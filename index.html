function week11Record(d,r){const item=week11Days[d-1];return `<div class="micro action-record"><div class="eyebrow">今日旅行聚會記錄</div><h3>${esc(item.cta)}</h3><p>依今天主題留下你的行程、選擇與備案，下次可以直接使用。</p><div class="record-grid">${item.labels.map((label,i)=>`<div class="field record-wide"><label for="${['recordMain','recordKey','recordInsight'][i]}">${esc(label)}</label><textarea id="${['recordMain','recordKey','recordInsight'][i]}" rows="3" placeholder="${esc(label)}；依今天實際情況填寫。">${esc(r[['main','key','insight'][i]]||'')}</textarea></div>`).join('')}</div><button class="btn soft" onclick="saveActionRecord(11,${d})">儲存這筆記錄</button></div>`;}
function week11Context(d){const item=week11Days[d-1];return `<section class="depth-card week11-context"><p class="eyebrow">02 · 看見｜今天的真實情境</p>${item.exampleHtml||'<p>'+esc(item.example)+'</p>'}</section><section class="depth-card week11-context"><p class="eyebrow">03 · 判斷｜依今天主題做選擇</p><ul>${item.judge.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;}


const week12Days=[{"title":"找出三個有效習慣，今天重複一個。","focus":"不用把前面每一招都留下來，先找最適合自己的兩三件事。","why":"學了很多方法，最後真正留得住的，往往是那些不太麻煩、做完又覺得有幫助的事。今天先回看自己的經驗，不急著訂新的大目標。\n\n「養成一個新習慣平均需要 66 天」。這是研究中的概括結果，不是每個人的期限；該研究的估計差異約為 18～254 天。習慣種類、生活情境與個人都會影響時間。\n\n重點是把一件事放在相近的情境中反覆做，慢慢變得順手。中斷一次不需要全部歸零，先看看下一次怎麼更容易開始。","whyHtml":"<p>學了很多方法，最後真正留得住的，往往是那些不太麻煩、做完又覺得有幫助的事。今天先回看自己的經驗，不急著訂新的大目標。</p><p>「養成一個新習慣平均需要 <strong>66 天</strong>」。這是研究中的概括結果，不是每個人的期限；該研究的估計差異約為 <strong>18～254 天</strong>。習慣種類、生活情境與個人都會影響時間。</p><p><strong>重點是把一件事放在相近的情境中反覆做，慢慢變得順手。中斷一次不需要全部歸零，先看看下一次怎麼更容易開始。</strong></p>","example":"你試過每天備三餐，兩天就累了；但早餐多加一顆蛋、下班走五分鐘，反而連忙的時候也做得到。這兩件事就是值得留下的線索，不必因為它們很小就忽略。\n\n今天找的是「我真的用得上」，不是「哪個方法看起來最厲害」。","exampleHtml":"你試過每天備三餐，兩天就累了；但早餐多加一顆蛋、下班走五分鐘，反而連忙的時候也做得到。這兩件事就是值得留下的線索，不必因為它們很小就忽略。<br><br><strong>今天找的是「我真的用得上」，不是「哪個方法看起來最厲害」。</strong>","judge":["效果：哪個方法讓用餐、精神或生活更舒服？不要只看體重。","負擔：花費、時間與準備量，長期是否承受得起？","重複：它通常接在哪件事之後？下週還有這個機會嗎？"],"steps":["回看前幾週兩三筆記錄，沒有記錄就回想實際經驗。","列出三件做過且有幫助的小事。","分別寫下有用的原因與最容易發生的時刻。","挑一件下週最想保留的習慣。","今天再做一次，記下是否仍然順手。"],"notes":"66 天是給耐心的提醒，不是新的倒數壓力。你不需要連續完美才算進步。","cta":"找出三個有效習慣，今天重複一個。","labels":["三個有用習慣與實際經驗","最容易開始的提示、時間與負擔","今天重複哪一個？下週保留什麼？"]},{"title":"寫下三條有忙碌版本的飲食原則。","focus":"把「我要吃健康一點」，在日常生活遇到某個情況，就做一件小事。","why":"常常中斷，不一定是沒毅力，也可能是目標太大、提示不清楚，或每次都要重新想。把做法接在固定事件後面，再留一個忙碌版本，會比較容易開始。\n\n飲食原則是幫你做選擇，不是食物禁令。像「買便當時看看有沒有蔬菜」比「以後絕對不吃某種食物」更有彈性，也更好帶進日常。\n\n如果一連幾次做不到，先縮小或換時刻。少一點準備、把食材放到看得到的地方、請家人一起分工，都比反覆責備自己更有用。","whyHtml":"<p>常常中斷，不一定是沒毅力，也可能是目標太大、提示不清楚，或每次都要重新想。把做法接在固定事件後面，再留一個忙碌版本，會比較容易開始。</p><p>飲食原則是幫你做選擇，不是食物禁令。像「買便當時看看有沒有蔬菜」比「以後絕對不吃某種食物」更有彈性，也更好帶進日常。</p><p>如果一連幾次做不到，先縮小或換時刻。少一點準備、把食材放到看得到的地方、請家人一起分工，都比反覆責備自己更有用。</p>","example":"不用從空白開始想，先照這三條做，再依自己的生活調整：\n\n① 吃早餐時，加一樣蛋白質食物。\n例如吐司搭一顆蛋，或搭一杯無糖豆漿；有時間再加一份水果。\n\n② 買午餐時，看看餐裡有沒有蔬菜。\n便當裡菜太少，就加一份燙青菜；店裡沒有，也可以下一餐再補上，不用為此多跑好幾家。\n\n③ 晚餐先選一組熟悉的搭配，不必每天想新菜單。\n例如飯、豆腐和青菜；想換口味，就把豆腐換成魚或蛋。\n\n忙碌日版本：加班太晚，就買一份有飯、肉或豆製品、蔬菜的便當，飲料選水或無糖茶。\n按自己的食慾吃，不用因為沒下廚就跳過晚餐。","exampleHtml":"不用從空白開始想，先照這三條做，再依自己的生活調整：<br><br><strong class=\"week12-emphasis\">① 吃早餐時，加一樣蛋白質食物。</strong><br>例如吐司搭一顆蛋，或搭一杯無糖豆漿；有時間再加一份水果。<br><br><strong class=\"week12-emphasis\">② 買午餐時，看看餐裡有沒有蔬菜。</strong><br>便當裡菜太少，就加一份燙青菜；店裡沒有，也可以下一餐再補上，不用為此多跑好幾家。<br><br><strong class=\"week12-emphasis\">③ 晚餐先選一組熟悉的搭配，不必每天想新菜單。</strong><br>例如飯、豆腐和青菜；想換口味，就把豆腐換成魚或蛋。<br><br><strong class=\"week12-emphasis\">忙碌日版本：加班太晚，就買一份有飯、肉或豆製品、蔬菜的便當，飲料選水或無糖茶。</strong><br>按自己的食慾吃，不用因為沒下廚就跳過晚餐。","judge":["具體：什麼時候、在哪裡、做什麼，說得清楚嗎？","彈性：沒時間或買不到時，有沒有能接受的替代？","足夠：這條原則有幫我正常吃飯，還是讓我越吃越少、越來越焦慮？"],"steps":["早餐搭一顆蛋或一杯無糖豆漿。","買午餐時確認有蔬菜，菜少時可加一份。","晚餐用飯、豆腐與青菜等熟悉組合。","加班時用有主食、蛋白質與蔬菜的便當替代。","今天選一條試做，記下一句是否方便就好。"],"notes":"連續做不到時，先修做法。生病、疲累或環境改變，都值得重新安排。","cta":"寫下三條有忙碌版本的飲食原則。","labels":["三條「當＿＿，我就＿＿」原則","忙碌版本與需要準備的環境","今天試用結果與要調整的地方"]},{"title":"建立三組常用餐與食材替換。","focus":"把喜歡的餐變成可替換的組合，減少每天想菜單的力氣。","why":"長期吃得順，不靠每餐都有新花樣。先留幾組真的喜歡、預算能負擔的餐，再輪換食材，往往比收集一百份食譜更實用。\n\n每組先看主食、蛋白質食物與蔬菜或其他含纖維食物，飲料也一起安排。份量依食慾與個人需要，每餐吃八分飽是比較好的選擇。\n\n常用不等於永遠只吃一樣。蛋、豆腐、魚肉可以輪換，蔬菜隨季節改，全穀可替換部分精製主食；這樣比較容易維持變化，也用得完。","whyHtml":"<p><strong>長期吃得順，不靠每餐都有新花樣。先留幾組真的喜歡、預算能負擔的餐，再輪換食材，往往比收集一百份食譜更實用。</strong></p><p>每組先看主食、蛋白質食物與蔬菜或其他含纖維食物，飲料也一起安排。份量依食慾與個人需要，<strong>每餐吃八分飽是比較好的選擇。</strong></p><p>常用不等於永遠只吃一樣。蛋、豆腐、魚肉可以輪換，蔬菜隨季節改，全穀可替換部分精製主食；這樣比較容易維持變化，也用得完。</p>","example":"早上趕著出門，不知道吃什麼，就烤兩片吐司、煎一顆蛋，再帶一根香蕉，飲料選水或無糖茶。覺得不夠或太多，就依自己的食慾調整。\n\n晚上下班累了，不想研究食譜，就煮飯、熱一份豆腐，再炒一盤青菜。隔天想換口味，把豆腐換成魚，青菜換成當季買得到的就好。\n\n如果連開火的時間都沒有，就到熟悉的店買一份有飯、蛋白質食物和蔬菜的便當。把這幾組好吃、買得到、做得完的餐當成備選，就不用每天重新想一次。","exampleHtml":"早上趕著出門，不知道吃什麼，就烤兩片吐司、煎一顆蛋，再帶一根香蕉，飲料選水或無糖茶。覺得不夠或太多，就依自己的食慾調整。<br><br>晚上下班累了，不想研究食譜，就煮飯、熱一份豆腐，再炒一盤青菜。隔天想換口味，把豆腐換成魚，青菜換成當季買得到的就好。<br><br>如果連開火的時間都沒有，就到熟悉的店買一份有飯、蛋白質食物和蔬菜的便當。<strong>把這幾組好吃、買得到、做得完的餐當成備選，就不用每天重新想一次。</strong>","judge":["願意吃：這是真正喜歡的味道，還是只因為看起來健康？","取得：家附近買得到、價格合適、保存也方便嗎？","搭配：主要食物類別都有位置嗎？吃完是否足夠而舒服？"],"steps":["選早餐、居家正餐與忙碌外購各一組。","列出主食、蛋白質與含纖維食物，安排飲料。","每組寫一個缺貨或没空準備時的替換。","看看庫存，按人數與預計餐次列少量採買清單。","今天實際吃其中一組，再依食慾調整。"],"notes":"有醫療團隊提供的飲食計畫時，把常用餐放進那份計畫調整。不要為了完成表格硬吃或忍餓。","cta":"建立三組常用餐與食材替換。","labels":["早餐、居家與外購三組常用餐","每組食材替換與份量感受","庫存、預計餐次與少量採買清單"]},{"title":"排好普通、忙碌與休息日的活動版本。","focus":"普通日有安排，忙碌日有小版本，身體不舒服時也能安心休息。","why":"活動計畫最容易卡在「今天做不到原本的量，乾脆不做」。替自己準備不同版本，就不用每天在全做或全不做之間選。\n\n例如普通日走十五分鐘，忙碌日先走五分鐘；遇到不適就休息或依專業建議調整。小版本是維持開始的方法，不代表已達完整活動建議。\n\n重新開始也需要具體時間。漏做後，寫下下一個可行時刻，用熟悉、較輕鬆的量回來，不用加倍補做。中斷很久或健康狀況改變時，先確認目前適合的活動。","whyHtml":"<p>活動計畫最容易卡在「今天做不到原本的量，乾脆不做」。替自己準備不同版本，就不用每天在全做或全不做之間選。</p><p>例如普通日走十五分鐘，忙碌日先走五分鐘；遇到不適就休息或依專業建議調整。小版本是維持開始的方法，不代表已達完整活動建議。</p><p>重新開始也需要具體時間。漏做後，寫下下一個可行時刻，用熟悉、較輕鬆的量回來，不用加倍補做。中斷很久或健康狀況改變時，先確認目前適合的活動。</p>","example":"你上週加班三天沒走路，原本想等下週一再開始。今天改成晚餐後走五分鐘，回家就收工；等恢復順手，再回到原來的時間。這次練的是回來的方法。\n\n正常日：晚餐後走十五分鐘。\n用能舒服說話的速度走，選熟悉、好走的路線。\n\n忙碌日：晚餐後在家踏步或走動五分鐘。\n做完就可以收工，不必補回原本的十五分鐘。\n\n需要休息時：今天先休息，照常吃飯、喝水與睡覺。\n身體恢復後，先從五分鐘的輕鬆版本回來；仍有不適就繼續休息，必要時詢問專業人員。","exampleHtml":"你上週加班三天沒走路，原本想等下週一再開始。今天改成晚餐後走五分鐘，回家就收工；等恢復順手，再回到原來的時間。這次練的是回來的方法。<br><br><strong class=\"week12-emphasis\">正常日：晚餐後走十五分鐘。</strong><br>用能舒服說話的速度走，選熟悉、好走的路線。<br><br><strong class=\"week12-emphasis\">忙碌日：晚餐後在家踏步或走動五分鐘。</strong><br>做完就可以收工，不必補回原本的十五分鐘。<br><br><strong class=\"week12-emphasis\">需要休息時：今天先休息，照常吃飯、喝水與睡覺。</strong><br>身體恢復後，先從五分鐘的輕鬆版本回來；仍有不適就繼續休息，必要時詢問專業人員。","judge":["起點：現在的體能和身體狀況適合這個量嗎？","版本：短版本真的夠簡單，不會讓我又想拖延嗎？","恢復：哪一天、哪個事件之後重新開始？有沒有安排休息？"],"steps":["身體舒服、時間足夠時，晚餐後走十五分鐘。","今天很忙，就改成在家踏步或走動五分鐘。","身體不舒服時先休息，不勉強完成。","恢復後先用五分鐘的輕鬆版本重新開始。","今天選適合的一種做，記一句感受即可。"],"notes":"休息也是長期安排的一部分。出現胸痛、暈眩或異常喘時停止活動，必要時立即求助。","cta":"排好普通、忙碌與休息日的活動版本。","labels":["活動、普通日時間／次數與開始提示","忙碌版本、恢復日與休息安排","今天試用感受與下次開始時刻"]},{"title":"完成自己的長期計畫與每週回顧安排。","focus":"把有效方法放進自己的健康行動手冊，之後可以慢慢改。","why":"課程結束後，不必靠記住所有內容過日子。留一份短短的手冊：飲食原則、常用餐、活動版本與中斷後的下一步，就能繼續使用。\n\n每週留十分鐘看看：哪件事有效？卡在哪裡？下週只改什麼？這是方便起步的時間安排，不是必須每次精準計時。\n\n長期系統會跟生活一起改。工作、照顧責任或身體狀況變了，就調整時間和方法；需要協助時，把能聯絡的人也寫下來。","whyHtml":"<p>課程結束後，不必靠記住所有內容過日子。留一份短短的手冊：飲食原則、常用餐、活動版本與中斷後的下一步，就能繼續使用。</p><p>每週留十分鐘看看：哪件事有效？卡在哪裡？下週只改什麼？這是方便起步的時間安排，不是必須每次精準計時。</p><p><strong>長期系統會跟生活一起改。工作、照顧責任或身體狀況變了，就調整時間和方法；需要協助時，把能聯絡的人也寫下來。</strong></p>","example":"你把週日晚上設為整理時間，先看這週用餐和活動記錄。發現早餐組合很順，晚間散步卻常被加班打斷，就只把散步改到午休。其餘先保留，不用每週重寫整個人生。","exampleHtml":"你把週日晚上設為整理時間，先看這週用餐和活動記錄。發現早餐組合很順，晚間散步卻常被加班打斷，就只把散步改到午休。其餘先保留，不用每週重寫整個人生。","judge":["簡單：手冊一眼看得懂嗎？還是列了太多每天做不到的事？","可改：忙碌、生病或旅行時，有沒有替代與恢復安排？","支持：固定何時回顧？需要誰幫忙？遇到問題能找哪種專業？"],"steps":["整理三條飲食原則、三組常用餐與活動版本。","寫下中斷後的第一步與可行開始時刻。","選每週固定回顧時間，只問有效、卡住與下一步。","今天打開健康行動手冊，把可用的安排寫入並儲存。","選一個下週要繼續的小行動，不再增加一整套要求。"],"notes":"完成課程不代表從此不會中斷；知道怎麼調整和回來，才是能帶走的能力。","cta":"完成自己的長期計畫與每週回顧安排。","labels":["飲食、餐點與活動的重點安排","中斷後第一步與可求助的人","每週回顧時間、三個問題與下週行動"]},{"title":"彈性日：實測你的忙碌版本。","focus":"今天真的用一次，再把不方便的地方改小。","why":"備案只有寫下來，還不知道是否好用。挑一個忙碌情境試一次，就能看出是步驟太多、食材不好買，還是提醒放錯地方。","example":"你原本的備案是回家煮冷凍蔬菜，但太晚回來連洗鍋都不想做。今天改用附近買得到的餐點搭配，並把更省事的選擇寫回手冊。","observe":"","judge":["今天卡住的真正原因是什麼？","哪個短版本現在最容易用？","做完後，手冊要刪掉或修改哪一步？"],"steps":["選一個真實或模擬的忙碌情境。","從常用餐或活動計畫選一個短版本。","按需要試用，不舒服時選休息。","記下最麻煩的一步，把它縮小或替換。","把修正寫進健康行動手冊並儲存。"],"notes":"備案不好用，就改備案，不用怪自己。","cta":"今天實測一次，把方法修得更好用。","labels":["忙碌情境與我選的短版本","實際結果與最麻煩的一步","手冊需要怎麼修改"]},{"title":"課程回顧：留下能繼續用的健康行動手冊。","focus":"不用一次承諾一輩子，先排好接下來一週。","why":"最後一天不是要證明自己已經完美，而是留下生活改變時仍能參考的方法。短期有空做什麼、忙碌時保留什麼、何時回顧，都比一句「永遠堅持」具體。","example":"你留下三條飲食原則、幾組愛吃的餐與一個簡單活動安排，並約好週日看一次。下週就從早餐那一條開始，其他依需要慢慢接上。","observe":"","judge":["哪些內容是我真的試過願意繼續的？","如果中斷，我知道下一步與需要的支持嗎？","手冊有儲存嗎？下次何時回來更新？"],"steps":["回看本週與前幾週最有用的記錄。","確認手冊包含飲食原則、常用餐與活動版本。","補上忙碌備案、重新開始方式與支持者。","完成本週 check-in，儲存健康行動手冊。","寫下接下來一週的第一個行動與回顧時間。"],"notes":"中斷不會抹掉已學會的事。下次從一個可行的小步繼續。","cta":"今天完成手冊，排好下一週第一步。","labels":["我最想保留的三件事","忙碌備案、恢復方式與支持者","下一週第一步與回顧時間"]}];
const week12Meta=[{"title":"什麼真的有效？留下你的成功線索","concept":"不用把前面每一招都留下來，先找最適合自己的兩三件事。","hook":"什麼真的有效？留下你的成功線索","example":"你試過每天備三餐，兩天就累了；但早餐多加一顆蛋、下班走五分鐘，反而連忙的時候也做得到。這兩件事就是值得留下的線索，不必因為它們很小就忽略。<br><br><strong>今天找的是「我真的用得上」，不是「哪個方法看起來最厲害」。</strong>","apply":"回看前幾週兩三筆記錄，沒有記錄就回想實際經驗。"},{"title":"你的個人飲食原則：讓忙碌日也有版本","concept":"把「我要吃健康一點」，在日常生活遇到某個情況，就做一件小事。","hook":"你的個人飲食原則：讓忙碌日也有版本","example":"不用從空白開始想，先照這三條做，再依自己的生活調整：<br><br><strong class=\"week12-emphasis\">① 吃早餐時，加一樣蛋白質食物。</strong><br>例如吐司搭一顆蛋，或搭一杯無糖豆漿；有時間再加一份水果。<br><br><strong class=\"week12-emphasis\">② 買午餐時，看看餐裡有沒有蔬菜。</strong><br>便當裡菜太少，就加一份燙青菜；店裡沒有，也可以下一餐再補上，不用為此多跑好幾家。<br><br><strong class=\"week12-emphasis\">③ 晚餐先選一組熟悉的搭配，不必每天想新菜單。</strong><br>例如飯、豆腐和青菜；想換口味，就把豆腐換成魚或蛋。<br><br><strong class=\"week12-emphasis\">忙碌日版本：加班太晚，就買一份有飯、肉或豆製品、蔬菜的便當，飲料選水或無糖茶。</strong><br>按自己的食慾吃，不用因為沒下廚就跳過晚餐。","apply":"早餐搭一顆蛋或一杯無糖豆漿。"},{"title":"你的常用餐點：好吃、買得到、做得完","concept":"把喜歡的餐變成可替換的組合，減少每天想菜單的力氣。","hook":"你的常用餐點：好吃、買得到、做得完","example":"早上趕著出門，不知道吃什麼，就烤兩片吐司、煎一顆蛋，再帶一根香蕉，飲料選水或無糖茶。覺得不夠或太多，就依自己的食慾調整。<br><br>晚上下班累了，不想研究食譜，就煮飯、熱一份豆腐，再炒一盤青菜。隔天想換口味，把豆腐換成魚，青菜換成當季買得到的就好。<br><br>如果連開火的時間都沒有，就到熟悉的店買一份有飯、蛋白質食物和蔬菜的便當。<strong>把這幾組好吃、買得到、做得完的餐當成備選，就不用每天重新想一次。</strong>","apply":"選早餐、居家正餐與忙碌外購各一組。"},{"title":"你的最低活動量：中斷後也回得來","concept":"普通日有安排，忙碌日有小版本，身體不舒服時也能安心休息。","hook":"你的最低活動量：中斷後也回得來","example":"你上週加班三天沒走路，原本想等下週一再開始。今天改成晚餐後走五分鐘，回家就收工；等恢復順手，再回到原來的時間。這次練的是回來的方法。<br><br><strong class=\"week12-emphasis\">正常日：晚餐後走十五分鐘。</strong><br>用能舒服說話的速度走，選熟悉、好走的路線。<br><br><strong class=\"week12-emphasis\">忙碌日：晚餐後在家踏步或走動五分鐘。</strong><br>做完就可以收工，不必補回原本的十五分鐘。<br><br><strong class=\"week12-emphasis\">需要休息時：今天先休息，照常吃飯、喝水與睡覺。</strong><br>身體恢復後，先從五分鐘的輕鬆版本回來；仍有不適就繼續休息，必要時詢問專業人員。","apply":"身體舒服、時間足夠時，晚餐後走十五分鐘。"},{"title":"你的長期計畫","concept":"把有效方法放進自己的健康行動手冊，之後可以慢慢改。","hook":"你的長期計畫：","example":"你把週日晚上設為整理時間，先看這週用餐和活動記錄。發現早餐組合很順，晚間散步卻常被加班打斷，就只把散步改到午休。其餘先保留，不用每週重寫整個人生。","apply":"整理三條飲食原則、三組常用餐與活動版本。"}];
const week12Rich=[{"why":"學了很多方法，最後真正留得住的，往往是那些不太麻煩、做完又覺得有幫助的事。今天先回看自己的經驗，不急著訂新的大目標。 「養成一個新習慣平均需要 66 天」。這是研究中的概括結果，不是每個人的期限；該研究的估計差異約為 18～254 天。習慣種類、生活情境與個人都會影響時間。 重點是把一件事放在相近的情境中反覆做，慢慢變得順手。中斷一次不需要全部歸零，先看看下一次怎麼更容易開始。","whyHtml":"<p>學了很多方法，最後真正留得住的，往往是那些不太麻煩、做完又覺得有幫助的事。今天先回看自己的經驗，不急著訂新的大目標。</p><p>「養成一個新習慣平均需要 <strong>66 天</strong>」。這是研究中的概括結果，不是每個人的期限；該研究的估計差異約為 <strong>18～254 天</strong>。習慣種類、生活情境與個人都會影響時間。</p><p><strong>重點是把一件事放在相近的情境中反覆做，慢慢變得順手。中斷一次不需要全部歸零，先看看下一次怎麼更容易開始。</strong></p>","example":"你試過每天備三餐，兩天就累了；但早餐多加一顆蛋、下班走五分鐘，反而連忙的時候也做得到。這兩件事就是值得留下的線索，不必因為它們很小就忽略。<br><br><strong>今天找的是「我真的用得上」，不是「哪個方法看起來最厲害」。</strong>","exampleHtml":"<p>你試過每天備三餐，兩天就累了；但早餐多加一顆蛋、下班走五分鐘，反而連忙的時候也做得到。這兩件事就是值得留下的線索，不必因為它們很小就忽略。<br><br><strong>今天找的是「我真的用得上」，不是「哪個方法看起來最厲害」。</strong></p>","observe":"","omitObserve":true,"judge":["效果：哪個方法讓用餐、精神或生活更舒服？不要只看體重。","負擔：花費、時間與準備量，長期是否承受得起？","重複：它通常接在哪件事之後？下週還有這個機會嗎？"],"do":["回看前幾週兩三筆記錄，沒有記錄就回想實際經驗。","列出三件做過且有幫助的小事。","分別寫下有用的原因與最容易發生的時刻。","挑一件下週最想保留的習慣。","今天再做一次，記下是否仍然順手。"],"cta":"找出三個有效習慣，今天重複一個。","tip":"66 天是給耐心的提醒，不是新的倒數壓力。你不需要連續完美才算進步。","extra":"<div class=\"lesson-info-grid\"><div><b>沒有變瘦也能有收穫</b><span>午餐比較不慌、下午不再餓到沒力、走路更舒服，都能是有用的線索。</span></div><div><b>刪掉不合身的方法</b><span>每天煮三餐太累，可以先留一餐；調整做法不等於否定之前的努力。</span></div><div><b>觀察而不是打卡競賽</b><span>記一個完成記號加一句感受就好，不必為了連續天數勉強身體。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.surrey.ac.uk/news/does-it-really-take-66-days-form-habit-we-asked-expert-dr-pippa-lally\" target=\"_blank\" rel=\"noopener\">研究者談 66 天與個人差異</a></p>"},{"why":"常常中斷，不一定是沒毅力，也可能是目標太大、提示不清楚，或每次都要重新想。把做法接在固定事件後面，再留一個忙碌版本，會比較容易開始。 飲食原則是幫你做選擇，不是食物禁令。像「買便當時看看有沒有蔬菜」比「以後絕對不吃某種食物」更有彈性，也更好帶進日常。 如果一連幾次做不到，先縮小或換時刻。少一點準備、把食材放到看得到的地方、請家人一起分工，都比反覆責備自己更有用。","whyHtml":"<p>常常中斷，不一定是沒毅力，也可能是目標太大、提示不清楚，或每次都要重新想。把做法接在固定事件後面，再留一個忙碌版本，會比較容易開始。</p><p>飲食原則是幫你做選擇，不是食物禁令。像「買便當時看看有沒有蔬菜」比「以後絕對不吃某種食物」更有彈性，也更好帶進日常。</p><p>如果一連幾次做不到，先縮小或換時刻。少一點準備、把食材放到看得到的地方、請家人一起分工，都比反覆責備自己更有用。</p>","example":"不用從空白開始想，先照這三條做，再依自己的生活調整：<br><br><strong class=\"week12-emphasis\">① 吃早餐時，加一樣蛋白質食物。</strong><br>例如吐司搭一顆蛋，或搭一杯無糖豆漿；有時間再加一份水果。<br><br><strong class=\"week12-emphasis\">② 買午餐時，看看餐裡有沒有蔬菜。</strong><br>便當裡菜太少，就加一份燙青菜；店裡沒有，也可以下一餐再補上，不用為此多跑好幾家。<br><br><strong class=\"week12-emphasis\">③ 晚餐先選一組熟悉的搭配，不必每天想新菜單。</strong><br>例如飯、豆腐和青菜；想換口味，就把豆腐換成魚或蛋。<br><br><strong class=\"week12-emphasis\">忙碌日版本：加班太晚，就買一份有飯、肉或豆製品、蔬菜的便當，飲料選水或無糖茶。</strong><br>按自己的食慾吃，不用因為沒下廚就跳過晚餐。","exampleHtml":"<p>不用從空白開始想，先照這三條做，再依自己的生活調整：<br><br><strong class=\"week12-emphasis\">① 吃早餐時，加一樣蛋白質食物。</strong><br>例如吐司搭一顆蛋，或搭一杯無糖豆漿；有時間再加一份水果。<br><br><strong class=\"week12-emphasis\">② 買午餐時，看看餐裡有沒有蔬菜。</strong><br>便當裡菜太少，就加一份燙青菜；店裡沒有，也可以下一餐再補上，不用為此多跑好幾家。<br><br><strong class=\"week12-emphasis\">③ 晚餐先選一組熟悉的搭配，不必每天想新菜單。</strong><br>例如飯、豆腐和青菜；想換口味，就把豆腐換成魚或蛋。<br><br><strong class=\"week12-emphasis\">忙碌日版本：加班太晚，就買一份有飯、肉或豆製品、蔬菜的便當，飲料選水或無糖茶。</strong><br>按自己的食慾吃，不用因為沒下廚就跳過晚餐。</p>","observe":"","omitObserve":true,"judge":["具體：什麼時候、在哪裡、做什麼，說得清楚嗎？","彈性：沒時間或買不到時，有沒有能接受的替代？","足夠：這條原則有幫我正常吃飯，還是讓我越吃越少、越來越焦慮？"],"do":["早餐搭一顆蛋或一杯無糖豆漿。","買午餐時確認有蔬菜，菜少時可加一份。","晚餐用飯、豆腐與青菜等熟悉組合。","加班時用有主食、蛋白質與蔬菜的便當替代。","今天選一條試做，記下一句是否方便就好。"],"cta":"寫下三條有忙碌版本的飲食原則。","tip":"連續做不到時，先修做法。生病、疲累或環境改變，都值得重新安排。","extra":"<div class=\"lesson-info-grid\"><div><b>忘記了</b><span>把提醒接在已有事件，例如訂午餐前先看今天是否需要補蔬菜。</span></div><div><b>太麻煩</b><span>一次只備一項食材，或選方便處理的冷凍蔬菜，不要求每餐從零開始。</span></div><div><b>沒人支持</b><span>提出具體分工，例如一人買菜、一人洗菜，比只說「大家要健康」更容易配合。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/diet-nutrition/changing-habits-better-health\" target=\"_blank\" rel=\"noopener\">NIDDK：習慣與中斷後的調整</a></p>"},{"why":"長期吃得順，不靠每餐都有新花樣。先留幾組真的喜歡、預算能負擔的餐，再輪換食材，往往比收集一百份食譜更實用。 每組先看主食、蛋白質食物與蔬菜或其他含纖維食物，飲料也一起安排。份量依食慾與個人需要，每餐吃八分飽是比較好的選擇。 常用不等於永遠只吃一樣。蛋、豆腐、魚肉可以輪換，蔬菜隨季節改，全穀可替換部分精製主食；這樣比較容易維持變化，也用得完。","whyHtml":"<p><strong>長期吃得順，不靠每餐都有新花樣。先留幾組真的喜歡、預算能負擔的餐，再輪換食材，往往比收集一百份食譜更實用。</strong></p><p>每組先看主食、蛋白質食物與蔬菜或其他含纖維食物，飲料也一起安排。份量依食慾與個人需要，<strong>每餐吃八分飽是比較好的選擇。</strong></p><p>常用不等於永遠只吃一樣。蛋、豆腐、魚肉可以輪換，蔬菜隨季節改，全穀可替換部分精製主食；這樣比較容易維持變化，也用得完。</p>","example":"早上趕著出門，不知道吃什麼，就烤兩片吐司、煎一顆蛋，再帶一根香蕉，飲料選水或無糖茶。覺得不夠或太多，就依自己的食慾調整。<br><br>晚上下班累了，不想研究食譜，就煮飯、熱一份豆腐，再炒一盤青菜。隔天想換口味，把豆腐換成魚，青菜換成當季買得到的就好。<br><br>如果連開火的時間都沒有，就到熟悉的店買一份有飯、蛋白質食物和蔬菜的便當。<strong>把這幾組好吃、買得到、做得完的餐當成備選，就不用每天重新想一次。</strong>","exampleHtml":"<p>早上趕著出門，不知道吃什麼，就烤兩片吐司、煎一顆蛋，再帶一根香蕉，飲料選水或無糖茶。覺得不夠或太多，就依自己的食慾調整。<br><br>晚上下班累了，不想研究食譜，就煮飯、熱一份豆腐，再炒一盤青菜。隔天想換口味，把豆腐換成魚，青菜換成當季買得到的就好。<br><br>如果連開火的時間都沒有，就到熟悉的店買一份有飯、蛋白質食物和蔬菜的便當。<strong>把這幾組好吃、買得到、做得完的餐當成備選，就不用每天重新想一次。</strong></p>","observe":"今天完成三組自己的常用餐，並為每組留一個替換。","omitObserve":false,"judge":["願意吃：這是真正喜歡的味道，還是只因為看起來健康？","取得：家附近買得到、價格合適、保存也方便嗎？","搭配：主要食物類別都有位置嗎？吃完是否足夠而舒服？"],"do":["選早餐、居家正餐與忙碌外購各一組。","列出主食、蛋白質與含纖維食物，安排飲料。","每組寫一個缺貨或沒空準備時的替換。","看看庫存，按人數與預計餐次列少量採買清單。","今天實際吃其中一組，再依食慾調整。"],"cta":"建立三組常用餐與食材替換。","tip":"有醫療團隊提供的飲食計畫時，把常用餐放進那份計畫調整。不要為了完成表格硬吃或忍餓。","extra":"<div class=\"lesson-info-grid\"><div><b>採買先看庫存</b><span>先用需要先吃的食材，再補缺口，減少重買和浪費。</span></div><div><b>方便也能有變化</b><span>原味乳品或無糖豆漿、蛋、豆製品與可方便處理的蔬果，都可依喜好搭配。</span></div><div><b>留一個真的能買到的外購餐</b><span>寫清楚店家、組合與替代，不用每次忙到最後才重新搜尋。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/weight-management/healthy-eating-physical-activity-for-life/health-tips-adults\" target=\"_blank\" rel=\"noopener\">NIDDK：日常飲食與活動</a></p>"},{"why":"活動計畫最容易卡在「今天做不到原本的量，乾脆不做」。替自己準備不同版本，就不用每天在全做或全不做之間選。 例如普通日走十五分鐘，忙碌日先走五分鐘；遇到不適就休息或依專業建議調整。小版本是維持開始的方法，不代表已達完整活動建議。 重新開始也需要具體時間。漏做後，寫下下一個可行時刻，用熟悉、較輕鬆的量回來，不用加倍補做。中斷很久或健康狀況改變時，先確認目前適合的活動。","whyHtml":"<p>活動計畫最容易卡在「今天做不到原本的量，乾脆不做」。替自己準備不同版本，就不用每天在全做或全不做之間選。</p><p>例如普通日走十五分鐘，忙碌日先走五分鐘；遇到不適就休息或依專業建議調整。小版本是維持開始的方法，不代表已達完整活動建議。</p><p>重新開始也需要具體時間。漏做後，寫下下一個可行時刻，用熟悉、較輕鬆的量回來，不用加倍補做。中斷很久或健康狀況改變時，先確認目前適合的活動。</p>","example":"你上週加班三天沒走路，原本想等下週一再開始。今天改成晚餐後走五分鐘，回家就收工；等恢復順手，再回到原來的時間。這次練的是回來的方法。<br><br><strong class=\"week12-emphasis\">正常日：晚餐後走十五分鐘。</strong><br>用能舒服說話的速度走，選熟悉、好走的路線。<br><br><strong class=\"week12-emphasis\">忙碌日：晚餐後在家踏步或走動五分鐘。</strong><br>做完就可以收工，不必補回原本的十五分鐘。<br><br><strong class=\"week12-emphasis\">需要休息時：今天先休息，照常吃飯、喝水與睡覺。</strong><br>身體恢復後，先從五分鐘的輕鬆版本回來；仍有不適就繼續休息，必要時詢問專業人員。","exampleHtml":"<p>你上週加班三天沒走路，原本想等下週一再開始。今天改成晚餐後走五分鐘，回家就收工；等恢復順手，再回到原來的時間。這次練的是回來的方法。<br><br><strong class=\"week12-emphasis\">正常日：晚餐後走十五分鐘。</strong><br>用能舒服說話的速度走，選熟悉、好走的路線。<br><br><strong class=\"week12-emphasis\">忙碌日：晚餐後在家踏步或走動五分鐘。</strong><br>做完就可以收工，不必補回原本的十五分鐘。<br><br><strong class=\"week12-emphasis\">需要休息時：今天先休息，照常吃飯、喝水與睡覺。</strong><br>身體恢復後，先從五分鐘的輕鬆版本回來；仍有不適就繼續休息，必要時詢問專業人員。</p>","observe":"","omitObserve":true,"judge":["起點：現在的體能和身體狀況適合這個量嗎？","版本：短版本真的夠簡單，不會讓我又想拖延嗎？","恢復：哪一天、哪個事件之後重新開始？有沒有安排休息？"],"do":["身體舒服、時間足夠時，晚餐後走十五分鐘。","今天很忙，就改成在家踏步或走動五分鐘。","身體不舒服時先休息，不勉強完成。","恢復後先用五分鐘的輕鬆版本重新開始。","今天選適合的一種做，記一句感受即可。"],"cta":"排好普通、忙碌與休息日的活動版本。","tip":"休息也是長期安排的一部分。出現胸痛、暈眩或異常喘時停止活動，必要時立即求助。","extra":"<div class=\"lesson-info-grid\"><div><b>提示要靠近日常</b><span>把活動接在換衣服、午休結束或晚餐後，比只寫「有空再做」具體。</span></div><div><b>肌力也留恢復</b><span>較吃力的同部位肌力練習不要天天硬做，按體能安排恢復日。</span></div><div><b>吃飯不用拿運動交換</b><span>照需要正常吃飯與喝水，不因漏做活動就跳餐，也不靠加倍運動補償食物。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/weight-management/healthy-eating-physical-activity-for-life/health-tips-adults\" target=\"_blank\" rel=\"noopener\">NIDDK：日常飲食與活動</a></p>"},{"why":"課程結束後，不必靠記住所有內容過日子。留一份短短的手冊：飲食原則、常用餐、活動版本與中斷後的下一步，就能繼續使用。 每週留十分鐘看看：哪件事有效？卡在哪裡？下週只改什麼？這是方便起步的時間安排，不是必須每次精準計時。 長期系統會跟生活一起改。工作、照顧責任或身體狀況變了，就調整時間和方法；需要協助時，把能聯絡的人也寫下來。","whyHtml":"<p>課程結束後，不必靠記住所有內容過日子。留一份短短的手冊：飲食原則、常用餐、活動版本與中斷後的下一步，就能繼續使用。</p><p>每週留十分鐘看看：哪件事有效？卡在哪裡？下週只改什麼？這是方便起步的時間安排，不是必須每次精準計時。</p><p><strong>長期系統會跟生活一起改。工作、照顧責任或身體狀況變了，就調整時間和方法；需要協助時，把能聯絡的人也寫下來。</strong></p>","example":"你把週日晚上設為整理時間，先看這週用餐和活動記錄。發現早餐組合很順，晚間散步卻常被加班打斷，就只把散步改到午休。其餘先保留，不用每週重寫整個人生。","exampleHtml":"<p>你把週日晚上設為整理時間，先看這週用餐和活動記錄。發現早餐組合很順，晚間散步卻常被加班打斷，就只把散步改到午休。其餘先保留，不用每週重寫整個人生。</p>","observe":"今天把前三週最有用的內容和本週練習，整理成自己的簡短版本。","omitObserve":false,"judge":["簡單：手冊一眼看得懂嗎？還是列了太多每天做不到的事？","可改：忙碌、生病或旅行時，有沒有替代與恢復安排？","支持：固定何時回顧？需要誰幫忙？遇到問題能找哪種專業？"],"do":["整理三條飲食原則、三組常用餐與活動版本。","寫下中斷後的第一步與可行開始時刻。","選每週固定回顧時間，只問有效、卡住與下一步。","今天打開健康行動手冊，把可用的安排寫入並儲存。","選一個下週要繼續的小行動，不再增加一整套要求。"],"cta":"完成自己的長期計畫與每週回顧安排。","tip":"完成課程不代表從此不會中斷；知道怎麼調整和回來，才是能帶走的能力。","extra":"<div class=\"lesson-info-grid\"><div><b>手冊寫短一點</b><span>每欄留可執行的句子，少用「更努力」「要自律」這種不知道怎麼做的詞。</span></div><div><b>支持可以很具體</b><span>找人陪走一段、共同採買或分擔備餐，讓事情真的比較容易。</span></div><div><b>需要時找專業</b><span>飲食焦慮、反覆失控、睡眠或活動困難持續影響生活時，不用只靠習慣技巧硬撐。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://newsinhealth.nih.gov/2018/03/creating-healthy-habits\" target=\"_blank\" rel=\"noopener\">NIH：建立健康習慣</a></p><p><a class=\"btn soft\" href=\"#/completion\">打開我的健康行動手冊 →</a></p>"}];
weeks[11].title='建立你的長期系統';weeks[11].outcome='把有效習慣、常用餐與活動安排留在手冊，忙碌或中斷時也知道怎麼繼續。';
weeks[11].lessons=week12Meta.map(l=>l.title);weeks[11].daily_actions=week12Days.map(d=>d.title);
weeks[11].review_prompts=['哪個習慣最有效又容易重複？','忙碌或中斷時，用哪個版本回來？','下一週第一步與固定回顧時間是什麼？'];
curriculum[11].why=weeks[11].outcome;curriculum[11].intro='不用靠一輩子的毅力撐住。這週留下你真正用得上的方法，替忙碌日做小版本，再把下一次開始與回顧時間安排好。';
curriculum[11].ability='能辨認有效習慣、寫出具體原則，建立常用餐與活動版本，完成可持續更新的健康行動手冊。';
curriculum[11].completion='留下可執行的安排，並實際試一次；66 天不是及格期限，中斷也不必全部重來。';
curriculum[11].lessons=week12Meta;curriculum[11].actions=week12Days.map(d=>({title:d.title,steps:d.steps}));
curriculum[11].challenge={title:'真實挑戰：原本做不到，就改用小版本',prompt:'選一次忘記、忙碌或中斷的情況，調整一個步驟，完成可行版本並留下下一次時間。',success:'找到能繼續的方法，而不是補回所有漏掉的次數。'};
curriculum[11].flex=['太忙做不到原計畫','忘記後拖了好幾天','生活作息改變'];
week12Rich.forEach((r,i)=>lessonRichOverrides['12-'+(i+1)]=r);actionOverrides[12]=week12Days.map(d=>d.steps);
function week12Record(d,r){const item=week12Days[d-1];return `<div class="micro action-record"><div class="eyebrow">今日長期計畫記錄</div><h3>${esc(item.cta)}</h3><p>依今天主題留下你的習慣、版本與下一步，下次可以直接使用。</p><div class="record-grid">${item.labels.map((label,i)=>`<div class="field record-wide"><label for="${['recordMain','recordKey','recordInsight'][i]}">${esc(label)}</label><textarea id="${['recordMain','recordKey','recordInsight'][i]}" rows="3" placeholder="${esc(label)}；依今天實際情況填寫。">${esc(r[['main','key','insight'][i]]||'')}</textarea></div>`).join('')}</div><button class="btn soft" onclick="saveActionRecord(12,${d})">儲存這筆記錄</button>${d>=5?'<p><a class="btn soft" href="#/completion">打開我的健康行動手冊 →</a></p>':''}</div>`;}
function week12Context(d){const item=week12Days[d-1];return `<section class="depth-card week12-context"><p class="eyebrow">02 · 看見｜今天的真實情境</p>${item.exampleHtml||'<p>'+esc(item.example)+'</p>'}</section><section class="depth-card week12-context"><p class="eyebrow">03 · 判斷｜依今天主題做選擇</p><ul>${item.judge.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;}

window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');render();
</script></body></html>
