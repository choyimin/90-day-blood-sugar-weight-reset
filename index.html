function saveFlex(w){state.flex=state.flex||{};const x=state.flex[w]||{context:'',done:false,method:''};x.note=document.getElementById('flexNote')?.value||'';state.flex[w]=x;save();toast('已儲存 Flex Day');render();}
function migrateWeek7(){
 if(state.week7Version===week7Version)return;
 const archive={};
 for(const bucket of ['lessons','actions','lessonPractice','actionSteps','actionRecords','actionFeelings']){
  const obj=state[bucket]||{};archive[bucket]={};
  for(const k of Object.keys(obj))if(/^[^-]+-7-/.test(k)){archive[bucket][k]=obj[k];delete obj[k];}
 }
 for(const bucket of ['reviews','challenges','flex']){if(state[bucket]?.[7]!==undefined){archive[bucket]=state[bucket][7];delete state[bucket][7];}}
 state.week7Previous=archive;state.week7Version=week7Version;save();
}
function week7History(){const a=state.week7Previous;if(!a)return '';const entries=Object.entries(a.actionRecords||{});if(!entries.length)return '';return `<details class="barriers-history"><summary>查看舊版 Week 7 紀錄（便利商店指南）</summary><p>章節已更換主題，舊資料保留在這裡；新版進度從新練習開始。</p>${entries.map(([k,r])=>`<article><h3>舊版 Day ${esc(k.split('-')[2])}</h3>${Object.values(r).filter(v=>typeof v==='string').map(v=>`<p>${esc(v)}</p>`).join('')}</article>`).join('')}</details>`;}
function week7Self(l){const checked=state.week7Self?.[l]||[];return `<section class="selfcheck"><p class="eyebrow">30 秒自我檢查</p><h2>今天我能做到哪一個理解？</h2><div class="selfcheck-grid">${week7LessonData[l-1].self.map(([t,d],i)=>`<button type="button" class="${checked[i]?'active':''}" aria-pressed="${!!checked[i]}" onclick="week7ToggleSelf(${l},${i},this)"><b>${esc(t)}</b><span>${esc(d)}</span></button>`).join('')}</div><p>可點選多項，沒有通過門檻；選擇會儲存在這個瀏覽器。</p></section>`;}
function week7ToggleSelf(l,i,el){state.week7Self=state.week7Self||{};const a=state.week7Self[l]||[];a[i]=!a[i];state.week7Self[l]=a;save();el.classList.toggle('active',a[i]);el.setAttribute('aria-pressed',String(a[i]));}
function week7Fields(d){return d===4?[['when','時間與場景','例如：下午四點、辦公室加班。'],['last','上次進食與是否足夠','時間、大約食物與份量；不用精算。'],['wanted','想吃的食物／身體訊號','想吃的味道、肚子空或其他訊號。'],['hunger','餓感（可文字或 0–10）','可寫不確定；不是准不准吃的門檻。'],['emotion','當下情緒與需要','例如：焦躁，也餓，需要食物與休息。'],['decision','吃了什麼／採取什麼行動','吃飯、點心、休息、找人說話等。'],['result','之後感受與下次線索','身體和情緒各有何變化？']]:week7Days[d-1].labels.map((t,i)=>[['main','key','insight'][i],t,'依今天的實際情況寫下；不確定也可以。']);}
function week7Record(d,r){return `<div class="micro action-record barriers-record"><p class="eyebrow">${d===4?'食物與感受日誌':'今日障礙應對紀錄'}</p><h3>${esc(week7Days[d-1].cta)}</h3><p>只需記一次，不計算熱量、不評價食物好壞。內容儲存在目前瀏覽器。</p><div class="record-grid">${week7Fields(d).map(([id,label,ph])=>`<div class="field record-wide"><label for="barrier_${id}">${esc(label)}</label><textarea id="barrier_${id}" rows="3" placeholder="${esc(ph)}">${esc(r[id]||'')}</textarea></div>`).join('')}</div><button type="button" class="btn soft" onclick="saveActionRecord(7,${d})">儲存這筆記錄</button></div>`;}
function saveWeek7Record(d){const r={};week7Fields(d).forEach(([id])=>{r[id]=document.getElementById('barrier_'+id)?.value||'';});state.actionRecords=state.actionRecords||{};state.actionRecords[key('a',7,d)]=r;save();toast('已儲存這筆觀察 ✓');}
function week7Context(d){const x=week7Days[d-1];return `<section class="depth-card week7-context"><p class="eyebrow">02 · 看見｜今天的真實情境</p><p>${esc(x.example)}</p></section><section class="depth-card week7-context"><p class="eyebrow">03 · 判斷｜依今天主題做選擇</p><ul>${x.judge.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;}

const week8Days=[{"title":"看懂一次實際食用量。","focus":"同一樣食物，吃多少也有差。先看懂眼前的量，再決定怎麼吃。","why":"你有沒有遇過：明明只吃「一碗」，今天卻比昨天撐？碗有大有小，堆得多高也不一樣。只記食物名稱，很容易漏掉實際吃進去的量。\n\n份量會影響這餐提供多少能量與營養，但不是越少越好。吃得不足，也可能讓你很快又餓。這週先練習把量看清楚，再搭配食慾、活動與整餐內容做調整。\n\n包裝上的「每份量」是標示的計算單位，不是命令你吃多少。你的實際食用量，才是換算這次攝取量的起點。","example":"下午拆了一包餅乾，標示每份 30 公克、整包 3 份。若吃完整包，各項每份營養數字就要乘以 3；若分成三次，每次大約一份。先倒在盤裡看看，往往比邊聊天邊從袋子拿更容易掌握。","judge":["實際量：我吃的是整包、半包，還是幾口？用什麼容器能說清楚？","整餐需要：這只是點心，還是正餐的一部分？有沒有吃得足夠？","採買安排：大包裝真的用得完嗎？能分裝保存，還是小包更方便？"],"steps":["拿一項你平常會吃的包裝食品。","找出每份量與每包份數。","把這次準備吃的量放進碗盤，記下大約比例。","若能判斷吃了幾份，就換算一項每份營養數字。","吃完留一句感受，決定下次是否維持或調整。"],"notes":"今天只練習看懂量，不必為了數字硬把食物減半。","cta":"看懂一次實際食用量。","labels":["食物、每份量與整包份數","實際吃的比例與換算結果","餐後感受與下次包裝／分裝選擇"]},{"title":"用自己的手描述一餐份量。","focus":"出門沒帶秤？用自己的手做大概比較，先建立看得懂的份量感。","why":"每餐拿秤很麻煩，外食也不方便。手就在身邊，可以幫你描述「這塊魚大約多大」「這份飯跟昨天差多少」。\n\n手掌法是粗估工具，手的大小、食物厚度和堆法都會影響結果。這不是精準克數，它是一個大約估算的方式。我們先找一個容易重複的參考對照方式就好。","example":"午餐選烤魚便當，魚肉我們大約選「自己的」一個掌心（或拳頭）大小，飯則記成自己常用碗的半碗。下次改買雞肉便當時，就有可以比較的參考，不必猜「今天好像很多」。","judge":["能估嗎：是整塊魚肉，還是帶骨、裹粉或混合料理？可吃的部分有多少？","一致嗎：我用的是掌心還是整隻手？厚度、盛裝方式有沒有記？","夠用嗎：今天活動與食慾如何？粗估能幫忙，還是需要標示與專業份量計畫？"],"steps":["選今天一餐中的魚、肉、豆腐或主食。","用掌心或拳頭比較外觀，先不指定必須吃多少。","記下厚度、帶骨與實際可吃部分。","用同一個說法描述另一項食物，完成這一餐。","留下你的常用估量方式與餐後感受。"],"notes":"如果你有醫療團隊安排的碳水計算或份量計畫，照原計畫；手掌粗估不能取代它。","cta":"用自己的手描述一餐份量。","labels":["食物與我的手掌描述","厚度、可吃部分與其他參考容器","餐後是否足夠？下次怎麼估？"]},{"title":"用餐盤法組合今天的一餐。","focus":"先看看這一盤有什麼，再安排蔬菜、蛋白質與主食的位置。","why":"只盯著飯量，很容易忘了整餐還缺什麼。餐盤法讓你一眼看到食物分布，點餐和採買時都比較有方向。\n\n可以參考蔬果約半盤、蛋白質食物與全穀主食各約四分之一的搭配方向，再依需要調整。水果也可安排在其他時間。比例是搭配提示，盤子大小和盛裝高度仍會影響總量。","example":"晚餐有白飯、雞肉和一小撮青菜。你不必把飯全部拿掉，可以加一份青菜，讓雞肉、飯和菜都有位置。採買時先看冰箱已有雞肉與米，今天補青菜就好，不用重新買一整套。","judge":["種類：看得到蔬菜、蛋白質與主食嗎？還是幾乎都在吃同一類？","總量：盤子很大或堆得很高嗎？比例漂亮也要看看實際量。","可行：家裡有什麼？預算內最容易補上的食物是哪一項？"],"steps":["拿一個平常會用的餐盤或便當盒。","辨認現有食物中的蔬菜、蛋白質與主食。","參考餐盤方向，把缺少的一類補上。","照食慾盛裝，吃完留意是否足夠或太撐。","記下這次組合，以及下次只需要補買的食材。"],"notes":"不用每餐擺得像照片。湯麵、燴飯也能看食材組合；地瓜與玉米要一起考慮主食的量。","cta":"用餐盤法組合今天的一餐。","labels":["這一盤的蔬菜、蛋白質與主食","我補上的食物與大約份量","冰箱已有什麼？下次要買什麼？"]},{"title":"在餐廳決定適合自己的份量。","focus":"店家端上來的份量，不一定剛好符合你今天的需要。","why":"餐廳設計的是一整份餐食，可以餐點上桌後，看看份量，是否需要再加點其他選項。\n\n加大只多一點錢，未必是你需要的優惠。點餐前問清楚大小、配餐和能否分享，通常比吃撐後才後悔更省事。","example":"兩個人點披薩，套餐還附義大利麵、薯條和飲料。先確認披薩大小，再決定要不要整套。可以先點主餐和蔬菜，真的不夠再加；若預計有剩食，先確認能否及時帶回冷藏。","judge":["點餐前：幾個人吃？主餐之外是否又附飯麵、麵包或配餐？","上桌後：先盛到自己盤裡，是否比較容易看懂吃了多少？","吃不完：可以分享或妥善保存嗎？行程不方便冷藏時能否少點再加？"],"steps":["選一間你真的會去的餐廳，查看菜單份量。","確認用餐人數、套餐內容和總價。","提出一個需要的調整，例如小份、分享或不加大。","上桌後按需要取餐，中途再決定是否加量。","記下剛好的點法與剩食安排，留作下次參考。"],"notes":"分享可以，吃完也可以。你要練的是自己做決定，不是遵守「外食只能吃半份」。","cta":"在餐廳決定適合自己的份量。","labels":["餐廳、人數與原本的套餐","實際點法、份量調整與總價","吃完感受、剩食安排與下次點法"]},{"title":"在一餐中留意飽足與滿足。","focus":"吃到一半，問問自己：還餓嗎？舒服嗎？這餐有滿足我嗎？","why":"有些人常狼吞虎嚥，吃飯吃得很急，當最後一口吞下去，才發現自己已經很撐。\n\n想練習慢一點，可以先從幾口開始，試著一口咀嚼 20～25 次，把它當成放慢速度的提醒；實際次數依食物軟硬調整，不用每口都數。\n\n飽足訊號的傳遞需要時間，常以大約 20 分鐘來提醒我們別吃太快，但不是每個人都要等滿 20 分鐘才會覺得飽。慢慢咀嚼、留意用餐中的感受，能幫助你及時察覺已經吃得足夠，減少不小心吃撐的機會。","example":"午餐吃便當，你平常一邊滑手機，一邊很快把飯吃完。今天先把手機放旁邊，每口慢慢嚼，吞下後再夾下一口。吃到一半時，問自己：「我還餓嗎？肚子舒服嗎？」還餓就繼續吃；已經飽了，就不用勉強把剩下的吃完。","judge":["身體：我仍餓、舒服地飽，還是有點撐？不確定也可以嗎？","搭配：這餐有主食、蛋白質和蔬菜嗎？很快又餓可能需要補足。","下一步：我需要繼續吃、加一點、保留剩食，還是讓用餐安靜一些？"],"steps":["挑一餐比較能留意自己的時刻。","開吃前寫下餓感或上一餐的時間。","吃到中途，花一小段時間感受身體與滿足程度。","依需要繼續、加量或停下，不要求固定答案。","餐後記一句感受，下次只調整一件事。"],"notes":"如果觀察讓你更焦慮，就簡化成一句感受。明顯飢餓時不必用忍耐來完成練習。","cta":"在一餐中留意飽足與滿足。","labels":["餐前餓感與上次進食時間","中途身體感受與我的選擇","餐後感受與下一次的小調整"]},{"title":"彈性日：用最順手的方法看份量。","focus":"沒有熟悉的碗盤也沒關係，挑一個今天用得上的提示。","why":"出門或臨時換店時，不可能每次都量得一樣。手掌、碗盤、包裝標示或身體感受，選一個能幫你做決定的方法，就算有練到。","example":"臨時買湯麵，看不到餐盤比例。你可以看碗有多大、麵與配料大約多少，再決定是否加蛋或青菜，不用把整碗拆開測量。","judge":["現場最容易看的是包裝、碗盤還是食材大小？","這餐缺少哪一類，份量是否夠我吃？","我能做哪個不增加太多麻煩的調整？"],"steps":["記下今天臨時改變的用餐情境。","選一個最方便的份量提示。","用一句話描述眼前食物的量與搭配。","依需要完成一個調整，並實際吃這一餐。","記下這個方法是否順手，下次還要不要用。"],"notes":"不用同時用完所有方法。今天找一個好用的就好。","cta":"今天選一個提示，完成一次份量覺察。","labels":["臨時情境與眼前的食物","我用的提示與實際調整","吃完感受，下次是否繼續用"]},{"title":"每週回顧：留下自己的份量參考。","focus":"整理一個常用碗盤、一個外食點法，再列出下週買得到、用得完的食材。","why":"你的參考要來自真的吃過的經驗。比起背別人的固定克數，知道哪個碗、哪個點法讓自己吃得舒服，往往更容易帶進下週生活。","example":"這週你發現用家裡飯碗描述最自然，也知道常買的便當需要補青菜。下週先看冰箱庫存，買足預計幾餐用的蔬菜，份量不夠時再調整，不必一次囤滿。","judge":["哪個方法最容易用，且不會讓我焦慮？","哪一餐需要加量、調整搭配或換包裝？","下週有幾人在家吃？食材能在保存期限內用完嗎？"],"steps":["回看這週一到兩筆實際記錄。","留下一個最順手的份量描述方式。","挑一個願意再用的外食點法或餐盤組合。","盤點庫存，按人數和餐次寫下採買數量與保存安排。","完成本週 check-in，寫下下週只保留的一步。"],"notes":"目標是吃得夠、吃得舒服，也讓採買更省心。","cta":"今天留下份量小抄與下週採買清單。","labels":["最順手的方法與一個實際例子","常用餐點、需要調整的地方","下週人數／餐次、採買數量與保存安排"]}];
const week8Meta=[{"title":"為什麼份量很重要","concept":"同一樣食物，吃多少也有差。先看懂眼前的量，再決定怎麼吃。","hook":"為什麼份量很重要","example":"晚餐盛咖哩飯，你換了一個比較大的碗，還是習慣盛到八分滿。看起來同樣是「一碗」，飯和咖哩卻都比平常多，吃完才發現有點撐。下次先用熟悉的碗盛裝，看看大約多少，再依當天的食慾決定要不要加，不必因為換了大碗就自動裝滿。","apply":"拿一項你平常會吃的包裝食品。"},{"title":"手掌估份量法","concept":"出門沒帶秤？用自己的手做大概比較，先建立看得懂的份量感。","hook":"手掌估份量法","example":"午餐選烤魚便當，魚肉我們大約選「自己的」一個掌心（或拳頭）大小，飯則記成自己常用碗的半碗。下次改買雞肉便當時，就有可以比較的參考，不必猜「今天好像很多」。","apply":"選今天一餐中的魚、肉、豆腐或主食。"},{"title":"餐盤法","concept":"先看看這一盤有什麼，再安排蔬菜、蛋白質與主食的位置。","hook":"餐盤法","example":"晚餐有白飯、雞肉和一小撮青菜。你不必把飯全部拿掉，可以加一份青菜，讓雞肉、飯和菜都有位置。採買時先看冰箱已有雞肉與米，今天補青菜就好，不用重新買一整套。","apply":"拿一個平常會用的餐盤或便當盒。"},{"title":"餐廳份量","concept":"店家端上來的份量，不一定剛好符合你今天的需要。","hook":"餐廳份量","example":"兩個人點披薩，套餐還附義大利麵、薯條和飲料。先確認披薩大小，再決定要不要整套。可以先點主餐和蔬菜，真的不夠再加；若預計有剩食，先確認能否及時帶回冷藏。","apply":"選一間你真的會去的餐廳，查看菜單份量。"},{"title":"辨識飽足感","concept":"吃到一半，問問自己：還餓嗎？舒服嗎？這餐有滿足我嗎？","hook":"辨識飽足感","example":"午餐吃便當，你平常一邊滑手機，一邊很快把飯吃完。今天先把手機放旁邊，每口慢慢嚼，吞下後再夾下一口。吃到一半時，問自己：「我還餓嗎？肚子舒服嗎？」還餓就繼續吃；已經飽了，就不用勉強把剩下的吃完。","apply":"挑一餐比較能留意自己的時刻。"}];
const week8Rich=[{"why":"你有沒有遇過：明明只吃「一碗」，今天卻比昨天撐？碗有大有小，堆得多高也不一樣。只記食物名稱，很容易漏掉實際吃進去的量。 份量會影響這餐提供多少能量與營養，但不是越少越好。吃得不足，也可能讓你很快又餓。這週先練習把量看清楚，再搭配食慾、活動與整餐內容做調整。 包裝上的「每份量」是標示的計算單位，不是命令你吃多少。你的實際食用量，才是換算這次攝取量的起點。","whyHtml":"<p>你有沒有遇過：明明只吃「一碗」，今天卻比昨天撐？碗有大有小，堆得多高也不一樣。只記食物名稱，很容易漏掉實際吃進去的量。</p><p>份量會影響這餐提供多少能量與營養，但不是越少越好。吃得不足，也可能讓你很快又餓。這週先練習把量看清楚，再搭配食慾、活動與整餐內容做調整。</p><p>包裝上的「每份量」是標示的計算單位，不是命令你吃多少。你的實際食用量，才是換算這次攝取量的起點。</p>","example":"晚餐盛咖哩飯，你換了一個比較大的碗，還是習慣盛到八分滿。看起來同樣是「一碗」，飯和咖哩卻都比平常多，吃完才發現有點撐。下次先用熟悉的碗盛裝，看看大約多少，再依當天的食慾決定要不要加，不必因為換了大碗就自動裝滿。","exampleHtml":"<p>晚餐盛咖哩飯，你換了一個<strong>比較大的碗</strong>，還是習慣盛到八分滿。</p><p>看起來同樣是<strong>「一碗」</strong>，飯和咖哩卻都比平常多，吃完才發現有點撐。</p><p>下次先用<strong>熟悉的碗</strong>盛裝，看看大約多少，再依當天的食慾決定要不要加，不必因為換了大碗就自動裝滿。</p>","observe":"今天選一餐，看看餐具大小和盛裝高度有沒有影響你取用的量，再留意吃完是否舒服。","judge":["實際量：我吃的是整包、半包，還是幾口？用什麼容器能說清楚？","整餐需要：這只是點心，還是正餐的一部分？有沒有吃得足夠？","採買安排：大包裝真的用得完嗎？能分裝保存，還是小包更方便？"],"do":["拿一項你平常會吃的包裝食品。","找出每份量與每包份數。","把這次準備吃的量放進碗盤，記下大約比例。","若能判斷吃了幾份，就換算一項每份營養數字。","吃完留一句感受，決定下次是否維持或調整。"],"cta":"看懂一次實際食用量。","tip":"今天只練習看懂量，不必為了數字硬把食物減半。","extra":"<div class=\"lesson-info-grid\"><div><b>一包不一定是一份</b><span>先看「本包裝含幾份」，再回頭看實際吃多少。</span></div><div><b>用家裡的碗就好</b><span>寫「平常飯碗八分滿」比只寫「一碗」更好回想。</span></div><div><b>買大包先想怎麼用</b><span>查看保存方式、開封期限與吃的人數，別只看優惠。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/weight-management/just-enough-food-portions\" target=\"_blank\" rel=\"noopener\">份量與每份量</a> · <a href=\"https://www.canada.ca/en/health-canada/services/food-guide/eating-support/cooking/make-healthy-meals-plate.html\" target=\"_blank\" rel=\"noopener\">餐盤搭配</a> · <a href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety\" target=\"_blank\" rel=\"noopener\">剩食保存</a></p>"},{"why":"每餐拿秤很麻煩，外食也不方便。手就在身邊，可以幫你描述「這塊魚大約多大」「這份飯跟昨天差多少」。\n\n手掌法是粗估工具，手的大小、食物厚度和堆法都會影響結果。這不是精準克數，它是一個大約估算的方式。我們先找一個容易重複的參考對照方式就好。","whyHtml":"<p>每餐拿秤很麻煩，外食也不方便。手就在身邊，可以幫你描述「這塊魚大約多大」「這份飯跟昨天差多少」。</p><p>手掌法是粗估工具，手的大小、食物厚度和堆法都會影響結果。這不是精準克數，它是一個大約估算的方式。我們先找一個容易重複的參考對照方式就好。</p>","example":"午餐選烤魚便當，魚肉我們大約選「自己的」一個掌心（或拳頭）大小，飯則記成自己常用碗的半碗。下次改買雞肉便當時，就有可以比較的參考，不必猜「今天好像很多」。","exampleHtml":"<p>午餐選烤魚便當，魚肉我們大約選<strong>「自己的」一個掌心（或拳頭）大小</strong>，飯則記成<strong>自己常用碗的半碗</strong>。</p><p>下次改買雞肉便當時，就有可以比較的參考，不必猜「今天好像很多」。</p>","observe":"把手當成隨身尺，描述大小；真正要吃多少，仍回到自己的需要。","judge":["能估嗎：是整塊魚肉，還是帶骨、裹粉或混合料理？可吃的部分有多少？","一致嗎：我用的是掌心還是整隻手？厚度、盛裝方式有沒有記？","夠用嗎：今天活動與食慾如何？粗估能幫忙，還是需要標示與專業份量計畫？"],"do":["選今天一餐中的魚、肉、豆腐或主食。","用掌心或拳頭比較外觀，先不指定必須吃多少。","記下厚度、帶骨與實際可吃部分。","用同一個說法描述另一項食物，完成這一餐。","留下你的常用估量方式與餐後感受。"],"cta":"用自己的手描述一餐份量。","tip":"如果你有醫療團隊安排的碳水計算或份量計畫，照原計畫；手掌粗估不能取代它。","extra":"<div class=\"lesson-info-grid\"><div><b>掌心看面積</b><span>適合描述成塊食物；厚薄不同，重量也不同。</span></div><div><b>拳頭看體積</b><span>用來粗略比較一團食物的大小，不直接換成固定克數。</span></div><div><b>混合料理換個方法</b><span>炒飯、湯麵或咖哩較難拆開，用碗的大小與盛裝高度描述即可。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/weight-management/just-enough-food-portions\" target=\"_blank\" rel=\"noopener\">份量與每份量</a> · <a href=\"https://www.canada.ca/en/health-canada/services/food-guide/eating-support/cooking/make-healthy-meals-plate.html\" target=\"_blank\" rel=\"noopener\">餐盤搭配</a> · <a href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety\" target=\"_blank\" rel=\"noopener\">剩食保存</a></p>"},{"why":"只盯著飯量，很容易忘了整餐還缺什麼。餐盤法讓你一眼看到食物分布，點餐和採買時都比較有方向。 可以參考蔬果約半盤、蛋白質食物與全穀主食各約四分之一的搭配方向，再依需要調整。水果也可安排在其他時間。比例是搭配提示，盤子大小和盛裝高度仍會影響總量。","whyHtml":"<p>只盯著飯量，很容易忘了整餐還缺什麼。餐盤法讓你一眼看到食物分布，點餐和採買時都比較有方向。</p><p>可以參考蔬果約半盤、蛋白質食物與全穀主食各約四分之一的搭配方向，再依需要調整。水果也可安排在其他時間。比例是搭配提示，盤子大小和盛裝高度仍會影響總量。</p><figure class=\"week8-plate\"><img src=\"data:image/webp;base64,UklGRmYwAQBXRUJQVlA4IFowAQCQJgSdASqAAoACPnk2lUekoyIhq3kaaJAPCU2mUaLnbF/k//+08pb9TcPv8/pt9K/3/qf/Vvrvymf+XT/rpv+nzv43VoQQBsjgdCDScGHk/+neBh1r/QDpiu5QJj5QNoso8f53j0+yv+lfQ227uu3xj/5b+8/zPpNcn98vxv8d/nPeC/w96HuP/S8xLq3z2/9b1cf1j/gewZ+yPTZ8zP7z+sH/6/3W98v9/9SX+w/8zre 有白飯、雞肉和一小撮青菜。你不必把飯全部拿掉，可以加一份青菜，讓雞肉、飯和菜都有位置。採買時先看冰箱已有雞肉與米，今天補青菜就好，不用重新買一整套。</p>","observe":"看一餐時，先問「少了哪一類？」再想「哪裡需要調整？」","judge":["種類：看得到蔬菜、蛋白質與主食嗎？還是幾乎都在吃同一類？","總量：盤子很大或堆得很高嗎？比例漂亮也要看看實際量。","可行：家裡有什麼？預算內最容易補上的食物是哪一項？"],"do":["拿一個平常會用的餐盤或便當盒。","辨認現有食物中的蔬菜、蛋白質與主食。","參考餐盤方向，把缺少的一類補上。","照食慾盛裝，吃完留意是否足夠或太撐。","記下這次組合，以及下次只需要補買的食材。"],"cta":"用餐盤法組合今天的一餐。","tip":"不用每餐擺得像照片。湯麵、燴飯也能看食材組合；地瓜與玉米要一起考慮主食的量。","extra":"<div class=\"lesson-info-grid\"><div><b>蔬菜可以方便一點</b><span>冷凍蔬菜、好清洗的青菜都能用，選你真的會煮的。</span></div><div><b>蛋白質不用只靠肉</b><span>豆腐、豆類、蛋、魚肉都可輪流搭配。</span></div><div><b>主食保留位置</b><span>飯、麵、地瓜不用消失；有全穀選項時可以試著替換一部分。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/weight-management/just-enough-food-portions\" target=\"_blank\" rel=\"noopener\">份量與每份量</a> · <a href=\"https://www.canada.ca/en/health-canada/services/food-guide/eating-support/cooking/make-healthy-meals-plate.html\" target=\"_blank\" rel=\"noopener\">餐盤搭配</a> · <a href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety\" target=\"_blank\" rel=\"noopener\">剩食保存</a></p>"},{"why":"餐廳設計的是一整份餐食，可以餐點上桌後，看看份量，是否需要再加點其他選項。\n\n加大只多一點錢，未必是你需要的優惠。點餐前問清楚大小、配餐和能否分享，通常比吃撐後才後悔更省事。","whyHtml":"<p>餐廳設計的是一整份餐食，可以餐點上桌後，看看份量，是否需要再加點其他選項。</p><p>加大只多一點錢，未必是你需要的優惠。點餐前問清楚大小、配餐和能否分享，通常比吃撐後才後悔更省事。</p>","example":"兩個人點披薩，套餐還附義大利麵、薯條和飲料。先確認披薩大小，再決定要不要整套。可以先點主餐和蔬菜，真的不夠再加；若預計有剩食，先確認能否及時帶回冷藏。","exampleHtml":"<p><strong>真實情境：</strong>兩個人點披薩，套餐還附義大利麵、薯條和飲料。先確認披薩大小，再決定要不要整套。可以先點主餐和蔬菜，真的不夠再加；若預計有剩食，先確認能否及時帶回冷藏。</p>","observe":"今天看的是店家的「一份」，跟你需要的「一餐」有沒有落差。","judge":["點餐前：幾個人吃？主餐之外是否又附飯麵、麵包或配餐？","上桌後：先盛到自己盤裡，是否比較容易看懂吃了多少？","吃不完：可以分享或妥善保存嗎？行程不方便冷藏時能否少點再加？"],"do":["選一間你真的會去的餐廳，查看菜單份量。","確認用餐人數、套餐內容和總價。","提出一個需要的調整，例如小份、分享或不加大。","上桌後按需要取餐，中途再決定是否加量。","記下剛好的點法與剩食安排，留作下次參考。"],"cta":"在餐廳決定適合自己的份量。","tip":"分享可以，吃完也可以。你要練的是自己做決定，不是遵守「外食只能吃半份」。","extra":"<div class=\"lesson-info-grid\"><div><b>點餐可以這樣問</b><span>「這份大概多大？有附飯嗎？我們兩人分享合適嗎？」</span></div><div><b>合菜先看全桌</b><span>先看有哪些菜，再盛到自己的盤裡，避免一直夾卻忘了吃過什麼。</span></div><div><b>打包也看行程</b><span>熟食一般應在兩小時內冷藏；超過 32°C 的炎熱環境縮短為一小時。沒辦法保冷時，少點再加更方便。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/weight-management/just-enough-food-portions\" target=\"_blank\" rel=\"noopener\">份量與每份量</a> · <a href=\"https://www.canada.ca/en/health-canada/services/food-guide/eating-support/cooking/make-healthy-meals-plate.html\" target=\"_blank\" rel=\"noopener\">餐盤搭配</a> · <a href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety\" target=\"_blank\" rel=\"noopener\">剩食保存</a></p>"},{"why":"有些人常狼吞虎嚥，吃飯吃得很急，當最後一口吞下去，才發現自己已經很撐。\n\n想練習慢一點，可以先從幾口開始，試著一口咀嚼 20～25 次，把它當成放慢速度的提醒；實際次數依食物軟硬調整，不用每口都數。\n\n飽足訊號的傳遞需要時間，常以大約 20 分鐘來提醒我們別吃太快，但不是每個人都要等滿 20 分鐘才會覺得飽。慢慢咀嚼、留意用餐中的感受，能幫助你及時察覺已經吃得足夠，減少不小心吃撐的機會。","whyHtml":"<p>有些人常狼吞虎嚥，吃飯吃得很急，當最後一口吞下去，才發現自己已經很撐。</p><p>想練習慢一點，可以先從幾口開始，試著<strong>一口咀嚼 20～25 次</strong>，把它當成放慢速度的提醒；實際次數依食物軟硬調整，不用每口都數。</p><p>飽足訊號的傳遞需要時間，常以<strong>大約 20 分鐘</strong>來提醒我們別吃太快，但不是每個人都要等滿 20 分鐘才會覺得飽。慢慢咀嚼、留意用餐中的感受，能幫助你及時察覺已經吃得足夠，減少不小心吃撐的機會。</p>","example":"午餐吃便當，你平常一邊滑手機，一邊很快把飯吃完。今天先把手機放旁邊，每口慢慢嚼，吞下後再夾下一口。吃到一半時，問自己：「我還餓嗎？肚子舒服嗎？」還餓就繼續吃；已經飽了，就不用勉強把剩下的吃完。","exampleHtml":"<p>午餐吃便當，你平常一邊滑手機，一邊很快把飯吃完。</p><p>今天先<strong>把手機放旁邊</strong>，每口慢慢嚼，吞下後再夾下一口。</p><p>吃到一半時，問自己：<strong>「我還餓嗎？肚子舒服嗎？」</strong>還餓就繼續吃；已經飽了，就不用勉強把剩下的吃完。</p>","observe":"今天只練一件事：吃慢一點，留意自己什麼時候吃得剛好。","judge":["身體：我仍餓、舒服地飽，還是有點撐？不確定也可以嗎？","搭配：這餐有主食、蛋白質和蔬菜嗎？很快又餓可能需要補足。","下一步：我需要繼續吃、加一點、保留剩食，還是讓用餐安靜一些？"],"do":["挑一餐比較能留意自己的時刻。","開吃前寫下餓感或上一餐的時間。","吃到中途，花一小段時間感受身體與滿足程度。","依需要繼續、加量或停下，不要求固定答案。","餐後記一句感受，下次只調整一件事。"],"cta":"在一餐中留意飽足與滿足。","tip":"如果觀察讓你更焦慮，就簡化成一句感受。明顯飢餓時不必用忍耐來完成練習。","extra":"<div class=\"lesson-info-grid\"><div><b>不必計分</b><span>用「還餓」「舒服」「有點撐」「不確定」就能留下線索。</span></div><div><b>很快又餓時</b><span>回頭看這餐是否足夠、搭配是否完整，也留意當天活動。</span></div><div><b>下一餐照常</b><span>某餐吃得多，不用靠跳餐補償；把經驗留給下次調整。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/weight-management/just-enough-food-portions\" target=\"_blank\" rel=\"noopener\">份量與每份量</a> · <a href=\"https://www.canada.ca/en/health-canada/services/food-guide/eating-support/cooking/make-healthy-meals-plate.html\" target=\"_blank\" rel=\"noopener\">餐盤搭配</a> · <a href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety\" target=\"_blank\" rel=\"noopener\">剩食保存</a></p><p class=\"week6-sources\">慢食參考：<a href=\"https://www.health.harvard.edu/healthy-aging-and-longevity/8-steps-to-mindful-eating\" target=\"_blank\" rel=\"noopener\">Harvard Health：細嚼慢嚥</a> · <a href=\"https://www.bhf.org.uk/informationsupport/heart-matters-magazine/nutrition/how-to-stop-overeating\" target=\"_blank\" rel=\"noopener\">英國心臟基金會：放慢用餐與飽足感</a></p>"}];
weeks[7].title='為什麼份量很重要';
weeks[7].outcome='看懂份量、照顧食慾，把順手的方法用在餐桌、外食與採買。';
weeks[7].lessons=week8Meta.map(l=>l.title);weeks[7].daily_actions=week8Days.map(d=>d.title);
weeks[7].review_prompts=['哪個份量提示最順手？','哪一餐的份量或搭配需要調整？','下週想保留哪個方法、買哪些食材？'];
curriculum[7].why=weeks[7].outcome;
curriculum[7].intro='一碗、一包、一份套餐，到底是多少？這週一起把份量看清楚，用手掌、餐盤與身體感受，找到吃得夠也舒服的方式。';
curriculum[7].ability='會描述實際食用量、用視覺提示搭配一餐、調整外食點法，留下符合人數與餐次的採買清單。';
curriculum[7].completion='完成一次真實觀察與選擇就有價值，不以吃得最少或估得最準評分。';
curriculum[7].lessons=week8Meta;curriculum[7].actions=week8Days.map(d=>({title:d.title,steps:d.steps}));
curriculum[7].challenge={title:'真實挑戰：這份餐，適合今天的我嗎？',prompt:'遇到大份套餐、合菜或大包裝，先看實際量與搭配，再決定怎麼取餐、加量或分裝。留下一句餐後感受。',success:'說得出實際份量，並完成一個符合需要的選擇。'};
curriculum[7].flex=['臨時買湯麵','聚餐分享合菜','只有大包裝點心'];
week8Rich.forEach((r,i)=>lessonRichOverrides['8-'+(i+1)]=r);actionOverrides[8]=week8Days.map(d=>d.steps);
function week8Record(d,r){const item=week8Days[d-1];return `<div class="micro action-record"><div class="eyebrow">今日份量實際記錄</div><h3>${esc(item.cta)}</h3><p>依今天主題留下你的份量觀察與選擇，下次可以直接使用。</p><div class="record-grid">${item.labels.map((label,i)=>`<div class="field record-wide"><label for="${['recordMain','recordKey','recordInsight'][i]}">${esc(label)}</label><textarea id="${['recordMain','recordKey','recordInsight'][i]}" rows="3" placeholder="${esc(label)}；依今天實際情況填寫。">${esc(r[['main','key','insight'][i]]||'')}</textarea></div>`).join('')}</div><button class="btn soft" onclick="saveActionRecord(8,${d})">儲存這筆記錄</button></div>`;}
function week8Context(d){const item=week8Days[d-1];return `<section class="depth-card week8-context"><p class="eyebrow">02 · 看見｜今天的真實情境</p><p>${esc(item.example)}</p></section><section class="depth-card week8-context"><p class="eyebrow">03 · 判斷｜依今天主題做選擇</p><ul>${item.judge.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;}


const week9Days=[{"title":"走路 5～10 分鐘，找到舒服的起步速度。","focus":"不用先變得很會運動，先找一段願意走出去的時間。","why":"想到運動，你是不是先想到跑步、流汗，還有「我今天真的沒力了」？其實買菜多走一段、在住家附近散步，都可以是起點。規律活動有助於心肺健康、血糖管理與睡眠，收穫不只在體重計上。\n\n這週先從短時間、做得到的活動開始。今天試著走 5～10 分鐘，太多就縮短；已經有運動習慣的人，也可以照自己的安排，不需要刻意退回起點。\n\n一般成人可逐步朝每週 150～300 分鐘中等強度有氧活動、至少兩天肌力活動前進。這是長期方向，不是第一週就要交出的作業；輕鬆散步有價值，但不一定達到中等強度。","example":"晚餐後你常坐著滑手機。今天先穿好鞋，在附近平坦的路走一小圈，前後都放慢，中間用舒服的速度。回家只記下走了幾分鐘、身體感覺如何，不用追步數排行榜。","judge":["時間：哪個時刻最容易出門？五分鐘是否比訂半小時更實際？","環境：路面平不平、天氣熱不熱？需要換成室內路線嗎？","強度：呼吸是否舒服？稍微變快仍能說話，不用走到喘不過氣。"],"steps":["選一條平坦、安全、方便折返的短路線。","穿穩固的鞋，先用慢步走暖身。","按體能走 5～10 分鐘，必要時縮短或休息。","最後放慢速度，留意呼吸與身體感受。","記下實際時間和下次最容易出發的時刻。"],"notes":"胸痛、暈眩或異常喘時先停止；症狀嚴重或持續就立即求助。今天的目標是舒服地開始。","cta":"走路 5～10 分鐘，找到舒服的起步速度。","labels":["走路時間、地點與實際分鐘","速度是否舒服？途中有沒有休息？","身體感受與下次出發時刻"],"whyHtml":"<p>想到運動，你是不是先想到跑步、流汗，還有「我今天真的沒力了」？其實買菜多走一段、在住家附近散步，都可以是起點。規律活動有助於心肺健康、血糖管理與睡眠，收穫不只在體重計上。</p><p>這週先從短時間、做得到的活動開始。今天試著走 5～10 分鐘，太多就縮短；已經有運動習慣的人，也可以照自己的安排，不需要刻意退回起點。</p><p>一般成人可逐步朝每週 150～300 分鐘中等強度有氧活動、至少兩天肌力活動前進。這是長期方向，不是第一週就要交出的作業；輕鬆散步有價值，但不一定達到中等強度。</p>","exampleHtml":"<p>晚餐後你常坐著滑手機。今天先穿好鞋，在附近平坦的路走一小圈，前後都放慢，中間用舒服的速度。回家只記下走了幾分鐘、身體感覺如何，不用追步數排行榜。</p>"},{"title":"打斷久坐，今天安排兩次活動空檔。","focus":"今天不增加一堂課，先把一直坐著的時間切開。","why":"久坐常見危害，除了肌肉因長時間維持固定角度而緊繃，引起痠痛外，還會產生下肢循環變差與代謝與心血管負擔的風險","example":"工作時常打電腦連著回信，直到肩頸與腰背僵硬，才發現坐了很久。每坐 30至60分鐘 就起身走動或倒水 2至3分鐘、原地輕踏步，都能讓長時間不動的身體換個節奏。\n\n若站立不方便，就在穩固椅上活動腳踝、輪流抬腳。","judge":["觸發：用鬧鐘、工作段落結束，還是接水最不容易忘？","可行：會議中能換姿勢嗎？不能離席時有沒有舒服的坐姿活動？","持續：今天先試兩次是否做得到？提醒太密會不會反而忽略？"],"steps":["找一段容易連坐很久的工作或追劇時間。","設定一個提醒，或選一個自然的中斷點。","起身走動 2～3 分鐘；不便站立可改輕柔坐姿活動。","今天再試一次，看看哪個提醒最有效。","記下實際中斷次數與身體感受。"],"notes":"活動空檔不用做得很累；換姿勢、動一動就好，也不必用站一整天取代坐一整天。","cta":"打斷久坐，今天安排兩次活動空檔。","labels":["最容易久坐的情境與提醒方式","實際活動了幾次？每次做什麼？","哪個提醒有用，下次怎麼安排？"],"whyHtml":"<p><strong>久坐常見危害，除了肌肉因長時間維持固定角度而緊繃，引起痠痛外，還會產生下肢循環變差與代謝與心血管負擔的風險</strong></p>","exampleHtml":"<p>工作時常打電腦連著回信，直到肩頸與腰背僵硬，才發現坐了很久。<strong>每坐 30至60分鐘 就起身走動或倒水 2至3分鐘、原地輕踏步，都能讓長時間不動的身體換個節奏。</strong></p><p>若站立不方便，就在穩固椅上活動腳踝、輪流抬腳。</p><p><strong>先找出今天最長的一段久坐，把一個活動空檔插進去。</strong></p>"},{"title":"居家可做的運動：學會兩個基本動作。","focus":"一張穩固椅子、一面牆，就能開始練習幾個基本動作。","why":"下雨、沒時間去健身房，也不代表今天只能放棄。把家裡清出一小塊空間，就能練：超慢跑、徒手深蹲、瑜伽伸展與核心穩定運動。\n\n今天先學會動作，不追求次數或流多少汗。每個動作做幾次、休息一下，看看哪個適合你；姿勢穩定、能自然呼吸，比硬做完一整組更重要。","example":"在看電視時，利用客廳的空間，拿出瑜珈墊做核心穩定，如：棒式、蹲馬步、超慢跑。強化平衡力、肌力、肌耐力促進健康。\n\n椅子、門框、牆壁皆是好設備：另外也可以扶著沒有輪子的椅子做深蹲，年紀較大的長輩則可以進行坐姿站起，或是借助門框、牆壁做伸展、伏牆挺身、抬腿等運動，增加動作的變化性。","judge":["空間：地面防滑、椅子穩固，附近沒有容易絆倒的物品嗎？","動作：能平穩控制、自然呼吸嗎？有疼痛就換動作或停止。","難度：減少次數、縮小幅度或改坐姿，哪個版本最適合今天？"],"steps":["清出空間，把無輪穩固椅子靠牆，備好飲水。","用輕柔踏步或坐姿活動暖身幾分鐘。","從下方動作卡選兩個，每個先試 3～5 次。","動作間休息，保持自然呼吸，不憋氣、不硬撐。","記下選了哪些動作、次數與需要調整的地方。"],"notes":"動作有刺痛或關節痛就停止。若有近期手術、受傷或活動限制，先確認適合的版本。","cta":"居家可做的運動：學會兩個基本動作。","labels":["我選的兩個動作與版本","各做幾次？需要什麼支撐或休息？","哪個動作順手，哪裡需要調整？"],"whyHtml":"<p>下雨、沒時間去健身房，也不代表今天只能放棄。把家裡清出一小塊空間，就能練<strong>：超慢跑、徒手深蹲、瑜伽伸展與核心穩定運動。</strong></p><p><strong>今天先學會動作，不追求次數或流多少汗。每個動作做幾次、休息一下，看看哪個適合你；姿勢穩定、能自然呼吸，比硬做完一整組更重要。</strong></p>","exampleHtml":"<p><strong>在看電視時，利用客廳的空間，拿出瑜珈墊做核心穩定，如：棒式、蹲馬步、超慢跑。強化平衡力、肌力、肌耐力促進健康。</strong></p><p><strong>椅子、門框、牆壁皆是好設備：另外也可以扶著沒有輪子的椅子做深蹲，年紀較大的長輩則可以進行坐姿站起，或是借助門框、牆壁做伸展、伏牆挺身、抬腿等運動，增加動作的變化性。</strong></p><p><strong>今天先把空間準備好，再選兩個不會引起疼痛的動作試做。</strong></p>"},{"title":"心肺耐力／肌耐力運動：完成一個簡單組合。","focus":"一種練心肺功能持續活動，一種練特定肌肉群對抗阻力、反覆用力的持久力；今天試著把兩者搭起來","why":"走一段路就很喘，和提東西一下就覺得手痠或無力，是不同的感受。心肺耐力幫助你持續活動；肌耐力則是肌肉反覆出力、維持動作的能力。兩者都和日常生活有關，也常一起被用到。\n\n可用低衝擊踏步搭配坐站或推牆，試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。\n\n起步不用跳躍、衝刺或做到力竭。運動量慢慢增加，先從每週3到5次，每次5分鐘開始；隨著體能的增加可加長運動時間。\n\n如果運動完隔天太過疲累可以休息，讓身體恢復。","example":"今天先用原地擺手踏步暖身和靜態伸展，然後弓箭步左右各20下，徒手深蹲1分鐘，開合跳1分鐘，原地擺手抬腳1分鐘。試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。動作之間能不休息就不要休息，可利用原地抬腳擺手來緩和心率。\n\n動作的快慢由自己決定，建議不要趕快，順順的做就好。\n\n如果你發現自己負荷不了，隨時可以停下來休息，等身體恢復再繼續進行下一個動作。\n\n所有訓練量力而為，運動過程中產生任何不適，請立即停止。必要時尋求專業協助。","judge":["心肺：踏步時還能說話嗎？太喘就降速、縮短或休息。","肌耐力：最後幾次仍能穩定完成嗎？開始憋氣或姿勢跑掉就先停。","恢復：昨天有沒有練到同一部位？今天有明顯痠痛或疲累嗎？"],"steps":["先用輕鬆踏步或坐姿活動暖身 3～5 分鐘。","選原地踏步或低衝擊側踏，先做 1 分鐘，按能力縮短。","選坐站或推牆做約 5 次，沿用昨天學到的姿勢。","休息至呼吸舒服；有餘力可再一輪，最後慢慢收操。","分別記下分鐘、次數與感受，安排恢復時間。"],"notes":"輕微用力感和尖銳疼痛不同；不用追求越痠越有效。若今天還沒恢復，改輕柔活動或休息。","cta":"心肺耐力／肌耐力運動：完成一個簡單組合。","labels":["心肺活動名稱、分鐘與輪數","肌耐力動作、次數與休息","呼吸、肌肉感受與下次恢復安排"],"whyHtml":"<p>走一段路就很喘，和提東西一下就覺得手痠或無力，是不同的感受。<strong>心肺耐力幫助你持續活動；肌耐力則是肌肉反覆出力、維持動作的能力。</strong>兩者都和日常生活有關，也常一起被用到。</p><p>可用低衝擊踏步搭配坐站或推牆，試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。</p><p><strong>起步不用跳躍、衝刺或做到力竭。運動量慢慢增加，先從每週3到5次，每次5分鐘開始；隨著體能的增加可加長運動時間。</strong></p><p><strong>如果運動完隔天太過疲累可以休息，讓身體恢復。</strong></p>","exampleHtml":"<p>今天先用原地擺手踏步暖身和靜態伸展，然後弓箭步左右各20下，徒手深蹲1分鐘，開合跳1分鐘，原地擺手抬腳1分鐘。試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。動作之間能不休息就不要休息，<strong>可利用原地抬腳擺手來緩和心率</strong>。</p><ul><li><strong>動作的快慢由自己決定，建議不要趕快，順順的做就好。</strong></li><li><strong>如果你發現自己負荷不了，隨時可以停下來休息，等身體恢復再繼續進行下一個動作。</strong></li><li><strong>所有訓練量力而為，運動過程中產生任何不適，請立即停止。必要時尋求專業協助。</strong></li></ul>"},{"title":"建立自己的最低活動量，今天先試一次。","focus":"替忙碌日留一個小版本，讓下一次開始更容易。","why":"最難的常不是某天做很多，而是忙起來之後，還能找得到開始的方法。把活動接在固定時刻，再準備一個較短版本，就不用每天重新和自己討論。\n\n最低版本可以是走五分鐘、起身活動兩次，或做幾次熟悉的動作。它的功能是維持習慣，不是這樣就已達到完整運動建議。體能好之後再慢慢增加。","example":"你原本想每天走路半小時，但下雨或加班就整週中斷。可以改成「看電視時拿起裝水的寶特瓶，充當啞鈴練臂力，或者進行5到10分鐘的超慢跑」。另外選兩個不連續的日子做居家肌力練習，當天很累，就用較輕鬆版本，記住，行動比不行動好，也可以在youtube上挑選適合您的簡單運動跟練。","judge":["明確：什麼事情做完後開始？在哪裡？做哪一種活動？","彈性：普通日、忙碌日和需要休息的日子，各怎麼安排？","進展：先穩定一週再調整，是否比一次訂太多更容易做到？"],"steps":["選一個喜歡且適合自己的活動。","寫下固定開始時刻、地點與普通日的時間或次數。","準備忙碌日的短版本，以及需要休息時的安排。","今天實際做一次短版本，看看是否真的方便。","把下次時間放進行程，只留下最需要的一個提醒。"],"notes":"這是你的起步方案，不是每天的最低及格線。生病或不舒服時可以休息。","cta":"建立自己的最低活動量，今天先試一次。","labels":["我的開始時刻、地點與活動","普通日／忙碌日版本與休息安排","今天試做結果與下一次時間"],"whyHtml":"<p>最難的常不是某天做很多，而是忙起來之後，還能找得到開始的方法。把活動接在固定時刻，再準備一個較短版本，就不用每天重新和自己討論。</p><p>最低版本可以是走五分鐘、起身活動兩次，或做幾次熟悉的動作。它的功能是維持習慣，不是這樣就已達到完整運動建議。體能好之後再慢慢增加。</p>","exampleHtml":"<p>你原本想每天走路半小時，但下雨或加班就整週中斷。可以改成「看電視時拿起裝水的寶特瓶，充當啞鈴練臂力，或者進行5到10分鐘的超慢跑」。另外選兩個不連續的日子做居家肌力練習，當天很累，就用較輕鬆版本，記住，<strong>行動比不行動好</strong>，也可以在youtube上挑選適合您的簡單運動跟練。</p>"},{"title":"彈性日：把活動換成今天做得到的版本。","focus":"下雨、加班或行程改變，就換方法，不用補做。","why":"活動計畫能不能留下來，常取決於它能不能調整。戶外改室內、長時間拆短、疲累時改輕柔活動，都是把方法帶進生活。","example":"今天下雨，原本的散步取消。你改在室內輕鬆踏步幾分鐘；如果腿還痠，就做舒服的坐姿活動，或安排休息，不用硬湊到原本時間。","judge":["現在是時間不夠、環境不合適，還是身體需要休息？","哪個熟悉的版本今天做起來最方便？","做完是舒服，還是更疲累？下次要不要再縮小？"],"steps":["記下今天計畫改變的原因。","選室內、短時間或坐姿的熟悉版本；不舒服就休息。","確認空間與身體狀況，再開始輕柔活動。","按能力完成，不追趕昨天或原定的數字。","留下一個下次遇到同樣情況能用的備案。"],"notes":"調整不等於放棄。需要休息時，把下一次可行時間留下來就好。","cta":"今天用一個可行版本照顧身體。","labels":["原本計畫與今天的限制","我選的替代活動或休息安排","做完感受與下次可用的備案"],"whyHtml":"<p>活動計畫能不能留下來，常取決於它能不能調整。戶外改室內、長時間拆短、疲累時改輕柔活動，都是把方法帶進生活。</p>"},{"title":"每週回顧：留下自己的活動小計畫。","focus":"看看哪個活動最順手，再排進下一週。","why":"這週不只看總分鐘，也看哪些方法容易開始、做完是否舒服。把有效的時間與動作留下來，下一週就有自己的起點。","example":"你發現下班走路容易做到，鬧鐘提醒起身卻常被關掉。下週保留散步，把活動空檔接在工作段落後；居家練習排在兩個不連續的日子，讓身體有恢復時間。","judge":["哪種活動我願意再做，哪個時刻最容易開始？","哪天太累、太趕或不舒服，方案需要怎麼調整？","下週是否有有氧、適合的肌力練習與休息，而不只追同一個數字？"],"steps":["回看本週的活動時間、動作與感受。","選一個最容易重複的有氧活動。","安排適合自己的居家肌力練習與恢復日。","準備飲水、正常用餐與忙碌日的替代方案。","完成本週 check-in，寫下下一次開始的時間。"],"notes":"先保留有效的一件事，再慢慢累積；沒完成的部分不需要加倍補回來。","cta":"今天排好下週的活動、恢復與備案。","labels":["這週最順手的活動與實際經驗","下週活動日、時間及恢復安排","飲水／用餐準備與忙碌日備案"],"whyHtml":"<p>這週不只看總分鐘，也看哪些方法容易開始、做完是否舒服。把有效的時間與動作留下來，下一週就有自己的起點。</p>"}];
const week9Meta=[{"title":"為什麼活動很重要：從走路開始","concept":"不用先變得很會運動，先找一段願意走出去的時間。","hook":"為什麼活動很重要：從走路開始","example":"晚餐後你常坐著滑手機。今天先穿好鞋，在附近平坦的路走一小圈，前後都放慢，中間用舒服的速度。回家只記下走了幾分鐘、身體感覺如何，不用追步數排行榜。","apply":"選一條平坦、安全、方便折返的短路線。"},{"title":"打斷久坐：讓身體換個姿勢","concept":"今天不增加一堂課，先把一直坐著的時間切開。","hook":"打斷久坐：讓身體換個姿勢","example":"工作時常打電腦連著回信，直到肩頸與腰背僵硬，才發現坐了很久。每坐 30至60分鐘 就起身走動或倒水 2至3分鐘、原地輕踏步，都能讓長時間不動的身體換個節奏。\n\n若站立不方便，就在穩固椅上活動腳踝、輪流抬腳。","apply":"找一段容易連坐很久的工作或追劇時間。"},{"title":"居家可做的運動","concept":"一張穩固椅子、一面牆，就能開始練習幾個基本動作。","hook":"居家可做的運動","example":"在看電視時，利用客廳的空間，拿出瑜珈墊做核心穩定，如：棒式、蹲馬步、超慢跑。強化平衡力、肌力、肌耐力促進健康。\n\n椅子、門框、牆壁皆是好設備：另外也可以扶著沒有輪子的椅子做深蹲，年紀較大的長輩則可以進行坐姿站起，或是借助門框、牆壁做伸展、伏牆挺身、抬腿等運動，增加動作的變化性。","apply":"清出空間，把無輪穩固椅子靠牆，備好飲水。"},{"title":"心肺耐力／肌耐力運動","concept":"一種練心肺功能持續活動，一種練特定肌肉群對抗阻力、反覆用力的持久力；今天試著把兩者搭起來","hook":"心肺耐力／肌耐力運動","example":"今天先用原地擺手踏步暖身和靜態伸展，然後弓箭步左右各20下，徒手深蹲1分鐘，開合跳1分鐘，原地擺手抬腳1分鐘。試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。動作之間能不休息就不要休息，可利用原地抬腳擺手來緩和心率。\n\n動作的快慢由自己決定，建議不要趕快，順順的做就好。\n\n如果你發現自己負荷不了，隨時可以停下來休息，等身體恢復再繼續進行下一個動作。\n\n所有訓練量力而為，運動過程中產生任何不適，請立即停止。必要時尋求專業協助。","apply":"先用輕鬆踏步或坐姿活動暖身 3～5 分鐘。"},{"title":"建立你的最低活動量","concept":"替忙碌日留一個小版本，讓下一次開始更容易。","hook":"建立你的最低活動量","example":"你原本想每天走路半小時，但下雨或加班就整週中斷。可以改成「看電視時拿起裝水的寶特瓶，充當啞鈴練臂力，或者進行5到10分鐘的超慢跑」。另外選兩個不連續的日子做居家肌力練習，當天很累，就用較輕鬆版本，記住，行動比不行動好，也可以在youtube上挑選適合您的簡單運動跟練。","apply":"選一個喜歡且適合自己的活動。"}];
const week9Rich=[{"why":"想到運動，你是不是先想到跑步、流汗，還有「我今天真的沒力了」？其實買菜多走一段、在住家附近散步，都可以是起點。規律活動有助於心肺健康、血糖管理與睡眠，收穫不只在體重計上。 這週先從短時間、做得到的活動開始。今天試著走 5～10 分鐘，太多就縮短；已經有運動習慣的人，也可以照自己的安排，不需要刻意退回起點。 一般成人可逐步朝每週 150～300 分鐘中等強度有氧活動、至少兩天肌力活動前進。這是長期方向，不是第一週就要交出的作業；輕鬆散步有價值，但不一定達到中等強度。","whyHtml":"<p>想到運動，你是不是先想到跑步、流汗，還有「我今天真的沒力了」？其實買菜多走一段、在住家附近散步，都可以是起點。規律活動有助於心肺健康、血糖管理與睡眠，收穫不只在體重計上。</p><p>這週先從短時間、做得到的活動開始。今天試著走 5～10 分鐘，太多就縮短；已經有運動習慣的人，也可以照自己的安排，不需要刻意退回起點。</p><p>一般成人可逐步朝每週 150～300 分鐘中等強度有氧活動、至少兩天肌力活動前進。這是長期方向，不是第一週就要交出的作業；輕鬆散步有價值，但不一定達到中等強度。</p>","example":"晚餐後你常坐著滑手機。今天先穿好鞋，在附近平坦的路走一小圈，前後都放慢，中間用舒服的速度。回家只記下走了幾分鐘、身體感覺如何，不用追步數排行榜。","exampleHtml":"<p>晚餐後你常坐著滑手機。今天先穿好鞋，在附近平坦的路走一小圈，前後都放慢，中間用舒服的速度。回家只記下走了幾分鐘、身體感覺如何，不用追步數排行榜。</p>","observe":"今天找一個固定時刻，例如下班到家後，接上一小段走路。","judge":["時間：哪個時刻最容易出門？五分鐘是否比訂半小時更實際？","環境：路面平不平、天氣熱不熱？需要換成室內路線嗎？","強度：呼吸是否舒服？稍微變快仍能說話，不用走到喘不過氣。"],"do":["選一條平坦、安全、方便折返的短路線。","穿穩固的鞋，先用慢步走暖身。","按體能走 5～10 分鐘，必要時縮短或休息。","最後放慢速度，留意呼吸與身體感受。","記下實際時間和下次最容易出發的時刻。"],"cta":"走路 5～10 分鐘，找到舒服的起步速度。","tip":"胸痛、暈眩或異常喘時先停止；症狀嚴重或持續就立即求助。今天的目標是舒服地開始。","extra":"<div class=\"lesson-info-grid\"><div><b>走得快不快怎麼看？</b><span>中等強度通常呼吸變快，能說話但不太能唱歌；先從更輕鬆的速度也可以。</span></div><div><b>水先準備好</b><span>這種短時間活動通常喝水即可，不必為了走十分鐘特別買運動飲料。</span></div><div><b>血糖用藥要留意</b><span>使用胰島素或磺醯脲類藥物者，運動中或之後可能低血糖；依醫療團隊安排監測與處置，不自行改藥。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.who.int/europe/publications/i/item/9789240014886\" target=\"_blank\" rel=\"noopener\">WHO：活動建議</a> · <a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/healthy-living-with-diabetes\" target=\"_blank\" rel=\"noopener\">NIDDK：活動、飲水與血糖</a> · <a href=\"https://www.cdc.gov/healthy-weight-growth/physical-activity/index.html\" target=\"_blank\" rel=\"noopener\">CDC：活動強度</a></p>"},{"why":"久坐常見危害，除了肌肉因長時間維持固定角度而緊繃，引起痠痛外，還會產生下肢循環變差與代謝與心血管負擔的風險","whyHtml":"<p><strong>久坐常見危害，除了肌肉因長時間維持固定角度而緊繃，引起痠痛外，還會產生下肢循環變差與代謝與心血管負擔的風險</strong></p>","example":"工作時常打電腦連著回信，直到肩頸與腰背僵硬，才發現坐了很久。每坐 30至60分鐘 就起身走動或倒水 2至3分鐘、原地輕踏步，都能讓長時間不動的身體換個節奏。\n\n若站立不方便，就在穩固椅上活動腳踝、輪流抬腳。","exampleHtml":"<p>工作時常打電腦連著回信，直到肩頸與腰背僵硬，才發現坐了很久。<strong>每坐 30至60分鐘 就起身走動或倒水 2至3分鐘、原地輕踏步，都能讓長時間不動的身體換個節奏。</strong></p><p>若站立不方便，就在穩固椅上活動腳踝、輪流抬腳。</p><p><strong>先找出今天最長的一段久坐，把一個活動空檔插進去。</strong></p>","observe":"","judge":["觸發：用鬧鐘、工作段落結束，還是接水最不容易忘？","可行：會議中能換姿勢嗎？不能離席時有沒有舒服的坐姿活動？","持續：今天先試兩次是否做得到？提醒太密會不會反而忽略？"],"do":["找一段容易連坐很久的工作或追劇時間。","設定一個提醒，或選一個自然的中斷點。","起身走動 2～3 分鐘；不便站立可改輕柔坐姿活動。","今天再試一次，看看哪個提醒最有效。","記下實際中斷次數與身體感受。"],"cta":"打斷久坐，今天安排兩次活動空檔。","tip":"活動空檔不用做得很累；換姿勢、動一動就好，也不必用站一整天取代坐一整天。","extra":"<div class=\"lesson-info-grid\"><div><b>辦公室版本</b><span>回完一段工作後走一小圈，別每次休息都繼續坐著滑手機。</span></div><div><b>在家版本</b><span>一集節目結束就起身整理桌面或走動，讓提示自然出現。</span></div><div><b>點心照需要安排</b><span>接水休息不等於一定要買點心；若真的餓，可選水果搭牛奶或無糖豆漿，也別用喝水代替吃飯。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.who.int/europe/publications/i/item/9789240014886\" target=\"_blank\" rel=\"noopener\">WHO：活動建議</a> · <a href=\"https://www.nhs.uk/live-well/exercise/sitting-exercises/\" target=\"_blank\" rel=\"noopener\">NHS：坐姿活動</a></p>","omitObserve":true},{"why":"下雨、沒時間去健身房，也不代表今天只能放棄。把家裡清出一小塊空間，就能練：超慢跑、徒手深蹲、瑜伽伸展與核心穩定運動。\n\n今天先學會動作，不追求次數或流多少汗。每個動作做幾次、休息一下，看看哪個適合你；姿勢穩定、能自然呼吸，比硬做完一整組更重要。","whyHtml":"<p>下雨、沒時間去健身房，也不代表今天只能放棄。把家裡清出一小塊空間，就能練<strong>：超慢跑、徒手深蹲、瑜伽伸展與核心穩定運動。</strong></p><p><strong>今天先學會動作，不追求次數或流多少汗。每個動作做幾次、休息一下，看看哪個適合你；姿勢穩定、能自然呼吸，比硬做完一整組更重要。</strong></p>","example":"在看電視時，利用客廳的空間，拿出瑜珈墊做核心穩定，如：棒式、蹲馬步、超慢跑。強化平衡力、肌力、肌耐力促進健康。\n\n椅子、門框、牆壁皆是好設備：另外也可以扶著沒有輪子的椅子做深蹲，年紀較大的長輩則可以進行坐姿站起，或是借助門框、牆壁做伸展、伏牆挺身、抬腿等運動，增加動作的變化性。","exampleHtml":"<p><strong>在看電視時，利用客廳的空間，拿出瑜珈墊做核心穩定，如：棒式、蹲馬步、超慢跑。強化平衡力、肌力、肌耐力促進健康。</strong></p><p><strong>椅子、門框、牆壁皆是好設備：另外也可以扶著沒有輪子的椅子做深蹲，年紀較大的長輩則可以進行坐姿站起，或是借助門框、牆壁做伸展、伏牆挺身、抬腿等運動，增加動作的變化性。</strong></p><p><strong>今天先把空間準備好，再選兩個不會引起疼痛的動作試做。</strong></p>","observe":"","judge":["空間：地面防滑、椅子穩固，附近沒有容易絆倒的物品嗎？","動作：能平穩控制、自然呼吸嗎？有疼痛就換動作或停止。","難度：減少次數、縮小幅度或改坐姿，哪個版本最適合今天？"],"do":["清出空間，把無輪穩固椅子靠牆，備好飲水。","用輕柔踏步或坐姿活動暖身幾分鐘。","從下方動作卡選兩個，每個先試 3～5 次。","動作間休息，保持自然呼吸，不憋氣、不硬撐。","記下選了哪些動作、次數與需要調整的地方。"],"cta":"居家可做的運動：學會兩個基本動作。","tip":"動作有刺痛或關節痛就停止。若有近期手術、受傷或活動限制，先確認適合的版本。","extra":"<div class=\"lesson-info-grid\"><div><b>坐站｜練習起身</b><span>穩固椅子靠牆，雙腳平放、約與髖同寬。身體稍向前，站起再慢慢坐下；需要時用手輔助，不要讓身體直接跌回椅上。</span></div><div><b>推牆｜練習推的動作</b><span>面向牆，雙手約肩高、略比肩寬。保持身體一直線，彎手肘靠近牆，再慢慢推回；站近一點比較容易。</span></div><div><b>坐姿抬腳｜較輕鬆版本</b><span>坐穩、雙腳著地，輪流輕抬一側膝蓋再放下，各做幾次；幅度以舒服為主，不向後猛仰。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.nhs.uk/live-well/exercise/strength-exercises/\" target=\"_blank\" rel=\"noopener\">NHS：居家肌力動作</a> · <a href=\"https://www.nhs.uk/live-well/exercise/sitting-exercises/\" target=\"_blank\" rel=\"noopener\">NHS：坐姿活動</a></p>","omitObserve":true},{"why":"走一段路就很喘，和提東西一下就覺得手痠或無力，是不同的感受。心肺耐力幫助你持續活動；肌耐力則是肌肉反覆出力、維持動作的能力。兩者都和日常生活有關，也常一起被用到。\n\n可用低衝擊踏步搭配坐站或推牆，試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。\n\n起步不用跳躍、衝刺或做到力竭。運動量慢慢增加，先從每週3到5次，每次5分鐘開始；隨著體能的增加可加長運動時間。\n\n如果運動完隔天太過疲累可以休息，讓身體恢復。","whyHtml":"<p>走一段路就很喘，和提東西一下就覺得手痠或無力，是不同的感受。<strong>心肺耐力幫助你持續活動；肌耐力則是肌肉反覆出力、維持動作的能力。</strong>兩者都和日常生活有關，也常一起被用到。</p><p>可用低衝擊踏步搭配坐站或推牆，試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。</p><p><strong>起步不用跳躍、衝刺或做到力竭。運動量慢慢增加，先從每週3到5次，每次5分鐘開始；隨著體能的增加可加長運動時間。</strong></p><p><strong>如果運動完隔天太過疲累可以休息，讓身體恢復。</strong></p>","example":"今天先用原地擺手踏步暖身和靜態伸展，然後弓箭步左右各20下，徒手深蹲1分鐘，開合跳1分鐘，原地擺手抬腳1分鐘。試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。動作之間能不休息就不要休息，可利用原地抬腳擺手來緩和心率。\n\n動作的快慢由自己決定，建議不要趕快，順順的做就好。\n\n如果你發現自己負荷不了，隨時可以停下來休息，等身體恢復再繼續進行下一個動作。\n\n所有訓練量力而為，運動過程中產生任何不適，請立即停止。必要時尋求專業協助。","exampleHtml":"<p>今天先用原地擺手踏步暖身和靜態伸展，然後弓箭步左右各20下，徒手深蹲1分鐘，開合跳1分鐘，原地擺手抬腳1分鐘。試一個簡單組合。在姿勢穩定的前提下，練習一小段時間或一組重複動作。動作之間能不休息就不要休息，<strong>可利用原地抬腳擺手來緩和心率</strong>。</p><ul><li><strong>動作的快慢由自己決定，建議不要趕快，順順的做就好。</strong></li><li><strong>如果你發現自己負荷不了，隨時可以停下來休息，等身體恢復再繼續進行下一個動作。</strong></li><li><strong>所有訓練量力而為，運動過程中產生任何不適，請立即停止。必要時尋求專業協助。</strong></li></ul>","observe":"","judge":["心肺：踏步時還能說話嗎？太喘就降速、縮短或休息。","肌耐力：最後幾次仍能穩定完成嗎？開始憋氣或姿勢跑掉就先停。","恢復：昨天有沒有練到同一部位？今天有明顯痠痛或疲累嗎？"],"do":["先用輕鬆踏步或坐姿活動暖身 3～5 分鐘。","選原地踏步或低衝擊側踏，先做 1 分鐘，按能力縮短。","選坐站或推牆做約 5 次，沿用昨天學到的姿勢。","休息至呼吸舒服；有餘力可再一輪，最後慢慢收操。","分別記下分鐘、次數與感受，安排恢復時間。"],"cta":"心肺耐力／肌耐力運動：完成一個簡單組合。","tip":"輕微用力感和尖銳疼痛不同；不用追求越痠越有效。若今天還沒恢復，改輕柔活動或休息。","extra":"<div class=\"lesson-info-grid\"><div><b>心肺選項</b><span>原地踏步、左右側踏、室內腳踏車都可選；先找能穩定持續的節奏，不用追快。</span></div><div><b>肌耐力選項</b><span>坐站、推牆可從一小組開始；次數減少也沒關係，先把動作控制好。</span></div><div><b>運動後怎麼吃？</b><span>短時間練習後照常吃均衡餐，例如飯＋豆腐或魚＋青菜。一般不需要特別買蛋白粉，也不必把主食刪掉。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.nhs.uk/live-well/exercise/strength-exercises/\" target=\"_blank\" rel=\"noopener\">NHS：居家肌力動作</a> · <a href=\"https://www.bhf.org.uk/informationsupport/heart-matters-magazine/nutrition/food-for-fitness\" target=\"_blank\" rel=\"noopener\">BHF：運動與飲食</a> · <a href=\"https://www.cdc.gov/healthy-weight-growth/physical-activity/index.html\" target=\"_blank\" rel=\"noopener\">CDC：活動強度</a></p>","omitObserve":true},{"why":"最難的常不是某天做很多，而是忙起來之後，還能找得到開始的方法。把活動接在固定時刻，再準備一個較短版本，就不用每天重新和自己討論。\n\n最低版本可以是走五分鐘、起身活動兩次，或做幾次熟悉的動作。它的功能是維持習慣，不是這樣就已達到完整運動建議。體能好之後再慢慢增加。","whyHtml":"<p>最難的常不是某天做很多，而是忙起來之後，還能找得到開始的方法。把活動接在固定時刻，再準備一個較短版本，就不用每天重新和自己討論。</p><p>最低版本可以是走五分鐘、起身活動兩次，或做幾次熟悉的動作。它的功能是維持習慣，不是這樣就已達到完整運動建議。體能好之後再慢慢增加。</p>","example":"你原本想每天走路半小時，但下雨或加班就整週中斷。可以改成「看電視時拿起裝水的寶特瓶，充當啞鈴練臂力，或者進行5到10分鐘的超慢跑」。另外選兩個不連續的日子做居家肌力練習，當天很累，就用較輕鬆版本，記住，行動比不行動好，也可以在youtube上挑選適合您的簡單運動跟練。","exampleHtml":"<p>你原本想每天走路半小時，但下雨或加班就整週中斷。可以改成「看電視時拿起裝水的寶特瓶，充當啞鈴練臂力，或者進行5到10分鐘的超慢跑」。另外選兩個不連續的日子做居家肌力練習，當天很累，就用較輕鬆版本，記住，<strong>行動比不行動好</strong>，也可以在youtube上挑選適合您的簡單運動跟練。</p>","observe":"今天把「想多運動」寫成一個時間、地點和具體動作。","judge":["明確：什麼事情做完後開始？在哪裡？做哪一種活動？","彈性：普通日、忙碌日和需要休息的日子，各怎麼安排？","進展：先穩定一週再調整，是否比一次訂太多更容易做到？"],"do":["選一個喜歡且適合自己的活動。","寫下固定開始時刻、地點與普通日的時間或次數。","準備忙碌日的短版本，以及需要休息時的安排。","今天實際做一次短版本，看看是否真的方便。","把下次時間放進行程，只留下最需要的一個提醒。"],"cta":"建立自己的最低活動量，今天先試一次。","tip":"這是你的起步方案，不是每天的最低及格線。生病或不舒服時可以休息。","extra":"<div class=\"lesson-info-grid\"><div><b>提醒放在看得到的地方</b><span>鞋子放門邊，或把活動接在換衣服之後，減少臨時找東西。</span></div><div><b>採買支持規律生活</b><span>準備好喝水的容器與平常會吃的食材，比先買一堆運動補充品更實用。</span></div><div><b>一次只加一點</b><span>先把五分鐘做得順手，再試著多一兩分鐘；不要同時增加時間、速度和阻力。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.who.int/europe/publications/i/item/9789240014886\" target=\"_blank\" rel=\"noopener\">WHO：活動建議</a> · <a href=\"https://www.bhf.org.uk/informationsupport/heart-matters-magazine/nutrition/food-for-fitness\" target=\"_blank\" rel=\"noopener\">BHF：運動與飲食</a></p>"}];
weeks[8].title='簡單運動';weeks[8].outcome='從走路、打斷久坐與居家練習開始，找到能持續的活動與恢復節奏。';
weeks[8].lessons=week9Meta.map(l=>l.title);weeks[8].daily_actions=week9Days.map(d=>d.title);
weeks[8].review_prompts=['哪個活動與時間最容易重複？','哪裡需要降強度、休息或改方法？','下週如何安排活動、用餐與恢復？'];
curriculum[8].why=weeks[8].outcome;curriculum[8].intro='不用先買器材，也不用一次練很久。這週從走路、活動空檔到居家動作，試著讓身體多動一點，再留下適合自己的小計畫。';
curriculum[8].ability='能選擇適合的活動強度、做兩個居家動作，分辨心肺與肌耐力，安排活動、用餐與恢復。';
curriculum[8].completion='實際嘗試並記下適合自己的版本；需要調整或休息也是有用的觀察，不以流汗、痠痛或體重評分。';
curriculum[8].lessons=week9Meta;curriculum[8].actions=week9Days.map(d=>({title:d.title,steps:d.steps}));
curriculum[8].challenge={title:'真實挑戰：今天的活動怎麼安排？',prompt:'遇到沒空、下雨或疲累時，選一個合適的短版本；若需要休息，就安排恢復與下一次時間。記下身體的回應。',success:'依今天的狀況做一個可行決定，留下一個下次可用的方法。'};
curriculum[8].flex=['下雨無法出門','加班只剩幾分鐘','肌肉疲累需要恢復'];
week9Rich.forEach((r,i)=>lessonRichOverrides['9-'+(i+1)]=r);actionOverrides[9]=week9Days.map(d=>d.steps);
function week9Record(d,r){const item=week9Days[d-1];return `<div class="micro action-record"><div class="eyebrow">今日活動實際記錄</div><h3>${esc(item.cta)}</h3><p>依今天主題留下你的活動與感受，下次可以直接使用。</p><div class="record-grid">${item.labels.map((label,i)=>`<div class="field record-wide"><label for="${['recordMain','recordKey','recordInsight'][i]}">${esc(label)}</label><textarea id="${['recordMain','recordKey','recordInsight'][i]}" rows="3" placeholder="${esc(label)}；依今天實際情況填寫。">${esc(r[['main','key','insight'][i]]||'')}</textarea></div>`).join('')}</div><button class="btn soft" onclick="saveActionRecord(9,${d})">儲存這筆記錄</button></div>`;}
function week9Context(d){const item=week9Days[d-1];return `<section class="depth-card week9-context"><p class="eyebrow">02 · 看見｜今天的真實情境</p>${item.exampleHtml||'<p>'+esc(item.example)+'</p>'}</section><section class="depth-card week9-context"><p class="eyebrow">03 · 判斷｜依今天主題做選擇</p><ul>${item.judge.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;}


const week10Days=[{"title":"記下一次壓力與飲食選擇。","focus":"想吃東西的時候，除了食物，也看看今天發生了什麼。","why":"忙了一天，回家就想吃點甜的，這種經驗很常見。食物可以帶來安慰，壓力也可能影響食慾：有人吃得多，有人反而吃不下。先看懂自己的反應，才知道需要怎麼照顧自己。\n\n這週不重做飲食類型測驗，而是練習把壓力來源、當下需要和可行的回應接起來。情緒和飢餓可能同時存在，不必急著把自己分成「真的餓」或「只是嘴饞」。\n\n如果白天一直忙到沒吃飯，晚上很餓並不奇怪。先安排足夠、規律的餐點，再看看壓力需要什麼支持，比靠意志力撐住更實際。","example":"下午被主管催進度，你一邊回訊息一邊想買珍奶。回頭一想，中午只吃了幾口，也一直沒休息。今天先吃一份能讓自己吃飽的餐點或合適點心，再把工作拆出下一步；想喝喜歡的飲料，也可以自己決定。","judge":["身體：上一餐何時吃、吃得夠嗎？現在有餓、累或緊繃的感覺嗎？","情緒：我是在焦慮、生氣、委屈，還是只想放鬆？","回應：需要食物、休息、釐清工作，還是找人說說？可以同時選兩項。"],"steps":["選今天一次壓力大或特別想吃東西的時刻。","記下剛才發生的事，不先批評自己。","看看上一餐與身體感受，用一個詞形容情緒。","做一個照顧需要的行動，餓了就正常吃。","稍後記一句結果，不用以吃或沒吃打分數。"],"notes":"食物不是敵人。今天多看懂一個需要，就有新的選擇。","cta":"記下一次壓力與飲食選擇。","labels":["時間、事件與上一餐情況","身體感受、情緒與需要","我的回應與稍後感受"]},{"title":"找出一個觸發壓力的來源。","focus":"把「最近壓力很大」拆成一件看得見、能處理的小事。","why":"只說「我壓力很大」，通常不知道從哪裡改。把時間、事件和腦中那句話記下來，才比較容易發現：是工作太多、怕被責備，還是每天都睡不夠？\n\n壓力來源不一定能馬上消失。可以先分成「現在能調整」「需要別人協助」「暫時無法改變」，把力氣放在下一步，不要求自己什麼都扛。","example":"你發現每次晚上收到工作訊息，就會打開零食櫃。讓你緊張的其實是「不馬上回就會被認為不認真」。今天先確認哪些事情真的緊急，為非緊急訊息留明天處理的時間，再看看這樣是否少了一點壓力。","judge":["事件：是誰、什麼時間、什麼事情讓我緊張？","想法：我當時對自己說了什麼？那是事實，還是擔心？","資源：我能調整一項安排，或向誰提出具體協助？"],"steps":["挑一個這週重複出現的壓力情境。","寫下事件、腦中想法與情緒。","記下接著做了什麼，包括是否吃東西。","選一個可調整處，或寫出要請誰幫什麼忙。","今天試一次，留下結果與下一步。"],"notes":"記錄是找線索，不是找誰的錯。牽涉工作或照顧責任時，可以尋求分工。","cta":"找出一個觸發壓力的來源。","labels":["觸發事件與當時想法","情緒與接著做的事","能調整的一步／需要誰的協助"]},{"title":"試一種適合自己的減壓活動。","focus":"先讓節奏慢下來，再決定下一步；不用強迫自己忍住不吃。","why":"情緒一上來，我們常立刻找事情做，吃東西也可能成為其中一個習慣。留一個短暫空檔，什麼都不做，可以讓你聽見自己真正想說的話。\n\n空檔不必固定要多少時間，可以先試一到五分鐘，做舒服的呼吸、走動或和信任的人聊一下，再回來看看需要。\n\n把含色胺酸、維生素 B 群與鎂的天然食物放進均衡飲食，有助於提供身體與神經系統所需的營養；但不能保證多吃就能降低壓力荷爾蒙或改善心情。例如可輪流選擇豆類、蛋、乳品、全穀、堅果與深綠色蔬菜。\n\n減壓活動雖然不會自動解決所有問題，但能提供一些喘息空間，幫助我們應對持續的壓力。\n\n常見的減壓活動包括：規律運動、泡個舒壓的澡、冥想、瑜珈、聽音樂、按摩、陪寵物玩、看喜劇、閱讀、喝些花草茶，使用香氛蠟燭等。選自己喜歡又適合的就好；睡前可選無咖啡因飲品，蠟燭離開前與睡前要熄滅。","example":"今天和家人吵架後，你很煩，手已經伸向餅乾。可以先坐穩，舒服地深呼吸幾次後，說出「我現在很委屈」。如果餓，就吃點東西；如果需要有人聽，先找願意陪你的人。但就算吃了餅乾，也不代表我們這次練習失敗。\n\n選一種你願意做的減壓活動，試著去愛自己，放鬆自己。","judge":["適合：我現在適合安靜呼吸、走動，還是找人說話？","舒服：活動有讓自己舒服一點嗎？若更焦慮，能換方法嗎？","後續：情緒緩一些之後，還有哪些實際需要沒被照顧？"],"steps":["在一個壓力時刻，先說出當下的情緒。","選舒服呼吸、輕鬆走動或聯絡信任的人。","試一到五分鐘，按感受調整，不強迫忍餓。","再決定要吃、休息、溝通或處理一件小事。","記下哪個方法稍微有幫助，下次保留它。"],"notes":"呼吸練習不用吸到很深，也不用憋氣；若暈眩或不舒服，停止練習，回到自然呼吸。","cta":"試一種適合自己的減壓活動。","labels":["壓力情境與當下情緒","我試的活動、時間與感受","接著需要什麼，下次保留哪個方法"],"whyHtml":"<p>情緒一上來，我們常立刻找事情做，吃東西也可能成為其中一個習慣。<strong>留一個短暫空檔，什麼都不做，可以讓你聽見自己真正想說的話。</strong></p><p>空檔不必固定要多少時間，可以先試一到五分鐘，做舒服的呼吸、走動或和信任的人聊一下，再回來看看需要。</p><p><strong>把含色胺酸、維生素 B 群與鎂的天然食物放進均衡飲食，有助於提供身體與神經系統所需的營養；但不能保證多吃就能降低壓力荷爾蒙或改善心情。</strong>例如可輪流選擇豆類、蛋、乳品、全穀、堅果與深綠色蔬菜。</p><p>減壓活動雖然不會自動解決所有問題，但能提供一些喘息空間，幫助我們應對持續的壓力。</p><p>常見的<strong>減壓活動</strong>包括：<strong>規律運動、泡個舒壓的澡、冥想、瑜珈、聽音樂、按摩、陪寵物玩、看喜劇、閱讀、喝些花草茶，使用香氛蠟燭等。</strong>選自己喜歡又適合的就好；睡前可選無咖啡因飲品，蠟燭離開前與睡前要熄滅。</p>","exampleHtml":"<p>今天和家人吵架後，你很煩，手已經伸向餅乾。可以先坐穩，舒服地深呼吸幾次後，說出「我現在很委屈」。如果餓，就吃點東西；如果需要有人聽，先找願意陪你的人。但就算吃了餅乾，也不代表我們這次練習失敗。</p><p><strong>選一種你願意做的減壓活動，試著去愛自己，放鬆自己。</strong></p>"},{"title":"安排睡前關機與就寢時間。","focus":"替睡前留一段安靜時間，讓一天有機會慢慢結束。","why":"明明很累，卻一直滑手機、回訊息，越晚越捨不得睡。今天先不要求立刻睡著，而是替身體準備一段比較安靜的睡前時間。\n\n若你的作息允許，可以把晚上 9～10 點設為準備就寢的目標，睡前至少 30 分鐘關閉手機與其他螢幕，讓工作與通知先停下來。這不是人人適用的固定睡眠時段；輪班或原本很晚睡的人，可依起床時間逐步調整。\n\n18～60 歲成人通常需要每晚至少 7 小時睡眠。固定起床與就寢節奏、留足睡眠時間，比硬逼自己九點躺下卻一直焦慮更實際。","example":"你想晚上十點休息，就寢前可以先洗一個舒服的溫水澡；若喜歡香氣，可依標示使用適合泡澡的產品，不要把未稀釋精油直接加入浴水。\n\n把九點半設為關手機時間，先設好鬧鐘，再把手機放到床邊以外。刷牙、調暗燈光，接著看幾頁紙本書，或者使用腹式呼吸冥想；如果九點就開始想睡，也可以提早就寢。\n\n今天先決定一個關機時間，再排一個簡單的睡前活動。","judge":["時間：明天幾點起床？安排的就寢時間能留足睡眠嗎？","環境：手機、工作通知、燈光或噪音，哪個最容易先調整？","飲食：下午或晚上的咖啡因、睡前大餐或飲酒，是否影響自己入睡？"],"steps":["按起床時間選擇就寢目標，作息允許可安排晚上 9～10 點。","設定睡前至少 30 分鐘關閉手機與螢幕的提醒。","先處理必要聯絡與鬧鐘，把手機放遠。","做一個放鬆活動：紙本閱讀、輕柔伸展或寫下明天待辦。","隔天記下實際關機、就寢時間與精神，調整一件事。"],"notes":"不用把睡眠變成成績。若持續睡不好、影響白天生活，或有明顯打鼾與呼吸中斷，找醫療人員協助。","cta":"安排睡前關機與就寢時間。","labels":["目標關機、就寢與起床時間","實際關機／就寢時間與睡前活動","隔天精神與下一次調整"],"whyHtml":"<p>明明很累，卻一直滑手機、回訊息，越晚越捨不得睡。今天先不要求立刻睡著，而是替身體準備一段比較安靜的睡前時間。</p><p>若你的作息允許，可以把晚上 9～10 點設為準備就寢的目標，睡前至少 30 分鐘關閉手機與其他螢幕，讓工作與通知先停下來。這不是人人適用的固定睡眠時段；輪班或原本很晚睡的人，可依起床時間逐步調整。</p><p>18～60 歲成人通常需要每晚至少 7 小時睡眠。固定起床與就寢節奏、留足睡眠時間，比硬逼自己九點躺下卻一直焦慮更實際。</p>","exampleHtml":"<p>你想晚上十點休息，就寢前可以先洗一個舒服的溫水澡；若喜歡香氣，可依標示使用適合泡澡的產品，不要把未稀釋精油直接加入浴水。</p><p>把九點半設為關手機時間，先設好鬧鐘，再把手機放到床邊以外。刷牙、調暗燈光，接著看幾頁紙本書，或者<strong>使用腹式呼吸冥想</strong>；如果九點就開始想睡，也可以提早就寢。</p><p><strong>今天先決定一個關機時間，再排一個簡單的睡前活動。</strong></p>"},{"title":"不帶羞愧地回到下一個正常選擇。","focus":"昨天很亂也沒關係，今天從下一餐、下一個小安排繼續。","why":"壓力大時吃得比預期多，接著責怪自己、隔天不吃，容易讓生活更難受。不用去責備自己或有罪惡感，偶爾吃一餐不如預期的餐點，也不代表失敗。食物可以帶來安慰，重新回到規律用餐與休息，才有餘裕看清楚發生了什麼。\n\n恢復不是假裝沒事，而是把經驗變成可用的安排：哪個觸發最常出現？哪個減壓方法有用？晚上什麼時間該把手機放下？留下兩三個真的做得到的就好。","example":"昨晚跟男友大吵一架，你怒吃了一盒冰淇淋跟很多洋芋片，今天很想跳過早餐。這次照原本需要安排早餐，可以喝豆漿或牛奶，再按食慾搭配吐司、燕麥或其他平常會吃的食物，不必刻意只喝一杯來補償。\n\n晚上睡覺前泡個澡，敷個面膜做放鬆，手機先關通知；如果餓，可準備一份合適點心，如堅果或無糖優格，讓自己不必又低落又累地硬撐。\n\n今天不補償昨天，寫下一個更容易照顧自己的安排。","judge":["語氣：我是在描述事情，還是在罵自己？可以怎麼換句話說？","需要：下一餐、休息與睡眠，有哪一項現在可以照顧？","支持：反覆失控或很痛苦時，有沒有值得信任的人或專業協助？"],"steps":["用中立的一句話描述一次不如預期的經驗。","找出一個壓力來源與沒被照顧的需要。","下一餐照常安排，不用挨餓或加倍運動補償。","選一項支持：備餐、減壓活動、關機提醒或求助。","寫下下一次開始的時間，今天完成最小的一步。"],"notes":"若反覆吃到失控、很痛苦或出現補償行為，可以找醫師、心理師或營養師協助，不必獨自承擔。","cta":"不帶羞愧地回到下一個正常選擇。","labels":["中立描述這次經驗","壓力來源與沒被照顧的需要","下一餐、支持方式與開始時間"],"whyHtml":"<p>壓力大時吃得比預期多，接著責怪自己、隔天不吃，容易讓生活更難受。<strong>不用去責備自己或有罪惡感，偶爾吃一餐不如預期的餐點，也不代表失敗。食物可以帶來安慰，重新回到規律用餐與休息，才有餘裕看清楚發生了什麼。</strong></p><p><strong>恢復不是假裝沒事，而是把經驗變成可用的安排：哪個觸發最常出現？哪個減壓方法有用？晚上什麼時間該把手機放下？留下兩三個真的做得到的就好。</strong></p>","exampleHtml":"<p>昨晚跟男友大吵一架，你怒吃了一盒冰淇淋跟很多洋芋片，今天很想跳過早餐。這次照原本需要安排早餐，可以喝豆漿或牛奶，再按食慾搭配吐司、燕麥或其他平常會吃的食物，不必刻意只喝一杯來補償。</p><p>晚上睡覺前泡個澡，敷個面膜做放鬆，手機先關通知；如果餓，可準備一份合適點心，如堅果或無糖優格，讓自己不必又低落又累地硬撐。</p><p><strong>今天不補償昨天，寫下一個更容易照顧自己的安排。</strong></p>"},{"title":"彈性日：在忙亂的一天保留一個支持。","focus":"計畫被打亂時，先照顧最需要的一件事。","why":"加班或照顧家人時，不可能每一步都照表走。正常吃一餐、請人分工或留五分鐘安靜下來，都可以是今天的支持。","example":"今天加班，沒辦法照原訂時間睡。你先吃晚餐，交代必要事項後停止回非緊急訊息，再縮短睡前流程。明天依實際情況恢復作息，不為少做一步責備自己。","judge":["現在最缺的是食物、休息、時間還是協助？","哪一件事可以延後或請人分擔？","今晚能保留哪個簡單的睡前安排？"],"steps":["寫下今天打亂計畫的事情。","選最需要照顧的一項身體或情緒需要。","完成一個支持行動，必要時請人協助。","保留可行的用餐或睡前安排，不追求全部做到。","記下下次同樣情境可用的備案。"],"notes":"今天只保留一個支持也有價值。","cta":"今天先照顧一個最需要的地方。","labels":["臨時情境與目前需要","我做的支持與請求協助","今晚安排與下次備案"]},{"title":"每週回顧：完成自己的減壓與睡前小計畫。","focus":"留下最常見的觸發、最有用的方法和可行的睡前時間。","why":"回顧不是算這週吃得好不好，而是找出哪些支持真正有用。下週只保留一個壓力調整、一個減壓活動與一個睡前提示，先把它們用熟。","example":"你發現最常被晚間工作訊息影響，短散步能讓心情平穩一些。下週先確認回覆界線，晚餐後走一小圈，九點半關手機、十點準備休息；若作息不同，就排自己的可行時間。","judge":["哪個觸發最常出現，哪一點能調整？","什麼活動真的讓自己舒服一點？","就寢安排能否配合起床時間，留足睡眠？"],"steps":["回看本週一到兩筆紀錄，找一個常見觸發。","留下最有幫助的減壓活動與可求助的人。","設定下週用餐準備、關機與就寢時間。","為加班或照顧家人的日子留一個備案。","完成本週 check-in，寫下下一次要先做的一步。"],"notes":"少一點責備，多一個可用的方法，讓下週更容易開始。","cta":"今天整理自己的減壓與睡前小計畫。","labels":["常見觸發與能調整的一步","減壓活動、支持者與用餐準備","下週關機／就寢時間與忙碌備案"]}];
const week10Meta=[{"title":"壓力與食物選擇：先看見自己的需要","concept":"想吃東西的時候，除了食物，也看看今天發生了什麼。","hook":"壓力與食物選擇：先看見自己的需要","example":"下午被主管催進度，你一邊回訊息一邊想買珍奶。回頭一想，中午只吃了幾口，也一直沒休息。今天先吃一份能讓自己吃飽的餐點或合適點心，再把工作拆出下一步；想喝喜歡的飲料，也可以自己決定。","apply":"選今天一次壓力大或特別想吃東西的時刻。"},{"title":"找出壓力來源與飲食觸發","concept":"把「最近壓力很大」拆成一件看得見、能處理的小事。","hook":"找出壓力來源與飲食觸發","example":"你發現每次晚上收到工作訊息，就會打開零食櫃。讓你緊張的其實是「不馬上回就會被認為不認真」。今天先確認哪些事情真的緊急，為非緊急訊息留明天處理的時間，再看看這樣是否少了一點壓力。","apply":"挑一個這週重複出現的壓力情境。"},{"title":"留一個短暫空檔：練習減壓","concept":"先讓節奏慢下來，再決定下一步；不用強迫自己忍住不吃。","hook":"留一個短暫空檔：練習減壓","example":"今天和家人吵架後，你很煩，手已經伸向餅乾。可以先坐穩，舒服地深呼吸幾次後，說出「我現在很委屈」。如果餓，就吃點東西；如果需要有人聽，先找願意陪你的人。但就算吃了餅乾，也不代表我們這次練習失敗。\n\n選一種你願意做的減壓活動，試著去愛自己，放鬆自己。","apply":"在一個壓力時刻，先說出當下的情緒。"},{"title":"睡前放鬆：關手機、提早休息","concept":"替睡前留一段安靜時間，讓一天有機會慢慢結束。","hook":"睡前放鬆：關手機、提早休息","example":"你想晚上十點休息，就寢前可以先洗一個舒服的溫水澡；若喜歡香氣，可依標示使用適合泡澡的產品，不要把未稀釋精油直接加入浴水。\n\n把九點半設為關手機時間，先設好鬧鐘，再把手機放到床邊以外。刷牙、調暗燈光，接著看幾頁紙本書，或者使用腹式呼吸冥想；如果九點就開始想睡，也可以提早就寢。\n\n今天先決定一個關機時間，再排一個簡單的睡前活動。","apply":"按起床時間選擇就寢目標，作息允許可安排晚上 9～10 點。"},{"title":"不帶羞愧地恢復：留下支持自己的方法","concept":"昨天很亂也沒關係，今天從下一餐、下一個小安排繼續。","hook":"不帶羞愧地恢復：留下支持自己的方法","example":"昨晚跟男友大吵一架，你怒吃了一盒冰淇淋跟很多洋芋片，今天很想跳過早餐。這次照原本需要安排早餐，可以喝豆漿或牛奶，再按食慾搭配吐司、燕麥或其他平常會吃的食物，不必刻意只喝一杯來補償。\n\n晚上睡覺前泡個澡，敷個面膜做放鬆，手機先關通知；如果餓，可準備一份合適點心，如堅果或無糖優格，讓自己不必又低落又累地硬撐。\n\n今天不補償昨天，寫下一個更容易照顧自己的安排。","apply":"用中立的一句話描述一次不如預期的經驗。"}];
const week10Rich=[{"why":"忙了一天，回家就想吃點甜的，這種經驗很常見。食物可以帶來安慰，壓力也可能影響食慾：有人吃得多，有人反而吃不下。先看懂自己的反應，才知道需要怎麼照顧自己。 這週不重做飲食類型測驗，而是練習把壓力來源、當下需要和可行的回應接起來。情緒和飢餓可能同時存在，不必急著把自己分成「真的餓」或「只是嘴饞」。 如果白天一直忙到沒吃飯，晚上很餓並不奇怪。先安排足夠、規律的餐點，再看看壓力需要什麼支持，比靠意志力撐住更實際。","whyHtml":"<p>忙了一天，回家就想吃點甜的，這種經驗很常見。食物可以帶來安慰，壓力也可能影響食慾：有人吃得多，有人反而吃不下。先看懂自己的反應，才知道需要怎麼照顧自己。</p><p>這週不重做飲食類型測驗，而是練習把壓力來源、當下需要和可行的回應接起來。情緒和飢餓可能同時存在，不必急著把自己分成「真的餓」或「只是嘴饞」。</p><p>如果白天一直忙到沒吃飯，晚上很餓並不奇怪。先安排足夠、規律的餐點，再看看壓力需要什麼支持，比靠意志力撐住更實際。</p>","example":"下午被主管催進度，你一邊回訊息一邊想買珍奶。回頭一想，中午只吃了幾口，也一直沒休息。今天先吃一份能讓自己吃飽的餐點或合適點心，再把工作拆出下一步；想喝喜歡的飲料，也可以自己決定。","exampleHtml":"<p>下午被主管催進度，你一邊回訊息一邊想買珍奶。回頭一想，中午只吃了幾口，也一直沒休息。今天先吃一份能讓自己吃飽的餐點或合適點心，再把工作拆出下一步；想喝喜歡的飲料，也可以自己決定。</p>","observe":"今天只留一筆：發生什麼事、身體怎麼了、我需要什麼。","judge":["身體：上一餐何時吃、吃得夠嗎？現在有餓、累或緊繃的感覺嗎？","情緒：我是在焦慮、生氣、委屈，還是只想放鬆？","回應：需要食物、休息、釐清工作，還是找人說說？可以同時選兩項。"],"do":["選今天一次壓力大或特別想吃東西的時刻。","記下剛才發生的事，不先批評自己。","看看上一餐與身體感受，用一個詞形容情緒。","做一個照顧需要的行動，餓了就正常吃。","稍後記一句結果，不用以吃或沒吃打分數。"],"cta":"記下一次壓力與飲食選擇。","tip":"食物不是敵人。今天多看懂一個需要，就有新的選擇。","extra":"<div class=\"lesson-info-grid\"><div><b>正餐先顧好</b><span>忙碌餐也可用飯或地瓜，搭蛋、豆腐或魚肉，再加蔬菜，不必只靠咖啡撐著。</span></div><div><b>點心可以準備</b><span>下午常餓，可準備水果搭原味優格或無糖豆漿；份量依食慾，食物依保存方式收好。</span></div><div><b>不只看食物</b><span>休息被壓縮、工作不清楚或缺少陪伴，都可能需要另外處理。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.cuh.nhs.uk/patient-information/introduction-to-emotional-eating/\" target=\"_blank\" rel=\"noopener\">CUH：情緒與飲食</a></p>"},{"why":"只說「我壓力很大」，通常不知道從哪裡改。把時間、事件和腦中那句話記下來，才比較容易發現：是工作太多、怕被責備，還是每天都睡不夠？ 壓力來源不一定能馬上消失。可以先分成「現在能調整」「需要別人協助」「暫時無法改變」，把力氣放在下一步，不要求自己什麼都扛。","whyHtml":"<p>只說「我壓力很大」，通常不知道從哪裡改。把時間、事件和腦中那句話記下來，才比較容易發現：是工作太多、怕被責備，還是每天都睡不夠？</p><p>壓力來源不一定能馬上消失。可以先分成「現在能調整」「需要別人協助」「暫時無法改變」，把力氣放在下一步，不要求自己什麼都扛。</p>","example":"你發現每次晚上收到工作訊息，就會打開零食櫃。讓你緊張的其實是「不馬上回就會被認為不認真」。今天先確認哪些事情真的緊急，為非緊急訊息留明天處理的時間，再看看這樣是否少了一點壓力。","exampleHtml":"<p>你發現每次晚上收到工作訊息，就會打開零食櫃。讓你緊張的其實是「不馬上回就會被認為不認真」。今天先確認哪些事情真的緊急，為非緊急訊息留明天處理的時間，再看看這樣是否少了一點壓力。</p>","observe":"今天只挑一個常出現的觸發，找出能改的一小步。","judge":["事件：是誰、什麼時間、什麼事情讓我緊張？","想法：我當時對自己說了什麼？那是事實，還是擔心？","資源：我能調整一項安排，或向誰提出具體協助？"],"do":["挑一個這週重複出現的壓力情境。","寫下事件、腦中想法與情緒。","記下接著做了什麼，包括是否吃東西。","選一個可調整處，或寫出要請誰幫什麼忙。","今天試一次，留下結果與下一步。"],"cta":"找出一個觸發壓力的來源。","tip":"記錄是找線索，不是找誰的錯。牽涉工作或照顧責任時，可以尋求分工。","extra":"<div class=\"lesson-info-grid\"><div><b>工作太多</b><span>列出今天最重要的一件事，其他工作確認期限或請人協調。</span></div><div><b>人際壓力</b><span>試著說「我現在需要一點時間，晚些再回覆」，替自己留空間。</span></div><div><b>疲累與空腹</b><span>檢查是否常跳餐或拖到太晚；先把用餐時間放進行程，再談其他調整。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.cuh.nhs.uk/patient-information/a-brief-guide-to-tackling-emotional-eating/\" target=\"_blank\" rel=\"noopener\">CUH：辨認觸發</a></p>"},{"why":"情緒一上來，我們常立刻找事情做，吃東西也可能成為其中一個習慣。留一個短暫空檔，什麼都不做，可以讓你聽見自己真正想說的話。\n\n空檔不必固定要多少時間，可以先試一到五分鐘，做舒服的呼吸、走動或和信任的人聊一下，再回來看看需要。\n\n把含色胺酸、維生素 B 群與鎂的天然食物放進均衡飲食，有助於提供身體與神經系統所需的營養；但不能保證多吃就能降低壓力荷爾蒙或改善心情。例如可輪流選擇豆類、蛋、乳品、全穀、堅果與深綠色蔬菜。\n\n減壓活動雖然不會自動解決所有問題，但能提供一些喘息空間，幫助我們應對持續的壓力。\n\n常見的減壓活動包括：規律運動、泡個舒壓的澡、冥想、瑜珈、聽音樂、按摩、陪寵物玩、看喜劇、閱讀、喝些花草茶，使用香氛蠟燭等。選自己喜歡又適合的就好；睡前可選無咖啡因飲品，蠟燭離開前與睡前要熄滅。","whyHtml":"<p>情緒一上來，我們常立刻找事情做，吃東西也可能成為其中一個習慣。<strong>留一個短暫空檔，什麼都不做，可以讓你聽見自己真正想說的話。</strong></p><p>空檔不必固定要多少時間，可以先試一到五分鐘，做舒服的呼吸、走動或和信任的人聊一下，再回來看看需要。</p><p><strong>把含色胺酸、維生素 B 群與鎂的天然食物放進均衡飲食，有助於提供身體與神經系統所需的營養；但不能保證多吃就能降低壓力荷爾蒙或改善心情。</strong>例如可輪流選擇豆類、蛋、乳品、全穀、堅果與深綠色蔬菜。</p><p>減壓活動雖然不會自動解決所有問題，但能提供一些喘息空間，幫助我們應對持續的壓力。</p><p>常見的<strong>減壓活動</strong>包括：<strong>規律運動、泡個舒壓的澡、冥想、瑜珈、聽音樂、按摩、陪寵物玩、看喜劇、閱讀、喝些花草茶，使用香氛蠟燭等。</strong>選自己喜歡又適合的就好；睡前可選無咖啡因飲品，蠟燭離開前與睡前要熄滅。</p>","example":"今天和家人吵架後，你很煩，手已經伸向餅乾。可以先坐穩，舒服地深呼吸幾次後，說出「我現在很委屈」。如果餓，就吃點東西；如果需要有人聽，先找願意陪你的人。但就算吃了餅乾，也不代表我們這次練習失敗。\n\n選一種你願意做的減壓活動，試著去愛自己，放鬆自己。","exampleHtml":"<p>今天和家人吵架後，你很煩，手已經伸向餅乾。可以先坐穩，舒服地深呼吸幾次後，說出「我現在很委屈」。如果餓，就吃點東西；如果需要有人聽，先找願意陪你的人。但就算吃了餅乾，也不代表我們這次練習失敗。</p><p><strong>選一種你願意做的減壓活動，試著去愛自己，放鬆自己。</strong></p>","observe":"","judge":["適合：我現在適合安靜呼吸、走動，還是找人說話？","舒服：活動有讓自己舒服一點嗎？若更焦慮，能換方法嗎？","後續：情緒緩一些之後，還有哪些實際需要沒被照顧？"],"do":["在一個壓力時刻，先說出當下的情緒。","選舒服呼吸、輕鬆走動或聯絡信任的人。","試一到五分鐘，按感受調整，不強迫忍餓。","再決定要吃、休息、溝通或處理一件小事。","記下哪個方法稍微有幫助，下次保留它。"],"cta":"試一種適合自己的減壓活動。","tip":"呼吸練習不用吸到很深，也不用憋氣；若暈眩或不舒服，停止練習，回到自然呼吸。","extra":"<div class=\"lesson-info-grid\"><div><b>舒服呼吸</b><span>坐穩、放鬆肩膀，自然吸氣、慢慢吐氣。可以輕數拍子，但不要強迫長度。</span></div><div><b>讓身體動一點</b><span>在安全的地方散步、輕柔伸展，或聽一首喜歡的音樂，不以消耗熱量為目的。</span></div><div><b>找一個人陪你</b><span>可以說「我今天有點卡住，你能聽我說五分鐘嗎？」不需要馬上得到答案。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.nhs.uk/mental-health/self-help/guides-tools-and-activities/breathing-exercises-for-stress/\" target=\"_blank\" rel=\"noopener\">NHS：舒服的呼吸練習</a></p><p class=\"week6-sources\">營養參考：<a href=\"https://www.health.harvard.edu/blog/nutritional-strategies-to-ease-anxiety-201604139441\" target=\"_blank\" rel=\"noopener\">Harvard Health：飲食與焦慮研究</a></p>","omitObserve":true},{"why":"明明很累，卻一直滑手機、回訊息，越晚越捨不得睡。今天先不要求立刻睡著，而是替身體準備一段比較安靜的睡前時間。 若你的作息允許，可以把晚上 9～10 點設為準備就寢的目標，睡前至少 30 分鐘關閉手機與其他螢幕，讓工作與通知先停下來。這不是人人適用的固定睡眠時段；輪班或原本很晚睡的人，可依起床時間逐步調整。 18～60 歲成人通常需要每晚至少 7 小時睡眠。固定起床與就寢節奏、留足睡眠時間，比硬逼自己九點躺下卻一直焦慮更實際。","whyHtml":"<p>明明很累，卻一直滑手機、回訊息，越晚越捨不得睡。今天先不要求立刻睡著，而是替身體準備一段比較安靜的睡前時間。</p><p>若你的作息允許，可以把晚上 9～10 點設為準備就寢的目標，睡前至少 30 分鐘關閉手機與其他螢幕，讓工作與通知先停下來。這不是人人適用的固定睡眠時段；輪班或原本很晚睡的人，可依起床時間逐步調整。</p><p>18～60 歲成人通常需要每晚至少 7 小時睡眠。固定起床與就寢節奏、留足睡眠時間，比硬逼自己九點躺下卻一直焦慮更實際。</p>","example":"你想晚上十點休息，就寢前可以先洗一個舒服的溫水澡；若喜歡香氣，可依標示使用適合泡澡的產品，不要把未稀釋精油直接加入浴水。\n\n把九點半設為關手機時間，先設好鬧鐘，再把手機放到床邊以外。刷牙、調暗燈光，接著看幾頁紙本書，或者使用腹式呼吸冥想；如果九點就開始想睡，也可以提早就寢。\n\n今天先決定一個關機時間，再排一個簡單的睡前活動。","exampleHtml":"<p>你想晚上十點休息，就寢前可以先洗一個舒服的溫水澡；若喜歡香氣，可依標示使用適合泡澡的產品，不要把未稀釋精油直接加入浴水。</p><p>把九點半設為關手機時間，先設好鬧鐘，再把手機放到床邊以外。刷牙、調暗燈光，接著看幾頁紙本書，或者<strong>使用腹式呼吸冥想</strong>；如果九點就開始想睡，也可以提早就寢。</p><p><strong>今天先決定一個關機時間，再排一個簡單的睡前活動。</strong></p>","observe":"","judge":["時間：明天幾點起床？安排的就寢時間能留足睡眠嗎？","環境：手機、工作通知、燈光或噪音，哪個最容易先調整？","飲食：下午或晚上的咖啡因、睡前大餐或飲酒，是否影響自己入睡？"],"do":["按起床時間選擇就寢目標，作息允許可安排晚上 9～10 點。","設定睡前至少 30 分鐘關閉手機與螢幕的提醒。","先處理必要聯絡與鬧鐘，把手機放遠。","做一個放鬆活動：紙本閱讀、輕柔伸展或寫下明天待辦。","隔天記下實際關機、就寢時間與精神，調整一件事。"],"cta":"安排睡前關機與就寢時間。","tip":"不用把睡眠變成成績。若持續睡不好、影響白天生活，或有明顯打鼾與呼吸中斷，找醫療人員協助。","extra":"<div class=\"lesson-info-grid\"><div><b>晚上嘴餓怎麼辦？</b><span>如果真的餓，可按需要吃適量、自己容易消化的點心，不必硬忍；避免臨睡前吃很大一餐。</span></div><div><b>飲料先看看</b><span>下午、晚上留意咖啡、濃茶與能量飲料；酒精也不是助眠的解法。</span></div><div><b>不用一次提早兩小時</b><span>原本很晚睡，可先把睡前流程提早一點，觀察幾天再調整。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.cdc.gov/sleep/about/index.html\" target=\"_blank\" rel=\"noopener\">CDC：睡眠與睡前習慣</a></p><p class=\"week6-sources\">香氛參考：<a href=\"https://www.nccih.nih.gov/health/lavender\" target=\"_blank\" rel=\"noopener\">NCCIH：薰衣草的證據與安全性</a></p>","omitObserve":true},{"why":"壓力大時吃得比預期多，接著責怪自己、隔天不吃，容易讓生活更難受。不用去責備自己或有罪惡感，偶爾吃一餐不如預期的餐點，也不代表失敗。食物可以帶來安慰，重新回到規律用餐與休息，才有餘裕看清楚發生了什麼。\n\n恢復不是假裝沒事，而是把經驗變成可用的安排：哪個觸發最常出現？哪個減壓方法有用？晚上什麼時間該把手機放下？留下兩三個真的做得到的就好。","whyHtml":"<p>壓力大時吃得比預期多，接著責怪自己、隔天不吃，容易讓生活更難受。<strong>不用去責備自己或有罪惡感，偶爾吃一餐不如預期的餐點，也不代表失敗。食物可以帶來安慰，重新回到規律用餐與休息，才有餘裕看清楚發生了什麼。</strong></p><p><strong>恢復不是假裝沒事，而是把經驗變成可用的安排：哪個觸發最常出現？哪個減壓方法有用？晚上什麼時間該把手機放下？留下兩三個真的做得到的就好。</strong></p>","example":"昨晚跟男友大吵一架，你怒吃了一盒冰淇淋跟很多洋芋片，今天很想跳過早餐。這次照原本需要安排早餐，可以喝豆漿或牛奶，再按食慾搭配吐司、燕麥或其他平常會吃的食物，不必刻意只喝一杯來補償。\n\n晚上睡覺前泡個澡，敷個面膜做放鬆，手機先關通知；如果餓，可準備一份合適點心，如堅果或無糖優格，讓自己不必又低落又累地硬撐。\n\n今天不補償昨天，寫下一個更容易照顧自己的安排。","exampleHtml":"<p>昨晚跟男友大吵一架，你怒吃了一盒冰淇淋跟很多洋芋片，今天很想跳過早餐。這次照原本需要安排早餐，可以喝豆漿或牛奶，再按食慾搭配吐司、燕麥或其他平常會吃的食物，不必刻意只喝一杯來補償。</p><p>晚上睡覺前泡個澡，敷個面膜做放鬆，手機先關通知；如果餓，可準備一份合適點心，如堅果或無糖優格，讓自己不必又低落又累地硬撐。</p><p><strong>今天不補償昨天，寫下一個更容易照顧自己的安排。</strong></p>","observe":"","judge":["語氣：我是在描述事情，還是在罵自己？可以怎麼換句話說？","需要：下一餐、休息與睡眠，有哪一項現在可以照顧？","支持：反覆失控或很痛苦時，有沒有值得信任的人或專業協助？"],"do":["用中立的一句話描述一次不如預期的經驗。","找出一個壓力來源與沒被照顧的需要。","下一餐照常安排，不用挨餓或加倍運動補償。","選一項支持：備餐、減壓活動、關機提醒或求助。","寫下下一次開始的時間，今天完成最小的一步。"],"cta":"不帶羞愧地回到下一個正常選擇。","tip":"若反覆吃到失控、很痛苦或出現補償行為，可以找醫師、心理師或營養師協助，不必獨自承擔。","extra":"<div class=\"lesson-info-grid\"><div><b>換一句話</b><span>把「我又失敗了」換成「昨天太累，也沒吃好，今天先補上用餐安排」。</span></div><div><b>採買留點餘裕</b><span>備好容易組餐的蛋、豆腐、主食與蔬菜，份量按人數與餐次，不必囤滿。</span></div><div><b>留一個支持名單</b><span>記下願意聽你說話的人，以及需要時可以聯絡的專業資源。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/stress/\" target=\"_blank\" rel=\"noopener\">NHS：壓力與支持</a></p>","omitObserve":true}];
weeks[9].title='壓力與情緒性飲食';weeks[9].outcome='辨認壓力觸發、照顧用餐與睡眠，建立可重複的減壓和恢復方式。';
weeks[9].lessons=week10Meta.map(l=>l.title);weeks[9].daily_actions=week10Days.map(d=>d.title);
weeks[9].review_prompts=['最常見的壓力觸發是什麼？','哪個減壓或睡前安排最有幫助？','下週要保留哪一步與哪些支持？'];
curriculum[9].why=weeks[9].outcome;curriculum[9].intro='壓力大時想吃點東西，不用先責怪自己。這週一起找出觸發、安排減壓活動與規律用餐，也替睡前留一段關手機、慢慢休息的時間。';
curriculum[9].ability='能描述一個壓力來源、選擇合適回應，安排睡前關機與就寢時間，遇到不順時回到下一個正常選擇。';
curriculum[9].completion='完成一筆觀察或一個照顧需要的行動就有價值；不以忍住不吃或立刻睡著作為成績。';
curriculum[9].lessons=week10Meta;curriculum[9].actions=week10Days.map(d=>({title:d.title,steps:d.steps}));
curriculum[9].challenge={title:'真實挑戰：壓力來了，先照顧一個需要',prompt:'選一次工作、人際或晚間壓力情境，說出需要，試一個可行回應，再留下結果。',success:'多看懂一個觸發，完成一次照顧自己的回應。'};
curriculum[9].flex=['加班打亂用餐','晚間訊息停不下來','照顧家人後很疲累'];
week10Rich.forEach((r,i)=>lessonRichOverrides['10-'+(i+1)]=r);actionOverrides[10]=week10Days.map(d=>d.steps);
function week10Record(d,r){const item=week10Days[d-1];return `<div class="micro action-record"><div class="eyebrow">今日減壓實際記錄</div><h3>${esc(item.cta)}</h3><p>依今天主題留下你的情境、需要與回應，下次可以直接使用。</p><div class="record-grid">${item.labels.map((label,i)=>`<div class="field record-wide"><label for="${['recordMain','recordKey','recordInsight'][i]}">${esc(label)}</label><textarea id="${['recordMain','recordKey','recordInsight'][i]}" rows="3" placeholder="${esc(label)}；依今天實際情況填寫。">${esc(r[['main','key','insight'][i]]||'')}</textarea></div>`).join('')}</div><button class="btn soft" onclick="saveActionRecord(10,${d})">儲存這筆記錄</button></div>`;}
function week10Context(d){const item=week10Days[d-1];return `<section class="depth-card week10-context"><p class="eyebrow">02 · 看見｜今天的真實情境</p>${item.exampleHtml||'<p>'+esc(item.example)+'</p>'}</section><section class="depth-card week10-context"><p class="eyebrow">03 · 判斷｜依今天主題做選擇</p><ul>${item.judge.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;}


const week11Days=[{"title":"替旅行準備一個食物補給備案。","focus":"班機延誤、店家休息、看不懂菜單時，也能先把自己餵飽。","why":"旅行最常卡住的，不一定是不會選菜，而是「現在根本沒東西吃」。車程太長、抵達太晚或店家臨時休息，都可能讓原本的餐點安排落空。\n\n出發前先查住處附近的超市、車站補給點與營業時間，再準備一點能按標示保存的食物。這份備案是讓你有得吃，不是要求整趟旅行都照固定菜單。\n\n到了不熟悉的地方，先確認食材、過敏原與保存條件。語言不通時，可以把需要避開的食材翻譯好給店家看；嚴重食物過敏者仍需確認能否避免交叉接觸，不能只靠翻譯猜。","example":"火車晚了一小時，到旅館時餐廳已打烊。你先去查好的超市買麵包、未開封且標示可常溫保存的豆漿，再買一份方便處理的水果。這餐先吃得足夠，明天有更多選擇再補充變化。","judge":["找得到：住處或車站附近哪裡有食物？抵達時還開著嗎？","帶得動：車程多久、能否冷藏？包裝能常溫保存嗎？","吃得安心：食材與水源清楚嗎？過敏或其他飲食需要能否確認？"],"steps":["挑一次近期或模擬行程，寫下最長交通段與抵達時間。","查一個附近超市或補給點，記下營業時間。","按人數與等待時間列兩樣備用食物和飲水。","確認保存方式、過敏原與當地攜帶食品規定。","把地點與備案存下來，出發前看一次。"],"notes":"旅程沒有完美菜單也沒關係。先解決有得吃、吃得夠與保存安全。","cta":"替旅行準備一個食物補給備案。","labels":["交通段、抵達時間與補給地點","備用食物、人數與保存方式","營業時間、飲水與需要確認的事項"]},{"title":"安排旅行或聚會當天的用餐空檔。","focus":"把早餐、交通和晚宴一起看，別讓行程把自己餓到沒力。","why":"婚宴晚上才開始，白天又忙著移動，很容易想「先不吃，晚上一次吃」。但等到很餓才入席，常會吃得很急，也更難享受真正想吃的菜。\n\n今天練的是安排整天的空檔。先確認集合時間、車程與聚會開始時間，該吃的一餐照需要吃；如果等待很久，再準備一份方便的點心。\n\n地方小吃、生日蛋糕都是旅程與聚會的樂趣。先選你真正期待的體驗，不必每個攤位都排，也不必用少吃其他餐來交換。","example":"下午搭車參加晚宴，六點集合卻可能七點半才上菜。你中午先吃一餐，出門帶一份點心，等候時若餓就吃。到了現場，可以慢慢享受想吃的菜，聊天也不會一直分心想著肚子餓。","judge":["等待：從上一餐到上菜大約隔多久？中途有沒有補給？","體驗：今天最期待哪一道食物或哪個聚會時刻？","安排：點心、飲水和同行者需求是否都留了空間？"],"steps":["寫下出門、交通、聚會開始與預計上菜時間。","在行程裡留一個正常用餐空檔。","若等待時間長，準備合適點心與飲水。","挑一個真正想享受的食物或活動，留足時間。","聚會後記下哪個安排讓當天比較舒服。"],"notes":"不必空腹赴宴，也不必靠挨餓換取甜點。旅遊的樂趣不只在吃完多少種食物。","cta":"安排旅行或聚會當天的用餐空檔。","labels":["出門、交通與預計上菜時間","正常用餐空檔與點心安排","最想享受的體驗與當天感受"]},{"title":"吃到飽：練習先看、少量試、再決定。","focus":"把錢花在喜歡的味道與聚餐時間，不必用吃撐來證明划算。","why":"走進吃到飽，最容易讓人失去方向的是「每樣都想試」和「這麼貴要吃回本」。盤子越堆越滿，反而分不清哪些真的好吃。\n\n今天先看一圈，再拿少量真正想吃的食物，吃完再決定要不要添。這不是限制只能拿幾盤，而是讓每次取餐都有機會重新選擇。\n\n健康飲食也包括衛生：選有適當保溫或冷藏的餐點，用公用夾具取餐，續盤換乾淨盤子。不把室溫放了很久的生冷食物當成必吃項目。","example":"看到海鮮、烤肉、麵食和蛋糕，你原本想一口氣全拿。今天先繞一圈，順序可以是第一盤先拿沙拉蔬菜、第二盤冷盤海鮮，第三盤拿主蛋白質和適量主食；第四盤可以拿湯品或烤物回座位慢慢吃。之後再拿一份最期待的甜點，若還餓就再取餐，不用只為了價錢硬塞。","judge":["喜歡：這是我真的想吃，還是因為貴、限量或別人都拿？","感受：吃完這盤還餓嗎？味道滿足嗎？要添哪一項？","衛生：熱食是否保持熱、冷食是否冷藏？取餐工具和盤子乾淨嗎？"],"steps":["用近期聚餐或模擬自助餐情境練習，先看完整個餐檯。","挑幾樣真正想吃的食物，先少量取用並搭配蔬菜與主食。","回座位慢慢吃，留意味道和身體感受。","需要再添時換乾淨盤子，按食慾取餐。","記下最滿足的一樣食物與下次想保留的取餐方式。"],"notes":"吃到舒服，比吃到不能動更值得。若今天沒有去吃到飽，用家中一餐模擬取餐順序即可。","cta":"吃到飽：練習先看、少量試、再決定。","labels":["實際或模擬餐檯、我最想吃的食物","第一盤與續盤決定、衛生觀察","吃完感受與下次取餐方式"],"exampleHtml":"<p>看到海鮮、烤肉、麵食和蛋糕，你原本想一口氣全拿。今天先繞一圈，順序可以是第一盤先拿沙拉蔬菜、第二盤冷盤海鮮，第三盤拿主蛋白質和適量主食；第四盤可以拿湯品或烤物回座位慢慢吃。</p><p>之後再拿一份最期待的甜點，<strong>若還餓就再取餐，不用只為了價錢硬塞</strong>。</p><p><strong>今天練「先看、少量試、再決定」，不用計算一定得吃幾盤。</strong></p>"},{"title":"喝多酒的照顧與求助小卡：不喝酒也能練。","focus":"先分清楚是宿醉不舒服，還是需要立刻求助；沒有快速醒酒的食物。","why":"隔天頭痛、口渴、噁心，常讓人急著找「解酒餐」。但喝咖啡、洗澡或再喝一杯，都不能加速清除酒精。喝水可以補充水分，並不會讓人立刻恢復清醒。\n\n如果只是宿醉、意識清楚且能正常吞嚥，可以停止飲酒、休息，小口喝水，再按胃口吃能接受的食物。症狀嚴重、持續嘔吐或喝不下水時應就醫；不要靠意志力照常開車或操作機器。\n\n這堂不是邀請你喝酒。今天準備一份「不舒服時怎麼處理、找誰幫忙」的小卡，平常就能完成。","example":"朋友聚會後，你隔天口渴、頭痛，但人清楚、能喝水。你取消開車安排，小口補水、休息，餓了吃一些吐司或粥，再依胃口恢復正常用餐。若朋友叫不醒、呼吸不正常，就不是「睡一覺」的情況，要立刻求助。","judge":["警訊：人能叫醒嗎？呼吸正常嗎？有沒有抽搐、意識混亂或皮膚發青？","照顧：能安全吞嚥、留得住水嗎？症狀是否嚴重或一直惡化？","安排：今天能否取消駕駛與高風險活動，請清醒的人協助？"],"steps":["寫下聚會後不開車的交通備案與可聯絡的人。","記住叫不醒、呼吸異常、抽搐或意識混亂等求助警訊。","把「停止飲酒、不用咖啡或洗澡醒酒」寫進小卡。","註記只有清醒且可吞嚥時才小口補水、按胃口進食。","存好當地緊急電話；今天沒有喝酒也算完成這份準備。"],"notes":"有人叫不醒或疑似酒精中毒，立即打當地急救電話（台灣 119），不要留他獨自睡。","cta":"喝多酒的照顧與求助小卡：不喝酒也能練。","labels":["安全交通與清醒協助者","立即求助的警訊與當地急救電話","清醒可吞嚥時的照顧方式與應避免的做法"]},{"title":"旅行回家後：整理剩食，安排第一餐。","focus":"回到家先看看帶回的食物與冰箱，不用又累又餓地重新採買。","why":"旅行回家後，行李還沒收、冰箱也不一定有食物，容易一邊累一邊想著晚餐怎麼辦。今天做的是回家後的整理：先確認帶回的食物能不能安全留用，再用現有食材安排一餐。\n\n和出發前找補給點不同，這次不用再查店家或列旅行備品。把能用的食材用掉、需要補的少量買齊，讓生活接得上就好。","example":"週末旅行回家，你帶回一袋未開封餅乾，冰箱裡還有蛋和冷凍蔬菜。餅乾按標示保存，晚餐用飯、蛋和蔬菜組合；如果帶回的熟食沒有妥善保冷、放了多久也不清楚，就不要靠聞味道判斷能不能吃。","judge":["保存：帶回食物的包裝、期限與冷藏條件清楚嗎？","現有食材：冰箱與櫃子裡有哪些能組成一餐的東西？","補買：今天真正缺哪一項？能否少量補齊，而不是重新買一整套？"],"steps":["拿出帶回的食物，核對包裝、日期與保存經過。","依標示收好可保存的食品；保存安全不明的易腐食物不要留用。","查看家中現有主食、蛋白質食物與蔬菜。","用現有食材安排回家第一餐，只補買真正缺的品項。","記下用了哪些食材、還剩什麼，以及下一餐優先用哪一項。"],"notes":"今天整理的是回家後的食物與第一餐，不需要排毒、補償或大採買。","cta":"今天用現有食材安排回家第一餐。","labels":["帶回食物、保存情況與處理方式","家中現有食材與今天的第一餐","需要補買什麼？下一餐優先用什麼？"]},{"title":"彈性日：行程臨時變動，啟用一個備案。","focus":"今天試著用既有準備解決一個突發狀況。","why":"備案不是寫得越多越好，而是現場真的用得上。先判斷最急的需要，再找最近、可行的補給或交通選項。","example":"原本買晚餐的店休息，你查到附近超市還營業，先買能安全食用的一餐。其他想吃的名店留到下次，今天不用為了一份理想菜單一直趕路。","judge":["現在最急的是吃飯、喝水、休息還是安全交通？","現有備案哪個還有效？需要再確認營業時間嗎？","買到的食物能現在吃完或妥善保存嗎？"],"steps":["選一次臨時變動，或用店家休息的情境演練。","找出眼前最急的一項需要。","使用補給小抄或交通備案解決它。","確認食物保存與返程安全。","記下備案有沒有用，更新一項資訊。"],"notes":"今天先把人照顧好，其他行程可以調整。","cta":"今天啟用一次備案，並更新小抄。","labels":["突發狀況與最急的需要","啟用的備案與結果","需要更新的資訊"]},{"title":"每週回顧：留下旅行與聚會工具包。","focus":"把補給、用餐節奏、吃到飽與聚會安全整理成自己的版本。","why":"這週學的是陌生情境下的應對，不是再背一次點餐原則。留下最容易忘、卻最有用的資訊，下次就能多一點安心。","example":"你把車站補給點、晚宴前的用餐安排、吃到飽取餐提醒與安全返程方式放進同一張便條。出發前看一遍，臨時變動時就不必從頭想。","judge":["哪個問題最容易再次發生？","哪一份小抄確實能幫忙，資訊仍有效嗎？","下次出發前要先做哪一步？"],"steps":["回看本週實際記錄或演練。","留下最有用的食物補給點與保存安排。","保留一個聚會用餐節奏或吃到飽取餐方法。","確認安全返程、協助者與急救資訊。","完成 check-in，寫下下次出發前的第一步。"],"notes":"工具包不用很長，留幾個真正會用的答案就好。","cta":"今天完成自己的旅行與聚會工具包。","labels":["最常遇到的問題與有效解法","補給、取餐與安全返程小抄","下次出發前要確認的一步"]}];
const week11Meta=[{"title":"旅行找食物：先留一個補給備案","concept":"班機延誤、店家休息、看不懂菜單時，也能先把自己餵飽。","hook":"旅行找食物：先留一個補給備案","example":"火車晚了一小時，到旅館時餐廳已打烊。你先去查好的超市買麵包、未開封且標示可常溫保存的豆漿，再買一份方便處理的水果。這餐先吃得足夠，明天有更多選擇再補充變化。","apply":"挑一次近期或模擬行程，寫下最長交通段與抵達時間。"},{"title":"旅行與聚會：安排一整天的用餐節奏","concept":"把早餐、交通和晚宴一起看，別讓行程把自己餓到沒力。","hook":"旅行與聚會：安排一整天的用餐節奏","example":"下午搭車參加晚宴，六點集合卻可能七點半才上菜。你中午先吃一餐，出門帶一份點心，等候時若餓就吃。到了現場，可以慢慢享受想吃的菜，聊天也不會一直分心想著肚子餓。","apply":"寫下出門、交通、聚會開始與預計上菜時間。"},{"title":"吃到飽怎麼吃得舒服","concept":"把錢花在喜歡的味道與聚餐時間，不必用吃撐來證明划算。","hook":"吃到飽怎麼吃得舒服","example":"看到海鮮、烤肉、麵食和蛋糕，你原本想一口氣全拿。今天先繞一圈，順序可以是第一盤先拿沙拉蔬菜、第二盤冷盤海鮮，第三盤拿主蛋白質和適量主食；第四盤可以拿湯品或烤物回座位慢慢吃。之後再拿一份最期待的甜點，若還餓就再取餐，不用只為了價錢硬塞。","apply":"用近期聚餐或模擬自助餐情境練習，先看完整個餐檯。"},{"title":"聚會喝多了：先顧安全，再慢慢恢復","concept":"先分清楚是宿醉不舒服，還是需要立刻求助；沒有快速醒酒的食物。","hook":"聚會喝多了：先顧安全，再慢慢恢復","example":"朋友聚會後，你隔天口渴、頭痛，但人清楚、能喝水。你取消開車安排，小口補水、休息，餓了吃一些吐司或粥，再依胃口恢復正常用餐。若朋友叫不醒、呼吸不正常，就不是「睡一覺」的情況，要立刻求助。","apply":"寫下聚會後不開車的交通備案與可聯絡的人。"},{"title":"旅行回家後：整理剩食，安排第一餐","concept":"回到家先看看帶回的食物與冰箱，不用又累又餓地重新採買。","hook":"旅行回家後：整理剩食，安排第一餐","example":"週末旅行回家，你帶回一袋未開封餅乾，冰箱裡還有蛋和冷凍蔬菜。餅乾按標示保存，晚餐用飯、蛋和蔬菜組合；如果帶回的熟食沒有妥善保冷、放了多久也不清楚，就不要靠聞味道判斷能不能吃。","apply":"拿出帶回的食物，核對包裝、日期與保存經過。"}];
const week11Rich=[{"why":"旅行最常卡住的，不一定是不會選菜，而是「現在根本沒東西吃」。車程太長、抵達太晚或店家臨時休息，都可能讓原本的餐點安排落空。 出發前先查住處附近的超市、車站補給點與營業時間，再準備一點能按標示保存的食物。這份備案是讓你有得吃，不是要求整趟旅行都照固定菜單。 到了不熟悉的地方，先確認食材、過敏原與保存條件。語言不通時，可以把需要避開的食材翻譯好給店家看；嚴重食物過敏者仍需確認能否避免交叉接觸，不能只靠翻譯猜。","whyHtml":"<p>旅行最常卡住的，不一定是不會選菜，而是「現在根本沒東西吃」。車程太長、抵達太晚或店家臨時休息，都可能讓原本的餐點安排落空。</p><p>出發前先查住處附近的超市、車站補給點與營業時間，再準備一點能按標示保存的食物。這份備案是讓你有得吃，不是要求整趟旅行都照固定菜單。</p><p>到了不熟悉的地方，先確認食材、過敏原與保存條件。語言不通時，可以把需要避開的食材翻譯好給店家看；嚴重食物過敏者仍需確認能否避免交叉接觸，不能只靠翻譯猜。</p>","example":"火車晚了一小時，到旅館時餐廳已打烊。你先去查好的超市買麵包、未開封且標示可常溫保存的豆漿，再買一份方便處理的水果。這餐先吃得足夠，明天有更多選擇再補充變化。","exampleHtml":"<p>火車晚了一小時，到旅館時餐廳已打烊。你先去查好的超市買麵包、未開封且標示可常溫保存的豆漿，再買一份方便處理的水果。這餐先吃得足夠，明天有更多選擇再補充變化。</p>","observe":"挑一段最可能錯過用餐的行程，先留一個找得到、買得到的備案。","judge":["找得到：住處或車站附近哪裡有食物？抵達時還開著嗎？","帶得動：車程多久、能否冷藏？包裝能常溫保存嗎？","吃得安心：食材與水源清楚嗎？過敏或其他飲食需要能否確認？"],"do":["挑一次近期或模擬行程，寫下最長交通段與抵達時間。","查一個附近超市或補給點，記下營業時間。","按人數與等待時間列兩樣備用食物和飲水。","確認保存方式、過敏原與當地攜帶食品規定。","把地點與備案存下來，出發前看一次。"],"cta":"替旅行準備一個食物補給備案。","tip":"旅程沒有完美菜單也沒關係。先解決有得吃、吃得夠與保存安全。","extra":"<div class=\"lesson-info-grid\"><div><b>沒冰箱怎麼買？</b><span>選原封、標示可常溫保存且吃得完的包裝；需要冷藏的乳品或熟食不要在背包裡放一整天。</span></div><div><b>看不懂菜單怎麼辦？</b><span>用食物照片、店家說明和翻譯工具確認；不確定過敏原時，不要把「應該沒有」當成保證。</span></div><div><b>陌生地區的水與食物</b><span>水源不可靠時選原封瓶裝水；優先選充分煮熟、上桌仍熱的食物，生食、冰塊與切好的水果要看當地衛生條件。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://wwwnc.cdc.gov/travel/page/food-water-safety\" target=\"_blank\" rel=\"noopener\">CDC：旅行飲食安全</a></p>"},{"why":"婚宴晚上才開始，白天又忙著移動，很容易想「先不吃，晚上一次吃」。但等到很餓才入席，常會吃得很急，也更難享受真正想吃的菜。 今天練的是安排整天的空檔。先確認集合時間、車程與聚會開始時間，該吃的一餐照需要吃；如果等待很久，再準備一份方便的點心。 地方小吃、生日蛋糕都是旅程與聚會的樂趣。先選你真正期待的體驗，不必每個攤位都排，也不必用少吃其他餐來交換。","whyHtml":"<p>婚宴晚上才開始，白天又忙著移動，很容易想「先不吃，晚上一次吃」。但等到很餓才入席，常會吃得很急，也更難享受真正想吃的菜。</p><p>今天練的是安排整天的空檔。先確認集合時間、車程與聚會開始時間，該吃的一餐照需要吃；如果等待很久，再準備一份方便的點心。</p><p>地方小吃、生日蛋糕都是旅程與聚會的樂趣。先選你真正期待的體驗，不必每個攤位都排，也不必用少吃其他餐來交換。</p>","example":"下午搭車參加晚宴，六點集合卻可能七點半才上菜。你中午先吃一餐，出門帶一份點心，等候時若餓就吃。到了現場，可以慢慢享受想吃的菜，聊天也不會一直分心想著肚子餓。","exampleHtml":"<p>下午搭車參加晚宴，六點集合卻可能七點半才上菜。你中午先吃一餐，出門帶一份點心，等候時若餓就吃。到了現場，可以慢慢享受想吃的菜，聊天也不會一直分心想著肚子餓。</p>","observe":"今天把交通與聚會時間畫成一條線，找出需要安排吃東西的空檔。","judge":["等待：從上一餐到上菜大約隔多久？中途有沒有補給？","體驗：今天最期待哪一道食物或哪個聚會時刻？","安排：點心、飲水和同行者需求是否都留了空間？"],"do":["寫下出門、交通、聚會開始與預計上菜時間。","在行程裡留一個正常用餐空檔。","若等待時間長，準備合適點心與飲水。","挑一個真正想享受的食物或活動，留足時間。","聚會後記下哪個安排讓當天比較舒服。"],"cta":"安排旅行或聚會當天的用餐空檔。","tip":"不必空腹赴宴，也不必靠挨餓換取甜點。旅遊的樂趣不只在吃完多少種食物。","extra":"<div class=\"lesson-info-grid\"><div><b>行程太滿</b><span>少排一個點，換一段坐下吃飯的時間，有時整天會更好玩。</span></div><div><b>同行者不同步</b><span>先約好吃飯或補給時間，有需要的人可以先吃，不必全部一起忍餓。</span></div><div><b>點心帶多少？</b><span>按人數與等待時間準備，像全穀餅乾、水果或合適的堅果；需冷藏的食品要有保冷條件。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niddk.nih.gov/health-information/weight-management/just-enough-food-portions\" target=\"_blank\" rel=\"noopener\">NIDDK：實際食用量</a></p>"},{"why":"走進吃到飽，最容易讓人失去方向的是「每樣都想試」和「這麼貴要吃回本」。盤子越堆越滿，反而分不清哪些真的好吃。 今天先看一圈，再拿少量真正想吃的食物，吃完再決定要不要添。這不是限制只能拿幾盤，而是讓每次取餐都有機會重新選擇。 健康飲食也包括衛生：選有適當保溫或冷藏的餐點，用公用夾具取餐，續盤換乾淨盤子。不把室溫放了很久的生冷食物當成必吃項目。","whyHtml":"<p>走進吃到飽，最容易讓人失去方向的是「每樣都想試」和「這麼貴要吃回本」。盤子越堆越滿，反而分不清哪些真的好吃。</p><p>今天先看一圈，再拿少量真正想吃的食物，吃完再決定要不要添。這不是限制只能拿幾盤，而是讓每次取餐都有機會重新選擇。</p><p>健康飲食也包括衛生：選有適當保溫或冷藏的餐點，用公用夾具取餐，續盤換乾淨盤子。不把室溫放了很久的生冷食物當成必吃項目。</p>","example":"看到海鮮、烤肉、麵食和蛋糕，你原本想一口氣全拿。今天先繞一圈，順序可以是第一盤先拿沙拉蔬菜、第二盤冷盤海鮮，第三盤拿主蛋白質和適量主食；第四盤可以拿湯品或烤物回座位慢慢吃。之後再拿一份最期待的甜點，若還餓就再取餐，不用只為了價錢硬塞。","exampleHtml":"<p>看到海鮮、烤肉、麵食和蛋糕，你原本想一口氣全拿。今天先繞一圈，順序可以是第一盤先拿沙拉蔬菜、第二盤冷盤海鮮，第三盤拿主蛋白質和適量主食；第四盤可以拿湯品或烤物回座位慢慢吃。</p><p>之後再拿一份最期待的甜點，<strong>若還餓就再取餐，不用只為了價錢硬塞</strong>。</p><p><strong>今天練「先看、少量試、再決定」，不用計算一定得吃幾盤。</strong></p>","observe":"","judge":["喜歡：這是我真的想吃，還是因為貴、限量或別人都拿？","感受：吃完這盤還餓嗎？味道滿足嗎？要添哪一項？","衛生：熱食是否保持熱、冷食是否冷藏？取餐工具和盤子乾淨嗎？"],"do":["用近期聚餐或模擬自助餐情境練習，先看完整個餐檯。","挑幾樣真正想吃的食物，先少量取用並搭配蔬菜與主食。","回座位慢慢吃，留意味道和身體感受。","需要再添時換乾淨盤子，按食慾取餐。","記下最滿足的一樣食物與下次想保留的取餐方式。"],"cta":"吃到飽：練習先看、少量試、再決定。","tip":"吃到舒服，比吃到不能動更值得。若今天沒有去吃到飽，用家中一餐模擬取餐順序即可。","extra":"<div class=\"lesson-info-grid\"><div><b>甜點不用搶先堆滿</b><span>先看自己真正想試什麼，選少量享受，還想吃再決定。</span></div><div><b>飲料也占胃口</b><span>依口渴喝水；喜歡其他飲料可自行選擇，不必一直續甜飲才覺得划算。</span></div><div><b>餐檯前多看一眼</b><span>生食與熟食工具分開；發現餐點溫度或衛生有疑慮，就換一項或詢問店員。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.fda.gov/food/buy-store-serve-safe-food/serving-safe-buffets\" target=\"_blank\" rel=\"noopener\">FDA：自助餐食物安全</a></p>","omitObserve":true},{"why":"隔天頭痛、口渴、噁心，常讓人急著找「解酒餐」。但喝咖啡、洗澡或再喝一杯，都不能加速清除酒精。喝水可以補充水分，並不會讓人立刻恢復清醒。 如果只是宿醉、意識清楚且能正常吞嚥，可以停止飲酒、休息，小口喝水，再按胃口吃能接受的食物。症狀嚴重、持續嘔吐或喝不下水時應就醫；不要靠意志力照常開車或操作機器。 這堂不是邀請你喝酒。今天準備一份「不舒服時怎麼處理、找誰幫忙」的小卡，平常就能完成。","whyHtml":"<p>隔天頭痛、口渴、噁心，常讓人急著找「解酒餐」。但喝咖啡、洗澡或再喝一杯，都不能加速清除酒精。喝水可以補充水分，並不會讓人立刻恢復清醒。</p><p>如果只是宿醉、意識清楚且能正常吞嚥，可以停止飲酒、休息，小口喝水，再按胃口吃能接受的食物。症狀嚴重、持續嘔吐或喝不下水時應就醫；不要靠意志力照常開車或操作機器。</p><p>這堂不是邀請你喝酒。今天準備一份「不舒服時怎麼處理、找誰幫忙」的小卡，平常就能完成。</p>","example":"朋友聚會後，你隔天口渴、頭痛，但人清楚、能喝水。你取消開車安排，小口補水、休息，餓了吃一些吐司或粥，再依胃口恢復正常用餐。若朋友叫不醒、呼吸不正常，就不是「睡一覺」的情況，要立刻求助。","exampleHtml":"<p>朋友聚會後，你隔天口渴、頭痛，但人清楚、能喝水。你取消開車安排，小口補水、休息，餓了吃一些吐司或粥，再依胃口恢復正常用餐。若朋友叫不醒、呼吸不正常，就不是「睡一覺」的情況，要立刻求助。</p>","observe":"今天先把安全交通、照顧者與求助方式記好，不用透過喝酒來練習。","judge":["警訊：人能叫醒嗎？呼吸正常嗎？有沒有抽搐、意識混亂或皮膚發青？","照顧：能安全吞嚥、留得住水嗎？症狀是否嚴重或一直惡化？","安排：今天能否取消駕駛與高風險活動，請清醒的人協助？"],"do":["寫下聚會後不開車的交通備案與可聯絡的人。","記住叫不醒、呼吸異常、抽搐或意識混亂等求助警訊。","把「停止飲酒、不用咖啡或洗澡醒酒」寫進小卡。","註記只有清醒且可吞嚥時才小口補水、按胃口進食。","存好當地緊急電話；今天沒有喝酒也算完成這份準備。"],"cta":"喝多酒的照顧與求助小卡：不喝酒也能練。","tip":"有人叫不醒或疑似酒精中毒，立即打當地急救電話（台灣 119），不要留他獨自睡。","extra":"<div class=\"lesson-info-grid\"><div><b>等待救援時</b><span>留在身旁；無意識但正常呼吸者協助側躺，避免嘔吐嗆到。沒有正常呼吸時依接線員指示施救。不強灌水、不催吐。</span></div><div><b>食物不是解酒藥</b><span>吐司、粥等只是較能接受的進食選擇；油膩大餐、能量飲料或電解質飲不能保證治好宿醉。</span></div><div><b>藥物不要自行混用</b><span>酒精與安眠鎮靜藥併用可能危險；止痛藥也可能增加肝臟或胃部風險，需要時先問醫師或藥師。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/understanding-dangers-of-alcohol-overdose\" target=\"_blank\" rel=\"noopener\">NIAAA：酒精過量警訊</a></p><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/hangovers\" target=\"_blank\" rel=\"noopener\">NIAAA：宿醉與常見迷思</a></p>"},{"why":"旅行回家後，行李還沒收、冰箱也不一定有食物，容易一邊累一邊想著晚餐怎麼辦。今天做的是回家後的整理：先確認帶回的食物能不能安全留用，再用現有食材安排一餐。\n\n和出發前找補給點不同，這次不用再查店家或列旅行備品。把能用的食材用掉、需要補的少量買齊，讓生活接得上就好。","whyHtml":"<p>旅行回家後，行李還沒收、冰箱也不一定有食物，容易一邊累一邊想著晚餐怎麼辦。今天做的是回家後的整理：先確認帶回的食物能不能安全留用，再用現有食材安排一餐。</p><p>和出發前找補給點不同，這次不用再查店家或列旅行備品。把能用的食材用掉、需要補的少量買齊，讓生活接得上就好。</p>","example":"週末旅行回家，你帶回一袋未開封餅乾，冰箱裡還有蛋和冷凍蔬菜。餅乾按標示保存，晚餐用飯、蛋和蔬菜組合；如果帶回的熟食沒有妥善保冷、放了多久也不清楚，就不要靠聞味道判斷能不能吃。","exampleHtml":"<p>週末旅行回家，你帶回一袋未開封餅乾，冰箱裡還有蛋和冷凍蔬菜。餅乾按標示保存，晚餐用飯、蛋和蔬菜組合；如果帶回的熟食沒有妥善保冷、放了多久也不清楚，就不要靠聞味道判斷能不能吃。</p>","observe":"今天看看帶回的食物與家中庫存，先把回家第一餐安排好。","judge":["保存：帶回食物的包裝、期限與冷藏條件清楚嗎？","現有食材：冰箱與櫃子裡有哪些能組成一餐的東西？","補買：今天真正缺哪一項？能否少量補齊，而不是重新買一整套？"],"do":["拿出帶回的食物，核對包裝、日期與保存經過。","依標示收好可保存的食品；保存安全不明的易腐食物不要留用。","查看家中現有主食、蛋白質食物與蔬菜。","用現有食材安排回家第一餐，只補買真正缺的品項。","記下用了哪些食材、還剩什麼，以及下一餐優先用哪一項。"],"cta":"今天用現有食材安排回家第一餐。","tip":"今天整理的是回家後的食物與第一餐，不需要排毒、補償或大採買。","extra":"<div class=\"lesson-info-grid\"><div><b>先看保存經過</b><span>需冷藏的食品若一路沒有妥善保冷，不要只靠外觀或味道判斷。保存不明的易腐食物不要留用。</span></div><div><b>先用家裡有的</b><span>飯麵、蛋或豆腐與蔬菜可以組成一餐；不用為了剛旅行回來就全部重新採買。</span></div><div><b>只補真正缺的</b><span>先寫下第一餐會吃什麼，再決定缺哪一項、買多少；下一餐優先安排需要先用的食材。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.fda.gov/food/buy-store-serve-safe-food/serving-safe-buffets\" target=\"_blank\" rel=\"noopener\">FDA：剩食保存與食品安全</a></p>"}];
