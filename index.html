/* Editorial Wellness visual restoration */
.landing{background:var(--cream);color:var(--ink)}
.landing-nav{max-width:1240px;margin:auto;height:82px;padding:0 32px;background:transparent;border-bottom:0}
.landing-nav .brand{display:flex;gap:12px;align-items:center}
.landing-nav .brand .logo{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 13px Inter}
.landing-nav .brand b{display:block;font:500 22px Georgia,"Noto Serif TC",serif;color:var(--g)}
.landing-nav .brand small{display:block;color:var(--sage);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.landing-hero{max-width:1240px;margin:auto;padding:48px 32px 72px;display:grid;grid-template-columns:.9fr 1.1fr;gap:54px;align-items:stretch}
.landing-hero h1{font:500 clamp(48px,5.6vw,76px)/.98 Georgia,"Noto Serif TC",serif;letter-spacing:-2px;color:var(--g);margin:18px 0 24px}
.landing-lead{font-size:18px;line-height:1.75;color:#56615b;max-width:590px}
.editorial-visual{display:grid;grid-template-columns:1.55fr .9fr;grid-template-rows:1fr 1fr;gap:10px;min-height:520px}
.editorial-visual .img{border-radius:18px;overflow:hidden;background:var(--sand);position:relative}
.editorial-visual .img img{width:100%;height:100%;object-fit:cover;display:block}
.editorial-visual .mainimg{grid-row:1 / span 2}
.editorial-visual .caption{position:absolute;left:16px;bottom:14px;color:#fff;font:500 20px Georgia,serif;text-shadow:0 1px 10px #0008}
.editorial-visual .caption small{display:block;font:11px Inter,sans-serif;letter-spacing:1px;margin-top:3px}
.editorial-quote{position:absolute;right:18px;top:16px;background:rgba(250,248,245,.9);padding:12px 15px;border-radius:12px;color:var(--g);font:16px Georgia,serif;max-width:180px}
.price{font:500 30px Georgia,serif;color:var(--g);margin:26px 0}
.price span{font:14px Inter,system-ui,sans-serif;color:var(--muted)}
.bigbtn{padding:15px 22px;border-radius:999px;margin:5px 8px 5px 0}
.landing-section{padding:82px 32px;text-align:center;max-width:1240px;margin:auto}
.landing-section h2{font:500 46px/1.12 Georgia,"Noto Serif TC",serif;color:var(--g);margin:12px auto 18px;max-width:900px}
.landing-section p{font-size:17px;line-height:1.75;color:var(--muted);max-width:820px;margin:0 auto 28px}
.editorial-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:42px;text-align:left}
.editorial-grid .tile{min-height:230px;border-radius:18px;overflow:hidden;position:relative;background:#ddd}
.editorial-grid .tile img{width:100%;height:100%;object-fit:cover;display:block}
.editorial-grid .tile span{position:absolute;left:16px;bottom:14px;color:#fff;font:500 22px Georgia,serif;text-shadow:0 1px 10px #0008}
.editorial-grid .tile small{display:block;font:10px Inter,sans-serif;letter-spacing:1.5px;margin-top:4px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.feature-grid div{padding:32px;border-right:1px solid var(--line)}
.feature-grid div:last-child{border-right:0}
.feature-grid b{display:block;font:500 36px Georgia,serif;color:var(--g)}
.feature-grid span{display:block;color:var(--muted);margin-top:6px}
.landing-section.dark{max-width:none;background:var(--g);color:#fff}
.landing-section.dark h2{color:#fff}.landing-section.dark p{color:#d9e3dd}
.landing-foot{text-align:center;padding:30px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
@media(max-width:850px){.landing-hero{grid-template-columns:1fr;padding:35px 20px 55px}.editorial-visual{min-height:420px}.editorial-grid{grid-template-columns:1fr 1fr}.landing-section{padding:65px 20px}.feature-grid{grid-template-columns:1fr}.feature-grid div{border-right:0;border-bottom:1px solid var(--line)}.feature-grid div:last-child{border-bottom:0}}
@media(max-width:520px){.editorial-visual{grid-template-columns:1fr 1fr;min-height:360px}.landing-hero h1{font-size:48px}.editorial-grid{grid-template-columns:1fr}.landing-nav{padding:0 18px}}

<script>
const weeks=[{"week":1,"title":"重新開始與基準","outcome":"建立務實的起點，找出最容易做到、又最有影響力的一個改變","lessons":["為什麼日常選擇很重要","了解你的起點","80% 原則","找出最大的阻力","建立第一個簡單習慣"],"daily_actions":["記錄一餐平常的飲食，不評價自己。","留意一餐中讓你感到滿足的地方。","找出今天最困難的一個飲食決定。","在一次非預期的點心前，先停下 5 分鐘。","選一個明天也能重複的小改變。","彈性日：在任何真實生活情境中運用本週技巧。","每週回顧：什麼有效？什麼困難？接下來要重複什麼？"],"review_prompts":["什麼有效？","什麼感覺困難？","下週你要重複什麼？"]},{"week":2,"title":"認識 GI 與碳水化合物","outcome":"了解碳水化合物的品質、份量與食物搭配，不恐懼也不需要完全排除。","lessons":["什麼是碳水化合物？","什麼是 GI？","GI 與份量大小","為什麼食物搭配很重要","更好的碳水化合物選擇"],"daily_actions":["列出今天吃到的主要碳水化合物食物。","從份量與情境比較兩種碳水化合物食物。","在一餐中把碳水化合物與蛋白質搭配。","在一餐加入富含纖維的食物。","選一種你喜歡的碳水化合物，練習合理份量。","彈性日：外食時運用本週原則。","每週回顧：什麼讓碳水化合物的選擇更容易？"],"review_prompts":["什麼有效？","什麼感覺困難？","下週你要重複什麼？"]},{"week":3,"title":"打造均衡餐盤","outcome":"用簡單的視覺化餐盤方法，做出有飽足感又均衡的一餐。","lessons":["均衡餐盤","蛋白質","富含纖維的食物","非澱粉類蔬菜","組合一頓真實的餐"],"daily_actions":["打造一份均衡餐盤。","在一餐加入非澱粉類蔬菜。","確認一餐中有明確的蛋白質來源。","用視覺方式調整碳水化合物份量。","拍下一餐均衡餐盤，作為自己的參考。","彈性日：用手邊現有食物組合一份均衡餐。","每週回顧：哪一種餐盤模式最容易做到？"],"review_prompts":["什麼有效？","什麼感覺困難？","下週你要重複什麼？"]},{"week":4,"title":"讀懂食品標籤","outcome":"有信心地閱讀每份量、總碳水化合物、添加糖、纖維與蛋白質。","lessons":["每份量","總碳水化合物","添加糖","纖維","讀懂完整標籤"],"daily_actions":["讀一個食品標籤，找出每份量。","在一項產品上找出總碳水化合物。","找到標示出的添加糖。","找到纖維與蛋白質。","用五項檢查完整閱讀一項產品，判斷它是否適合你的日常。","彈性日：在商店比較兩項產品。","每週回顧：之後讀標籤時，你會先看哪一項？"],"review_prompts":["什麼有效？","什麼感覺困難？","下週你要重複什麼？"]},{"week":5,"title":"早餐策略","outcome":"為在家、工作與忙碌早晨建立三個可以反覆使用的早餐選擇。","lessons":["為什麼早餐可以成為有用的固定點","常見早餐陷阱","蛋白質＋纖維","更好的便利選擇","建立你的早餐公式"],"daily_actions":["嘗試一份蛋白質＋纖維早餐。","找出你平常早餐中的一個陷阱。","建立早餐預設選擇 #1。","建立早餐預設選擇 #2。","建立早餐預設選擇 #3。","彈性日：忙碌早晨使用其中一個預設選擇。","每週回顧：選出最容易執行的早餐預設。"],"review_prompts":["什麼有效？","什麼感覺困難？","下週你要重複什麼？"]},{"week":6,"title":"外食策略","outcome":"在餐廳、外送、商務餐與社交聚餐中做出務實選擇。","lessons":["餐廳決策框架","早餐店","速食","餐廳與外送","商務餐與社交聚餐"],"daily_actions":["在一餐中使用三步驟餐廳決策框架。","在早餐店或咖啡店練習。","用外送或外帶練習。","在商務餐中練習。","在社交聚餐中練習，不追求完美。","彈性日：選擇當下能做到的最佳選項。","每週回顧：哪一個決策步驟最有幫助？"],"review_prompts":["什麼有效？","什麼感覺困難？","下週你要重複什麼？"]},{"week":7,"title":"便利商店指南","outcome":"當沒有 const bonuses=[["外食快速指南","餐廳、外送與社交聚餐時的簡單決策框架。"],["購物與便利商店速查表","時間有限或選擇有限時，快速組合實用餐點。"],["食品標籤解碼器","快速查閱每份量、碳水化合物、添加糖與纖維。"],["90 天習慣追蹤器","看見自己的模式，不需要追求完美。"],["緊急飲食指南","當一天沒有照計畫走時，知道下一步怎麼做。"]];
let state=JSON.parse(localStorage.getItem('resetDemo')||'null')||{lessons:{},actions:{},reviews:{},playbook:{},rating:{}};
const key=(t,w,n)=>t+'-'+w+'-'+n; const save=()=>localStorage.setItem('resetDemo',JSON.stringify(state));
function stats(){let l=0,a=0,r=0;weeks.forEach(w=>{w.lessons.forEach((_,i)=>l+=!!state.lessons[key('l',w.week,i+1)]);w.daily_actions.forEach((_,i)=>a+=!!state.actions[key('a',w.week,i+1)]);r+=!!state.reviews[w.week]});let done=l+a+r;return{l,a,r,done,pct:Math.round(done/(60+84+12)*100)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setTop(c){document.getElementById('crumb').textContent=c;const s=stats();document.getElementById('sidePct').textContent=s.pct+'%';document.getElementById('sideBar').style.width=s.pct+'%';document.getElementById('side第').textContent=Math.min(90,Math.max(1,s.done+1));document.querySelectorAll('[data-nav]').forEach(a=>a.classList.remove('active'));}
function go(h){location.hash=h}
function dashboard(){setTop('你的重整計畫');const s=stats();let current=1;for(let w of weeks){let total=w.lessons.length+w.daily_actions.length+1,done=w.lessons.reduce((n,_,i)=>n+!!state.lessons[key('l',w.week,i+1)],0)+w.daily_actions.reduce((n,_,i)=>n+!!state.actions[key('a',w.week,i+1)],0)+!!state.reviews[w.week];if(done<total){current=w.week;break}else current=w.week}const w=weeks[current-1];return `<div class="page"><div class="grid g2"><section class="card hero"><div><p class="eyebrow">90-第 PRACTICAL HEALTH RESET</p><h1>Welcome back. Let's make the next choice a little easier.</h1><p>Learn one useful idea, apply it in real life, and build a system you can actually repeat.</p></div><div><span class="pill" style="background:rgba(255,255,255,.12);color:white">第 ${Math.min(90,s.done+1)}／90 天 · 第 ${current}</span><div style="margin-top:15px"><a class="btn primary" href="#/week/${current}">Continue 第 ${current} →</a></div></div></section><section class="card next"><div><p class="eyebrow">UP NEXT</p><h3>${esc(w.lessons[0])}</h3><p class="muted">${esc(w.outcome)}</p></div><div style="display:grid;gap:8px"><a class="btn primary" href="#/lesson/${current}/1">Continue lesson</a><a class="btn outline" href="#/action/${current}/1">今天的行動</a></div></section></div><section class="section"><div class="section-head row"><div><p class="eyebrow">YOUR 90-第 PROGRESS</p><h2>Small steps create momentum.</h2></div></div><div class="stats"><div class="card stat"><b>${s.l}/60</b><span>課程 completed</span></div><div class="card stat"><b>${s.a}/84</b><span>Daily actions completed</span></div><div class="card stat"><b>${s.r}/12</b><span>第ly check-ins</span></div></div></section><section class="section"><div class="row"><div><p class="eyebrow">12-週 ROADMAP</p><h2>你的完整旅程</h2></div><a class="btn soft" href="#/progress">View progress →</a></div><div class="grid" style="margin-top:14px">${weeks.map(w=>`<a class="weekrow" href="#/week/${w.week}"><span class="weekno">週 ${String(w.week).padStart(2,'0')}</span><div><h3>${esc(w.title)}</h3><p>${esc(w.outcome)}</p></div><span class="tag ${w.week===current?'current':''}">${w.week===current?'Current':'Open'}</span></a>`).join('')}</div></section></div>`}
function week(n){const w=weeks[n-1];setTop('第 '+n);return `<div class="page"><a class="muted" href="#/dashboard">← 首頁</a><section class="card weekhero section"><p class="eyebrow">週 ${String(n).padStart(2,'0')}</p><h1>${esc(w.title)}</h1><p class="lead">${esc(w.outcome)}</p><div class="pills"><span class="pill">5 課程</span><span class="pill">7 每日行動</span><span class="pill">1 第ly 回顧</span></div><div class="tabs"><button class="active">Overview</button><button onclick="go('#/lesson/${n}/1')">課程</button><button onclick="go('#/action/${n}/1')">每日行動</button><button onclick="go('#/checkin/${n}')">回顧</button></div></section><section class="section grid g2equal"><div class="card"><p class="eyebrow">本週目標</p><h2>學習 → 應用 → 重複</h2><p class="muted">把本週能力用在日常情境。目標是建立有用的預設選擇，而不是完美的一週。</p><a class="btn primary" href="#/lesson/${n}/1">開始下一課 →</a></div><div class="card"><p class="eyebrow">本週</p><div class="stats"><div class="stat"><b>5</b><span>課程</span></div><div class="stat"><b>7</b><span>行動</span></div><div class="stat"><b>1</b><span>回顧</span></div></div></div></section><section class="section"><p class="eyebrow">課程</p><h2>建立能力</h2><div class="grid g2equal" style="margin-top:14px">${w.lessons.map((t,i)=>{let d=!!state.lessons[key('l',n,i+1)];return `<a class="lesson ${d?'done':''}" href="#/lesson/${n}/${i+1}"><div><small>課程 ${i+1}</small><h3>${esc(t)}</h3></div><span class="checkcircle">${d?'✓':'→'}</span></a>`}).join('')}</div></section><section class="section"><p class="eyebrow">每日行動</p><h2>在真實生活中練習</h2><div class="grid" style="margin-top:14px">${w.daily_actions.map((t,i)=>{let d=!!state.actions[key('a',n,i+1)];return `<a class="lesson ${d?'done':''}" href="#/action/${n}/${i+1}"><div><small>第 ${i+1}</small><h3>${esc(t)}</h3></div><span class="checkcircle">${d?'✓':'→'}</span></a>`}).join('')}</div></section><section class="section"><div class="card row"><div><p class="eyebrow">週LY REVIEW</p><h2>停下來．觀察．調整</h2><p class="muted">Capture what worked, what was difficult, and what you will repeat.</p></div><a class="btn primary" href="#/checkin/${n}">${state.reviews[n]?'已完成回顧 ✓':'開始每週回顧 →'}</a></div></section></div>`}
function lesson(w,l){const x=weeks[w-1],title=x.lessons[l-1],done=!!state.lessons[key('l',w,l)];setTop(`第 ${w} · Lesson ${l}`);let principles=['改變之前先觀察。平常的一天就是有用的資料。','找出模式，而不是只看單一餐。','選擇一個仍有意義、但最容易做到的小改變。','針對真正困難的時刻設計，而不是理想中的一天。','讓下一個有幫助的行動變得清楚又容易。'];return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a><section class="card content section"><p class="eyebrow">課程 ${l} OF 5 · 週 ${w}</p><h1 style="font:500 38px Georgia,serif;margin:5px 0 12px">${esc(title)}</h1><p class="lead">健康習慣來自一次又一次的日常選擇。目標是把本週的觀念變成能在真實生活中使用的實用能力。</p><div class="card" style="background:#f5f4ef;box-shadow:none;margin-top:22px"><p class="eyebrow">實用觀念</p><p>${principles[(l-1)%5]}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:22px"><button class="btn primary" onclick="completeLesson(${w},${l})">${done?'已完成 ✓':'標記課程完成'}</button><a class="btn soft" href="#/action/${w}/${Math.min(7,l)}">Go to daily action →</a></div></section><section class="section card"><p class="eyebrow">KEEP IT SIMPLE</p><h2>進步比完美重要</h2><p class="muted">把這堂課的一個想法用在一個真實情境中。你正在建立可以重複的能力。</p></section></div>`}
function completeLesson(w,l){state.lessons[key('l',w,l)]=true;save();toast('課程已儲存');render()}
function action(w,d){const x=weeks[w-1],text=x.daily_actions[d-1],done=!!state.actions[key('a',w,d)];setTop(`第 ${w} · 第 ${d}`);return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a><section class="action section"><div class="card"><p class="eyebrow">第 ${d} · 週 ${w}</p><h1>今天的行動</h1><p class="lead">${esc(text)}</p><label class="checkbox"><input id="actionCheck" type="checkbox" ${done?'checked':''}><span>我完成了這項行動——或至少真誠地嘗試了。</span></label><button class="btn primary" onclick="saveAction(${w},${d})">${done?'已儲存 ✓':'儲存今天的進度'}</button></div><aside class="grid"><div class="card"><p class="eyebrow">記住</p><h2>一個小行動就夠了。</h2><p class="muted">如果今天很混亂，就回到下一個正常選擇，不需要重新開始。</p></div><div class="card"><p class="eyebrow">相關內容</p><a class="btn soft" href="#/lesson/${w}/${Math.min(5,d)}">開啟課程 →</a></div></aside></section></div>`}
function saveAction(w,d){state.actions[key('a',w,d)]=document.getElementById('actionCheck').checked;save();toast('進度 saved');render()}
function checkin(w){const x=weeks[w-1],ex=state.reviews[w]||{rating:0,note:''};setTop(`第 ${w} · 回顧`);return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a><section class="card check section"><p class="eyebrow">週 ${w} REVIEW</p><h1>停下來．觀察．調整</h1><p class="lead">There is no score to pass. Use a minute to capture what worked and what you want to repeat.</p><div class="field" style="margin-top:24px"><label>這週感覺如何？</label><div class="rating">${[1,2,3,4,5].map(n=>`<button class="rate ${ex.rating===n?'sel':''}" onclick="rate(${n})">${n}</button>`).join('')}</div></div><div class="field"><label for="reviewNote">什麼有效、什麼困難，以及你接下來要重複什麼？</label><textarea id="reviewNote" rows="7" placeholder="寫下幾句真實的感受……">${esc(ex.note||'')}</textarea></div><button class="btn primary" style="margin-top:15px" onclick="saveReview(${w})">儲存每週回顧</button></section></div>`}
let chosen=0;function rate(n){chosen=n;document.querySelectorAll('.rate').forEach(x=>x.classList.remove('sel'));event.target.classList.add('sel')}
function saveReview(w){state.reviews[w]={rating:chosen||state.reviews[w]?.rating||0,note:document.getElementById('reviewNote').value};save();toast('第ly check-in saved');render()}
function progress(){setTop('進度');const s=stats();return `<div class="page"><p class="eyebrow">你的進度</p><section class="progressHero"><div><h1>保持前進的節奏。</h1><p>${s.done} 個已完成步驟，持續在你的 90 天系統中前進。</p><div class="track"><i style="width:${s.pct}%"></i></div></div><div class="big">${s.pct}%</div></section><section class="section"><div class="stats"><div class="card stat"><b>${s.l}/60</b><span>課程</span></div><div class="card stat"><b>${s.a}/84</b><span>每日行動</span></div><div class="card stat"><b>${s.r}/12</b><span>每週回顧</span></div></div></section><section class="section"><p class="eyebrow">每週進度</p><h2>你的完整旅程</h2><div class="grid" style="margin-top:14px">${weeks.map(w=>{let l=w.lessons.filter((_,i)=>state.lessons[key('l',w.week,i+1)]).length,a=w.daily_actions.filter((_,i)=>state.actions[key('a',w.week,i+1)]).length,p=Math.round((l+a+(state.reviews[w.week]?1:0))/13*100);return `<a class="weekrow" href="#/week/${w.week}"><span class="weekno">週 ${String(w.week).padStart(2,'0')}</span><div><h3>${esc(w.title)}</h3><p>${l}/5 課程 · ${a}/7 行動 · ${state.reviews[w.week]?'已完成回顧':'尚未回顧'}</p></div><span class="tag ${p===100?'current':''}">${p===100?'完成':p+'%'}</span></a>`}).join('')}</div></section></div>`}
function bonus(){setTop('加值資源庫');return `<div class="page"><p class="eyebrow">加值資源庫</p><h1 class="display">把真正有用的工具放在手邊。</h1><p class="lead">五份實用資源，專為你需要快速答案的時刻設計，而不是再上一堂長課。</p><section class="section grid g3">${bonuses.map((b,i)=>`<article class="bonus"><div class="num">BONUS ${String(i+1).padStart(2,'0')}</div><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p><button class="btn soft" onclick="openBonus(${i})">查看資源 →</button></article>`).join('')}</section></div>`}
function openBonus(i){toast(bonuses[i][0]+' opened — resource preview ready')}
function completion(){setTop('我的健康行動手冊');const pb=state.playbook||{};const s=stats();return `<div class="page"><section class="card completion section"><div class="seal">✓</div><p class="eyebrow" style="margin-top:20px">你的長期系統</p><h1>${s.pct>=90?'恭喜你——你已建立自己的健康行動手冊。':'你的健康行動手冊正在成形。'}</h1><p class="lead">把真正有效的方法整理成個人系統，讓你在 90 天之後也能持續使用。</p></section><section class="section playgrid"><div class="card"><p class="eyebrow">飲食規則</p><h2>我的 3 條規則</h2><div class="grid"><input id="rule1" value="${esc(pb.rule1||'')}" placeholder="規則 1"><input id="rule2" value="${esc(pb.rule2||'')}" placeholder="規則 2"><input id="rule3" value="${esc(pb.rule3||'')}" placeholder="規則 3"></div></div><div class="card"><p class="eyebrow">預設選擇</p><h2>我的常用餐點</h2><textarea id="meals" rows="8" placeholder="早餐／午餐／晚餐預設選擇……">${esc(pb.meals||'')}</textarea></div><div class="card"><p class="eyebrow">活動</p><h2>我的最低活動量</h2><textarea id="movement" rows="6" placeholder="平常一週我可以重複的活動……">${esc(pb.movement||'')}</textarea></div><div class="card"><p class="eyebrow">重整流程</p><h2>我的每週回顧</h2><textarea id="review" rows="6" placeholder="我什麼時候回顧？會問自己什麼？">${esc(pb.review||'')}</textarea></div></section><button class="btn primary" style="margin-top:18px" onclick="savePlaybook()">儲存我的健康行動手冊</button></div>`}
function savePlaybook(){state.playbook={rule1:rule1.value,rule2:rule2.value,rule3:rule3.value,meals:meals.value,movement:movement.value,review:review.value};save();toast('行動手冊已儲存')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function landing(){return `<div class="landing"><header class="landing-nav"><a class="brand" href="/"><span class="logo">90</span><span><b>90 天健康重整</b><small>控糖與體重</small></span></a><a class="btn primary" href="/dashboard">開始</a></header><main><section class="landing-hero"><div><p class="eyebrow">90-DAY PRACTICAL HEALTH RESET</p><h1>小小的選擇。<br>持續的行動。<br>真正的改變。</h1><p class="landing-lead">一套為真實生活設計的 90 天飲食與生活習慣系統。特別為外食、忙碌工作與沒有時間複雜計算的人設計。</p><div class="price">US$19 <span>— 一次付款・一次購買</span></div><a class="btn primary bigbtn" href="/dashboard">開始我的 90 天重整 →</a><a class="btn outline bigbtn" href="#learn">查看 12 週內容 ↓</a><p style="font-size:12px;color:var(--muted);margin-top:18px">教育用途，不提供診斷、治療或個人化醫療建議。</p></div><div class="editorial-visual"><div class="img mainimg"><img src="assets/meal.jpg" alt="均衡餐盤"><div class="editorial-quote">Small choices.<br>Consistent actions.</div><div class="caption">均衡餐盤<small>吃得簡單・吃得平衡</small></div></div><div class="img"><img src="assets/movement.jpg" alt="簡單活動"><div class="caption">保持活動<small>Simple Movement</small></div></div><div class="img"><img src="assets/learning.jpg" alt="學習與成長"><div class="caption">學習與成長<small>Learn Clearly</small></div></div></div></section><section class="landing-section" id="learn"><p class="eyebrow">WHY THIS WORKS</p><h2>不是另一套嚴格飲食規則。</h2><p>真正困難的是早餐店、餐廳、便利商店、加班、聚餐、旅行與壓力下的每一次選擇。這套系統把健康習慣拆成你真的能做到的小步驟。</p><div class="editorial-grid"><div class="tile"><img src="assets/simple.jpg" alt="生活平衡"><span>生活保持平衡<small>LIVE BALANCED</small></span></div><div class="tile"><img src="assets/movement.jpg" alt="簡單活動"><span>簡單活動<small>STAY ACTIVE</small></span></div><div class="tile"><img src="assets/learning.jpg" alt="學習"><span>清楚學習<small>LEARN CLEARLY</small></span></div><div class="tile"><img src="assets/balance.jpg" alt="平衡"><span>穩定前進<small>KEEP BALANCED</small></span></div></div><div class="feature-grid"><div><b>12 週</b><span>引導式微課程</span></div><div><b>84 個</b><span>每日行動</span></div><div><b>5 份</b><span>實用 Bonus 工具</span></div></div></section><section class="landing-section dark"><p class="eyebrow">學習 → 選擇 → 行動 → 追蹤 → 回顧 → 調整</p><h2>不是追求完美，而是建立你的下一個好選擇。</h2><p>從 GI 與碳水、均衡餐盤、食品標籤，到外食、便利商店、份量、簡單活動與壓力管理，12 週一步一步建立可持續的方法。</p><a class="btn" style="background:#fff;color:var(--g)" href="/dashboard">開始 90 天重整 →</a></section><section class="landing-section"><p class="eyebrow">完整內容</p><h2>一套可以帶進真實生活的 90 天系統。</h2><p>12 週課程、每週回顧、五份加值指南、90 天習慣追蹤器，以及最後的個人健康行動手冊。</p><a class="btn primary" href="/dashboard">立即開始 →</a></section></main><footer class="landing-foot">教育用途，不提供診斷、治療、治癒、預防或個別化醫療建議。</footer></div>`}

function render(){let path=location.pathname.replace(/\/+$/,'')||'/';let h=location.hash.replace(/^#/,'');if(h) path=h;let m=path.match(/^\/(?:week|weeks)\/(\d+)$/);if(m) path='/week/'+m[1];m=path.match(/^\/(?:lesson)\/(\d+)\/(\d+)$/);if(m) path='/lesson/'+m[1]+'/'+m[2];m=path.match(/^\/(?:action)\/(\d+)\/(\d+)$/);if(m) path='/action/'+m[1]+'/'+m[2];m=path.match(/^\/(?:checkin)\/(\d+)$/);if(m) path='/checkin/'+m[1];let v;if(path==='/')v=landing();else if(path==='/dashboard')v=dashboard();else if(/^\/week\/\d+$/.test(path))v=week(+path.split('/')[2]);else if(/^\/lesson\/\d+\/\d+$/.test(path)){let q=path.split('/');v=lesson(+q[2],+q[3]);}else if(/^\/action\/\d+\/\d+$/.test(path)){let q=path.split('/');v=action(+q[2],+q[3]);}else if(/^\/checkin\/\d+$/.test(path))v=checkin(+path.split('/')[2]);else if(path==='/progress')v=progress();else if(path==='/bonus')v=bonus();else if(path==='/completion')v=completion();else v=landing();document.getElementById('view').innerHTML=v;document.querySelectorAll('[data-nav]').forEach(a=>{let r=path.split('/')[1]||'dashboard';a.classList.toggle('active',a.dataset.nav===r)});}

window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');render();
</script></body></html>
