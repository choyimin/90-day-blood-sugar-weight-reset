/* Editorial Wellness visual restoration */
.landing{background:var(--cream);color:var(--ink)}
.landing-nav{max-width:1240px;margin:auto;height:82px;padding:0 32px;background:transparent;border-bottom:0}
.landing-nav .brand{display:flex;gap:12px;align-items:center}
.landing-nav .brand .logo{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 13px Inter}
.landing-nav .brand b{display:block;font:500 22px Georgia,"Noto Serif TC",serif;color:var(--g)}
.landing-nav .brand small{display:block;color:var(--sage);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.landing-hero{max-width:1240px;margin:auto;padding:48px 32px 72px;display:grid;grid-template-columns:.9fr 1.1fr;gap:54px;align-items:stretch}
.landing-hero h1{font:500 clamp(48px,5.6vw,76px)/.98 Georgia,"Noto Serif TC",serif;letter-spacing:-2px;color:var(--g);margin:18px 0 24px}
.landing-lead{font-size:18px;line-height:1.75;color:#56615b;max-width:590px}

.editorial-visual .img img{width:100%;height:100%;object-fit:cover;display:block}
.editorial-visual .mainimg{grid-row:1 / span 2}
.editorial-visual .caption{position:absolute;left:16px;bottom:14px;color:#fff;font:500 20px Georgia,serif;text-shadow:0 1px 10px #0008}
.editorial-visual .caption small{display:block;font:11px Inter,sans-serif;letter-spacing:1px;margin-top:3px}
.editorial-quote{position:absolute;right:18px;top:16px;background:rgba(250,248,245,.9);padding:12px 15px;border-radius:12px;color:var(--g);font:16px Georgia,serif;max-width:180px}
.price{font:500 30px Georgia,serif;color:var(--g);margin:26px 0}
.price span{font:14px Inter,system-ui,sans-serif;color:var(--muted)}
.bigbtn{padding:15px 22px;border-radius:999px;margin:5px 8px 5px 0}
.landing-section{padding:82px 32px;text-align:center;max-width:1240px;margin:auto}
.landing-section h2{font:500 46px/1.12 Georgia,"Noto Serif TC",serif;color:var(--g);margin:12px auto 18px;max-width:900px}
.landing-section p{font-size:17px;line-height:1.75;color:var(--muted);max-width:820px;margin:0 auto 28px}
.editorial-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:42px;text-align:left}

.editorial-grid .tile img{width:100%;height:100%;object-fit:cover;display:block}
.editorial-grid .tile span{position:absolute;left:16px;bottom:14px;color:#fff;font:500 22px Georgia,serif;text-shadow:0 1px 10px #0008}
.editorial-grid .tile small{display:block;font:10px Inter,sans-serif;letter-spacing:1.5px;margin-top:4px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.feature-grid div{padding:32px;border-right:1px solid var(--line)}
.feature-grid div:last-child{border-right:0}
.feature-grid b{display:block;font:500 36px Georgia,serif;color:var(--g)}
.feature-grid span{display:block;color:var(--muted);margin-top:6px}
.landing-section.dark{max-width:none;background:var(--g);color:#fff}
.landing-section.dark h2{color:#fff}.landing-section.dark p{color:#d9e3dd}

function stats(){let l=0,a=0,r=0;weeks.forEach(w=>{w.lessons.forEach((_,i)=>l+=!!state.lessons[key('l',w.week,i+1)]);w.daily_actions.forEach((_,i)=>a+=!!state.actions[key('a',w.week,i+1)]);r+=!!state.reviews[w.week]});let done=l+a+r;return{l,a,r,done,pct:Math.round(done/(60+84+12)*100)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

span><div><h3>${esc(w.title)}</h3><p>${esc(w.outcome)}</p></div><span class="tag ${w.week===current?'current':''}">${w.week===current?'Current':'Open'}</span></a>`).join('')}</div></section></div>`}

<span class="checkcircle">${d?'✓':'→'}</span></a>`}).join('')}</div></section><section class="section"><p class="eyebrow">DAILY ACTION</p><h2>7 天真實生活練習</h2><div class="grid" style="margin-top:14px">${w.daily_actions.map((t,i)=>{let d=!!state.actions[key('a',n,i+1)],steps=c.actions[i].steps;return `<a class="lesson ${d?'done':''}" href="#/action/${n}/${i+1}"><div><small>DAY ${i+1} · ${steps.length} STEPS</small><h3>${esc(t)}</h3><span class="muted">${esc(steps[0])}</span></div><span class="checkcircle">${d?'✓':'→'}</span></a>`}).join('')}</div></section><section class="section"><div class="card challenge row"><div><p class="eyebrow">REAL-LIFE CHALLENGE</p><h2>${esc(c.challenge.title)}</h2><p class="muted">${esc(c.challenge.prompt)}</p></div><a class="btn primary" href="#/challenge/${n}">開始挑戰 →</a></div></section><section class="section"><div class="card row"><div><p class="eyebrow">FLEX DAY</p><h2>把本週能力帶進不可預測的一天。</h2><p class="muted">情境：${c.flex.map(esc).join(' · ')}</p></div><a class="btn soft" href="#/flex/${n}">開啟 Flex Day →</a></div></section><section class="section"><div class="card row"><div><p class="eyebrow">WEEKLY REVIEW</p><h2>停下來．觀察．調整</h2><p class="muted">記下什麼有效、哪裡卡住，以及下週值得保留的一件事。</p></div><a class="btn primary" href="#/checkin/${n}">${rd?'已完成回顧 ✓':'開始每週回顧 →'}</a></div></section></div>`}
const lessonRichOverrides={"2-1":{"why":"碳水化合物是許多日常食物中的主要營養素，會在消化後提供葡萄糖作為能量。對控糖來說，重點不是把碳水全部拿掉，而是學會辨認來源、品質與份量。","example":"白飯、麵、吐司、燕麥、地瓜、水果、豆類與乳品都可能含有碳水。真正需要練習的是：同樣一餐裡，你的碳水來自什麼，以及它旁邊還有什麼。","judge":["這份食物主要提供什麼碳水來源？","它是較完整、含纖維的來源，還是高度精製？","這份量放進整餐後，是否仍符合我的需要？"],"do":["列出今天一餐中的所有主要碳水食物。","圈出其中一個主要來源。","判斷它較接近完整來源還是精製來源。","看看這餐是否同時有蛋白質與蔬菜／纖維。","寫下一個你願意保留或改善的選擇。"],"cta":"今天就做：辨認你這一餐的碳水來源。","tip":"不要把「有碳水」等同於「不健康」；先學會分辨。","observe":"今天吃飯時，刻意把碳水來源一一辨認出來，而不是只用「飯、麵、甜食」做模糊分類。"},"2-2":{"why":"知道 GI 的意義之後，真正有用的是把它變成選擇方法：在相似食物中優先找較低 GI、較少精製、含纖維的碳水，再用蛋白質把整餐組完整。","example":"同樣要吃主食，可以比較燕麥、豆類、全穀與較精製的早餐穀物；如果這餐再搭配蛋、魚、雞肉、豆腐或無糖乳品，就不是只在挑一個 GI 數字，而是在設計整餐。","judge":["這兩個碳水選項相比，哪個較少精製、纖維較多或 GI 較低？","我有沒有一個明確的蛋白質來源可以一起吃？","這個選擇的份量與整餐搭配是否適合我？"],"do":["找兩種你常吃的碳水食物。","比較它們的加工程度、纖維與可取得的 GI 資訊。","選出較適合日常的版本。","替它加上一個蛋白質來源，例如蛋、魚、雞肉、豆腐或無糖乳品。","記下這個組合是否容易在日常重複。"],"cta":"今天練習：選較好的碳水，再配一個蛋白質來源。","tip":"低 GI 是選擇線索，不是唯一標準；蛋白質、纖維、份量與整餐仍要一起看。","observe":"今天看到主食時，不只問「它是什麼」，而是比較哪個版本較少精製、纖維較多，再想一個蛋白質搭配。"},"2-3":{"why":"GI 描述的是血糖上升速度的相對差異，不代表你吃了多少碳水。控糖時，食物的種類與實際份量都重要。","example":"一種食物即使 GI 較低，如果一次吃下很大的份量，仍可能攝取不少碳水。因此「低 GI」不能被理解成可以無限量吃。","judge":["我實際吃了多少？","這個份量提供多少碳水？","如果份量增加，我的判斷還會一樣嗎？"],"do":["選一種你常吃的低 GI 或較完整主食。","先估計平常份量。","再比較半份、正常份量與大份量的差異。","把份量放回整餐看，而不是單看主食。","記下你最容易接受的份量。"],"cta":"今天就做：同時看「食物品質」與「吃多少」。","tip":"低 GI 不等於可以忽略份量。","observe":"今天遇到低 GI 食物時，同時注意你吃了多少，避免把低 GI 誤解成不限量。"},"2-4":{"why":"一餐不是單一食物。碳水和蛋白質、蔬菜與纖維一起出現時，整體的飽足感與餐後血糖反應可能與單獨吃大量精製碳水不同。學會搭配，比追求單一「神奇食物」更實用。","example":"白飯配魚、豆腐和大量蔬菜，和只吃一大份白飯，是完全不同的餐型。你不需要放棄飯，而是學會替它找到合適的搭配。","judge":["這餐的主要碳水是什麼？","蛋白質在哪裡？蔬菜或其他纖維在哪裡？","如果只能補一樣，哪一樣最能讓這餐更完整？"],"do":["選今天一餐。","指出主要碳水來源。","指出蛋白質來源。","加入一份蔬菜或其他高纖食物。","記下搭配後的飽足與滿足感。"],"cta":"今天就做：替一份碳水找到蛋白質與纖維夥伴。","tip":"不要只問「能不能吃飯」，改問「這餐怎麼組合更好？」","observe":"今天把一份主食放回整餐，直接觀察蛋白質、蔬菜與碳水如何組成一個完整餐盤。"},"2-5":{"why":"更好的碳水選擇不是尋找「零碳水」，而是優先選擇較少精製、保留較多纖維、份量也適合自己的來源。這能讓控糖變成可長期執行的選擇，而不是短期禁令。","example":"把白麵包換成全穀吐司、把甜點式早餐改成燕麥加蛋白質，或在主食中選擇豆類、地瓜、糙米等，都是「改善品質」而不是「完全不吃」。","judge":["我有沒有一個較少精製、纖維較高的替代品？","這個替代品我真的吃得習慣嗎？","份量和整餐搭配是否合理？"],"do":["挑一個你常吃的精製碳水。","找一個你買得到、也願意吃的較完整替代品。","比較兩者的纖維與加工程度。","決定今天是否實際替換。","記下這個選擇能否成為你的日常版本。"],"cta":"今天就做：把一個精製碳水換成你真正喜歡的較完整版本。","tip":"最好的替代品，是你願意長期吃的那一個。","observe":"今天在兩個主食選項之間，實際比較加工程度、纖維與份量，而不是只看「健康」標籤。"},"3-1":{"why":"餐盤法把複雜的營養問題轉成一個吃飯時看得到的結構：蔬菜、蛋白質與含碳水食物各有位置。它不是精準計算，而是幫你在真實生活快速組餐。","example":"看到便當時，不必先算所有營養素；先找蔬菜、蛋白質，再看主食份量。這個順序能讓你在外食也有一個簡單的判斷框架。","judge":["餐盤裡蔬菜、蛋白質、碳水各在哪裡？","哪一區明顯不足？","我只調整一個區塊，能不能讓整餐更完整？"],"do":["選今天一餐。","先找蛋白質。","再找非澱粉蔬菜。","最後看主食份量。","只調整一個最缺的區塊。"],"cta":"今天就做：用餐盤結構看一餐。","tip":"餐盤法是視覺工具，不需要每餐做到完美比例。","observe":"今天看一盤真實食物，先找蔬菜、蛋白質與碳水各自的位置。"},"3-2":{"why":"蛋白質能幫助維持肌肉，也通常有助於增加飽足感。對一餐設計來說，先確認有明確蛋白質來源，是比只盯著主食更實用的做法。","example":"雞蛋、魚、雞肉、瘦肉、豆腐、無糖豆漿、希臘優格等都可以成為蛋白質來源；外食時，先找到主菜或豆製品，再處理其他部分。","judge":["這餐的蛋白質來源在哪裡？","份量是否足以成為一餐的明確主體之一？","如果沒有，我最方便補上的選項是什麼？"],"do":["選一餐。","指出蛋白質來源。","估計大約份量。","想一個更方便的替代來源。","把它記成你的常用蛋白質清單。"],"cta":"今天就做：每餐先找到蛋白質。","tip":"蛋白質不是配角；它可以成為組餐的起點。","observe":"今天每餐先找出明確的蛋白質來源，再決定其他食物怎麼搭。"},"3-3":{"why":"纖維能增加食物體積與飽足感，也會影響碳水消化與餐後血糖反應。學會增加纖維，是比單純「少吃」更有建設性的控糖策略。","example":"蔬菜、豆類、全穀、燕麥、堅果與部分水果都能提供纖維。實際做法不必一次大幅增加，而是從一餐多加一個高纖來源開始。","judge":["這餐目前的纖維來源在哪裡？","我能不能增加一份蔬菜、豆類或完整穀物？","這個增加方式會不會讓我太難執行？"],"do":["選一餐。","找出目前的纖維來源。","增加一份蔬菜、豆類或其他高纖食物。","維持原本合理的主食，不需要額外補償。","記下增加後的飽足感。"],"cta":"今天就做：替一餐加上一個纖維來源。","tip":"從一個小增加開始，比突然改變整天飲食更容易。","observe":"今天觀察一餐的纖維從哪裡來，以及增加一份後餐盤有什麼不同。"},"3-4":{"why":"非澱粉類蔬菜能提供纖維、微量營養素與體積，通常可以用來增加餐盤的豐富度，同時不需要大量增加精製碳水。","example":"葉菜、花椰菜、菇類、番茄、小黃瓜、青椒等都可以。外食時，即使只有一小份燙青菜或配菜，也比完全沒有更容易開始。","judge":["這餐有沒有非澱粉蔬菜？","哪一種是我最容易取得與接受的？","我能增加多少而不讓這餐變得難以執行？"],"do":["選一餐。","找出非澱粉蔬菜。","如果沒有，選一份最容易取得的。","先吃幾口再正常進餐。","記下你願意重複的蔬菜選擇。"],"cta":"今天就做：讓一餐出現一份非澱粉蔬菜。","tip":"不用追求種類很多；先讓它穩定出現在餐盤裡。","observe":"今天刻意找出非澱粉蔬菜，看看它在外食餐盤裡是否真的有位置。"},"3-5":{"why":"前四天學的是餐盤的不同零件，今天要把它們組成一個真正吃得下去的餐。真正有效的方法必須同時符合營養、口味、時間與預算。","example":"你可能只有便利商店、公司餐廳或外送可以選。這時不是重新設計理想食譜，而是從現有選項裡找到蛋白質、蔬菜與適合的碳水。","judge":["我現在有哪些真實可用的食物？","哪個區塊最缺？","怎麼調整後，我仍然會想吃、買得起、做得到？"],"do":["先列出手邊三到五個食物。","找出蛋白質。","找出蔬菜或纖維。","決定主食與份量。","完成後記下這份餐是否能再次複製。"],"cta":"今天就做：用現有食物組出一頓均衡餐。","tip":"好餐不是拍照用的；是你下週還能做出來的餐。","observe":"今天不用理想菜單，直接用手邊食物完成一頓完整餐。"},"4-1":{"why":"食品標籤上的「每份量」是理解後面所有數字的起點。標籤上的碳水、糖、纖維與蛋白質通常都是以一份為基準；你實際吃的可能不只一份。","example":"一包零食標示每份 30 克、每包有兩份。如果你吃完整包，標籤上的數字就不能直接當成你的實際攝取量。","judge":["包裝寫幾份？","我實際會吃幾份？","如果我吃完整包，後面的數字要不要乘上份數？"],"do":["拿一個你常吃的包裝。","找出每份量。","找出一包共有幾份。","估計自己通常吃幾份。","把這個份數寫下來。"],"cta":"今天就做：先學會看懂「一份」到底是多少。","tip":"不先看份量，後面的數字很容易被誤讀。","observe":"今天拿一個包裝，先確認「一份」和「整包」是不是同一件事。"},"4-2":{"why":"對控糖來說，「總碳水化合物」通常比只看「糖」更有資訊價值，因為澱粉、糖與其他可消化碳水都可能影響血糖。","example":"一片吐司可能寫糖很少，但總碳水仍可能不低，因為主要來源是澱粉。只看糖，可能低估這份食物的碳水。","judge":["總碳水是多少？","每份量是多少，我實際吃幾份？","這個數字放進整餐後是否仍符合我的需要？"],"do":["找一個包裝食品。","圈出總碳水化合物。","確認每份量。","估算實際吃幾份。","把結果和整餐的其他碳水一起看。"],"cta":"今天就做：在標籤上先找到「總碳水化合物」。","tip":"不要只被「糖 0」或「低糖」吸引；先看總碳水。","observe":"今天不要只看糖，直接在標籤上找到總碳水化合物。"},"4-3":{"why":"添加糖是食品製造或調理過程中另外加入的糖，了解它能幫助你辨認飲料、甜點與加工食品中容易被忽略的糖來源。","example":"早餐穀片可能同時有天然食材與添加糖；含糖飲料則可能在沒有飽足感的情況下提供大量糖。標籤能讓你把「感覺很健康」變成可比較的資訊。","judge":["這項食品有沒有添加糖？","每份是多少，我會吃幾份？","它是否值得用在我的日常，還是更適合偶爾？"],"do":["找一個你常買的包裝食品。","找到添加糖欄位。","記下每份數值。","比較另一個相似產品。","選出你更願意常用的一個。"],"cta":"今天就做：用添加糖比較兩個相似產品。","tip":"不是所有糖都需要恐懼；重點是知道來源與整體攝取。","observe":"今天比較兩個相似食品的添加糖，看看包裝上的健康形象與數字是否一致。"},"4-4":{"why":"食品標籤上的纖維能幫助你比較同類食品的完整程度。對日常控糖來說，纖維也是把「品質」從模糊感覺變成可比較資訊的一個線索。","example":"同樣是麵包，兩個產品的總碳水可能相近，但纖維差異很大。把纖維一起看，能避免只用「糖低不低」做判斷。","judge":["每份纖維是多少？","同類產品相比，哪一個纖維較高？","這個選擇在價格、口味與可取得性上是否適合我？"],"do":["挑兩個同類產品。","找出纖維數值。","比較每份量是否相同。","再看總碳水與蛋白質。","選一個你真的願意使用的版本。"],"cta":"今天就做：用纖維比較兩個同類食品。","tip":"數字要放回整個產品看，不要只追求單一最高值。","observe":"今天用纖維比較兩個同類食品，而不是只看熱量或糖。"},"4-5":{"why":"完整閱讀標籤的目的不是讓你變成營養分析師，而是建立固定順序：份量 → 總碳水 → 添加糖 → 纖維 → 蛋白質。","example":"在超市拿兩個相似產品，依同一順序看五項資訊，你會比只看包裝正面的「低糖」「高纖」更容易做出穩定比較。","judge":["實際份量和標示份量一致嗎？","總碳水與添加糖怎麼看？","纖維與蛋白質是否支持我的整餐需求？"],"do":["拿一項食品。","先看每份量與份數。","再看總碳水與添加糖。","再看纖維與蛋白質。","用這五項資訊做出一次購買決定。"],"cta":"今天就做：完成一次五項標籤掃描。","tip":"建立固定閱讀順序，比記住一堆營養數字更實用。","observe":"今天依固定順序掃一次完整標籤，讓閱讀變成一個可複製的流程。"},"5-1":{"why":"早餐不必被神化，但對很多人來說，它是每天第一個可以預先設計的餐。若早餐常常只有精製碳水或含糖飲料，加入蛋白質與纖維可能讓整餐更有結構。","example":"早上只有甜麵包加含糖飲料，到了上午很快又餓；另一種做法是蛋、無糖豆漿、燕麥或全穀吐司搭配水果，讓早餐更完整。","judge":["我早餐通常有哪些碳水？","蛋白質與纖維在哪裡？","我能固定一個最容易做到的早餐組合嗎？"],"do":["回想三天早餐。","找出最常出現的碳水來源。","找出蛋白質與纖維是否不足。","設計一個更完整但不複雜的版本。","明天實際使用一次。"],"cta":"今天就做：設計一個你明天能重複的早餐。","tip":"早餐策略的重點是可重複，不是「完美早餐」。","observe":"今天把早餐拆成碳水、蛋白質與纖維三部分，看看最常缺哪一塊。"},"5-2":{"why":"早餐最常見的問題不是「吃早餐」本身，而是選擇太偏向精製澱粉、含糖飲料，或份量不足導致很快又餓。辨認陷阱後，只改最關鍵的一件事。","example":"早餐店的奶茶＋菠蘿麵包、飯糰配含糖飲料，或只喝咖啡到中午，都可能讓早餐缺少蛋白質、纖維或足夠的整體結構。","judge":["這份早餐的主要碳水是什麼？","有沒有蛋白質？飲料是否增加額外糖？","只改一件事，哪個最有影響又最容易？"],"do":["選一個你常吃的早餐。","指出主要碳水。","找出蛋白質缺口。","檢查飲料是否含糖。","只做一項改善並記錄。"],"cta":"今天就做：找出你的早餐最大陷阱。","tip":"一次改一件事，才能知道什麼真的有用。","observe":"今天拿自己的真實早餐，找出最影響整餐品質的一個早餐陷阱。"},"5-3":{"why":"早餐加入蛋白質與纖維，是把「吃一點就過去」變成更完整餐型的簡單公式。它也讓你有更多食物選擇，而不是只能依賴麵包或甜飲。","example":"蛋＋全穀吐司＋無糖豆漿＋一份水果，或無糖優格＋燕麥＋堅果＋水果，都可以依你的飲食習慣調整。","judge":["蛋白質來源是什麼？","纖維來源是什麼？","碳水份量是否仍符合整餐需求？"],"do":["選一個早餐。","加一個蛋白質來源。","加一個纖維來源。","保留適量你喜歡的碳水。","吃完記下飽足與滿意度。"],"cta":"今天就做：用「蛋白質＋纖維＋適量碳水」組早餐。","tip":"公式是幫助你選擇，不是固定菜單。","observe":"今天實際組一份「蛋白質＋纖維＋適量碳水」早餐。"},"5-4":{"why":"忙碌時真正需要的是一套能在便利商店或早餐店使用的快速判斷法，而不是理想食譜。先找蛋白質，再找蔬菜／纖維，最後選主食與飲料。","example":"便利商店可以用茶葉蛋、無糖豆漿、沙拉、地瓜或全穀類等組合；早餐店則可以優先找蛋、蔬菜與較不精製的主食，再調整飲料。","judge":["我現在有哪些可取得的蛋白質？","有沒有蔬菜、豆類、全穀或其他纖維？","飲料與主食怎麼選，才能符合今天情境？"],"do":["走進便利商店或早餐店。","先找蛋白質。","再找纖維或蔬菜。","選主食與飲料。","把這組合記成你的快速備案。"],"cta":"今天就做：完成一次「便利早餐組合」。","tip":"方便不是敵人；把方便變成更好的選項。","observe":"今天在早餐店或便利商店，用同一套順序完成一次快速選擇。"},"5-5":{"why":"真正有價值的早餐公式，是在不同情境都能快速套用的規則，例如「蛋白質＋纖維＋適量碳水＋無糖飲品」。它能降低每天重新思考的成本。","example":"在家可以是蛋＋燕麥＋水果；上班途中可以是茶葉蛋＋無糖豆漿＋地瓜；週末則可以調整成喜歡的版本。","judge":["這個公式包含蛋白質嗎？","有纖維與適量碳水嗎？","我能在家、外食與忙碌日都找到對應版本嗎？"],"do":["寫出你的早餐公式。","建立在家版。","建立外食版。","建立最忙碌時的備案。","選出明天的第一順位。"],"cta":"今天就做：完成你的三版本早餐公式。","tip":"好的公式不是限制選擇，而是讓你更快找到選擇。","observe":"今天把早餐變成三個固定公式，分別對應在家、外食與最忙的早晨。"},"6-1":{"why":"外食控糖的核心不是找到「完美餐廳」，而是在選項有限時仍能快速抓住幾個關鍵：蛋白質、蔬菜／纖維、主食份量與飲料。","example":"看到便當、麵店或自助餐時，先看整餐有哪些組成，再決定最值得調整的一項。這比打開菜單後一直搜尋「最低熱量」更容易執行。","judge":["這餐最明顯的蛋白質在哪裡？","蔬菜／纖維是否足夠？","主食與飲料哪一項最值得先調整？"],"do":["打開今天的菜單。","先找蛋白質。","再找蔬菜或纖維。","決定主食份量。","最後決定飲料並記下理由。"],"cta":"今天就做：用四步驟完成一次外食選擇。","tip":"外食的目標是做出更好的決定，不是追求零風險。","observe":"今天面對外食菜單時，按照蛋白質→蔬菜／纖維→主食→飲料的順序判斷。"},"6-2":{"why":"早餐店常見選項包含精製澱粉、加工肉品與含糖飲料；但你不需要放棄早餐店，只要學會重新組合。","example":"例如蛋餅可以搭配蛋或無糖豆漿，飲料改無糖，並視情況增加蔬菜或水果；重點是看整餐，而不是只禁止某一道食物。","judge":["主食是什麼？","蛋白質是否明確？","飲料與額外醬料是否增加不必要的糖？"],"do":["看早餐店菜單。","先選蛋白質。","選一份主食。","飲料選無糖或不額外加糖。","記下你下次會複製的點餐方式。"],"cta":"今天就做：設計你的早餐店固定點餐法。","tip":"固定法讓你忙碌時也不用重新做一百次決策。","observe":"今天實際拆解一份早餐店餐點，看哪一項最值得先調整。"},"6-3":{"why":"速食不代表「整餐失敗」。在選項有限的情況下，先處理份量、蛋白質、蔬菜與飲料，就能把一次用餐變成可管理的選擇。","example":"漢堡套餐可以調整飲料與薯條份量，也可以選擇有蛋白質與蔬菜的品項。重點不是把速食貼成禁食，而是知道哪一項最值得調整。","judge":["蛋白質來源是什麼？","精製澱粉與油炸配菜的份量多大？","飲料能不能先改成無糖？"],"do":["選一間你會去的速食店。","找蛋白質主體。","看主食與配菜份量。","飲料優先選無糖。","記下最容易做到的一項調整。"],"cta":"今天就做：完成一次「速食也能選」的練習。","tip":"偶爾吃到速食不是失敗；沒有備案才容易讓一次變成放棄。","observe":"今天在速食店把蛋白質、配菜、主食與飲料分開看，再做一項最重要的調整。"},"6-4":{"why":"外送最大的挑戰是資訊多、時間少、份量常常偏大。建立固定順序，可以讓你在滑手機點餐時仍快速做決定。","example":"先選有蛋白質的主餐，再確認是否有蔬菜，接著看飯麵份量與飲料。若份量大，可以把一部分留到下一餐，而不是逼自己一次吃完。","judge":["菜單中哪個選項有清楚蛋白質？","蔬菜是否只是裝飾，還是有實際份量？","份量與飲料哪個最容易讓整餐超出需求？"],"do":["打開外送平台。","選蛋白質主餐。","加一份蔬菜或選有蔬菜的餐。","決定主食與飲料。","下單前再快速掃一次整餐。"],"cta":"今天就做：用固定順序完成一次外送點餐。","tip":"點餐前 30 秒的檢查，往往比吃完後自責更有價值。","observe":"今天點一次外送，先看整餐結構，再決定份量與飲料。"},"6-5":{"why":"社交場合不能完全照課本控制，真正需要的是在不破壞社交的前提下，抓住最重要的幾個選擇。","example":"聚餐時先吃蛋白質與蔬菜，再依喜好吃主食；甜點或酒水出現時，不需要把整桌都拒絕，只要知道自己最想享受哪一項。","judge":["這餐最值得我優先照顧的是什麼？","哪些食物是我真正想吃的，哪些只是跟著吃？","我能不能在享受社交的同時保留一個控糖選擇？"],"do":["聚餐前先決定一個優先原則。","到場後先看整桌。","選一個真正想吃的享受項目。","其他地方維持簡單。","餐後記下這個策略是否可重複。"],"cta":"今天就做：在一次聚餐中只守住一個核心原則。","tip":"成功不是拒絕所有食物，而是仍然保有選擇權。","observe":"今天在社交餐桌上選一個核心原則，不讓「大家都這樣吃」取代你的判斷。"},"7-1":{"why":"便利商店的優勢是選擇多、取得快；問題是高糖飲料、精製零食與即食餐容易讓人只靠包裝做決定。建立「先找主體、再補缺口」的方法更可靠。","example":"進店後不要先拿甜飲與麵包，而是先找蛋白質，再找蔬菜／纖維，最後補主食與飲料。","judge":["我先看到的是什麼？","這組合有蛋白質與纖維嗎？","如果缺一樣，店裡最容易補什麼？"],"do":["進便利商店前先決定要買一餐。","找蛋白質。","找蔬菜／纖維。","選主食。","最後選飲料並檢查整組。"],"cta":"今天就做：用「主體→缺口→飲料」逛一次便利商店。","tip":"不要被貨架順序決定你的餐盤。","observe":"今天進便利商店時，不按貨架順序買，而是先找一餐需要的核心組成。"},"7-2":{"why":"便利商店蛋白質不只是一種食物。茶葉蛋、即食雞胸、無糖豆漿、豆腐、原味優格等，都能讓你快速建立一餐的主體。","example":"如果你只買一個麵包，餐點的蛋白質可能不足；加上一個容易取得的蛋白質來源，就能讓組合更完整。","judge":["哪個選項提供明確蛋白質？","它是否同時含有大量添加糖或精製澱粉？","哪個選項最方便、價格也能接受？"],"do":["挑三個便利商店蛋白質。","比較它們的蛋白質與份量。","檢查是否有額外糖分。","選出最方便的兩個。","建立自己的蛋白質備案。"],"cta":"今天就做：建立你的便利商店蛋白質清單。","tip":"備案越清楚，忙碌時越不需要靠意志力。","observe":"今天比較三種便利商店蛋白質，建立自己的常用清單。"},"7-3":{"why":"即食蔬菜是把「知道要吃菜」變成真正做得到的方法。沙拉、毛豆、海帶、菇類或其他即食蔬菜，都可以視情況加入。","example":"你不一定有時間回家煮菜。便利商店的即食蔬菜雖然不完美，但可以成為比完全沒有蔬菜更容易執行的選擇。","judge":["這份餐目前缺蔬菜嗎？","哪種即食蔬菜最容易取得？","醬料與整體份量是否需要注意？"],"do":["挑一份即食餐。","找出蔬菜缺口。","加入一份即食蔬菜。","醬料依需求使用。","記下哪種蔬菜最方便。"],"cta":"今天就做：讓一份便利商店餐出現真正的蔬菜。","tip":"便利是工具，不必等到「完美食材」才開始。","observe":"今天在即食餐裡主動補一份蔬菜，觀察這個改變有多容易。"},"7-4":{"why":"飲料很容易在沒有明顯飽足感的情況下增加糖與碳水。學會先辨認含糖與無糖選項，是外食與便利商店最省力的控糖技巧之一。","example":"含糖茶飲、汽水、果汁與加糖咖啡都可能提供額外糖；水、無糖茶、黑咖啡等通常不提供這些額外糖。","judge":["這杯飲料有沒有添加糖？","我今天真的需要它的甜味嗎？","如果想喝有味道的飲料，有沒有無糖版本？"],"do":["看三個飲料選項。","找出含糖與無糖版本。","比較標示。","選一杯無糖或較少糖的版本。","記下你願意長期使用的飲料。"],"cta":"今天就做：完成一次飲料替換。","tip":"飲料是很小的決策，但每天重複就很有價值。","observe":"今天比較一個含糖飲料和一個無糖版本，直接看標示。"},"7-5":{"why":"便利商店真正要學的是「組餐」，不是背品牌。用蛋白質＋蔬菜／纖維＋適量碳水＋飲料的結構，你可以在不同店型快速組出一餐。","example":"例如雞胸或豆腐＋沙拉／毛豆＋地瓜或全穀飯糰＋無糖茶；實際組合依個人需求、份量與可取得性調整。","judge":["蛋白質在哪裡？","蔬菜／纖維在哪裡？","碳水與飲料是否符合今天的需求？"],"do":["用店內現有選項組一餐。","先放蛋白質。","再補蔬菜／纖維。","選適量碳水。","拍照或記錄成你的快速範本。"],"cta":"今天就做：建立一份你的便利商店標準餐。","tip":"把方法存下來，下次就能直接複製。","observe":"今天用便利商店現有食物組出一頓完整餐，並把它存成範本。"},"8-1":{"why":"食物品質重要，但實際吃多少同樣重要。份量會直接影響你從一餐得到的碳水、能量與其他營養素，因此「健康食物」也需要放回實際份量理解。","example":"燕麥、堅果、地瓜都可以是很好的食物，但如果份量遠超過自己的需要，整餐仍可能變得過多。","judge":["這份食物的實際份量是多少？","我是在餓的時候自然吃多，還是因為容器太大？","減少或增加一點後，滿足感會不會差很多？"],"do":["選一餐觀察份量。","先看原本盛多少。","吃到一半停一下。","判斷是否還需要。","記下最舒服的份量。"],"cta":"今天就做：觀察一次「我到底吃多少」。","tip":"份量不是懲罰，而是理解自己的工具。","observe":"今天在一餐中觀察「盛多少」與「實際吃多少」的差異。"},"8-2":{"why":"手掌估份量是一種外食時的快速視覺工具，不需要秤重。它可以幫你先估蛋白質、主食與脂肪類的相對份量，再依個人需求調整。","example":"沒有秤的便當店裡，可以用自己的手掌估一份蛋白質，用拳頭或餐盤比例估主食與蔬菜。重點是建立一致的參考，而不是追求毫米級精準。","judge":["我今天需要估的是哪一類食物？","這個估法能不能讓我在沒有秤時做一致判斷？","吃完後的飽足感是否支持這個份量？"],"do":["選一餐不用秤重。","用手掌估蛋白質。","用拳頭或視覺估主食。","看蔬菜是否足夠。","記下這套估法是否方便。"],"cta":"今天就做：不用秤，完成一次手掌估份量。","tip":"這是估算工具，不是醫療精準測量。","observe":"今天不用秤，直接用手掌與視覺估算一餐的份量。"},"8-3":{"why":"餐盤法把份量從數字轉成視覺：先確保蔬菜與蛋白質有位置，再看含碳水食物的比例。它特別適合外食與家庭用餐。","example":"同樣是一盤飯菜，如果蔬菜幾乎沒有、飯佔大半，和飯適量、蛋白質明確、蔬菜充足，整體結構就不同。","judge":["餐盤哪一區最大？","蔬菜與蛋白質是否有明確位置？","我只改變一個區塊，哪個最值得？"],"do":["拿一盤今天真的會吃的食物。","先找蔬菜。","再找蛋白質。","觀察碳水份量。","只調整一個區塊後再吃。"],"cta":"今天就做：用餐盤法調整一餐。","tip":"先建立結構，再談細節。","observe":"今天用餐盤法重新看一份真實外食，而不是只看單一食物。"},"8-4":{"why":"餐廳份量常常比在家更大，且套餐會把多種食物綁在一起。學會辨識份量，能讓你不用「吃光」才算完成一餐。","example":"一大碗麵、一份薯條或大型飲料，都可能比你平常需要的量大。可以選小份、分享、留下一部分，或把剩餘帶走。","judge":["這是我平常的份量，還是餐廳提供的份量？","我是否真的需要把整份吃完？","最容易過量的是主食、配菜還是飲料？"],"do":["選一份外食。","先辨認大份量來源。","決定是否小份或分食。","吃到中途停一次。","記下哪個調整最容易。"],"cta":"今天就做：在餐廳辨認一次「餐廳份量」。","tip":"你可以享受餐點，不必被餐盒大小決定。","observe":"今天特別留意餐廳提供的份量是否大於你平常需要的份量。"},"8-5":{"why":"份量最後要回到身體感受。學會在進食中停一下，能讓你知道自己是還餓、剛好，還是已經過飽，而不是只依賴「盤子還剩多少」。","example":"有些人吃飯很快，直到吃完才發現太撐；如果在餐中途停 20 秒，可能更早察覺自己的飽足程度。","judge":["現在的餓感與飽足感是多少？","我是在享受食物，還是在機械式吃完？","如果停止進食 5 分鐘，我還會想繼續嗎？"],"do":["選一餐。","餐前記錄餓感 0–10。","吃到一半停 20 秒。","餐後 20–30 分鐘記錄飽足 0–10。","寫下最有用的身體訊號。"],"cta":"今天就做：把一次進食變成「有停頓的進食」。","tip":"不是要求你少吃，而是讓你更早知道自己需要多少。","observe":"今天在進食中途停一次，觀察身體是否已經從餓轉向剛好或過飽。"},"9-1":{"why":"規律活動不只是為了消耗熱量。活動能支持心肺健康、肌力與日常功能，也與身體對胰島素的反應有關。對控糖來說，重點是建立可持續的活動習慣。","example":"你不一定要每天去健身房；餐後走路、通勤多走一段、短時間肌力訓練，都可以成為日常活動的一部分。","judge":["我目前最少可以增加哪一段活動？","哪種活動我願意持續？","如何讓活動靠近既有生活節點？"],"do":["列出一天中三個可活動時段。","選最容易的一段。","設定 5–15 分鐘的起點。","今天完成一次。","記下時間與感受。"],"cta":"今天就做：找一段你真的能持續的活動時間。","tip":"先建立頻率，再慢慢增加強度。","observe":"今天把活動看成一天中的多個小機會，而不是只有「正式運動」才算。"},"9-2":{"why":"走路是低門檻的活動方式，可以從很短的時間開始。對許多人來說，把走路放進餐後、通勤或休息時間，比安排完整運動課更容易持續。","example":"午餐後走 10 分鐘、晚餐後繞街區一圈、打電話時站起來走，都能把活動放進原本就存在的時間。","judge":["哪個生活節點最適合接上走路？","我今天能做到幾分鐘？","怎麼讓它不用額外準備？"],"do":["選一個既有節點。","設定 5–15 分鐘走路。","完成後記下實際時間。","感受身體狀態。","決定明天是否複製。"],"cta":"今天就做：把走路接在一個固定生活節點後面。","tip":"「什麼時候走」比「哪裡走」更重要。","observe":"今天把一段 5–15 分鐘的走路接到固定生活節點。"},"9-3":{"why":"長時間坐著是現代生活常見情境。規律起身、走動或伸展，可以讓一天的活動更分散，而不必全部集中在一次運動。","example":"工作 60–90 分鐘後起身裝水、走到另一個房間、做幾次簡單伸展，都是打斷久坐的方式。","judge":["我最常連續坐多久？","哪個工作流程可以自然提醒我起身？","我能否把短活動分散到一天？"],"do":["找出一段最長久坐時間。","設定一次起身提醒。","走動 2–5 分鐘。","回到工作前做簡單伸展。","記下哪個提醒最有效。"],"cta":"今天就做：主動打斷一次長時間久坐。","tip":"短而頻繁的活動也值得累積。","observe":"今天找出最長的一段久坐時間，主動插入一次短活動。"},"9-4":{"why":"肌力訓練能幫助維持與建立肌肉與功能。入門不需要複雜器材，可以從坐站、牆壁伏地挺身、抬腿等安全、可控制的動作開始。","example":"在家用椅子做坐站、靠牆做推牆，都是容易理解的動作。若有疼痛、受傷或特殊健康狀況，應先向專業人員確認適合的運動方式。","judge":["哪個動作我能安全完成？","今天做幾次或幾組仍能保持動作品質？","如何讓它每週重複而不是只做一次？"],"do":["選一個簡單動作。","先做低量測試。","保持慢、穩定的動作。","休息後再決定是否增加。","記下最適合你的版本。"],"cta":"今天就做：完成一次簡單、可控制的肌力練習。","tip":"品質優先；疼痛不是「努力的證明」。","observe":"今天完成一個安全、低量的肌力動作，重點放在控制與品質。"},"9-5":{"why":"最低活動量不是你的終極目標，而是「最忙的日子也能守住」的底線。它讓活動習慣不會因一次忙碌就完全中斷。","example":"例如把最低標準設定成每天 10 分鐘走路，或每週三次短肌力。真正數字要依你的能力、時間與醫療建議調整。","judge":["什麼標準在最忙時仍可完成？","它是否足夠小，讓我願意重新開始？","如果錯過一天，我的下一次活動是什麼時候？"],"do":["寫下你的最低活動量。","選固定觸發時間。","安排一個最忙版本。","今天完成最低版本。","把它寫進下週行程。"],"cta":"今天就做：定義你的「最低活動量」。","tip":"最低標準的價值是維持連續性，不是限制你的進步。","observe":"今天定義一個最忙時仍能完成的最低活動量。"},"10-1":{"why":"壓力會改變注意力、食慾與決策方式，也可能讓人更容易選擇方便、高糖或高脂食物。理解這個連結，不是替自己找藉口，而是找出更有效的介入點。","example":"加班後非常餓，桌上剛好有零食；此時你面對的不只是「意志力」，而是疲勞、時間壓力與食物可得性同時出現。","judge":["我是在餓，還是在壓力下想快速得到安慰？","目前最大的壓力來源是什麼？","我能先處理哪一個因素，再做食物決定？"],"do":["記錄一次壓力下的進食衝動。","分辨身體飢餓與壓力因素。","先做一個短暫降壓動作。","再決定是否吃與吃什麼。","記下這次決策是否改變。"],"cta":"今天就做：在一次壓力性進食前，先辨認真正的觸發因素。","tip":"理解觸發點，比責怪自己更能改變下一次。","observe":"今天遇到想吃東西的壓力時刻，先拆開「身體餓」與「情緒／環境」兩件事。"},"10-2":{"why":"情緒性飲食不是簡單的「沒自制力」。常見觸發包括壓力、無聊、孤單、疲累、獎勵感與環境提示。先辨認，才知道該改變什麼。","example":"每天晚上追劇時自動吃零食，可能不是因為真的餓，而是「沙發＋電視＋零食」形成固定連結。","judge":["當下的情緒是什麼？","身體真的有飢餓訊號嗎？","什麼環境或時間點最常觸發這個行為？"],"do":["回想一次情緒性進食。","寫下時間、地點與情緒。","記下身體餓感 0–10。","找出最明顯的環境提示。","選一個下次要先改變的觸發點。"],"cta":"今天就做：找到一個你的情緒性飲食觸發點。","tip":"不是禁止情緒，而是讓你多一個選擇。","observe":"今天回看一次情緒性進食，找出時間、情緒與環境三個線索。"},"10-3":{"why":"短暫暫停不是叫你忍住不吃，而是把「衝動出現」和「立刻行動」之間拉開一點距離。十分鐘足以讓你重新判斷當下需要。","example":"下午很想吃甜食時，先喝水、走動、深呼吸或處理一件小事；10 分鐘後再問自己是否仍想吃。","judge":["10 分鐘後我還餓嗎？","我真正想解決的是飢餓、壓力還是疲累？","如果決定吃，我能不能有意識地選擇份量？"],"do":["辨認一次想吃東西的衝動。","先設定 10 分鐘計時。","做一件簡單的替代活動。","時間到後重新評估。","依重新評估結果做決定並記錄。"],"cta":"今天就做：練習一次 10 分鐘暫停。","tip":"暫停不是禁止；最後仍由你決定。","observe":"今天在衝動與進食之間加入完整 10 分鐘，而不是要求自己永遠不吃。"},"10-4":{"why":"如果食物成了唯一的壓力出口，單靠「不要吃」很難。準備幾個非食物的因應選項，可以讓你在壓力高的時候多一條路。","example":"短走路、洗澡、伸展、打電話、離開零食區、聽音樂或做幾分鐘呼吸練習，都可以依你的生活找到適合的版本。","judge":["現在最需要的是放鬆、轉移注意力、休息還是陪伴？","哪個替代活動只需要 5–10 分鐘？","它真的能在我最常觸發的情境出現嗎？"],"do":["列出三個壓力因應選項。","分別標記需要的時間。","選一個最容易做的。","今天在一次壓力時刻使用它。","記下它有沒有降低進食衝動。"],"cta":"今天就做：建立你的三個非食物因應選項。","tip":"備案要短、簡單、真的用得上。","observe":"今天準備三個不用食物也能處理壓力的選項，並實際用一個。"},"10-5":{"why":"一次吃多、吃甜或偏離計畫，不會自動讓整週失敗。真正重要的是下一餐能不能回到正常節奏，而不是用極端節食或運動補償。","example":"晚餐聚會吃多了，隔天不需要完全不吃；可以回到正常早餐、喝水、照平常活動，下一餐重新使用本週方法。","judge":["我現在是在修正，還是在懲罰自己？","下一個正常選擇是什麼？","我能從這次經驗學到哪一個觸發點？"],"do":["承認這次偏離，不美化也不責罵。","不要用極端方式補償。","回到下一個正常餐。","恢復原本的活動。","記下一個下次可以提前準備的改變。"],"cta":"今天就做：練習「下一餐正常回來」。","tip":"恢復能力，比永遠不偏離更重要。","observe":"今天如果發生吃多的情況，直接練習下一餐正常回來，而不是補償。"},"11-1":{"why":"旅行會打亂時間、餐點與可取得食物，因此最有效的策略不是帶著完美菜單，而是保留幾個核心判斷：蛋白質、纖維、主食份量與飲料。","example":"機場早餐、飯店自助餐、長途車上的零食都不一定能完全控制。你可以先找蛋白質與蔬菜，再依當天行程選主食。","judge":["今天有哪些食物選項？","哪個核心原則最值得守住？","如果下一餐完全不同，我的備案是什麼？"],"do":["查看今天行程。","找一個容易取得的蛋白質。","準備一個高纖備案。","決定主食與飲料策略。","記下旅行中最有用的一個方法。"],"cta":"今天就做：為下一個旅行／外出情境準備一個飲食備案。","tip":"旅行不是暫停學習，而是測試方法能否適應現實。","observe":"今天為一個旅行或外出行程準備蛋白質、纖維與飲料的備案。"},"11-2":{"why":"節日食物本來就是生活的一部分。控糖不代表不能慶祝，而是學會把真正想享受的食物放進整體餐點與份量裡。","example":"生日蛋糕、年節菜餚或聚餐甜點可以享受；與其每樣都吃很多，不如先決定最想吃的一兩樣，其他部分保持簡單。","judge":["今天真正想享受的是什麼？","哪一部分只是因為大家都吃我才跟著吃？","我能否保留喜歡的食物，同時讓整餐仍有蛋白質與蔬菜？"],"do":["聚餐前選一個最想享受的食物。","到場先看整桌。","先建立蛋白質與蔬菜。","有意識地吃喜歡的食物。","餐後記下是否滿足。"],"cta":"今天就做：在一次慶祝中選擇真正值得享受的一項。","tip":"享受與照顧自己可以同時存在。","observe":"今天在慶祝餐裡保留真正想享受的食物，同時維持整餐結構。"},"11-3":{"why":"家人或朋友可能會勸你多吃、少吃，或對你的飲食做評論。你需要的不是說服所有人，而是一句簡單、可重複的回應。","example":"「再吃一點啦」時，可以回答「謝謝，我先這樣就好」，不必解釋血糖、體重或整套飲食規則。","judge":["我最常在哪種社交情境被影響？","我想守住的核心原則是什麼？","哪一句簡短回應能讓我不需要反覆解釋？"],"do":["寫下一個社交場合。","選一個要守住的原則。","寫一句簡短回應。","在今天實際使用一次。","記下對方反應與自己的感受。"],"cta":"今天就做：準備一句你的社交飲食回應。","tip":"界線可以簡單，不需要辯論。","observe":"今天預演一句簡短的社交回應，讓你能在不爭辯的情況下保留選擇權。"},"11-4":{"why":"吃太多後最容易掉進「反正失敗了」或「明天完全不吃」的循環。真正有效的恢復，是停止補償，回到正常節奏並找出觸發原因。","example":"晚餐吃太多後，隔天不需要跳過早餐或做超量運動；先回到平常的餐點、活動與睡眠節奏。","judge":["這次是什麼情境造成的？","下一個正常餐是什麼？","我需要修正環境，還是只是需要繼續正常生活？"],"do":["記錄這次吃多的情境。","不採取極端補償。","下一餐照正常節奏吃。","恢復日常活動。","寫下一個下次要提前處理的因素。"],"cta":"今天就做：建立你的「吃多後恢復流程」。","tip":"一次事件不需要用另一個極端事件去補償。","observe":"今天練習吃多後的恢復流程，把重點放在下一個正常選擇。"},"11-5":{"why":"重整不是「重新開始一個嚴格計畫」，而是把你已經學會的技能拿回來：看情境、組餐、看份量、處理壓力、恢復。","example":"旅行回家後，不必從零開始；下一餐回到蛋白質、蔬菜與適量碳水，隔天恢復平常活動即可。","judge":["哪個技能是我現在最需要重新拿回來的？","我能從下一餐開始做什麼？","怎麼避免把一次偏離變成一整週放棄？"],"do":["選一個最近偏離計畫的情境。","找出真正需要修正的地方。","選一個已學過的技能。","在下一餐實際使用。","寫下「我已經回來」的一個證據。"],"cta":"今天就做：用一個已學過的技能完成重整。","tip":"重整不是重來；是把已經學會的能力重新拿回來。","observe":"今天選一個已學過的技能，直接用在最近一次偏離計畫的情境。"},"12-1":{"why":"90 天最後不是要你記住所有規則，而是找出哪些方法在你的生活裡真的產生效果、容易重複，而且值得保留。","example":"也許你發現「早餐固定蛋白質」比計算每一克碳水更容易；也許你真正有效的是餐後走路。這些個人證據比一份完美清單更有價值。","judge":["哪三個方法最容易做到？","哪一個方法讓你的飲食或活動最穩定？","哪些方法看起來很好，但其實不適合你的生活？"],"do":["回看 90 天紀錄。","列出三個最有幫助的行動。","列出兩個不適合你的方法。","選出最值得保留的一個。","寫下為什麼它有效。"],"cta":"今天就做：找出你的三個「真的有效」。","tip":"留下有效的，刪掉不適合的，才會形成自己的系統。","observe":"今天回看 90 天資料，不是找失敗，而是找出真正重複後有效的方法。"},"12-2":{"why":"長期計畫需要少數清楚的個人規則，而不是一長串禁忌。好的規則應該能在超市、外食與家中都使用。","example":"例如「含糖飲料不是日常預設」「每餐先找蛋白質」「主食份量放回整餐看」；規則應該描述你的行動，而不是把食物分成道德上的好壞。","judge":["這條規則能不能在真實生活使用？","它是具體行動，還是模糊口號？","我願意在三個月後仍然遵守嗎？"],"do":["寫出十條目前想到的規則。","刪掉模糊或過度嚴格的。","留下三到五條最有用的。","為每條規則寫一個真實例子。","把它存成個人行動手冊。"],"cta":"今天就做：寫出你的 3–5 條個人飲食規則。","tip":"規則越少、越清楚、越能執行，越有長期價值。","observe":"今天把你的經驗濃縮成 3–5 條具體、可執行的個人飲食規則。"},"12-3":{"why":"預設餐點能降低每天決策成本。你不需要每天發明新菜，只要準備幾個在家、外食、便利商店都能快速啟動的組合。","example":"把你已經證明吃得習慣的早餐、便當或便利商店組合存下來，忙碌時直接使用，剩下的精力留給真正需要決策的場合。","judge":["哪三餐最值得變成預設？","這些餐的蛋白質、蔬菜與碳水是否都有位置？","我能在不同價格與時間條件下做替代嗎？"],"do":["選三個你常吃的餐。","寫出每餐的核心組成。","各找一個替代版本。","標記最快速的版本。","存成你的預設餐點清單。"],"cta":"今天就做：建立三個可以直接複製的預設餐點。","tip":"預設不是無聊；它是把決策成本降到最低。","observe":"今天把三個已證明可行的餐點存成「不用重新思考」的預設。"},"12-4":{"why":"長期活動計畫需要一個最低標準，讓忙碌、旅行或低能量日也不會完全中斷。最低活動量應該是你能安全、穩定執行的底線。","example":"例如固定每週幾次短肌力、每天短時間走路或其他適合你的活動。具體頻率與強度要依你的體能、目標與專業建議調整。","judge":["什麼活動我最願意長期做？","最低版本在忙碌日能完成嗎？","我如何安排一般日與進階日兩個版本？"],"do":["回看第 9 週設定。","檢查它是否真的做到。","調整成更可靠的最低版本。","寫下一個一般日版本。","把兩者排進下週行程。"],"cta":"今天就做：完成你的長期最低活動量。","tip":"最低版本是保底，不是你的上限。","observe":"今天檢查第 9 週的最低活動量，調整成未來仍能做到的版本。"},"12-5":{"why":"90 天的價值在於建立一個沒有課程也能繼續運作的系統：預設餐點、飲食規則、活動底線、壓力備案與每週回顧。","example":"未來某一週忙到失控時，你不需要重新找方法；你只要回到自己的手冊，選一個最小行動，然後重新開始。","judge":["我最需要保留哪三個核心習慣？","什麼情境最可能讓系統失效？","我的「失守後恢復流程」是什麼？"],"do":["整理你的 3–5 條飲食規則。","整理三個預設餐點。","確認最低活動量。","寫下壓力／聚餐／旅行備案。","安排每週一次 5 分鐘回顧。"],"cta":"今天就做：完成你的個人 90 天後行動手冊。","tip":"真正的畢業，不是完成課程，而是不再需要每天重新開始。","observe":"今天把飲食、活動、壓力與恢復整理成一頁自己的長期行動手冊."},"1-1":{"why":"每天重複的小選擇會累積成飲食與生活模式。先理解「選擇」如何受到時間、環境與可取得食物影響，才能把改變放在真正能發生的地方。","example":"早餐只有咖啡、中午忙到很晚，下午自然更容易快速選擇高糖點心。重點不是責怪自己，而是看懂前面的條件如何影響後面的選擇。","judge":["這個選擇前發生了什麼？","當時有哪些實際可選的選項？","哪個小改變能讓下一次更容易？"],"do":["選今天一個真實飲食決定。","記下時間、地點與當時情況。","列出你當時看到的兩個以上選項。","寫下你最後為什麼選它。","找出一個下次可提前準備的小改變。"],"cta":"今天就做：拆解一次真實飲食選擇。","tip":"先理解選擇怎麼發生，才知道該改哪裡。","observe":"把這個主題放回今天的真實情境，看看它實際如何影響你的下一個選擇。"},"1-2":{"why":"沒有基準，就很難知道什麼真的改變了。建立簡單起點不是要求你完整記錄，而是讓你知道目前的飲食、活動與生活節奏。","example":"你可能發現早餐很穩定，真正困難的是下午；也可能外食不是問題，真正卡住的是晚餐後零食。這些資訊決定你接下來應該把力氣放在哪裡。","judge":["哪個時段最穩定？","哪個時段最常出現困難？","哪個問題如果改善，會最值得？"],"do":["快速回看昨天的飲食。","找出最穩定的一段。","找出最困難的一段。","記下當時的情境。","選一個最值得先處理的地方。"],"cta":"今天就做：畫出你的「最容易」與「最困難」時段。","tip":"基準不是成績單，而是接下來做決策的地圖。","observe":"把這個主題放回今天的真實情境，看看它實際如何影響你的下一個選擇。"},"1-3":{"why":"長期計畫不可能每天都遇到完美條件。80% 原則的核心是把注意力放在最重要的行動，允許生活有變化，並保留回到正軌的能力。","example":"聚餐、旅行或忙碌工作日，你可能無法控制每一道菜；但你仍能選擇飲料、蛋白質、蔬菜或主食份量中的一項。","judge":["今天最重要的一件事是什麼？","哪些細節其實不值得消耗力氣？","偏離後，我的下一個正常選擇是什麼？"],"do":["找一個今天不可能完美的情境。","選一個最重要的原則。","完成它，不再追加規則。","若其他地方沒做到，不補償。","記下這個策略能否重複。"],"cta":"今天就做：只守住一個最重要的選擇。","tip":"80% 不是降低標準，而是保留長期執行的空間。","observe":"把這個主題放回今天的真實情境，看看它實際如何影響你的下一個選擇。"},"1-4":{"why":"很多飲食困難不是知識不足，而是阻力太大：太餓、太累、時間不夠、食物就在眼前或壓力太高。找出阻力，才能設計真正有用的解法。","example":"下午加班又很餓，桌上剛好有零食。這時增加一條飲食規則通常沒用；提前準備一份點心或調整午餐時間，可能更有效。","judge":["阻力來自身體、環境還是情緒？","哪一個因素最直接？","我能提前改變哪一個條件？"],"do":["回想一次最近的失守。","列出至少兩個阻力。","選出最主要的一個。","設計一個提前準備。","下一次遇到時實際使用。"],"cta":"今天就做：替一個高風險時刻準備備案。","tip":"處理阻力，比要求自己更有意志力更有效。","observe":"把這個主題放回今天的真實情境，看看它實際如何影響你的下一個選擇。"},"1-5":{"why":"第一個習慣應該小到忙碌時也能完成，並且接在一個已存在的生活節點後面。這樣才能從「知道」變成「會做」。","example":"「每天吃得健康」太模糊；「午餐拿到餐盒後先找蛋白質」則有清楚的觸發點與動作。","judge":["觸發點清楚嗎？","行動小到忙碌時也能做嗎？","明天我願意再做一次嗎？"],"do":["選一個每天都會出現的觸發點。","接上一個小行動。","寫成「當＿＿，我就＿＿」。","準備一個環境提示。","明天實際做一次。"],"cta":"今天就做：寫出你的第一句「當……我就……」。","tip":"好習慣不是靠熱血，而是靠清楚的觸發與簡單的動作。","observe":"把這個主題放回今天的真實情境，看看它實際如何影響你的下一個選擇。"}};
function lesson(w,l){
 const x=weeks[w-1],c=getCurr(w),d=c.lessons[l-1],done=!!state.lessons[key('l',w,l)],next=l<5?`#/lesson/${w}/${l+1}`:`#/action/${w}/1`;
 setTop(`第 ${w} · Learn ${l}`);
 const rich=lessonRichOverrides[`${w}-${l}`]||{why:c.why,example:d.example||d.concept,observe:'把這個主題放回今天的真實情境，看看它如何出現在你的下一個選擇。',judge:['這個主題在我今天的情境中是什麼？','我需要注意哪一個關鍵判斷？','我能不能把這個判斷實際用一次？'],do:[d.apply,'今天實際做一次。','記下結果。','找出一個可以更簡單的地方。','決定下一次怎麼重複。'],cta:'今天就做一次。',tip:'把觀念帶進下一個真實選擇。'};
;
 return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a>
 <section class="card content section lesson-detail"><p class="eyebrow">LEARN ${l} OF 5 · WEEK ${w}</p><h1 class="lesson-title">${esc(d.title)}</h1><p class="lead lesson-lead">${esc(d.concept)}</p>
 <div class="lesson-map"><div><span>01</span><b>理解</b><small>先知道 WHY</small></div><div><span>02</span><b>看見</b><small>放進真實生活</small></div><div><span>03</span><b>判斷</b><small>知道怎麼選</small></div><div><span>04</span><b>行動</b><small>今天真的做</small></div></div>
 <div class="lesson-depth">
  <section class="depth-card why"><p class="eyebrow">01 · WHY｜為什麼這件事值得學？</p><h2>${esc(d.title)}</h2><p>${esc(rich.why)}</p></section>
  <section class="depth-card"><p class="eyebrow">02 · 看見｜主題如何出現在你的生活</p><h2>真實情境：${esc(rich.example)}</h2><p>${esc(rich.observe)}</p></section>
  <section class="depth-card"><p class="eyebrow">03 · 判斷｜不要問「對不對」，先問「適不適合」</p><h2>三個判斷角度</h2><ul>${rich.judge.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></section>

function action(w,d){
 const x=weeks[w-1],c=getCurr(w),a=actionOverrides[w]?.[d-1]?{steps:actionOverrides[w][d-1]}:c.actions[d-1],saved=!!state.actions[key('a',w,d)],savedSteps=state.actionSteps?.[key('a',w,d)]||(saved?Array(5).fill(true):[]),count=savedSteps.filter(Boolean).length;
 const focus=w===1?["先收集資料，不急著改","找到滿足感來源","拆出最困難的決定","在衝動與行動間留 5 分鐘","把改變做小","把方法帶進真實情境","整理成下一週的保留習慣"][d-1]:x.daily_actions[d-1];
 const cta=w===1?["今天先做一件事：記錄，不評價。","今天多做一個停頓：吃到一半感受一次。","今天不要找完美答案，找出真正的阻力。","今天給自己 5 分鐘，再決定下一步。","今天建立一個明天也能重複的行動。","今天不用計畫完美，只練習使用一個原則。","今天把最有用的一件事留下來。"][d-1]:"把今天的概念實際用一次。";
 const prompt=w===1?["記錄一餐的食物、飲料與大約份量，餐前／餐後各留下一個感受數字。","用一餐練習辨認「吃飽」與「滿足」的差別，最後留下你的發現。","找出一個最困難的飲食決定，拆出時間、地點、選項與真正阻力。","遇到一次想吃點心的衝動，先停 5 分鐘，再決定要不要吃。","把一個大目標縮成明天也做得到的單一步驟，寫出觸發點。","從早餐店、外送、加班或聚餐中選一個真實情境，使用本週方法。","回看本週，選出一個真的有效、值得繼續的做法。"][d-1]:"今天把本週方法帶進一個真實生活情境。";
 const notes=w===1?["不要修正今天的飲食。資料比漂亮的答案更有價值。","滿足感可能來自味道、速度、份量、搭配或情境。先觀察。","阻力不是藉口，而是設計下一步時最有用的資訊。","暫停不是禁止。你仍然可以吃；重點是多一次有意識的選擇。","好的習慣不是最大改變，而是最容易重複的改變。","成功標準是「真的練一次」，不是「整天都做到」。","下週不需要更多規則，只需要一個值得保留的行動。"][d-1]:"完成一次真實練習，就算建立了一筆有用的生活資料。";
 setTop(`第 ${w} · Day ${d}`);
 return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a><section class="card action section"><div>
 <p class="eyebrow">DAY ${d} · DAILY ACTION · WEEK ${w}</p><h1>${esc(x.daily_actions[d-1])}</h1><p class="lead">${esc(focus)}</p>
 <div class="depth-card why"><p class="eyebrow">WHY｜今天為什麼做這件事？</p><h3>${esc(cta)}</h3><p>${esc(prompt)}</p></div>
 <div class="action-steps-title"><div><p class="eyebrow">DO｜5 個可完成步驟</p><h2>一步一步做，不需要一次完成。</h2></div><span class="step-count" id="actionCount">${count}/5 完成</span></div>
 <div class="mini-progress"><i id="actionBar" style="width:${count/5*100}%"></i></div>

 <div class="finish-banner"><b>完成標準</b><p>5/5 = 完整完成。3/5 = 已經有練習價值。今天不需要補做，也不要用明天懲罰今天。</p></div>
