/* Editorial Wellness visual restoration */
.landing{background:var(--cream);color:var(--ink)}
.landing-nav{max-width:1240px;margin:auto;height:82px;padding:0 32px;background:transparent;border-bottom:0}
.landing-nav .brand{display:flex;gap:12px;align-items:center}
.landing-nav .brand .logo{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 13px Inter}
.landing-nav .brand b{display:block;font:500 22px Georgia,"Noto Serif TC",serif;color:var(--g)}
.landing-nav .brand small{display:block;color:var(--sage);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.landing-hero{max-width:1240px;margin:auto;padding:48px 32px 72px;display:grid;grid-template-columns:.9fr 1.1fr;gap:54px;align-items:stretch}
.landing-hero h1{font:500 clamp(48px,5.6vw,76px)/.98 Georgia,"Noto Serif TC",serif;letter-spacing:-2px;color:var(--g);margin:18px 0 24px}
.landing-lead{font-size:18px;line-height:1.75;color:#56615b;max-width:590px}
.editorial-visual{display:grid;grid-template-columns:1.55fr .9fr;grid-template-rows:1fr 1fr;gap:10px;min-height:520px}
.editorial-visual .img{border-radius:18px;overflow:hidden;background:var(--sand);position:relative}
.editorial-visual .img img{width:100%;height:100%;object-fit:cover;display:block}
.editorial-visual .mainimg{grid-row:1 / span 2}
.editorial-visual .caption{position:absolute;left:16px;bottom:14px;color:#fff;font:500 20px Georgia,serif;text-shadow:0 1px 10px #0008}
.editorial-visual .caption small{display:block;font:11px Inter,sans-serif;letter-spacing:1px;margin-top:3px}
.editorial-quote{position:absolute;right:18px;top:16px;background:rgba(250,248,245,.9);padding:12px 15px;border-radius:12px;color:var(--g);font:16px Georgia,serif;max-width:180px}
.price{font:500 30px Georgia,serif;color:var(--g);margin:26px 0}
.price span{font:14px Inter,system-ui,sans-serif;color:var(--muted)}
.bigbtn{padding:15px 22px;border-radius:999px;margin:5px 8px 5px 0}
.landing-section{padding:82px 32px;text-align:center;max-width:1240px;margin:auto}
.landing-section h2{font:500 46px/1.12 Georgia,"Noto Serif TC",serif;color:var(--g);margin:12px auto 18px;max-width:900px}
.landing-section p{font-size:17px;line-height:1.75;color:var(--muted);max-width:820px;margin:0 auto 28px}
.editorial-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:42px;text-align:left}
.editorial-grid .tile{min-height:230px;border-radius:18px;overflow:hidden;position:relative;background:#ddd}
.editorial-grid .tile img{width:100%;height:100%;object-fit:cover;display:block}
.editorial-grid .tile span{position:absolute;left:16px;bottom:14px;color:#fff;font:500 22px Georgia,serif;text-shadow:0 1px 10px #0008}
.editorial-grid .tile small{display:block;font:10px Inter,sans-serif;letter-spacing:1.5px;margin-top:4px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.feature-grid div{padding:32px;border-right:1px solid var(--line)}
.feature-grid div:last-child{border-right:0}
.feature-grid b{display:block;font:500 36px Georgia,serif;color:var(--g)}
.feature-grid span{display:block;color:var(--muted);margin-top:6px}
.landing-section.dark{max-width:none;background:var(--g);color:#fff}
.landing-section.dark h2{color:#fff}.landing-section.dark p{color:#d9e3dd}
.landing-foot{text-align:center;padding:30px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}

。","寫結果。","找一個可以提前處理的環節。"],["遇到一次衝動。","看時間。","做一個短暫非食物活動。","10 分鐘後重新評估。","記下暫停改變了什麼。"],["列出三個非食物壓力出口。","挑最簡單的一個。","今天使用一次。","觀察使用前後感受。","把它加入壓力備案。"],["回想一次不滿意的選擇。","不計算補償。","寫下一餐正常選擇。","找一個觸發因素。","寫下下次備案。"],["在一次壓力情境使用「辨識 → 暫停 → 選擇」。","記下觸發。","完成短暫停頓。","做出當下選擇。","記下結果，不批判。"],["回看五個 Learn。","選一個最有效的壓力方法。","找一個高風險時段。","設計一個提前提醒。","完成「下週我要繼續＿＿」。"]],"11":[["選一次旅行／外出餐。","保留一個熟悉錨點。","加入一個平衡元素。","享受真正想吃的部分。","記下下一餐正常選擇。"],["選一次慶祝情境。","選最想享受的一樣。","慢慢吃。","其餘依飢餓與喜好決定。","記下最滿意的部分。"],["寫三句社交回應。","選最自然的一句。","在一次情境使用。","觀察對方反應。","記下最自在的說法。"],["回想一次吃多。","不做補償。","安排下一餐。","照常活動。","記下一個真正原因。"],["建立恢復卡。","寫觸發情境。","寫停止自責的一句話。","寫下一餐。","寫第二天最低活動。"],["在真實聚會中使用本週框架。","保留一個享受選擇。","做一個平衡選擇。","不補償。","記下恢復速度。"],["回看本週五個 Learn。","選最有用的恢復原則。","找最常發生的失誤情境。","寫一個備案。","完成「下週我要繼續＿＿」。"]],"12":[["回看近期紀錄。","列出三個曾經有效的方法。","為每個寫一個真實例子。","刪掉不必要規則。","選出前三名。"],["寫下五條想保留的規則。","縮成一句一句。","刪除重複。","留下三條最實用的。","各寫一個使用情境。"],["選三個最常需要快速決定的餐。","各寫一個預設。","各準備一個替代。","記下取得方式。","整理成快捷清單。"],["寫理想活動量。","縮成最低版本。","設定觸發時間。","寫旅行／室內備案。","加入每週行程。"],["選固定每週回顧時間。","回看飲食、活動與情境。","寫一個有效的方法。","寫一個卡住的地方。","只決定下週一件事。"],["挑一個忙碌日測試你的個人系統。","使用一個飲食規則。","使用一個預設餐。","完成最低活動量。","記下哪裡最需要簡化。"],["回看 90 天。","選出三個最值得留下的工具。","寫出一頁式個人行動手冊。","決定下週如何繼續。","完成你的長期承諾句。"]]};
const lessonRichOverrides={"2-1":{"why":"碳水化合物是身體重要的能量來源。控糖不是把碳水全部拿掉，而是先知道哪些食物含有碳水、它們來自哪裡，再學會判斷品質與份量。","example":"白飯、麵、吐司、燕麥、地瓜、水果、豆類與乳品都可能提供碳水。含糖飲也會快速增加碳水，卻容易讓人忽略自己喝進去的量。","judge":["這食物主要提供碳水嗎？","它是較完整的來源，還是高度精製的來源？","這個份量放進整餐是否合理？"],"do":["選今天的一餐。","圈出飯、麵、麵包、根莖、水果與含糖飲等碳水來源。","把較完整與精製的來源分開看。","估計每一項的大約份量。","寫下一個你今天最想進一步了解的碳水來源。"],"cta":"今天先學會「看見碳水」：知道它從哪裡來。","tip":"碳水不是敵人；看懂來源，才有選擇。"},"2-2":{"why":"GI 是用來比較含碳水食物讓血糖上升速度的工具。它回答的是「速度的相對差異」，不是「這食物健不健康」。","example":"例如同樣是主食，不同食物的 GI 可能不同；但實際影響還會受到份量、纖維、加工、烹調與整餐搭配影響。","judge":["我是在比較相近的食物嗎？","我看到的 GI 是在說速度，不是健康分數嗎？","除了 GI，我還知道這食物的份量與纖維嗎？"],"do":["找兩種你常吃的含碳水食物。","比較它們的 GI 資訊。","同時記下每份碳水與纖維。","說出哪一個資訊最能幫你做決定。","寫下你不會再用 GI 判斷什麼。"],"cta":"今天把 GI 當成「速度資訊」，不要把它當健康分數。","tip":"GI 有用，但永遠不是唯一答案。"},"2-3":{"why":"GI 與份量是兩件不同的事。GI 描述速度；份量則決定你實際吃進多少碳水。控糖時兩個都要看。","example":"一大碗低 GI 主食仍可能提供很多碳水；因此不能因為「低 GI」就忽略份量。","judge":["這食物的 GI 如何？","我實際吃了多少？","把品質與份量放在一起後，我會怎麼調整？"],"do":["選今天的一餐主食。","估計實際吃的份量。","查看每份碳水資訊或可靠資料。","比較「小份／大份」對整餐的差異。","記下品質與份量各自告訴你的事情。"],"cta":"今天練習「GI 看速度，份量看總量」。","tip":"低 GI 不等於可以無限量；份量永遠要回到整餐。"},"2-4":{"why":"食物搭配會改變一餐的結構。把碳水和蛋白質、蔬菜與其他高纖食物放在一起，比只盯著某一種食物更接近真實飲食。","example":"白飯配魚肉與青菜，和單獨吃一大份精製澱粉，是不同的餐點結構；搭配也會影響飽足與實際選擇。","judge":["這餐有蛋白質嗎？","有蔬菜、豆類或其他纖維來源嗎？","我可以用現有食物補哪一塊？"],"do":["選一餐含碳水的餐。","找出蛋白質來源。","找出蔬菜或其他纖維來源。","保留喜歡的主食，再看份量。","記下搭配後的飽足與滿足感。"],"cta":"今天不要只問「吃多少碳水」，先問「碳水和什麼一起吃」。","tip":"完整的餐點結構，比單獨追一個數字更實用。"},"2-5":{"why":"較好的碳水選擇，通常是增加較少精製、較有纖維、份量合適的來源，而不是建立食物黑名單。","example":"全穀、燕麥、豆類、地瓜等可以成為日常選項；白飯、麵與麵包也不是一律禁止，而是回到品質、份量與搭配。","judge":["加工程度如何？","這個來源有沒有纖維或其他營養？","我喜歡、買得到，而且願意長期吃嗎？"],"do":["選一種你常吃的主食。","找一個較少精製或纖維較高的替代。","比較口味、價格與取得難度。","實際吃一次。","把你願意長期使用的版本存進清單。"],"cta":"今天找到一個「更好、也真的會吃」的碳水選擇。","tip":"最好的選擇不是理論上完美，而是你願意反覆使用。"},"3-1":{"why":"均衡餐盤的價值，是把控糖與體重管理中最重要的幾件事放在同一張餐桌上：非澱粉類蔬菜、蛋白質與適量碳水。你不用每餐計算，只要先看結構，就比較不容易讓精製澱粉或高熱量配料占滿整餐。","example":"便當常見白飯很多、青菜少、肉類有但不一定足夠。你可以先把餐盒想成三塊：大約一半放非澱粉類蔬菜，四分之一蛋白質，四分之一主食；實際仍依個人需求、餐點大小與醫療建議調整。","judge":["蔬菜、蛋白質、碳水三區都有嗎？","哪一區比例明顯過多或不足？","如果只能補一區，哪一個最能讓這餐更完整？"],"do":["選今天的一餐，先不要改任何食物。","指出餐中的非澱粉類蔬菜、蛋白質與碳水。","估計三區的大約比例，不需要秤重。","只調整最失衡的一區，例如加一份青菜或把主食改成較合適份量。","吃完記下：這個餐盤是否讓你更容易吃到舒服的飽足感。"],"cta":"今天用「1/2 蔬菜＋1/4 蛋白質＋1/4 碳水」看一次真實餐盤。","tip":"餐盤法是視覺化起點，不是硬性比例；重點是讓整餐不要只剩下主食。"},"3-2":{"observe":"今天可以在早餐、午餐、晚餐、點心或運動後，直接找出一個清楚的蛋白質來源，看看它怎麼和主食、蔬菜組成完整的一餐。","why":"蛋白質是身體維持、修復與建立組織的重要營養素，也是均衡餐盤中不可忽略的一塊。蛋白質由胺基酸組成，身體會利用這些胺基酸合成與更新肌肉、酵素、荷爾蒙及其他組織。對有運動習慣的人來說，足夠且分布合理的蛋白質也能支持運動後的肌肉修復與訓練適應；但蛋白質不是越多越好，仍要回到整體飲食與個人需求。","example":"早餐只有吐司和甜飲、午餐只有一大碗麵，都可能讓一餐主要由碳水構成。把蛋、魚、雞肉、瘦肉、豆腐、豆類、無糖豆漿或無糖乳品加入餐點，可以讓蛋白質成為清楚的主角。運動後則可以把蛋白質和適量碳水一起安排，支持恢復，而不是只喝高糖飲品。","judge":["這餐的主要蛋白質來源是哪一個？","它提供的是相對完整、少加工的蛋白質來源嗎？同時是否帶來很多糖、精製澱粉或油脂？","如果今天要補一份蛋白質，哪個來源最方便、符合口味，也能長期重複？"],"do":["選今天的一餐，先找到蛋白質主角。","寫下來源：蛋、魚、雞肉、瘦肉、豆腐、豆類或無糖乳品等。","估計它在整餐中的份量，不需要精算克數。","如果這餐蛋白質很少，加入一個你容易取得的來源。","記下吃完後的飽足感與便利性，選出一個你願意重複的蛋白質備案。"],"cta":"今天先找到每餐的「蛋白質主角」，再安排其他食物。","tip":"蛋白質提供胺基酸，支持肌肉與組織的維持、修復與更新；有運動習慣時，規律攝取也能支持恢復與訓練適應。若有腎臟疾病或其他特殊醫療需求，蛋白質份量應依醫療專業建議調整。","extra":"<div class=\"lesson-info-grid\"><div><b>優質蛋白質從哪裡來？</b><span>蛋、魚、雞肉、瘦肉、豆腐、豆類、無糖豆漿、無糖優格／乳品</span></div><div><b>蛋白質為什麼重要？</b><span>胺基酸是建造與更新肌肉、酵素、荷爾蒙與其他組織的重要原料。</span></div><div><b>有運動時呢？</b><span>運動後提供蛋白質，有助肌肉修復與訓練適應；搭配適量碳水更貼近完整恢復。</span></div></div>"},"3-3":{"observe":"今天從你真的會吃的食物找纖維：燕麥、豆類、蔬菜、水果、全穀、堅果或種子，看看不同來源如何自然放進一餐。","why":"膳食纖維不是只有「幫助排便」。不同纖維在腸道中的作用不同，其中水溶性纖維可以吸水形成凝膠，幫助延緩消化與吸收；非水溶性纖維則增加糞便體積、幫助腸道蠕動。實際食物通常同時含有兩類纖維，因此最實用的做法不是背名詞，而是增加多樣的植物性食物。","example":"燕麥、薏仁、大麥、豆類、蘋果、柑橘、奇亞籽與亞麻籽等可提供較多水溶性纖維；全穀、麥麩、堅果種子、蔬菜與帶皮蔬果則常提供較多非水溶性纖維。你可以從早餐加燕麥、午餐加豆類或蔬菜、點心選水果與堅果開始，而不是一次大幅改變。","judge":["這餐有沒有植物性食物提供纖維？","我需要增加的是水溶性來源、非水溶性來源，還是單純增加整體植物性食物的多樣性？","哪一個來源最容易加入我的日常，而且我願意長期吃？"],"do":["選今天的一餐，先找出已經有的蔬菜、豆類、全穀、水果、堅果或種子。","選一個新的纖維來源加入餐點，例如燕麥、豆類、菇類、蔬菜或水果。","若增加纖維較多，同時留意水分攝取與腸胃適應。","保留你原本喜歡的蛋白質與主食，不需要把整餐推翻重做。","記下哪一種纖維來源最容易取得、最好吃，也最值得下次重複。"],"cta":"今天為一餐增加一個「真正來自食物的纖維來源」。","tip":"水溶性與非水溶性是方便理解的分類，但多數天然食物兩者都有。增加纖維以食物為主、循序漸進，通常比一次大量補充更容易適應。","extra":"<div class=\"fiber-table-wrap\"><table class=\"fiber-table\"><thead><tr><th>類型</th><th>主要特性</th><th>常見食物來源</th><th>你可以怎麼用</th></tr></thead><tbody><tr><td><b>水溶性纖維</b></td><td>吸水形成凝膠，可延緩消化與吸收；部分可被腸道菌利用。</td><td>燕麥、大麥、豆類、蘋果、柑橘、奇亞籽、亞麻籽</td><td>早餐燕麥、餐中加豆類、優格加水果與種子</td></tr><tr><td><b>非水溶性纖維</b></td><td>增加糞便體積，支持腸道蠕動。</td><td>全穀、麥麩、堅果種子、蔬菜、帶皮蔬果</td><td>主食加入全穀、餐盤增加蔬菜、保留可食用果皮</td></tr></tbody></table><p class=\"table-note\">重點：多數天然食物同時含有兩類纖維，不必把食物硬分成「只有水溶性」或「只有非水溶性」。</p></div>"},"3-4":{"observe":"今天在便當、外食或超市裡，用顏色先找蔬菜，再特別留意一種深綠或十字花科蔬菜，觀察它怎麼補上餐盤。","why":"非澱粉類蔬菜是把餐盤變得更豐富、更多樣的簡單方法。它們通常能提供纖維、維生素、礦物質與植化素，同時以較低的澱粉比例增加餐盤體積。學會用顏色與類別辨認，比死背一長串蔬菜名稱更容易在外食、便當與超市裡快速做決定。","example":"你可以先用「五色」增加多樣性：紅色番茄、紅椒；橘黃色彩椒、胡蘿蔔；綠色菠菜、青江菜；紫色茄子、紫高麗菜；白色花椰菜、洋菇。再特別留意十字花科與深綠蔬菜，例如青花菜、花椰菜、高麗菜、芥藍、菠菜、地瓜葉等。馬鈴薯、玉米、地瓜雖然也有營養，但在餐盤規劃上通常更接近碳水區，不必拿來計入蔬菜區。","judge":["這份食物主要是非澱粉類蔬菜，還是同時提供大量澱粉、比較適合放在碳水區？","今天的餐盤有沒有至少一種看得見的蔬菜？能不能用不同顏色增加多樣性？","如果只能補一份蔬菜，哪一種最容易取得、最符合我的口味與預算？"],"do":["挑今天的一餐，先找出已經有的非澱粉類蔬菜。","用顏色判斷：今天是綠、紅、橘黃、紫，還是白色系？","若沒有深綠或十字花科蔬菜，選一種容易取得的加入，例如青菜、花椰菜或高麗菜。","把蔬菜放回整個餐盤，不用拿它取代所有主食或蛋白質。","記下你最容易在外食、便利商店或家裡取得的三種蔬菜，建立自己的常用清單。"],"cta":"今天讓一餐多出一份「看得見、顏色不同的非澱粉類蔬菜」。","tip":"五色是增加多樣性的視覺方法，不是硬性規定；十字花科與深綠蔬菜都是很實用的日常選項。玉米、馬鈴薯、地瓜不是壞食物，只是在餐盤法中通常更接近碳水區。","extra":"<div class=\"veg-info-grid\"><div><b>🔴 紅色</b><span>番茄、紅椒、紅高麗菜<br>可提供茄紅素、花青素等植化素。</span></div><div><b>🟠🟡 橘黃色</b><span>彩椒、胡蘿蔔、黃椒<br>常見類胡蘿蔔素來源。</span></div><div><b>🟢 深綠色</b><span>菠菜、青江菜、芥藍、地瓜葉<br>常見葉酸、維生素 K 與多種微量營養素來源。</span></div><div><b>🟣 紫色</b><span>茄子、紫高麗菜<br>常見花青素來源。</span></div><div><b>⚪ 白色</b><span>花椰菜、洋菇、白蘿蔔<br>提供纖維與多種植物性營養。</span></div><div><b>🥦 十字花科</b><span>青花菜、花椰菜、高麗菜、芥藍、蘿蔔<br>含硫代葡萄糖苷等植化素。</span></div></div>"},"3-5":{"why":"真正會改變飲食的，不是你能不能畫出理想餐盤，而是你能不能用手邊的食物組成一頓完整、可負擔、願意再吃的餐。把方法放進真實餐點，才會從知識變成能力。","example":"便利商店可以用雞胸肉或茶葉蛋搭配沙拉、毛豆，再選適量地瓜或全穀飯；便當則可以先找蛋白質與青菜，再決定白飯或其他主食的份量。不同食物都可以套用同一個結構。","judge":["這餐有沒有清楚的蛋白質？","有沒有非澱粉類蔬菜或其他纖維來源？","碳水來源是什麼、份量是否適合這一餐？"],"do":["選一個你今天真的會吃的餐點，不要另外做理想餐。","先圈出蛋白質，再找非澱粉類蔬菜或纖維來源。","最後看主食種類與份量，優先選較少精製的來源時就練習一次。","完成餐點後記下哪一區最容易缺。","把這份成功組合存成你的「下次直接照著選」範本。"],"cta":"今天完成一份「蛋白質＋蔬菜／纖維＋適量碳水」的真實餐。","tip":"你不需要每餐都完美；能在平常會遇到的餐點裡重現，就是這堂課真正的成果。"},"4-1":{"observe":"今天拿一項你真的會買、會吃的包裝食品，先不要看糖或熱量，第一眼只找「每份量」與「每包幾份」，把標籤的計算單位看懂。","why":"食品標籤的第一個關鍵不是哪個數字最低，而是「這些數字到底對應多少食物」。營養標示常以每份為基準；如果一包有多份，而你實際吃了兩份，糖、碳水、纖維與蛋白質等數字都要跟著倍增。要做出正確比較，先把每份量看懂。","example":"例如一包零食標示每份 30 公克、每包 3 份。如果你一次吃完整包，標示上的每份數字不能直接當成整包的攝取量；實際吃了 3 份，就要把每份營養數字乘以 3。另一方面，「每份量」是標示計算單位，不等於告訴你一定應該吃多少。","judge":["每份量用什麼單位？公克、毫升、幾片或其他？","整個包裝共有幾份？我實際通常吃幾份？","如果我吃的量和一份不同，哪些營養數字需要跟著換算？"],"do":["拿一項你常買的包裝食品。","找到每份量，寫下單位與數字。","找到每包／每盒共有幾份。","估計你實際會吃幾份，選一個營養數字做倍數換算。","把「每份」與「我實際吃的量」分開記下來。"],"cta":"今天先把「每份量」讀對，再看其他數字。","tip":"每份量是標籤的計算單位，不是你的飲食命令。若要比較兩個產品，先確認它們的標示基準是否相同。","extra":"<div class=\"lesson-info-grid\"><div><b>每份量 ≠ 建議吃多少</b><span>它主要告訴你營養數字以多少食物為計算基準。</span></div><div><b>每包有幾份？</b><span>這決定你吃完整包時，標示數字需要乘幾倍。</span></div><div><b>比較時看基準</b><span>不同產品可用每份或每 100 公克／毫升的資訊輔助比較，但仍要回到實際食用量。</span></div></div>"},
"4-2":{"observe":"今天找一項包裝食品，同時圈出「總碳水化合物、糖、膳食纖維」三個位置，觀察它們不是同一個數字。","why":"如果目標是更有意識地管理碳水，不能只看標籤上的「糖」。總碳水化合物通常包含糖、澱粉與膳食纖維等不同部分，因此一項食品即使標示糖不高，總碳水仍可能不低。先學會看總碳水，才能把食品放回整餐判斷。","example":"例如某款餅乾可能標示糖不高，但主要成分仍是麵粉、澱粉等碳水來源；另一款早餐穀片可能糖較高，同時也有較多纖維。兩者都不能只用「糖」一個數字決定。","judge":["每份總碳水是多少？我實際吃幾份？","糖與膳食纖維各是多少？它們和總碳水的關係是什麼？","把這項食品放進我的早餐、點心或一餐後，整體碳水情境如何？"],"do":["找一項常吃的包裝食品。","找到總碳水化合物。","同時找到糖與膳食纖維。","確認每份量，再把你實際吃的份量算進去。","寫下一句：我今天判斷這項食品時，為什麼不能只看糖？"],"cta":"今天把「看糖」升級成「看總碳水」。","tip":"總碳水是重要閱讀起點，但仍要和份量、纖維、蛋白質與整餐一起判斷。","extra":"<div class=\"lesson-info-grid\"><div><b>總碳水化合物</b><span>通常包含糖、澱粉與膳食纖維等碳水相關成分，是理解一項食品整體碳水的重要數字。</span></div><div><b>糖</b><span>是總碳水中的一部分；低糖不必然等於低總碳水。</span></div><div><b>膳食纖維</b><span>也是標籤中值得一起看的資訊，能幫助你判斷食物的整體營養結構。</span></div></div>"},
"4-3":{"observe":"今天挑兩項同類產品，先找「添加糖」；如果標籤沒有提供，就改看成分表，找出甜味來源並比較位置。","why":"添加糖的概念，能幫你分辨食物原本就存在的糖，和製造或調味過程中另外加入的糖。對日常選擇來說，這能讓你看穿「看起來很健康」但其實甜味來源很多的產品。若標籤有添加糖欄位，它是一個方便的快速線索；沒有時，成分表仍然能提供重要資訊。","example":"例如原味與調味乳品、不同口味穀片或醬料，可能有相近的產品名稱，但添加糖量不同。水果本身含天然糖，不代表就是「添加糖」；相反地，糖漿、砂糖或其他甜味原料出現在成分表中，則值得進一步留意。","judge":["標籤是否有「添加糖」？每份是多少？","如果沒有添加糖欄位，成分表前段是否出現糖、糖漿或其他甜味來源？","把添加糖、總碳水與實際份量一起看後，我還會選它嗎？"],"do":["挑兩個同類產品。","先比較每份量是否接近。","找到添加糖；若沒有，查看成分表中的甜味來源。","再比較總碳水與膳食纖維。","選一個更符合你日常需求、而且願意長期使用的版本，寫下理由。"],"cta":"今天用「添加糖＋成分表」看穿一次甜味來源。","tip":"添加糖是重要線索，但不是唯一判斷。天然含糖食物與添加糖要分開理解，再回到整體份量與飲食情境。","extra":"<div class=\"lesson-info-grid\"><div><b>添加糖</b><span>指製造或調製時另外加入的糖類；如果標籤有此欄位，可以直接比較。</span></div><div><b>沒有添加糖欄位？</b><span>看成分表，留意砂糖、糖漿、麥芽糖等甜味原料的位置與種類。</span></div><div><b>不要把天然糖當成添加糖</b><span>水果、乳品等食物本身可以含天然糖；重點是辨認「另外加入」的甜味來源。</span></div></div>"},
"4-4":{"observe":"今天找兩項同類食品，除了糖與總碳水，再把「膳食纖維、蛋白質」圈出來，看看哪一項更適合放進你的真實一餐。","why":"食品標籤不是只用來找「少糖」。纖維與蛋白質可以讓你更完整地理解一項食品在一餐中的角色：它是主要食物、搭配食物，還是只是偶爾吃的點心。把纖維與蛋白質放進判斷，可以避免只追逐單一數字。","example":"兩款早餐食品可能糖差不多，但一款纖維與蛋白質較高，另一款主要由精製澱粉構成。這時真正有用的問題不是「哪個零糖」，而是「哪個更適合我的早餐結構，以及我還需要搭配什麼」。","judge":["每份纖維多少？蛋白質多少？","總碳水與實際份量是多少？","放進一餐後，它補足了什麼，又還缺什麼？"],"do":["找兩項同類食品。","先確認兩者每份量。","記下總碳水、膳食纖維與蛋白質。","想像它們各自放進早餐或點心，判斷還需要搭配什麼。","選一項你願意實際使用的產品，寫下完整理由，而不是只寫「比較健康」。"],"cta":"今天從「看糖」進一步做到「看整體營養」。","tip":"高纖或高蛋白不會自動讓一項食品適合所有人；份量、配料、口味、價格與整餐都要一起考量。","extra":"<div class=\"lesson-info-grid\"><div><b>纖維看什麼？</b><span>看每份膳食纖維，再回到你實際吃的份量與整天植物性食物來源。</span></div><div><b>蛋白質看什麼？</b><span>看每份蛋白質，並思考它在這一餐是不是清楚的蛋白質來源。</span></div><div><b>最後放回整餐</b><span>一項食品沒有「單獨完美」這回事；重要的是它如何和其他食物組成一餐。</span></div></div>"},
"4-5":{"observe":"今天拿一項你真的會買的食品，按照固定順序掃描：每份量 → 總碳水 → 添加糖／糖 → 纖維 → 蛋白質，再看成分表。","why":"真正會用標籤，不是記住一堆營養名詞，而是建立一個固定、快速、可重複的閱讀順序。當你在便利商店、超市或外送選購包裝食品時，固定流程能降低選擇負擔，也能避免被正面宣稱或單一數字帶走。","example":"你看到「高纖」「低糖」「無添加」等醒目字樣時，不需要立刻相信或否定。先翻到營養標示，確認每份量與總碳水，再看添加糖、纖維、蛋白質，最後用成分表補上加工與配料資訊。","judge":["我知道這包食品的實際標示基準嗎？","總碳水、添加糖／糖、纖維、蛋白質告訴我什麼？","把它放進真實飲食後，我還需要搭配什麼？"],"do":["挑一項你平常會買的食品。","依固定順序完成五項掃描：份量、總碳水、添加糖／糖、纖維、蛋白質。","再快速看成分表，確認主要原料與甜味來源。","把標籤資訊放回你的早餐、點心或一餐判斷。","把它分類成「常用／偶爾／這次不選」，並寫下三個具體理由。"],"cta":"今天完成一次完整的「五項＋成分表」標籤掃描。","tip":"標籤是決策工具，不是營養考試。你不需要追求最低數字，只需要做出符合自己情境、願意重複的選擇。","extra":"<div class=\"lesson-info-grid\"><div><b>① 每份量</b><span>先知道數字是以多少食物計算。</span></div><div><b>② 總碳水</b><span>先看整體碳水，不只看糖。</span></div><div><b>③ 添加糖／糖</b><span>看甜味來源與每份數字。</span></div><div><b>④ 纖維＋蛋白質</b><span>把食品放回整餐結構。</span></div><div><b>⑤ 成分表</b><span>補充主要原料與加工資訊。</span></div><div><b>最後一問</b><span>「它適合我的日常，而且我真的會用嗎？」</span></div></div>"},"5-1":{"why":"早餐不一定是人人都必須吃的固定規則，但對有早餐習慣的人來說，它可以成為一天的穩定支點。重點是早餐的結構與後續感受。","example":"如果早餐只有甜麵包與含糖飲，有些人很快又餓；加入蛋白質、纖維與適量碳水，可以讓餐點更完整。","judge":["我通常幾點吃？","這餐有蛋白質與纖維嗎？","吃完後到下一餐的狀態如何？"],"do":["回想三天早餐。","找出共同模式。","標出蛋白質、纖維與碳水。","找最需要補強的一區。","做一個小調整並觀察結果。"],"cta":"今天把早餐當成「一天的支點」來檢查。","tip":"不是規定你一定要吃早餐，而是教你安排第一餐。"},"5-2":{"why":"早餐常見的問題不是「吃了早餐」，而是精製澱粉、甜飲很多，蛋白質與纖維不足，或因方便而缺少完整結構。","example":"甜麵包＋含糖飲、吐司配大量果醬、只有咖啡，都是可以拿來練習判斷的情境。","judge":["主要碳水在哪？","蛋白質在哪？","如果只能改一件事，哪件最值得？"],"do":["選你的平常早餐。","找出精製或含糖來源。","找出蛋白質缺口。","只改一件事。","記下便利性與飽足感的變化。"],"cta":"今天找出你的早餐最大弱點，只改一件事。","tip":"一次修一個最值得修的地方。"},"5-3":{"why":"「蛋白質＋纖維」是一個簡單的早餐組合概念，再依個人需求加入合適的碳水與飲料。這比背固定菜單更容易長期使用。","example":"蛋、無糖豆漿、原味優格可以搭配燕麥、全穀、水果或蔬菜，形成不同版本。","judge":["蛋白質來源是什麼？","纖維來源是什麼？","碳水份量是否適合這一餐？"],"do":["選一個早餐情境。","先選蛋白質。","加入一個纖維來源。","安排適量碳水。","記下便利、口味與飽足。"],"cta":"今天做一份「蛋白質＋纖維」早餐。","tip":"組合比單一食物更重要。"},"5-4":{"why":"忙碌早餐真正需要解決的是「取得容易＋不用想太久」，而不是追求理想食譜。","example":"便利商店、早餐店或辦公室都可以用蛋白質、纖維、適量碳水與無糖飲組合。","judge":["10 分鐘內取得得到嗎？","有蛋白質嗎？","精製澱粉或甜飲是否占太多？"],"do":["選一個常去的早餐地點。","找兩個蛋白質選項。","找一個纖維來源。","飲料選無糖。","把組合存成忙碌日預設。"],"cta":"今天建立一個忙碌早晨也做得到的早餐。","tip":"方便可以是優勢，不是妥協。"},"5-5":{"why":"早餐公式的價值，是讓你不用每天重新決定。固定結構、替換食材，就能建立穩定又有彈性的早餐系統。","example":"「蛋白質＋高纖食物＋適量碳水＋無糖飲」是一個結構，不是固定菜單。","judge":["哪些元素是你的核心？","哪些食物可以互換？","哪個版本最容易維持？"],"do":["寫出你的早餐公式。","列三種蛋白質。","列三種纖維／植物性來源。","列兩種碳水。","選出三個預設早餐。"],"cta":"今天完成你的三套早餐預設。","tip":"預設越清楚，越不靠臨時意志力。"},"6-1":{"why":"外食時，前面學過的餐盤與碳水原則要變成「點餐順序」，才能真正幫助你在有限時間內做決定。","example":"先找蛋白質，再找蔬菜／纖維，最後決定主食與飲料，是一個簡單的外食框架。","judge":["蛋白質在哪？","蔬菜或纖維在哪？","主食與飲料怎麼調整？"],"do":["打開菜單。","先圈兩個蛋白質選項。","找蔬菜／纖維。","決定主食與飲料。","記下這個順序是否省時間。"],"cta":"今天用「蛋白質→蔬菜→主食／飲料」點一次餐。","tip":"先決定餐的結構，再處理細節。"},"6-2":{"why":"早餐店選項有限，但仍可以從蛋白質、蔬菜與飲料三個地方做小調整，不必把喜歡的食物全部刪掉。","example":"蛋餅、吐司、漢堡都可以搭配蛋、肉類、蔬菜與無糖飲，重點是整餐結構。","judge":["蛋白質在哪？","主食份量如何？","飲料能否選無糖？"],"do":["選常去的早餐店。","找蛋白質來源。","找蔬菜或其他纖維。","飲料選無糖。","存一個可複製組合。"],"cta":"今天在早餐店完成一次「完整組合」。","tip":"不必放棄喜歡的食物，先改善組合。"},"6-3":{"why":"速食的選項有限，因此最實用的方法不是追求完美，而是先抓住飲料、蛋白質、配菜與份量這幾個高影響點。","example":"漢堡、炸物等不需要被視為失敗；你仍可以在有限選項裡做更有意識的組合。","judge":["有蛋白質嗎？","飲料含糖嗎？","配菜與主食份量如何？"],"do":["選一家速食店。","先選蛋白質主體。","飲料選無糖。","看看是否能增加蔬菜或較合適的配菜。","寫下一個最重要的改善。"],"cta":"今天練習「有限選項下的最佳選擇」。","tip":"不是每次都完美，先抓最大影響點。"},"6-4":{"why":"外送最容易在很餓時快速下單，因此需要一個在按下訂單前就能完成的快速檢查。","example":"先找主菜蛋白質、蔬菜與主食，再決定飲料與加點，可以降低臨時亂選的機率。","judge":["蛋白質在哪？","蔬菜在哪？","主食與飲料是否符合今天情境？"],"do":["打開外送平台。","先選蛋白質主菜。","加一份蔬菜／纖維。","選主食與飲料。","下單前做一次整餐檢查。"],"cta":"今天在外送平台做一次「下單前整餐檢查」。","tip":"先決定結構，再看口味與加點。"},"6-5":{"why":"聚餐不是課程之外，而是真正需要使用技能的地方。你可以享受社交，同時保留幾個自己的決策點。","example":"先找蛋白質與蔬菜，再選真正想吃的食物，吃到舒服後再決定是否繼續。","judge":["我最重要的選擇是哪個？","哪些食物是我真的想吃？","我能否享受，同時保留下一餐的彈性？"],"do":["預先選一個原則。","到場先找蛋白質與蔬菜。","挑真正想吃的。","吃到舒服再決定是否續盤。","記下最自然的策略。"],"cta":"今天在聚餐只練一個核心原則。","tip":"社交生活本身就是健康決策的練習場。"},"7-1":{"why":"便利商店最需要的是「組合能力」，而不是背品牌。只要知道先找什麼，你就能快速組成一餐。","example":"用蛋白質、蔬菜／纖維、適量碳水與無糖飲組合，就能在很多商品中做判斷。","judge":["蛋白質在哪？","纖維在哪？","主食與飲料如何搭？"],"do":["進店前先決定要買一餐。","先找蛋白質。","再找蔬菜／纖維。","最後選主食與飲料。","記下你的購物順序。"],"cta":"今天完成一份便利商店均衡餐。","tip":"先會組合，再建立自己的常用清單。"},"7-2":{"why":"便利商店的蛋白質選擇很多，學會比較「蛋白質、糖、份量與便利性」，比只記一個商品名稱更有用。","example":"茶葉蛋、無糖豆漿、雞肉、魚、豆腐與原味乳品都可能成為選項。","judge":["它是清楚的蛋白質來源嗎？","糖與份量如何？","哪個最方便、最符合今天情境？"],"do":["找三個蛋白質選項。","看蛋白質與糖資訊。","比較價格與份量。","選一個今天真的會吃的。","存成常用選項。"],"cta":"今天建立你的便利商店蛋白質清單。","tip":"常用選項越清楚，臨時購餐越輕鬆。"},"7-3":{"why":"便利商店餐常缺植物性食物；一份即食蔬菜或高纖選項，就能補上餐盤的重要區塊。","example":"沙拉、毛豆、海帶、蔬菜杯等可依供應與個人喜好選擇。","judge":["這餐有植物性食物嗎？","哪個能直接吃或快速處理？","哪個是我願意重複購買的？"],"do":["找一個蔬菜／高纖選項。","確認能直接搭配。","加入原本餐點。","吃完觀察滿足感。","記下最方便的選項。"],"cta":"今天為便利商店餐補上一個纖維來源。","tip":"方便的纖維來源也算好選擇。"},"7-4":{"why":"飲料很容易在不知不覺中增加糖與碳水，因此是建立低門檻控糖習慣的好入口。","example":"含糖茶飲、汽水、果汁與調味咖啡都可能含糖；水、無糖茶與無糖咖啡可以成為預設。","judge":["有添加糖嗎？","總碳水多少？","哪個無糖版本我願意長期喝？"],"do":["拿兩種常喝飲料。","看標示。","比較糖與總碳水。","選一個無糖版本。","實際喝一次並記下接受度。"],"cta":"今天練習「飲料先看糖」。","tip":"一個容易重複的飲料選擇，可以成為很有價值的習慣。"},"7-5":{"why":"預設餐能在忙碌時降低決策負擔。核心不是固定吃同一套，而是固定結構、食材可以替換。","example":"蛋白質＋蔬菜／纖維＋適量主食＋無糖飲，可以用很多便利商店商品完成。","judge":["缺哪一區？","哪個商品能補位？","下次能否三分鐘內重現？"],"do":["建立一份便利商店組合。","寫兩個蛋白質替換。","寫一個纖維替換。","寫一個主食替換。","存成自己的預設餐。"],"cta":"今天建立第一份便利商店預設餐。","tip":"預設是幫未來的自己省決策力。"},"8-1":{"why":"份量會影響一餐提供的碳水與能量；學份量不是要求你永遠計算，而是建立沒有秤也能判斷的能力。","example":"同一食物，小份與大份對整餐的影響不同。","judge":["主食大約多少？","蛋白質與蔬菜比例如何？","吃完是剛好、仍餓還是過撐？"],"do":["選一餐。","估主食份量。","看蛋白質與蔬菜。","吃到一半停一下。","記下飽足感。"],"cta":"今天觀察一餐份量，不需要秤。","tip":"先學會看，再決定是否需要更精準。"},"8-2":{"why":"手掌法提供一個沒有秤時的視覺估量起點，讓份量判斷可以帶進餐廳、辦公室與旅行。","example":"可用手掌、拳頭等身體尺度估量不同食物，再依個人情況與餐點調整。","judge":["我現在估的是哪一類食物？","哪個身體尺度最容易使用？","放進我的餐具裡好不好判斷？"],"do":["選一餐。","用手掌估蛋白質。","用拳頭或餐盤估其他區塊。","完成一餐。","記下最自然的估量方法。"],"cta":"今天用手掌法估一次份量。","tip":"這是工具，不是毫米級精準的測量。"},"8-3":{"why":"餐盤法看「結構」，份量方法看「大小」；兩者一起使用，比只盯著某一種食物更接近真實生活。","example":"主食很多、蛋白質與蔬菜很少，即使秤得很準，整餐仍可能不完整。","judge":["三個區塊都有嗎？","哪一區明顯過大或過小？","最小改動可以補哪裡？"],"do":["選一餐。","先看三區。","再估主食與蛋白質。","做一個小調整。","記下調整後的感受。"],"cta":"今天把「餐盤＋份量」一起使用。","tip":"先看結構，再看大小。"},"8-4":{"why":"餐廳份量常比家裡大。辨識份量，可以讓你保留喜歡的食物，而不必因為「一定要吃完」而忽略身體訊號。","example":"分享、留下部分、打包或吃到舒服就停，都可以是合理選項。","judge":["這份餐比平常大多少？","我真的需要全部吃完嗎？","哪種處理方式最自然？"],"do":["選一次餐廳餐點。","先觀察份量。","吃到一半停一下。","決定繼續、分享、留下或打包。","記下原因。"],"cta":"今天練習一次「份量由我決定」。","tip":"吃不完不是失敗。"},"8-5":{"why":"飽足感是身體訊號，不是成績分數。它可以幫助你重新判斷「我還需要多少」。","example":"餐前很餓時可能吃得快；中途停一下，可以重新確認是否還需要繼續。","judge":["餐前有多餓？","吃到一半還需要多少？","餐後是剛好、仍餓還是過撐？"],"do":["選一餐。","餐前記 0–10。","吃到一半停 30 秒。","餐後記飽足 0–10。","寫一句造成差異的因素。"],"cta":"今天做一次「中途停一下」。","tip":"身體訊號是資料，不是評分。"},"9-1":{"why":"活動能幫助身體使用能量，也有助於體適能與日常功能；真正重要的是找到可以持續的最低起點。","example":"走路、家務、爬樓梯與短段活動都可以累積，不一定要一次完成完整運動。","judge":["什麼活動最容易增加？","哪個時段最穩定？","我的最低版本是多少？"],"do":["回看今天的活動。","找一段可增加 5–10 分鐘的時間。","安排並完成活動。","記下活動前後感受。","決定是否值得重複。"],"cta":"今天增加一小段你做得到的活動。","tip":"可長期維持，比一次爆量更重要。"},"9-2":{"why":"走路是低門檻活動，可以拆成短段落並綁定既有生活，讓「運動」不再一定需要完整空檔。","example":"午餐後、通勤、晚餐後或工作間隔都可能成為固定走路時段。","judge":["什麼時段最容易？","多久我最願意？","什麼事情可以提醒我？"],"do":["選一個固定時段。","先從 10 分鐘開始。","完成後記實際時間。","觀察是否容易重複。","設定固定觸發。"],"cta":"今天走 10 分鐘，找到一個可重複的時段。","tip":"把走路綁在生活，比靠意志力穩。"},"9-3":{"why":"打斷久坐是一種不需要完整運動時段的日常策略。短暫起身與活動，可以讓一天增加更多動作機會。","example":"起身倒水、走去開會、短伸展，都可以成為工作日的活動節點。","judge":["我最常久坐哪段時間？","什麼提醒最有效？","最小活動可以是什麼？"],"do":["找最長的久坐時段。","設定提醒。","起身走動或伸展 2–5 分鐘。","記下身體感受。","決定明天是否重複。"],"cta":"今天打斷一次長時間久坐。","tip":"沒有完整運動，也可以先動一下。"},"9-4":{"why":"肌力活動有助於維持肌肉與身體功能。初學者重點是控制、規律與安全，不是追求重量或把自己操到極限。","example":"坐站、牆壁伏地挺身等都可以依能力調整；若出現疼痛或不適，應停止並尋求專業建議。","judge":["我能安全控制動作嗎？","需要降低難度嗎？","每週哪一天最適合？"],"do":["選 2–3 個簡單動作。","少量完成並保留餘裕。","注意穩定與呼吸。","不適就停止。","記下最適合你的動作。"],"cta":"今天完成一次短版、能力允許的肌力練習。","tip":"目標是建立能力，不是把自己操爆。"},"9-5":{"why":"最低活動量是「再忙也有機會做到」的版本，讓習慣在壞日子仍有出口。","example":"它可以是每天短走、規律起身或每週固定短肌力，依個人生活與身體狀況設定。","judge":["忙碌日也做得到嗎？","什麼時間觸發？","怎麼知道自己有做到？"],"do":["寫下你的最低活動量。","指定觸發時間。","設定忙碌日版本。","完成一次並記錄。","放進下週行程。"],"cta":"今天正式定義你的最低活動量。","tip":"最低不是偷懶，而是習慣的安全底線。"},"10-1":{"why":"壓力會影響食慾、注意力與選擇。先看見「壓力→進食」的連結，比責怪自己意志力差更有用。","example":"忙碌、疲累或睡眠不足時，有些人會更想吃甜食或方便食物。","judge":["我真的餓嗎？","壓力或疲勞參與多少？","我能先做哪個小動作？"],"do":["記下一次壓力時刻。","記身體餓感。","記情緒與疲勞。","觀察原本想做的選擇。","寫一個下次可用的步驟。"],"cta":"今天辨認一次「壓力→食物選擇」。","tip":"辨認不是責怪，而是增加選擇空間。"},"10-2":{"why":"情緒性飲食是一種可以觀察的行為模式，不是道德問題。觸發可能來自壓力、無聊、孤單、疲累或環境。","example":"下午看到零食就想吃，觸發可能不只是餓，也可能是疲勞或「食物就在眼前」。","judge":["什麼時間發生？","當時身體與情緒狀態如何？","環境中什麼最有影響？"],"do":["選一次想吃零食的時刻。","記時間與情境。","辨認身體、情緒與環境線索。","不批判自己。","找一個可以提前設計的環節。"],"cta":"今天找出一個主要觸發因素。","tip":"知道觸發點，才有機會提前準備。"},"10-3":{"why":"暫停不是禁止自己吃，而是在衝動與行動之間留一點空間。這段空間可以讓你重新辨認真正需求。","example":"先走動、喝水、呼吸或離開食物幾分鐘，再重新判斷是否真的想吃。","judge":["衝動有多強？","我需要食物，還是需要調節情緒？","幾分鐘後我仍然想吃嗎？"],"do":["遇到一次衝動。","停 5–10 分鐘。","做一個非食物活動。","重新判斷。","記下暫停前後的差異。"],"cta":"今天練習一次 10 分鐘暫停。","tip":"目的不是忍耐，而是增加選項。"},"10-4":{"why":"好的因應策略不是「永遠不吃」，而是先辨認需求，再選擇休息、活動、情緒調節或正常進食。","example":"如果是真的餓，就應該正常吃；不要把所有進食都當成情緒性飲食。","judge":["我是餓，還是需要調節情緒？","哪種因應方式符合真正需求？","如果餓，我能否選一份完整餐點？"],"do":["回想一次壓力進食。","判斷當時餓感。","選一個符合需求的因應方式。","如果仍餓就正常吃。","記下哪種方法有效。"],"cta":"今天建立你的「壓力來時，我可以做什麼」清單。","tip":"更多選項，比更多禁令更有用。"},"10-5":{"why":"恢復比失誤本身更重要。一次吃多或沒運動，不需要用極端節食或過度運動補償。","example":"晚餐吃多後，下一餐可以正常回到餐盤、份量與飲料策略，而不是跳餐。","judge":["我是在恢復，還是在補償？","下一個正常選擇是什麼？","這次提供了什麼資訊？"],"do":["記一次偏離。","不做補償。","安排下一個正常餐。","找出可能的觸發因素。","寫一個下次備案。"],"cta":"今天練習「下一餐正常回來」。","tip":"穩定不是從不偏離，而是知道怎麼回來。"},"11-1":{"why":"旅行時保留少數核心原則，比攜帶一整套規則更容易。你需要的是能在陌生環境快速使用的框架。","example":"旅館早餐、機場與便利商店都可以用蛋白質、植物性食物、適量碳水與飲料快速組合。","judge":["今天最重要的原則是哪一個？","哪一餐最不確定？","可以提前準備什麼？"],"do":["看行程。","找最不確定的一餐。","準備一個蛋白質或高纖備案。","先決定飲料。","記下最有用的策略。"],"cta":"今天替下一次旅行準備一個預設餐。","tip":"旅行是練習彈性，不是停止計畫。"},"11-2":{"why":"節日與慶祝是生活的一部分。健康選擇不是拒絕所有喜歡的食物，而是學會選擇、享受與自然恢復。","example":"你可以選真正想吃的甜點，正常享受，再回到下一個平衡餐，而不是進入補償循環。","judge":["我真正想吃什麼？","哪些只是因為眼前有？","吃完能否自然回到下一餐？"],"do":["選一個慶祝情境。","挑真正想吃的食物。","慢慢吃並注意滿足。","不補償。","記下最滿意的選擇。"],"cta":"今天練習一次「有選擇地享受」。","tip":"享受不是失敗。"},"11-3":{"why":"社交壓力可能讓人吃下自己其實不想吃的東西。簡單、自然的界線，可以保留關係也保留自己的選擇。","example":"「我先吃這些就好」「我現在剛好」都可以自然表達界線，不需要長篇解釋。","judge":["我是真的想吃嗎？","怎麼說最自然？","哪一個界線值得練習？"],"do":["想一個社交情境。","寫一句自己的回應。","用自然語氣說出來。","在真實情境使用。","記下自己的感受。"],"cta":"今天練習一句自己的社交界線。","tip":"界線不是拒絕人，而是保留選擇。"},"11-4":{"why":"吃多後最重要的是避免補償循環。極端限制可能讓下一次飢餓與失控更強；真正需要的是回到正常節奏。","example":"下一餐回到蛋白質、蔬菜、適量碳水與正常份量，比跳餐或懲罰性運動更穩定。","judge":["下一餐怎麼回到平常？","我有沒有想補償？","這次可以學到什麼原因？"],"do":["記一次吃多。","辨認當時飢餓、情緒與環境。","不跳餐、不刻意補償。","安排下一個正常餐。","寫一個下次要提前處理的點。"],"cta":"今天練習「吃多後不補償」。","tip":"恢復是技能，不是懲罰。"},"11-5":{"why":"無罪惡感重整，是把觀察、選擇、記錄與恢復串成一個循環。這讓一次偏離不會變成「整天都毀了」。","example":"週末聚餐後，不必等星期一；下一餐就能回到餐盤、份量與飲料策略。","judge":["下一個正常選擇是什麼？","哪個工具真的有用？","需要改的是規則，還是環境？"],"do":["回看一次偏離。","選一個已學工具。","在下一餐使用。","記下結果。","把有效方法加入備案。"],"cta":"今天完成一次「偏離→恢復」。","tip":"真正建立的是恢復能力。"},"12-1":{"why":"最後一週不是再增加規則，而是找出 90 天中真正有效、值得留下的少數工具。","example":"可能是無糖飲、早餐預設、餐盤法、標籤閱讀、走路或壓力策略；重點是你真的使用過。","judge":["哪些方法我真的做過？","哪三個最有幫助？","哪些規則可以刪掉？"],"do":["回看 90 天紀錄。","列出五個有效方法。","挑前三名。","各寫一個使用情境。","決定如何保留。"],"cta":"今天找出你的前三個有效工具。","tip":"長期系統應該越來越簡單。"},"12-2":{"why":"個人飲食規則應該是少數、清楚、可執行的原則，而不是禁止清單。","example":"例如「飲料以無糖為預設」「每餐先找蛋白質」「主食看份量」，都比「永遠不能吃某食物」更容易長期使用。","judge":["這條規則有幫助嗎？","什麼時候使用？","偶爾做不到時，我能自然回來嗎？"],"do":["寫五條目前規則。","刪掉過度嚴格或重複的。","縮成三條。","為每條寫使用情境。","確認自己願意長期使用。"],"cta":"今天完成你的三條個人飲食原則。","tip":"好規則讓生活更容易，不讓你更害怕食物。"},"12-3":{"why":"預設餐能在疲累、忙碌或選擇太多時降低決策負擔。它不是固定菜單，而是可靠模板。","example":"你可以為早餐、外食、便利商店與家庭晚餐各建立一個預設，食材可以自由替換。","judge":["哪一餐最需要預設？","有蛋白質、植物性食物與適量碳水嗎？","時間與成本合理嗎？"],"do":["選三個常需快速決定的餐。","各寫一個預設。","各準備一個替代版本。","寫取得方式。","存成快捷清單。"],"cta":"今天建立三份不用思考也能使用的預設餐。","tip":"預設是幫未來的自己省力。"},"12-4":{"why":"最低活動量是最忙時仍能保留的健康行為。它要小到能長期做，也要有明確觸發。","example":"可以是每日短走、規律起身或每週固定短肌力，依你的生活與身體狀況設定。","judge":["最小版本是什麼？","什麼時候最容易做到？","旅行或忙碌時的替代是什麼？"],"do":["寫最低活動量。","指定觸發時間。","設忙碌日版本。","設旅行／室內備案。","放進行程並實際做一次。"],"cta":"今天把最低活動量正式寫進生活。","tip":"能在壞日子存活的習慣，才有機會累積。"},"12-5":{"why":"長期計畫是一套決策系統：怎麼吃、怎麼動、遇到壓力怎麼辦、偏離後怎麼回來。90 天的目的就是讓你能自己使用這套系統。","example":"你應該能說出自己的飲食原則、預設餐、最低活動量與恢復方法，而不是繼續依賴一張嚴格菜單。","judge":["哪些工具我要保留？","哪些情境最需要備案？","未來 30 天我只需要持續哪一件事？"],"do":["整理三條飲食原則。","整理三個預設餐。","寫下最低活動量。","寫壓力／聚餐／旅行備案。","完成「未來 30 天，我會繼續……」。"],"cta":"今天完成你的個人健康行動手冊。","tip":"90 天的終點，不是結束，而是把有效方法變成日常。"}};const actionRecordGuidance={"2-1":["今天把碳水選擇記在這裡。","不用另外拿記事本；記下今天的食物、份量、搭配與你的判斷。"],"2-2":["今天把碳水選擇記在這裡。","不用另外拿記事本；記下今天的食物、份量、搭配與你的判斷。"],"2-3":["今天把碳水選擇記在這裡。","不用另外拿記事本；記下今天的食物、份量、搭配與你的判斷。"],"2-4":["今天把碳水選擇記在這裡。","不用另外拿記事本；記下今天的食物、份量、搭配與你的判斷。"],"2-5":["今天把碳水選擇記在這裡。","不用另外拿記事本；記下今天的食物、份量、搭配與你的判斷。"],"2-6":["今天把碳水選擇記在這裡。","不用另外拿記事本；記下今天的食物、份量、搭配與你的判 function focusFirstAction(){

}

function saveAction(w,d){state.actionSteps=state.actionSteps||{};let arr=state.actionSteps[key('a',w,d)]||Array(5).fill(false);state.actions[key('a',w,d)]=arr.every(Boolean);save();toast(state.actions[key('a',w,d)]?'今天的行動已完成':'已儲存目前進度');render()}
function challenge(w){const c=getCurr(w),x=state.challenges?.[w]||{checks:[false,false,false],note:'',choice:''};setTop(`第 ${w} · Challenge`);const choices=w===1?["早餐只有咖啡，午餐前已經很餓","下午 4 點工作壓力大，想吃零食","晚上回家很累，看到食物就想吃"]:["今天出現一個不在計畫內的飲食情境","我需要在有限選項中做選擇","我遇到一個讓我卡住的真實情境"];return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a><section class="card challenge section"><p class="eyebrow">REAL-LIFE CHALLENGE · WEEK ${w}</p><h1>${esc(c.challenge.title)}</h1><p class="lead">${esc(c.challenge.prompt)}</p><div class="micro"><p class="eyebrow">先選一個情境</p><h3>哪一個最像你今天可能遇到的時刻？</h3><div class="choicegrid">${choices.map(t=>`<button class="choice ${x.choice===t?'sel':''}" onclick="selectChallengeChoice(${w},'${esc(t).replace(/'/g,"\'")}')">${esc(t)}</button>`).join('')}</div></div><div class="checklist">${['我先停下來看情境，而不是自動反應。','我使用本週的一個原則做決定。','我完成後記下結果，知道下次可以怎麼做。'].map((t,i)=>`<label class="checkitem ${x.checks[i]?'done':''}"><input type="checkbox" ${x.checks[i]?'checked':''} onchange="toggleChallenge(${w},${i},this.checked)"><span><b>${esc(t)}</b><small>Challenge step ${i+1}</small></span></label>`).join('')}</div><div class="field"><label for="challengeNote">這次真實情境發生了什麼？</label><textarea id="challengeNote" rows="6" placeholder="例如：下午 4 點很餓又在加班，我先停 5 分鐘，發現自己其實是累和餓一起出現……">${esc(x.note||'')}</textarea></div><button class="btn primary" onclick="saveChallenge(${w})">儲存挑戰紀錄</button><p class="muted" style="margin-top:12px">成功標準：${esc(c.challenge.success)}</p></section></div>`}
function selectChallengeChoice(w,t){state.challenges=state.challenges||{};let x=state.challenges[w]||{checks:[false,false,false],note:'',choice:''};x.choice=t;state.challenges[w]=x;save();render()}
function toggleChallenge(w,i,v){state.challenges=state.challenges||{};let x=state.challenges[w]||{checks:[false,false,false],note:''};x.checks[i]=v;state.challenges[w]=x;save();const el=event.target.closest('.checkitem');if(el)el.classList.toggle('done',v)}
function saveChallenge(w){state.challenges=state.challenges||{};let x=state.challenges[w]||{checks:[false,false,false],note:''};x.note=document.getElementById('challengeNote').value;state.challenges[w]=x;save();toast('挑戰紀錄已儲存');render()}
function flex(w){const c=getCurr(w),x=state.flex?.[w]||{context:'',done:false,note:'',method:''};setTop(`第 ${w} · Flex Day`);const contexts=w===1?["早餐店","便利商店","外送／外帶","臨時聚餐","加班"]:c.flex;return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a><section class="card section"><p class="eyebrow">FLEX DAY · WEEK ${w}</p><h1>把本週能力帶進不可預測的一天。</h1><p class="lead">今天不是 cheat day。你不需要「補回來」，也不需要做到完美；只要在真實情境裡使用一個已經學過的方法。</p><div class="micro"><p class="eyebrow">今天的任務</p><h3>選一個情境 → 用一個方法 → 記下一個發現。</h3><p class="muted">完成一次就算成功。</p></div><div class="field" style="margin-top:24px"><label>今天的情境</label><div class="choicegrid">${contexts.map(t=>`<button class="choice ${x.context===t?'sel':''}" onclick="selectFlex(${w},'${esc(t).replace(/'/g,"\'")}')">${esc(t)}</button>`).join('')}</div></div><div class="field" style="margin-top:18px"><label>我使用了哪一個方法？</label><div class="choicegrid">${['先觀察，不急著改','找出真正的阻力','80% 原則','5 分鐘暫停','建立一個小習慣'].map(t=>`<button class="choice ${x.method===t?'sel':''}" onclick="selectFlexMethod(${w},'${esc(t).replace(/'/g,"\'")}')">${esc(t)}</button>`).join('')}</div></div><div class="checklist"><label class="checkitem ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleFlex(${w},this.checked)"><span><b>我在這個真實情境中使用了本週至少一個方法。</b><small>不要求結果完美，只要求真的練一次。</small></span></label></div><div class="field"><label for="flexNote">我用了什麼方法？結果如何？</label><textarea id="flexNote" rows="6" placeholder="例如：臨時聚餐，我沒有重新規劃整餐，只先觀察自己有多餓，再做一個比較容易接受的選擇……">${esc(x.note||'')}</textarea></div><button class="btn primary" onclick="saveFlex(${w})">儲存 Flex Day</button></section></div>`}
function selectFlexMethod(w,t){state.flex=state.flex||{};let x=state.flex[w]||{context:'',done:false,note:'',method:''};x.method=t;state.flex[w]=x;save();render()}
function selectFlex(w,t){state.flex=state.flex||{};let x=state.flex[w]||{context:'',done:false,note:''};x.context=t;state.flex[w]=x;save();render()}
function toggleFlex(w,v){state.flex=state.flex||{};let x=state.flex[w]||{context:'',done:false,note:''};x.done=v;state.flex[w]=x;save();const el=event.target.closest('.checkitem');if(el)el.classList.toggle('done',v)}
let chosen=0;function rate(n){chosen=n;document.querySelectorAll('.rate').forEach(x=>x.classList.remove('sel'));event.target.classList.add('sel')}
function checkin(w){const x=weeks[w-1],ex=state.reviews[w]||{rating:0,note:'',full:0,difficulty:0,context:[],win:'',keep:'',stuck:''},c=getCurr(w);chosen=ex.rating||0;const wins=w===1?['我更看見自己的飲食模式了','我有一次真的停下來再選','我找到一個最值得改善的時刻','我沒有完美，但我有繼續']:['我更容易做出選擇了','我有一次成功使用本週方法','我找到一個值得保留的做法','我更知道自己需要什麼'];return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a><section class="card check section"><p class="eyebrow">WEEKLY REVIEW · WEEK ${w}</p><h1>停下來．觀察．調整</h1><p class="lead">這不是打分數，而是把這週的生活資料整理成下一週可用的決策。</p><div class="checkin-grid" style="margin-top:24px"><div class="reviewbox"><div class="field"><label>這週整體感受</label><div class="rating">${[1,2,3,4,5].map(n=>`<button class="rate ${ex.rating===n?'sel':''}" onclick="rate(${n})">${n}</button>`).join('')}</div></div><div class="field"><label>本週最常見的飽足感</label><div class="rating">${[1,2,3,4,5].map(n=>`<button class="full ${ex.full===n?'sel':''}" onclick="pickReview('full',${n})">${n}</button>`).join('')}</div><small class="muted">1 = 很餓 · 3 = 剛好 · 5 = 很撐</small></div><div class="field" style="margin-top:18px"><label>本週難度</label><div class="rating">${[1,2,3,4,5].map(n=>`<button class="difficulty ${ex.difficulty===n?'sel':''}" onclick="pickReview('difficulty',${n})">${n}</button>`).join('')}</div><small class="muted">1 = 很容易 · 5 = 很困難</small></div></div><div class="reviewbox"><div class="field"><label>本週最值得肯定的一件事</label><div class="choicegrid">${wins.map(t=>`<button class="choice ${ex.win===t?'sel':''}" onclick="pickReviewText('win','${esc(t).replace(/'/g,"\'")}')">${esc(t)}</button>`).join('')}</div></div><div class="field" style="margin-top:18px"><label>最常遇到的情境（可複選）</label><div class="choicegrid">${['時間不夠','外食','工作／壓力','家人一起吃','家人一起吃','不知道怎麼選','其他'].filter((v,i,a)=>a.indexOf(v)===i).map(t=>`<button class="choice ${ex.context?.includes(t)?'sel':''}" onclick="toggleReviewContext('${esc(t).replace(/'/g,"\'")}')">${esc(t)}</button>`).join('')}</div></div></div></div><div class="grid g2equal" style="margin-top:18px"><div class="micro"><p class="eyebrow">留下來</p><h3>哪一件事值得帶進下週？</h3><textarea id="reviewKeep" rows="4" placeholder="例如：先記錄一餐，不急著修改。">${esc(ex.keep||'')}</textarea></div><div class="micro"><p class="eyebrow">卡住的地方</p><h3>哪個時刻最需要下一步設計？</h3><textarea id="reviewStuck" rows="4" placeholder="例如：下午 4 點加班時最容易亂吃。">${esc(ex.stuck||'')}</textarea></div></div><div class="micro"><p class="eyebrow">最後一句</p><h3>下週我要繼續＿＿＿＿＿＿。</h3><textarea id="reviewNote" rows="5" placeholder="把一件真的有效的事情留下來，比再增加十條規則更有價值。">${esc(ex.note||'')}</textarea></div><button class="btn primary" style="margin-top:15px" onclick="saveReview(${w})">儲存每週回顧</button></section></div>`}
function pickReviewText(k,t){state._reviewDraft=state._reviewDraft||{};state._reviewDraft[k]=t;render()}
function pickReview(k,n){state._reviewDraft=state._reviewDraft||{};state._reviewDraft[k]=n;render()}
function toggleReviewContext(t){state._reviewDraft=state._reviewDraft||{};let a=state._reviewDraft.context||[];a=a.includes(t)?a.filter(x=>x!==t):a.concat(t);state._reviewDraft.context=a;render()}
function saveReview(w){const old=state.reviews[w]||{},draft=state._reviewDraft||{};state.reviews[w]={rating:chosen||old.rating||0,full:draft.full||old.full||0,difficulty:draft.difficulty||old.difficulty||0,context:draft.context||old.context||[],win:draft.win||old.win||'',keep:document.getElementById('reviewKeep')?.value||old.keep||'',stuck:document.getElementById('reviewStuck')?.value||old.stuck||'',note:document.getElementById('reviewNote').value};delete state._reviewDraft;save();toast('第 '+w+' 週回顧已儲存');render()}
function progress(){setTop('進度');const s=stats();return `<div class="page"><p class="eyebrow">你的進度</p><section class="progressHero"><div><h1>保持前進的節奏。</h1><p>${s.done} 個已完成步驟，持續在你的 90 天系統中前進。</p><div class="track"><i style="width:${s.pct}%"></i></div></div><div class="big">${s.pct}%</div></section><section class="section"><div class="stats"><div class="card stat"><b>${s.l}/60</b><span>課程</span></div><div class="card stat"><b>${s.a}/84</b><span>每日行動</span></div><div class="card stat"><b>${s.r}/12</b><span>每週回顧</span></div></div></section><section class="section"><p class="eyebrow">每週進度</p><h2>你的完整旅程</h2><div class="grid" style="margin-top:14px">${weeks.map(w=>{let l=w.lessons.filter((_,i)=>state.lessons[key('l',w.week,i+1)]).length,a=w.daily_actions.filter((_,i)=>state.actions[key('a',w.week,i+1)]).length,p=Math.round((l+a+(state.reviews[w.week]?1:0))/13*100);return `<a class="weekrow" href="#/week/${w.week}"><span class="weekno">週 ${String(w.week).padStart(2,'0')}</span><div><h3>${esc(w.title)}</h3><p>${l}/5 課程 · ${a}/7 行動 · ${state.reviews[w.week]?'已完成回顧':'尚未回顧'}</p></div><span class="tag ${p===100?'current':''}">${p===100?'完成':p+'%'}</span></a>`}).join('')}</div></section></div>`}
function bonus(){setTop('加值資源庫');return `<div class="page"><p class="eyebrow">加值資源庫</p><h1 class="display">把真正有用的工具放在手邊。</h1><p class="lead">五份實用資源，專為你需要快速答案的時刻設計，而不是再上一堂長課。</p><section class="section grid g3">${bonuses.map((b,i)=>`<article class="bonus"><div class="num">BONUS ${String(i+1).padStart(2,'0')}</div><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p><button class="btn soft" onclick="openBonus(${i})">查看資源 →</button></article>`).join('')}</section></div>`}
function openBonus(i){toast(bonuses[i][0]+' opened — resource preview ready')}
function completion(){setTop('我的健康行動手冊');const pb=state.playbook||{};const s=stats();return `<div class="page"><section class="card completion section"><div class="seal">✓</div><p class="eyebrow" style="margin-top:20px">你的長期系統</p><h1>${s.pct>=90?'恭喜你——你已建立自己的健康行動手冊。':'你的健康行動手冊正在成形。'}</h1><p class="lead">把真正有效的方法整理成個人系統，讓你在 90 天之後也能持續使用。</p></section><section class="section playgrid"><div class="card"><p class="eyebrow">飲食規則</p><h2>我的 3 條規則</h2><div class="grid"><input id="rule1" value="${esc(pb.rule1||'')}" placeholder="規則 1"><input id="rule2" value="${esc(pb.rule2||'')}" placeholder="規則 2"><input id="rule3" value="${esc(pb.rule3||'')}" placeholder="規則 3"></div></div><div class="card"><p class="eyebrow">預設選擇</p><h2>我的常用餐點</h2><textarea id="meals" rows="8" placeholder="早餐／午餐／晚餐預設選擇……">${esc(pb.meals||'')}</textarea></div><div class="card"><p class="eyebrow">活動</p><h2>我的最低活動量</h2><textarea id="movement" rows="6" placeholder="平常一週我可以重複的活動……">${esc(pb.movement||'')}</textarea></div><div class="card"><p class="eyebrow">重整流程</p><h2>我的每週回顧</h2><textarea id="review" rows="6" placeholder="我什麼時候回顧？會問自己什麼？">${esc(pb.review||'')}</textarea></div></section><button class="btn primary" style="margin-top:18px" onclick="savePlaybook()">儲存我的健康行動手冊</button></div>`}
function savePlaybook(){state.playbook={rule1:rule1.value,rule2:rule2.value,rule3:rule3.value,meals:meals.value,movement:movement.value,review:review.value};save();toast('行動手冊已儲存')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function landing(){return `<div class="landing"><header class="landing-nav"><a class="brand" href="/"><span class="logo">90</span><span><b>90 天健康重整</b><small>控糖與體重</small></span></a><a class="btn primary" href="/dashboard">開始</a></header><main><section class="landing-hero"><div><p class="eyebrow">90-DAY PRACTICAL HEALTH RESET</p><h1>小小的選擇。<br>持續的行動。<br>真正的改變。</h1><p class="landing-lead">一套為真實生活設計的 90 天飲食與生活習慣系統。特別為外食、忙碌工作與沒有時間複雜計算的人設計。</p><div class="price">US$19 <span>— 一次付款・一次購買</span></div><a class="btn primary bigbtn" href="/dashboard">開始我的 90 天重整 →</a><a class="btn outline bigbtn" href="#learn">查看 12 週內容 ↓</a><p style="font-size:12px;color:var(--muted);margin-top:18px">教育用途，不提供診斷、治療或個人化醫療建議。</p></div><div class="editorial-visual"><div class="img mainimg"><img src="meal-hq.jpg" alt="均衡餐盤"><div class="editorial-quote">Small choices.<br>Consistent actions.</div><div class="caption">均衡餐盤<small>吃得簡單・吃得平衡</small></div></div><div class="img"><img src="movement-hq.jpg" alt="簡單活動"><div class="caption">保持活動<small>Simple Movement</small></div></div><div class="img"><img src="learning-hq.jpg" alt="學習與成長"><div class="caption">學習與成長<small>Learn Clearly</small></div></div></div></section><section class="landing-section" id="learn"><p class="eyebrow">WHY THIS WORKS</p><h2>不是另一套嚴格飲食規則。</h2><p>真正困難的是早餐店、餐廳、便利商店、加班、聚餐、旅行與壓力下的每一次選擇。這套系統把健康習慣拆成你真的能做到的小步驟。</p><div class="editorial-grid"><div class="tile"><img src="simple-hq.jpg" alt="生活平衡"><span>生活保持平衡<small>LIVE BALANCED</small></span></div><div class="tile"><img src="movement-hq.jpg" alt="簡單活動"><span>簡單活動<small>STAY ACTIVE</small></span></div><div class="tile"><img src="learning-hq.jpg" alt="學習"><span>清楚學習<small>LEARN CLEARLY</small></span></div><div class="tile"><img src="balance-hq.jpg" alt="平衡"><span>穩定前進<small>KEEP BALANCED</small></span></div></div><div class="feature-grid"><div><b>12 週</b><span>引導式微課程</span></div><div><b>84 個</b><span>每日行動</span></div><div><b>5 份</b><span>實用 Bonus 工具</span></div></div></section><section class="landing-section dark"><p class="eyebrow">學習 → 選擇 → 行動 → 追蹤 → 回顧 → 調整</p><h2>不是追求完美，而是建立你的下一個好選擇。</h2><p>從 GI 與碳水、均衡餐盤、食品標籤，到外食、便利商店、份量、簡單活動與壓力管理，12 週一步一步建立可持續的方法。</p><a class="btn" style="background:#fff;color:var(--g)" href="/dashboard">開始 90 天重整 →</a></section><section class="landing-section"><p class="eyebrow">完整內容</p><h2>一套可以帶進真實生活的 90 天系統。</h2><p>12 週課程、每週回顧、五份加值指南、90 天習慣追蹤器，以及最後的個人健康行動手冊。</p><a class="btn primary" href="/dashboard">立即開始 →</a></section></main><footer class="landing-foot">教育用途，不提供診斷、治療、治癒、預防或個別化醫療建議。</footer></div>`}

function render(){let path=location.pathname.replace(/\/+$/,'')||'/';let h=location.hash.replace(/^#/,'');if(h) path=h;let m=path.match(/^\/(?:week|weeks)\/(\d+)$/);if(m) path='/week/'+m[1];m=path.match(/^\/(?:lesson)\/(\d+)\/(\d+)$/);if(m) path='/lesson/'+m[1]+'/'+m[2];m=path.match(/^\/(?:action)\/(\d+)\/(\d+)$/);if(m) path='/action/'+m[1]+'/'+m[2];m=path.match(/^\/(?:checkin)\/(\d+)$/);if(m) path='/checkin/'+m[1];m=path.match(/^\/(?:challenge)\/(\d+)$/);if(m) path='/challenge/'+m[1];m=path.match(/^\/(?:flex)\/(\d+)$/);if(m) path='/flex/'+m[1];let v;if(path==='/')v=landing();else if(path==='/dashboard')v=dashboard();else if(/^\/week\/\d+$/.test(path))v=week(+path.split('/')[2]);else if(/^\/lesson\/\d+\/\d+$/.test(path)){let q=path.split('/');v=lesson(+q[2],+q[3]);}else if(/^\/action\/\d+\/\d+$/.test(path)){let q=path.split('/');v=action(+q[2],+q[3]);}else if(/^\/checkin\/\d+$/.test(path))v=checkin(+path.split('/')[2]);else if(/^\/challenge\/\d+$/.test(path))v=challenge(+path.split('/')[2]);else if(/^\/flex\/\d+$/.test(path))v=flex(+path.split('/')[2]);else if(path==='/progress')v=progress();else if(path==='/bonus')v=bonus();else if(path==='/completion')v=completion();else v=landing();document.getElementById('view').innerHTML=v;document.querySelectorAll('[data-nav]').forEach(a=>{let r=path.split('/')[1]||'dashboard';a.classList.toggle('active',a.dataset.nav===r)});}

window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');render();
</script></body></html>
