/* Editorial Wellness visual restoration */
.landing{background:var(--cream);color:var(--ink)}
.landing-nav{max-width:1240px;margin:auto;height:82px;padding:0 32px;background:transparent;border-bottom:0}
.landing-nav .brand{display:flex;gap:12px;align-items:center}
.landing-nav .brand .logo{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 13px Inter}
.landing-nav .brand b{display:block;font:500 22px Georgia,"Noto Serif TC",serif;color:var(--g)}
.landing-nav .brand small{display:block;color:var(--sage);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.landing-hero{max-width:1240px;margin:auto;padding:48px 32px 72px;display:grid;grid-template-columns:.9fr 1.1fr;gap:54px;align-items:stretch}
.landing-hero h1{font:500 clamp(48px,5.6vw,76px)/.98 Georgia,"Noto Serif TC",serif;letter-spacing:-2px;color:var(--g);margin:18px 0 24px}
.landing-lead{font-size:18px;line-height:1.75;color:#56615b;max-width:590px}
.editorial-visual{display:grid;grid-template-columns:1.55fr .9fr;grid-template-rows:1fr 1fr;gap:10px;min-height:520px}
.editorial-visual .img{border-radius:18px;overflow:hidden;background:var(--sand);position:relative}
.editorial-visual .img img{width:100%;height:100%;object-fit:cover;display:block}
.editorial-visual .mainimg{grid-row:1 / span 2}
.editorial-visual .caption{position:absolute;left:16px;bottom:14px;color:#fff;font:500 20px Georgia,serif;text-shadow:0 1px 10px #0008}
.editorial-visual .caption small{display:block;font:11px Inter,sans-serif;letter-spacing:1px;margin-top:3px}
.editorial-quote{position:absolute;right:18px;top:16px;background:rgba(250,248,245,.9);padding:12px 15px;border-radius:12px;color:var(--g);font:16px Georgia,serif;max-width:180px}
.price{font:500 30px Georgia,serif;color:var(--g);margin:26px 0}
.price span{font:14px Inter,system-ui,sans-serif;color:var(--muted)}
.bigbtn{padding:15px 22px;border-radius:999px;margin:5px 8px 5px 0}
.landing-section{padding:82px 32px;text-align:center;max-width:1240px;margin:auto}
.landing-section h2{font:500 46px/1.12 Georgia,"Noto Serif TC",serif;color:var(--g);margin:12px auto 18px;max-width:900px}
.landing-section p{font-size:17px;line-height:1.75;color:var(--muted);max-width:820px;margin:0 auto 28px}
.editorial-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:42px;text-align:left}
.editorial-grid .tile{min-height:230px;border-radius:18px;overflow:hidden;position:relative;background:#ddd}
.editorial-grid .tile img{width:100%;height:100%;object-fit:cover;display:block}
.editorial-grid .tile span{position:absolute;left:16px;bottom:14px;color:#fff;font:500 22px Georgia,serif;text-shadow:0 1px 10px #0008}
.editorial-grid .tile small{display:block;font:10px Inter,sans-serif;letter-spacing:1.5px;margin-top:4px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.feature-grid div{padding:32px;border-right:1px solid var(--line)}
.feature-grid div:last-child{border-right:0}
.feature-grid b{display:block;font:500 36px Georgia,serif;color:var(--g)}
.feature-grid span{display:block;color:var(--muted);margin-top:6px}
.landing-section.dark{max-width:none;background:var(--g);color:#fff}
.landing-section.dark h2{color:#fff}.landing-section.dark p{color:#d9e3dd}
.landing-foot{text-align:center;padding:30px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
@media(max-width:850px){.landing-hero{grid-template-columns:1fr;padding:35px 20px 55px}.editorial-visual{min-height:420px}.editorial-grid{grid-template-columns:1fr 1fr}.landing-section{padding:65px 20px}.feature-grid{grid-template-columns:1fr}.feature-grid div{border-right:0;border-bottom:1px solid var(--line)}.feature-grid div:last-child{border-bottom:0}}
@media(max-width:520px){.editorial-visual{grid-template-columns:1fr 1fr;min-height:360px}.landing-hero h1{font-size:48px}.editorial-grid{grid-template-columns:1fr}.landing-nav{padding:0 18px}}
.checklist{display:grid;gap:10px;margin:22px 0}.checkitem{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer}.checkitem input{width:18px;height:18px;margin-top:3px;accent-color:var(--g)}.checkitem.done{background:#f2f6f2;border-color:#cbd9cc}.checkitem b{display:block;font-size:13px;margin-bottom:3px}.checkitem small{color:var(--muted);font-size:11px}.mini-progress{height:7px;background:#e8e5de;border-radius:99px;overflow:hidden;margin:10px 0 18px}.mini-progress i{display:block;height:100%;background:var(--g);width:0}.content-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.micro{padding:18px;background:#f5f4ef;border-radius:15px;margin-top:14px}.micro h3{font:500 20px Georgia,serif;margin:4px 0 8px}.micro p{margin:0;color:#555d57}.stepnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--mist);color:var(--g);font-size:10px;font-weight:800;margin-right:8px}.challenge{background:#edf2ed}.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;cursor:pointer;text-align:left}.choice.sel{background:#e4eee7;border-color:#a9bcae;color:var(--g);font-weight:800}.checkin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.rangeval{font:500 25px Georgia,serif;color:var(--g)}.reviewbox{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fcfbf8}.nav-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}@media(max-width:850px){.content-grid,.checkin-grid{grid-template-columns:1fr}.choicegrid{grid-template-columns:1fr 1fr}}</style></head><body>

function stats(){let l=0,a=0,r=0;weeks.forEach(w=>{w.lessons.forEach((_,i)=>l+=!!state.lessons[key('l',w.week,i+1)]);w.daily_actions.forEach((_,i)=>a+=!!state.actions[key('a',w.week,i+1)]);r+=!!state.reviews[w.week]});let done=l+a+r;return{l,a,r,done,pct:Math.round(done/(60+84+12)*100)}}

function checkin(w){const x=weeks[w-1],ex=state.reviews[w]||{rating:0,note:'',full:0,difficulty:0,context:[]},c=getCurr(w);chosen=ex.rating||0;return `<div class="page"><a class="muted" href="#/week/${w}">← 第 ${w}</a><section class="card check section"><p class="eyebrow">WEEKLY REVIEW · WEEK ${w}</p><h1>停下來．觀察．調整</h1><p class="lead">這不是打分數，而是把這週的生活資料整理成下一週可用的決策。</p><div class="checkin-grid" style="margin-top:24px"><div class="reviewbox"><div class="field"><label>這週整體感受</label><div class="rating">${[1,2,3,4,5].map(n=>`<button class="rate ${ex.rating===n?'sel':''}" onclick="rate(${n})">${n}</button>`).join('')}</div></div><div class="field"><label>本週最常見的飽足感</label><div class="rating">${[1,2,3,4,5].map(n=>`<button class="full ${ex.full===n?'sel':''}" onclick="pickReview('full',${n})">${n}</button>`).join('')}</div><small class="muted">1 = 很餓 · 3 = 剛好 · 5 = 很撐</small></div><div class="field" style="margin-top:18px"><label>本週難度</label><div class="rating">${[1,2,3,4,5].map(n=>`<button class="difficulty ${ex.difficulty===n?'sel':''}" onclick="pickReview('difficulty',${n})">${n}</button>`).join('')}</div><small class="muted">1 = 很容易 · 5 = 很困難</small></div></div><div class="reviewbox"><div class="field"><label>最常遇到的情境（可複選）</label><div class="choicegrid">${['時間不夠','外食','工作／壓力','家人一起吃','不知道怎麼選','其他'].map(t=>`<button class="choice ${ex.context?.includes(t)?'sel':''}" onclick="toggleReviewContext('${esc(t).replace(/'/g,"\\'")}')">${esc(t)}</button>`).join('')}</div></div><div class="field" style="margin-top:18px"><label for="reviewNote">什麼有效？什麼困難？下週要繼續什麼？</label><textarea id="reviewNote" rows="8" placeholder="例如：外食框架很有幫助；加班時最難；下週我要繼續先找蛋白質……">${esc(ex.note||'')}</textarea></div></div></div><div class="micro"><p class="eyebrow">最後一句</p><h3>下週我要繼續＿＿＿＿＿＿。</h3><p class="muted">把一件真的有效的事情留下來，比再增加十條規則更有價值。</p></div><button class="btn primary" style="margin-top:15px" onclick="saveReview(${w})">儲存每週回顧</button></section></div>`}
function pickReview(k,n){state._reviewDraft=state._reviewDraft||{};state._reviewDraft[k]=n;document.querySelectorAll('.'+k).forEach(x=>x.classList.remove('sel'));event.target.classList.add('sel')}
function toggleReviewContext(t){state._reviewDraft=state._reviewDraft||{};let a=state._reviewDraft.context||[];a=a.includes(t)?a.filter(x=>x!==t):a.concat(t);state._reviewDraft.context=a;event.target.classList.toggle('sel',a.includes(t))}
function saveReview(w){const old=state.reviews[w]||{},draft=state._reviewDraft||{};state.reviews[w]={rating:chosen||old.rating||0,full:draft.full||old.full||0,difficulty:draft.difficulty||old.difficulty||0,context:draft.context||old.context||[],note:document.getElementById('reviewNote').value};delete state._reviewDraft;save();toast('第 '+w+' 週回顧已儲存');render()}
function progress(){setTop('進度');const s=stats();return `<div class="page"><p class="eyebrow">你的進度</p><section class="progressHero"><div><h1>保持前進的節奏。</h1><p>${s.done} 個已完成步驟，持續在你的 90 天系統中前進。</p><div class="track"><i style="width:${s.pct}%"></i></div></div><div class="big">${s.pct}%</div></section><section class="section"><div class="stats"><div class="card stat"><b>${s.l}/60</b><span>課程</span></div><div class="card stat"><b>${s.a}/84</b><span>每日行動</span></div><div class="card stat"><b>${s.r}/12</b><span>每週回顧</span></div></div></section><section class="section"><p class="eyebrow">每週進度</p><h2>你的完整旅程</h2><div class="grid" style="margin-top:14px">${weeks.map(w=>{let l=w.lessons.filter((_,i)=>state.lessons[key('l',w.week,i+1)]).length,a=w.daily_actions.filter((_,i)=>state.actions[key('a',w.week,i+1)]).length,p=Math.round((l+a+(state.reviews[w.week]?1:0))/13*100);return `<a class="weekrow" href="#/week/${w.week}"><span class="weekno">週 ${String(w.week).padStart(2,'0')}</span><div><h3>${esc(w.title)}</h3><p>${l}/5 課程 · ${a}/7 行動 · ${state.reviews[w.week]?'已完成回顧':'尚未回顧'}</p></div><span class="tag ${p===100?'current':''}">${p===100?'完成':p+'%'}</span></a>`}).join('')}</div></section></div>`}
function bonus(){setTop('加值資源庫');return `<div class="page"><p class="eyebrow">加值資源庫</p><h1 class="display">把真正有用的工具放在手邊。</h1><p class="lead">五份實用資源，專為你需要快速答案的時刻設計，而不是再上一堂長課。</p><section class="section grid g3">${bonuses.map((b,i)=>`<article class="bonus"><div class="num">BONUS ${String(i+1).padStart(2,'0')}</div><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p><button class="btn soft" onclick="openBonus(${i})">查看資源 →</button></article>`).join('')}</section></div>`}
function openBonus(i){toast(bonuses[i][0]+' opened — resource preview ready')}
function completion(){setTop('我的健康行動手冊');const pb=state.playbook||{};const s=stats();return `<div class="page"><section class="card completion section"><div class="seal">✓</div><p class="eyebrow" style="margin-top:20px">你的長期系統</p><h1>${s.pct>=90?'恭喜你——你已建立自己的健康行動手冊。':'你的健康行動手冊正在成形。'}</h1><p class="lead">把真正有效的方法整理成個人系統，讓你在 90 天之後也能持續使用。</p></section><section class="section playgrid"><div class="card"><p class="eyebrow">飲食規則</p><h2>我的 3 條規則</h2><div class="grid"><input id="rule1" value="${esc(pb.rule1||'')}" placeholder="規則 1"><input id="rule2" value="${esc(pb.rule2||'')}" placeholder="規則 2"><input id="rule3" value="${esc(pb.rule3||'')}" placeholder="規則 3"></div></div><div class="card"><p class="eyebrow">預設選擇</p><h2>我的常用餐點</h2><textarea id="meals" rows="8" placeholder="早餐／午餐／晚餐預設選擇……">${esc(pb.meals||'')}</textarea></div><div class="card"><p class="eyebrow">活動</p><h2>我的最低活動量</h2><textarea id="movement" rows="6" placeholder="平常一週我可以重複的活動……">${esc(pb.movement||'')}</textarea></div><div class="card"><p class="eyebrow">重整流程</p><h2>我的每週回顧</h2><textarea id="review" rows="6" placeholder="我什麼時候回顧？會問自己什麼？">${esc(pb.review||'')}</textarea></div></section><button class="btn primary" style="margin-top:18px" onclick="savePlaybook()">儲存我的健康行動手冊</button></div>`}
function savePlaybook(){state.playbook={rule1:rule1.value,rule2:rule2.value,rule3:rule3.value,meals:meals.value,movement:movement.value,review:review.value};save();toast('行動手冊已儲存')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function landing(){return `<div class="landing"><header class="landing-nav"><a class="brand" href="/"><span class="logo">90</span><span><b>90 天健康重整</b><small>控糖與體重</small></span></a><a class="btn primary" href="/dashboard">開始</a></header><main><section class="landing-hero"><div><p class="eyebrow">90-DAY PRACTICAL HEALTH RESET</p><h1>小小的選擇。<br>持續的行動。<br>真正的改變。</h1><p class="landing-lead">一套為真實生活設計的 90 天飲食與生活習慣系統。特別為外食、忙碌工作與沒有時間複雜計算的人設計。</p><div class="price">US$19 <span>— 一次付款・一次購買</span></div><a class="btn primary bigbtn" href="/dashboard">開始我的 90 天重整 →</a><a class="btn outline bigbtn" href="#learn">查看 12 週內容 ↓</a><p style="font-size:12px;color:var(--muted);margin-top:18px">教育用途，不提供診斷、治療或個人化醫療建議。</p></div><div class="editorial-visual"><div class="img mainimg"><img src="meal-hq.jpg" alt="均衡餐盤"><div class="editorial-quote">Small choices.<br>Consistent actions.</div><div class="caption">均衡餐盤<small>吃得簡單・吃得平衡</small></div></div><div class="img"><img src="movement-hq.jpg" alt="簡單活動"><div class="caption">保持活動<small>Simple Movement</small></div></div><div class="img"><img src="learning-hq.jpg" alt="學習與成長"><div class="caption">學習與成長<small>Learn Clearly</small></div></div></div></section><section class="landing-section" id="learn"><p class="eyebrow">WHY THIS WORKS</p><h2>不是另一套嚴格飲食規則。</h2><p>真正困難的是早餐店、餐廳、便利商店、加班、聚餐、旅行與壓力下的每一次選擇。這套系統把健康習慣拆成你真的能做到的小步驟。</p><div class="editorial-grid"><div class="tile"><img src="simple-hq.jpg" alt="生活平衡"><span>生活保持平衡<small>LIVE BALANCED</small></span></div><div class="tile"><img src="movement-hq.jpg" alt="簡單活動"><span>簡單活動<small>STAY ACTIVE</small></span></div><div class="tile"><img src="learning-hq.jpg" alt="學習"><span>清楚學習<small>LEARN CLEARLY</small></span></div><div class="tile"><img src="balance-hq.jpg" alt="平衡"><span>穩定前進<small>KEEP BALANCED</small></span></div></div><div class="feature-grid"><div><b>12 週</b><span>引導式微課程</span></div><div><b>84 個</b><span>每日行動</span></div><div><b>5 份</b><span>實用 Bonus 工具</span></div></div></section><section class="landing-section dark"><p class="eyebrow">學習 → 選擇 → 行動 → 追蹤 → 回顧 → 調整</p><h2>不是追求完美，而是建立你的下一個好選擇。</h2><p>從 GI 與碳水、均衡餐盤、食品標籤，到外食、便利商店、份量、簡單活動與壓力管理，12 週一步一步建立可持續的方法。</p><a class="btn" style="background:#fff;color:var(--g)" href="/dashboard">開始 90 天重整 →</a></section><section class="landing-section"><p class="eyebrow">完整內容</p><h2>一套可以帶進真實生活的 90 天系統。</h2><p>12 週課程、每週回顧、五份加值指南、90 天習慣追蹤器，以及最後的個人健康行動手冊。</p><a class="btn primary" href="/dashboard">立即開始 →</a></section></main><footer class="landing-foot">教育用途，不提供診斷、治療、治癒、預防或個別化醫療建議。</footer></div>`}

function render(){let path=location.pathname.replace(/\/+$/,'')||'/';let h=location.hash.replace(/^#/,'');if(h) path=h;let m=path.match(/^\/(?:week|weeks)\/(\d+)$/);if(m) path='/week/'+m[1];m=path.match(/^\/(?:lesson)\/(\d+)\/(\d+)$/);if(m) path='/lesson/'+m[1]+'/'+m[2];m=path.match(/^\/(?:action)\/(\d+)\/(\d+)$/);if(m) path='/action/'+m[1]+'/'+m[2];m=path.match(/^\/(?:checkin)\/(\d+)$/);if(m) path='/checkin/'+m[1];m=path.match(/^\/(?:challenge)\/(\d+)$/);if(m) path='/challenge/'+m[1];m=path.match(/^\/(?:flex)\/(\d+)$/);if(m) path='/flex/'+m[1];let v;if(path==='/')v=landing();else if(path==='/dashboard')v=dashboard();else if(/^\/week\/\d+$/.test(path))v=week(+path.split('/')[2]);else if(/^\/lesson\/\d+\/\d+$/.test(path)){let q=path.split('/');v=lesson(+q[2],+q[3]);}else if(/^\/action\/\d+\/\d+$/.test(path)){let q=path.split('/');v=action(+q[2],+q[3]);}else if(/^\/checkin\/\d+$/.test(path))v=checkin(+path.split('/')[2]);else if(/^\/challenge\/\d+$/.test(path))v=challenge(+path.split('/')[2]);else if(/^\/flex\/\d+$/.test(path))v=flex(+path.split('/')[2]);else if(path==='/progress')v=progress();else if(path==='/bonus')v=bonus();else if(path==='/completion')v=completion();else v=landing();document.getElementById('view').innerHTML=v;document.querySelectorAll('[data-nav]').forEach(a=>{let r=path.split('/')[1]||'dashboard';a.classList.toggle('active',a.dataset.nav===r)});}

window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');render();
</script></body></html>
