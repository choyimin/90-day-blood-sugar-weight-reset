"寫結果。","找一個可以提前處理的環節。"],["遇到一次衝動。","看時間。","做一個短暫非食物活動。","10 分鐘後重新評估。","記下暫停改變了什麼。"],["列出三個非食物壓力出口。","挑最簡單的一個。","今天使用一次。","觀察使用前後感受。","把它加入壓力備案。"],["回想一次不滿意的選擇。","不計算補償。","寫下一餐正常選擇。","找一個觸發因素。","寫下下次備案。"],["在一次壓力情境使用「辨識 → 暫停 → 選擇」。","記下觸發。","完成短暫停頓。","做出當下選擇。","記下結果，不批判。"],["回看五個 Learn。","選一個最有效的壓力方法。","找一個高風險時段。","設計一個提前提醒。","完成「下週我要繼續＿＿」。"]],"11":[["選一次旅行／外出餐。","保留一個熟悉錨點。","加入一個平衡元素。","享受真正想吃的部分。","記下下一餐正常選擇。"],["選一次慶祝情境。","選最想享受的一樣。","慢慢吃。","其餘依飢餓與喜好決定。","記下最滿意的部分。"],["寫三句社交回應。","選最自然的一句。","在一次情境使用。","觀察對方反應。","記下最自在的說法。"],["回想一次吃多。","不做補償。","安排下一餐。","照常活動。","記下一個真正原因。"],["建立恢復卡。","寫觸發情境。","寫停止自責的一句話。","寫下一餐。","寫第二天最低活動。"],["在真實聚會中使用本週框架。","保留一個享受選擇。","做一個平衡選擇。","不補償。","記下恢復速度。"],["回看本週五個 Learn。","選最有用的恢復原則。","找最常發生的失誤情境。","寫一個備案。","完成「下週我要繼續＿＿」。"]],"12":[["回看近期紀錄。","列出三個曾經有效的方法。","為每個寫一個真實例子。","刪掉不必要規則。","選出前三名。"],["寫下五條想保留的規則。","縮成一句一句。","刪除重複。","留下三條最實用的。","各寫一個使用情境。"],["選三個最常需要快速決定的餐。","各寫一個預設。","各準備一個替代。","記下取得方式。","整理成快捷清單。"],["寫理想活動量。","縮成最低版本。","設定觸發時間。","寫旅行／室內備案。","加入每週行程。"],["選固定每週回顧時間。","回看飲食、活動與情境。","寫一個有效的方法。","寫一個卡住的地方。","只決定下週一件事。"],["挑一個忙碌日測試你的個人系統。","使用一個飲食規則。","使用一個預設餐。","完成最低活動量。","記下哪裡最需要簡化。"],["回看 90 天。","選出三個最值得留下的工具。","寫出一頁式個人行動手冊。","決定下週如何繼續。","完成你的長期承諾句。"]]};
const lessonRichOverrides={"2-1":{"why":"碳水化合物是身體重要的能量來源。控糖不是把碳水全部拿掉，而是先知道哪些食物含有碳水、它們來自哪裡，再學會判斷品質與份量。","example":"白飯、麵、吐司、燕麥、地瓜、水果、豆類與乳品都可能提供碳水。含糖飲也會快速增加碳水，卻容易讓人忽略自己喝進去的量。","judge":["這食物主要提供碳水嗎？","它是較完整的來源，還是高度精製的來源？","這個份量放進整餐是否合理？"],"do":["選今天的一餐。","圈出飯、麵、麵包、根莖、水果與含糖飲等碳水來源。","把較完整與精製的來源分開看。","估計每一項的大約份量。","寫下一個你今天最想進一步了解的碳水來源。"],"cta":"今天先學會「看見碳水」：知道它從哪裡來。","tip":"碳水不是敵人；看懂來源，才有選擇。"},"2-2":{"why":"GI 是用來比較含碳水食物讓血糖上升速度的工具。它回答的是「速度的相對差異」，不是「這食物健不健康」。","example":"例如同樣是主食，不同食物的 GI 可能不同；但實際影響還會受到份量、纖維、加工、烹調與整餐搭配影響。","judge":["我是在比較相近的食物嗎？","我看到的 GI 是在說速度，不是健康分數嗎？","除了 GI，我還知道這食物的份量與纖維嗎？"],"do":["找兩種你常吃的含碳水食物。","比較它們的 GI 資訊。","同時記下每份碳水與纖維。","說出哪一個資訊最能幫你做決定。","寫下你不會再用 GI 判斷什麼。"],"cta":"今天把 GI 當成「速度資訊」，不要把它當健康分數。","tip":"GI 有用，但永遠不是唯一答案。"},"2-3":{"why":"GI 與份量是兩件不同的事。GI 描述速度；份量則決定你實際吃進多少碳水。控糖時兩個都要看。","example":"一大碗低 GI 主食仍可能提供很多碳水；因此不能因為「低 GI」就忽略份量。","judge":["這食物的 GI 如何？","我實際吃了多少？","把品質與份量放在一起後，我會怎麼調整？"],"do":["選今天的一餐主食。","估計實際吃的份量。","查看每份碳水資訊或可靠資料。","比較「小份／大份」對整餐的差異。","記下品質與份量各自告訴你的事情。"],"cta":"今天練習「GI 看速度，份量看總量」。","tip":"低 GI 不等於可以無限量；份量永遠要回到整餐。"},"2-4":{"why":"食物搭配會改變一餐的結構。把碳水和蛋白質、蔬菜與其他高纖食物放在一起，比只盯著某一種食物更接近真實飲食。","example":"白飯配魚肉與青菜，和單獨吃一大份精製澱粉，是不同的餐點結構；搭配也會影響飽足與實際選擇。","judge":["這餐有蛋白質嗎？","有蔬菜、豆類或其他纖維來源嗎？","我可以用現有食物補哪一塊？"],"do":["選一餐含碳水的餐。","找出蛋白質來源。","找出蔬菜或其他纖維來源。","保留喜歡的主食，再看份量。","記下搭配後的飽足與滿足感。"],"cta":"今天不要只問「吃多少碳水」，先問「碳水和什麼一起吃」。","tip":"完整的餐點結構，比單獨追一個數字更實用。"},"2-5":{"why":"較好的碳水選擇，通常是增加較少精製、較有纖維、份量合適的來源，而不是建立食物黑名單。","example":"全穀、燕麥、豆類、地瓜等可以成為日常選項；白飯、麵與麵包也不是一律禁止，而是回到品質、份量與搭配。","judge":["加工程度如何？","這個來源有沒有纖維或其他營養？","我喜歡、買得到，而且願意長期吃嗎？"],"do":["選一種你常吃的主食。","找一個較少精製或纖維較高的替代。","比較口味、價格與取得難度。","實際吃一次。","把你願意長期使用的版本存進清單。"],"cta":"今天找到一個「更好、也真的會吃」的碳水選擇。","tip":"最好的選擇不是理論上完美，而是你願意反覆使用。"},"3-1":{"why":"均衡餐盤的價值，是把控糖與體重管理中最重要的幾件事放在同一張餐桌上：非澱粉類蔬菜、蛋白質與適量碳水。你不用每餐計算，只要先看結構，就比較不容易讓精製澱粉或高熱量配料占滿整餐。","example":"便當常見白飯很多、青菜少、肉類有但不一定足夠。你可以先把餐盒想成三塊：大約一半放非澱粉類蔬菜，四分之一蛋白質，四分之一主食；實際仍依個人需求、餐點大小與醫療建議調整。","judge":["蔬菜、蛋白質、碳水三區都有嗎？","哪一區比例明顯過多或不足？","如果只能補一區，哪一個最能讓這餐更完整？"],"do":["選今天的一餐，先不要改任何食物。","指出餐中的非澱粉類蔬菜、蛋白質與碳水。","估計三區的大約比例，不需要秤重。","只調整最失衡的一區，例如加一份青菜或把主食改成較合適份量。","吃完記下：這個餐盤是否讓你更容易吃到舒服的飽足感。"],"cta":"今天用「1/2 蔬菜＋1/4 蛋白質＋1/4 碳水」看一次真實餐盤。","tip":"餐盤法是視覺化起點，不是硬性比例；重點是讓整餐不要只剩下主食。"},"3-2":{"observe":"今天可以在早餐、午餐、晚餐、點心或運動後，直接找出一個清楚的蛋白質來源，看看它怎麼和主食、蔬菜組成完整的一餐。","why":"蛋白質是身體維持、修復與建立組織的重要營養素，也是均衡餐盤中不可忽略的一塊。蛋白質由胺基酸組成，身體會利用這些胺基酸合成與更新肌肉、酵素、荷爾蒙及其他組織。對有運動習慣的人來說，足夠且分布合理的蛋白質也能支持運動後的肌肉修復與訓練適應；但蛋白質不是越多越好，仍要回到整體飲食與個人需求。","example":"早餐只有吐司和甜飲、午餐只有一大碗麵，都可能讓一餐主要由碳水構成。把蛋、魚、雞肉、瘦肉、豆腐、豆類、無糖豆漿或無糖乳品加入餐點，可以讓蛋白質成為清楚的主角。運動後則可以把蛋白質和適量碳水一起安排，支持恢復，而不是只喝高糖飲品。","judge":["這餐的主要蛋白質來源是哪一個？","它提供的是相對完整、少加工的蛋白質來源嗎？同時是否帶來很多糖、精製澱粉或油脂？","如果今天要補一份蛋白質，哪個來源最方便、符合口味，也能長期重複？"],"do":["選今天的一餐，先找到蛋白質主角。","寫下來源：蛋、魚、雞肉、瘦肉、豆腐、豆類或無糖乳品等。","估計它在整餐中的份量，不需要精算克數。","如果這餐蛋白質很少，加入一個你容易取得的來源。","記下吃完後的飽足感與便利性，選出一個你願意重複的蛋白質備案。"],"cta":"今天先找到每餐的「蛋白質主角」，再安排其他食物。","tip":"蛋白質提供胺基酸，支持肌肉與組織的維持、修復與更新；有運動習慣時，規律攝取也能支持恢復與訓練適應。若有腎臟疾病或其他特殊醫療需求，蛋白質份量應依醫療專業建議調整。","extra":"<div class=\"lesson-info-grid\"><div><b>優質蛋白質從哪裡來？</b><span>蛋、魚、雞肉、瘦肉、豆腐、豆類、無糖豆漿、無糖優格／乳品</span></div><div><b>蛋白質為什麼重要？</b><span>胺基酸是建造與更新肌肉、酵素、荷爾蒙與其他組織的重要原料。</span></div><div><b>有運動時呢？</b><span>運動後提供蛋白質，有助肌肉修復與訓練適應；搭配適量碳水更貼近完整恢復。</span></div></div>"},"3-3":{"observe":"今天從你真的會吃的食物找纖維：燕麥、豆類、蔬菜、水果、全穀、堅果或種子，看看不同來源如何自然放進一餐。","why":"膳食纖維不是只有「幫助排便」。不同纖維在腸道中的作用不同，其中水溶性纖維可以吸水形成凝膠，幫助延緩消化與吸收；非水溶性纖維則增加糞便體積、幫助腸道蠕動。實際食物通常同時含有兩類纖維，因此最實用的做法不是背名詞，而是增加多樣的植物性食物。","example":"燕麥、薏仁、大麥、豆類、蘋果、柑橘、奇亞籽與亞麻籽等可提供較多水溶性纖維；全穀、麥麩、堅果種子、蔬菜與帶皮蔬果則常提供較多非水溶性纖維。你可以從早餐加燕麥、午餐加豆類或蔬菜、點心選水果與堅果開始，而不是一次大幅改變。","judge":["這餐有沒有植物性食物提供纖維？","我需要增加的是水溶性來源、非水溶性來源，還是單純增加整體植物性食物的多樣性？","哪一個來源最容易加入我的日常，而且我願意長期吃？"],"do":["選今天的一餐，先找出已經有的蔬菜、豆類、全穀、水果、堅果或種子。","選一個新的纖維來源加入餐點，例如燕麥、豆類、菇類、蔬菜或水果。","若增加纖維較多，同時留意水分攝取與腸胃適應。","保留你原本喜歡的蛋白質與主食，不需要把整餐推翻重做。","記下哪一種纖維來源最容易取得、最好吃，也最值得下次重複。"],"cta":"今天為一餐增加一個「真正來自食物的纖維來源」。","tip":"水溶性與非水溶性是方便理解的分類，但多數天然食物兩者都有。增加纖維以食物為主、循序漸進，通常比一次大量補充更容易適應。","extra":"<div class=\"fiber-table-wrap\"><table class=\"fiber-table\"><thead><tr><th>類型</th><th>主要特性</th><th>常見食物來源</th><th>你可以怎麼用</th></tr></thead><tbody><tr><td><b>水溶性纖維</b></td><td>吸水形成凝膠，可延緩消化與吸收；部分可被腸道菌利用。</td><td>燕麥、大麥、豆類、蘋果、柑橘、奇亞籽、亞麻籽</td><td>早餐燕麥、餐中加豆類、優格加水果與種子</td></tr><tr><td><b>非水溶性纖維</b></td><td>增加糞便體積，支持腸道蠕動。</td><td>全穀、麥麩、堅果種子、蔬菜、帶皮蔬果</td><td>主食加入全穀、餐盤增加蔬菜、保留可食用果皮</td></tr></tbody></table><p class=\"table-note\">重點：多數天然食物同時含有兩類纖維，不必把食物硬分成「只有水溶性」或「只有非水溶性」。</p></div>"},"3-4":{"observe":"今天在便當、外食或超市裡，用顏色先找蔬菜，再特別留意一種深綠或十字花科蔬菜，觀察它怎麼補上餐盤。","why":"非澱粉類蔬菜是把餐盤變得更豐富、更多樣的簡單方法。它們通常能提供纖維、維生素、礦物質與植化素，同時以較低的澱粉比例增加餐盤體積。學會用顏色與類別辨認，比死背一長串蔬菜名稱更容易在外食、便當與超市裡快速做決定。","example":"你可以先用「五色」增加多樣性：紅色番茄、紅椒；橘黃色彩椒、胡蘿蔔；綠色菠菜、青江菜；紫色茄子、紫高麗菜；白色花椰菜、洋菇。再特別留意十字花科與深綠蔬菜，例如青花菜、花椰菜、高麗菜、芥藍、菠菜、地瓜葉等。馬鈴薯、玉米、地瓜雖然也有營養，但在餐盤規劃上通常更接近碳水區，不必拿來計入蔬菜區。","judge":["這份食物主要是非澱粉類蔬菜，還是同時提供大量澱粉、比較適合放在碳水區？","今天的餐盤有沒有至少一種看得見的蔬菜？能不能用不同顏色增加多樣性？","如果只能補一份蔬菜，哪一種最容易取得、最符合我的口味與預算？"],"do":["挑今天的一餐，先找出已經有的非澱粉類蔬菜。","用顏色判斷：今天是綠、紅、橘黃、紫，還是白色系？","若沒有深綠或十字花科蔬菜，選一種容易取得的加入，例如青菜、花椰菜或高麗菜。","把蔬菜放回整個餐盤，不用拿它取代所有主食或蛋白質。","記下你最容易在外食、便利商店或家裡取得的三種蔬菜，建立自己的常用清單。"],"cta":"今天讓一餐多出一份「看得見、顏色不同的非澱粉類蔬菜」。","tip":"五色是增加多樣性的視覺方法，不是硬性規定；十字花科與深綠蔬菜都是很實用的日常選項。玉米、馬鈴薯、地瓜不是壞食物，只是在餐盤法中通常更接近碳水區。","extra":"<div class=\"veg-info-grid\"><div><b>🔴 紅色</b><span>番茄、紅椒、紅高麗菜<br>可提供茄紅素、花青素等植化素。</span></div><div><b>🟠🟡 橘黃色</b><span>彩椒、胡蘿蔔、黃椒<br>常見類胡蘿蔔素來源。</span></div><div><b>🟢 深綠色</b><span>菠菜、青江菜、芥藍、地瓜葉<br>常見葉酸、維生素 K 與多種微量營養素來源。</span></div><div><b>🟣 紫色</b><span>茄子、紫高麗菜<br>常見花青素來源。</span></div><div><b>⚪ 白色</b><span>花椰菜、洋菇、白蘿蔔<br>提供纖維與多種植物性營養。</span></div><div><b>🥦 十字花科</b><span>青花菜、花椰菜、高麗菜、芥藍、蘿蔔<br>含硫代葡萄糖苷等植化素。</span></div></div>"},"3-5":{"why":"真正會改變飲食的，不是你能不能畫出理想餐盤，而是你能不能用手邊的食物組成一頓完整、可負擔、願意再吃的餐。把方法放進真實餐點，才會從知識變成能力。","example":"便利商店可以用雞胸肉或茶葉蛋搭配沙拉、毛豆，再選適量地瓜或全穀飯；便當則可以先找蛋白質與青菜，再決定白飯或其他主食的份量。不同食物都可以套用同一個結構。","judge":["這餐有沒有清楚的蛋白質？","有沒有非澱粉類蔬菜或其他纖維來源？","碳水來源是什麼、份量是否適合這一餐？"],"do":["選一個你今天真的會吃的餐點，不要另外做理想餐。","先圈出蛋白質，再找非澱粉類蔬菜或纖維來源。","最後看主食種類與份量，優先選較少精製的來源時就練習一次。","完成餐點後記下哪一區最容易缺。","把這份成功組合存成你的「下次直接照著選」範本。"],"cta":"今天完成一份「蛋白質＋蔬菜／纖維＋適量碳水」的真實餐。","tip":"你不需要每餐都完美；能在平常會遇到的餐點裡重現，就是這堂課真正的成果。"},"4-1":{"observe":"今天拿一項你真的會買、會吃的包裝食品，先不要看糖或熱量，第一眼只找「每份量」與「每包幾份」，把標籤的計算單位看懂。","why":"食品標籤的第一個關鍵不是哪個數字最低，而是「這些數字到底對應多少食物」。營養標示常以每份為基準；如果一包有多份，而你實際吃了兩份，糖、碳水、纖維與蛋白質等數字都要跟著倍增。要做出正確比較，先把每份量看懂。","example":"真實情境：例如一包零食標示每份 30 公克、每包 3 份。如果你一次吃完整包，標示上的每份數字不能直接當成整包的攝取量；實際吃了 3 份，就要把每份營養數字乘以 3。另一方面，「每份量」是標示計算單位，不等於告訴你一定應該吃多少。今天拿一項你真的會買、會吃的包裝食品，先不要看糖或熱量，第一眼只找「每份量」與「每包幾份」，把標籤的計算單位看懂。","judge":["每份量用什麼單位？公克、毫升、幾片或其他？","整個包裝共有幾份？我實際通常吃幾份？","如果我吃的量和一份不同，哪些營養數字需要跟著換算？"],"do":["拿一項你常買的包裝食品。","找到每份量，寫下單位與數字。","找到每包／每盒共有幾份。","估計你實際會吃幾份，選一個營養數字做倍數換算。","把「每份」與「我實際吃的量」分開記下來。"],"cta":"今天先把「每份量」讀對，再看其他數字。","tip":"每份量是標籤的計算單位，不是你的飲食命令。若要比較兩個產品，先確認它們的標示基準是否相同。","extra":"<div class=\"lesson-info-grid\"><div><b>每份量 ≠ 建議吃多少</b><span>它主要告訴你營養數字以多少食物為計算基準。</span></div><div><b>每包有幾份？</b><span>這決定你吃完整包時，標示數字需要乘幾倍。</span></div><div><b>比較時看基準</b><span>不同產品可用每份或每 100 公克／毫升的資訊輔助比較，但仍要回到實際食用量。</span></div></div>","exampleHtml":"<p><strong>真實情境：</strong></p><p>例如一包零食標示每份 30 公克、<strong>每包 3 份</strong>。</p><p>如果你一次吃完整包，標示上的每份數字不能直接當成整包的攝取量；實際吃了 <strong>3 份</strong>，就要把每份營養數字<strong>乘以 3</strong>。</p><p>另一方面，「<strong>每份量</strong>」是<strong>標示計算單位</strong>，不等於告訴你一定應該吃多少。</p><p>今天拿一項你真的會買、會吃的包裝食品，先不要看糖或熱量，第一眼只找「<strong>每份量</strong>」與「<strong>每包幾份</strong>」，把標籤的計算單位看懂。</p>","observeInExample":true},"4-2":{"why":"碳水化合物可以來自糖、澱粉與其他碳水來源；如果只看到「糖很低」就認為對血糖影響很小，可能忽略了產品仍含有不少總碳水。「碳水化合物淨量＝碳水化合物總量－膳食纖維－糖醇－甘油」作為練習公式；因此購買時仍要以產品實際標示為準。膳食纖維含量越高，通常代表食物含有較多不被人體完全消化吸收的纖維成分；在餐點中增加高纖食物，也有助於延長飽足感。","whyHtml":"碳水化合物可以來自糖、澱粉與其他碳水來源；如果只看到「糖很低」就認為對血糖影響很小，可能忽略了產品仍含有不少總碳水。<br><br><strong>碳水化合物淨量＝碳水化合物總量－膳食纖維－糖醇－甘油</strong><br><br>這裡把公式作為本課程的練習方式；因此購買時仍要以產品實際標示為準。膳食纖維含量越高，通常代表食物含有較多不被人體完全消化吸收的纖維成分；在餐點中增加高纖食物，也有助於延長飽足感。","example":"例如一項食品每份總碳水 20 g、膳食纖維 6 g、糖醇 4 g、甘油 1 g，依公式計算，淨碳水為 9 g。如果另一項食品總碳水 12 g、膳食纖維只有 1 g，即使糖只有 2 g，也不能只因為「糖少」就忽略「總碳水」。實際選購時，可以先練習尋找每份膳食纖維 5 g 以上、糖 5 g 以下的食品，再把它放回整餐判斷。","exampleHtml":"<p>例如一項食品</p><p class=\"example-line\">每份總碳水 20 g、膳食纖維 6 g、糖醇 4 g、甘油 1 g，</p><p class=\"example-line\">依公式計算，淨碳水為 9 g。</p><p>如果另一項食品</p><p class=\"example-line\">總碳水 12 g、膳食纖維只有 1 g，即使糖只有 2 g，</p><p class=\"example-line\">也不能只因為「糖少」就忽略「總碳水」。</p><p class=\"example-final\">實際選購時，可以先練習尋找每份膳食纖維 5 g 以上、糖 5 g 以下的食品，再把它放回整餐判斷。</p>","judge":["先看總碳水是多少，而不是只看糖嗎？","膳食纖維是否至少有 5 公克？這項食品是否能帶來較持久的飽足感？","糖是否為 5 公克以下？如果有糖醇或甘油，是否已了解標示與可能的腸胃反應？"],"do":["拿一項你常吃的包裝食品，記下每份總碳水。","找出膳食纖維，優先練習尋找每份 5 公克以上的高纖食品。","找出糖，今天練習尋找每份 5 公克以下的選項。","如果標示有糖醇或甘油，依課程公式做一次淨碳水練習；大量食用糖醇可能造成腹脹、放氣或腹瀉等腸胃不適。","把最後選擇放回整餐：記下你為什麼選它，而不是只看一個數字。"],"cta":"今天同時看「總碳水、纖維、糖」，不要只被低糖兩個字吸引。","tip":"本課程的快速練習門檻：膳食纖維至少 5 g、糖 5 g 以下。纖維來源以天然食物為主並循序增加；糖醇對血糖的影響依種類而異，大量攝取可能造成腸胃不適。","extra":"<div class=\"lesson-info-grid\"><div><b>淨碳水｜課程快速公式</b><span>碳水化合物淨量＝碳水化合物總量－膳食纖維－糖醇－甘油。這是本課程用來練習標籤比較的快速公式。</span></div><div><b>膳食纖維 ≥ 5 g</b><span>優先尋找每份膳食纖維 5 公克以上的食物。高纖食物通常需要較長時間消化，也有助於讓飽足感維持更久。</span></div><div><b>糖 ≤ 5 g</b><span>把每份糖 5 公克以下作為本課程的簡單篩選門檻，再回頭看總碳水與整餐。</span></div><div><b>糖醇／甘油</b><span>糖醇的血糖影響通常低於一般糖，但不同種類不同；大量食用可能造成腸胃不適。甘油是否列入營養標示與計算方式，也可能依產品與規範不同。</span></div></div>"},"4-3":{"why":"添加糖值得學，是因為「糖」與「添加糖」不是完全相同的概念。食品中的糖可能天然存在，也可能在製作過程中另外加入。乳製產品就是很好的例子：牛奶與無糖乳製品本身可以含有天然乳糖；看到糖的數字時，還要進一步看成分表，判斷是否另外加入砂糖、糖漿或其他甜味來源。","example":"例如原味牛奶或無糖優格可能有天然糖分，但不代表一定有另外添加糖。相對地，調味優格、甜味穀片或甜飲可能在天然糖之外再加入砂糖、糖漿等。依本課程的簡單篩選方式，可先尋找每份含糖量 5 公克或以下的選項，再查看成分表是否另外加入甜味來源。","exampleHtml":"<p>真實情境：例如原味牛奶或無糖優格可能有天然糖分，但不代表一定有另外添加糖。</p><p>相對地，調味優格、甜味穀片或甜飲可能在天然糖之外再加入砂糖、糖漿等。依課程的簡單篩選方式，可先尋找每份含糖量 5 公克或以下的選項，再查看成分表是否另外加入甜味來源。</p>","judge":["每份糖是多少？是否為 5 公克或以下？","這些糖可能來自天然食材，還是成分表中有另外添加的糖？","乳製產品的天然糖分是否被我誤認成添加糖？"],"do":["選一項乳製品或其他包裝食品。","記下每份糖的數字，先找 5 公克或以下的選項。","查看成分表前幾項，找砂糖、糖漿等另外加入的甜味來源。","如果是乳製產品，分辨天然乳糖與另外添加的糖。","記下你最後選擇的理由，練習不要只看包裝正面的「低糖」宣稱。"],"cta":"今天練習「糖的數字＋成分表」一起看。","tip":"乳製產品可以含有天然糖分；「有糖」不等於「有添加糖」。本課程的快速練習門檻是每份糖 5 g 或以下，最後仍要看完整標籤與整餐。","extra":"<div class=\"lesson-info-grid\"><div><b>天然糖分</b><span>例如乳製品中的乳糖，可能是食物本身自然存在的糖。</span></div><div><b>另外添加的糖</b><span>例如砂糖、糖漿等，在製作過程中另外加入，需要從成分表辨認。</span></div><div><b>課程快速門檻</b><span>優先練習尋找每份糖 5 公克或以下的食品，再進一步判斷糖的來源。</span></div></div>"},"4-4":{"why":"纖維與蛋白質都是讀標籤時很值得一起看的資訊。膳食纖維可以增加食物體積、支持飽足感，也讓飲食中的植物性食物更容易被看見；蛋白質則是均衡餐盤的重要元素。對控糖與體重管理而言，看到低糖食品還不夠，還要問：它有沒有足夠的纖維與蛋白質？整餐能不能因此更完整？","example":"例如兩款同類食品都標示糖 5 公克以下，但 A 每份纖維 1 公克、蛋白質 2 公克；B 每份纖維 5 公克、蛋白質 6 公克。B 不代表一定是「健康食品」，但它提供的纖維與蛋白質資訊值得進一步比較，也要同時查看總碳水、脂肪、鈉、成分表與實際份量。","exampleHtml":"<p>真實情境：例如兩款同類食品都標示糖 5 公克以下</p><p>A 每份纖維 1 公克、蛋白質 2 公克；<br>B 每份纖維 5 公克、蛋白質 6 公克。</p><p>B 不代表一定是「健康食品」，但它提供的纖維與蛋白質資訊值得進一步比較，也要同時查看總碳水、脂肪、鈉、成分表與實際份量。</p>","judge":["每份膳食纖維是否至少 5 公克？","每份蛋白質是多少？是否能成為整餐中的一個來源？","除了纖維與蛋白質，總碳水、糖、脂肪與成分表是否也合理？"],"do":["找兩項同類食品。","分別記下每份總碳水、糖、纖維與蛋白質。","先圈出纖維至少 5 公克的選項，再看蛋白質差異。","補看脂肪、鈉與成分表，避免只用單一數字下結論。","選出更符合你日常用途的一項，並寫下理由。"],"cta":"今天用「纖維＋蛋白質＋總碳水」一起比較兩項食品。","tip":"膳食纖維至少 5 g 可以作為本課程的練習門檻；蛋白質則要回到食品種類與整餐需求，不是越高越好。","extra":"<div class=\"lesson-info-grid\"><div><b>纖維｜至少 5 g</b><span>先找每份膳食纖維 5 公克以上的選項，建立高纖判讀習慣。</span></div><div><b>蛋白質｜放回整餐</b><span>看它能不能補上餐盤中的蛋白質區，而不是只追求最高數字。</span></div><div><b>最後再看完整標籤</b><span>總碳水、糖、脂肪、鈉與成分表仍然需要一起判斷。</span></div></div>"},"4-5":{"why":"讀懂完整標籤的目的，不是找一個「最低」的數字，而是快速看懂一項食品的整體品質與用途。卡路里不代表一切，真正重要的是食物品質與你實際吃多少；當你在外用餐或選包裝食品時，留意卡路里含量可以幫助你比較餐點。脂肪也不能只看「越低越好」：依本課程的簡單篩選方式，可以先留意每份脂肪 5 公克以下的食品，同時保留來自橄欖油、堅果等食物的較佳脂肪來源。閱讀標籤時也要注意，零脂肪不一定代表更好，部分產品可能透過增加糖或其他配料維持口感；低脂也不能只看名稱，仍要一起比較糖、鈉、脂肪與成分表。最後，選購食品時，成分清單較短、名稱較容易理解，通常更方便建立可重複的選擇。","example":"下面的示範營養標籤依照你提供的圖表結構整理。它不是在宣稱某一產品一定健康，而是讓你練習逐項讀懂：每份量 48.7 公克（2 份）、本包裝 14 份；每份 171.6 大卡、蛋白質 20 g、脂肪 5.4 g、飽和脂肪 1 g、反式脂肪 0 g、碳水化合物 15.9 g、糖 1 g、膳食纖維 10 g、鈉 228 mg。這個示範也很適合練習：脂肪 5.4 g 稍高於本課程 5 g 的簡單篩選門檻，但同時有 10 g 纖維、20 g 蛋白質與 1 g 糖，所以不能只看單一數字就下結論。","exampleHtml":"<p>真實情境：下面的示範營養標籤</p><p>讓你練習逐項讀懂：每份量 48.7 公克（2 份）、本包裝 14 份；每份 171.6 大卡、蛋白質 20 g、<strong>脂肪 5.4 g</strong>、飽和脂肪 1 g、反式脂肪 0 g、碳水化合物 15.9 g、糖 1 g、膳食纖維 10 g、鈉 228 mg。</p><p>這個示範很適合練習：<strong>脂肪 5.4 g</strong> 稍高於本課程 5 g 的簡單篩選門檻，但同時有 <strong>10 g 纖維</strong>、<strong>20 g 蛋白質</strong>與 <strong>1 g 糖</strong>，所以不能只看單一數字就下結論。</p>","judge":["每份量與整包份數是否清楚？我實際會吃幾份？","卡路里、脂肪、總碳水、糖、纖維與蛋白質放在一起看，這項食品適合我的用途嗎？","脂肪是否在課程練習門檻 5 公克以下？如果不是，它的脂肪來源與其他營養資訊如何？","成分表是否夠短、名稱是否大多是我能理解的食材？"],"do":["拿一項你常買的包裝食品，先記下每份量與整包份數。","記下卡路里與每份脂肪；課程中先練習尋找每份脂肪 5 公克以下的選項，同時留意橄欖油、堅果等較佳脂肪來源。","記下總碳水、糖與纖維；練習找糖 5 公克以下、纖維至少 5 公克的食品。","記下蛋白質，再往下看完整成分表，特別留意糖、糖漿與你不熟悉的成分。","最後用一句話分類：常用／偶爾／這次不選，並寫下最主要的理由。"],"cta":"今天完成一次完整標籤掃描，從「看數字」進步到「做判斷」。","tip":"卡路里是資訊，不是食品品質的全部。脂肪可先用 5 g／份作為本課程的簡單篩選；零脂肪不一定更好，也要看糖、鈉與成分表。選購包裝食品時，成分清單較短、名稱較容易理解，通常更方便建立長期選擇。","extra":"<div class=\"nutrition-label-wrap\"><div class=\"nutrition-label-demo\"><div class=\"nl-title\">營養標示｜示範版</div><div class=\"nl-serving\">每一份量 48.7 公克（2 份）<br>本包裝含 14 份</div><div class=\"nl-head\"><span>每份</span><span>每日參考值百分比</span></div><div class=\"nl-row strong\"><span>熱量</span><b>171.6 大卡</b><em>8%</em></div><div class=\"nl-row\"><span>蛋白質</span><b>20 公克</b><em>33%</em></div><div class=\"nl-row\"><span>脂肪</span><b>5.4 公克</b><em>9%</em></div><div class=\"nl-row indent\"><span>飽和脂肪</span><b>1 公克</b><em>6%</em></div><div class=\"nl-row indent\"><span>反式脂肪</span><b>0 公克</b><em>*</em></div><div class=\"nl-row strong\"><span>碳水化合物</span><b>15.9 公克</b><em>5%</em></div><div class=\"nl-row indent\"><span>糖</span><b>1 公克</b><em>*</em></div><div class=\"nl-row strong\"><span>膳食纖維</span><b>10 公克</b><em>40%</em></div><div class=\"nl-row\"><span>鈉</span><b>228 毫克</b><em>11%</em></div><div class=\"nl-note\">示範數字依你提供的營養標示圖表整理，用於學習閱讀順序與判斷方式。</div></div><div class=\"nl-guide\"><b>閱讀順序</b><span>① 每份量 → ② 卡路里 → ③ 脂肪 → ④ 總碳水 → ⑤ 糖 → ⑥ 纖維 → ⑦ 蛋白質 → ⑧ 成分表</span><b>脂肪提醒</b><span>本課程先用每份 5 g 以下作為簡單篩選。好脂肪來源可來自橄欖油、堅果等天然食物；零脂肪 ≠ 一定更好。</span><b>成分表提醒</b><span>優先選成分清單較短、名稱較容易理解的食品，再回到整餐與實際份量判斷。</span></div></div>"},"5-1":{"why":"早餐不一定是人人都必須吃的固定規則，但對有早餐習慣的人來說，它可以成為一天的穩定支點。重點是早餐的結構與後續感受。","example":"如果早餐只有甜麵包與含糖飲，有些人很快又餓；加入蛋白質、纖維與適量碳水，可以讓餐點更完整。","judge":["我通常幾點吃？","這餐有蛋白質與纖維嗎？","吃完後到下一餐的狀態如何？"],"do":["回想三天早餐。","找出共同模式。","標出蛋白質、纖維與碳水。","找最需要補強的一區。","做一個小調整並觀察結果。"],"cta":"今天把早餐當成「一天的支點」來檢查。","tip":"不是規定你一定要吃早餐，而是教你安排第一餐。"},"5-2":{"why":"早餐常見的問題不是「吃了早餐」，而是精製澱粉、甜飲很多，蛋白質與纖維不足，或因方便而缺少完整結構。","example":"甜麵包＋含糖飲、吐司配大量果醬、只有咖啡，都是可以拿來練習判斷的情境。","judge":["主要碳水在哪？","蛋白質在哪？","如果只能改一件事，哪件最值得？"],"do":["選你的平常早餐。","找出精製或含糖來源。","找出蛋白質缺口。","只改一件事。","記下便利性與飽足感的變化。"],"cta":"今天找出你的早餐最大弱點，只改一件事。","tip":"一次修一個最值得修的地方。"},"5-3":{"why":"「蛋白質＋纖維」是一個簡單的早餐組合概念，再依個人需求加入合適的碳水與飲料。這比背固定菜單更容易長期使用。","example":"蛋、無糖豆漿、原味優格可以搭配燕麥、全穀、水果或蔬菜，形成不同版本。","judge":["蛋白質來源是什麼？","纖維來源是什麼？","碳水份量是否適合這一餐？"],"do":["選一個早餐情境。","先選蛋白質。","加入一個纖維來源。","安排適量碳水。","記下便利、口味與飽足。"],"cta":"今天做一份「蛋白質＋纖維」早餐。","tip":"組合比單一食物更重要。"},"5-4":{"why":"忙碌早餐真正需要解決的是「取得容易＋不用想太久」，而不是追求理想食譜。","example":"便利商店、早餐店或辦公室都可以用蛋白質、纖維、適量碳水與無糖飲組合。","judge":["10 分鐘內取得得到嗎？","有蛋白質嗎？","精製澱粉或甜飲是否占太多？"],"do":["選一個常去的早餐地點。","找兩個蛋白質選項。","找一個纖維來源。","飲料選無糖。","把組合存成忙碌日預設。"],"cta":"今天建立一個忙碌早晨也做得到的早餐。","tip":"方便可以是優勢，不是妥協。"},"5-5":{"why":"早餐公式的價值，是讓你不用每天重新決定。固定結構、替換食材，就能建立穩定又有彈性的早餐系統。","example":"「蛋白質＋高纖食物＋適量碳水＋無糖飲」是一個結構，不是固定菜單。","judge":["哪些元素是你的核心？","哪些食物可以互換？","哪個版本最容易維持？"],"do":["寫出你的早餐公式。","列三種蛋白質。","列三種纖維／植物性來源。","列兩種碳水。","選出三個預設早餐。"],"cta":"今天完成你的三套早餐預設。","tip":"預設越清楚，越不靠臨時意志力。"},"6-1":{"why":"外食時，前面學過的餐盤與碳水原則要變成「點餐順序」，才能真正幫助你在有限時間內做決定。","example":"先找蛋白質，再找蔬菜／纖維，最後決定主食與飲料，是一個簡單的外食框架。","judge":["蛋白質在哪？","蔬菜或纖維在哪？","主食與飲料怎麼調整？"],"do":["打開菜單。","先圈兩個蛋白質選項。","找蔬菜／纖維。","決定主食與飲料。","記下這個順序是否省時間。"],"cta":"今天用「蛋白質→蔬菜→主食／飲料」點一次餐。","tip":"先決定餐的結構，再處理細節。"},"6-2":{"why":"早餐店選項有限，但仍可以從蛋白質、蔬菜與飲料三個地方做小調整，不必把喜歡的食物全部刪掉。","example":"蛋餅、吐司、漢堡都可以搭配蛋、肉類、蔬菜與無糖飲，重點是整餐結構。","judge":["蛋白質在哪？","主食份量如何？","飲料能否選無糖？"],"do":["選常去的早餐店。","找蛋白質來源。","找蔬菜或其他纖維。","飲料選無糖。","存一個可複製組合。"],"cta":"今天在早餐店完成一次「完整組合」。","tip":"不必放棄喜歡的食物，先改善組合。"},"6-3":{"why":"速食的選項有限，因此最實用的方法不是追求完美，而是先抓住飲料、蛋白質、配菜與份量這幾個高影響點。","example":"漢堡、炸物等不需要被視為失敗；你仍可以在有限選項裡做更有意識的組合。","judge":["有蛋白質嗎？","飲料含糖嗎？","配菜與主食份量如何？"],"do":["選一家速食店。","先選蛋白質主體。","飲料選無糖。","看看是否能增加蔬菜或較合適的配菜。","寫下一個最重要的改善。"],"cta":"今天練習「有限選項下的最佳選擇」。","tip":"不是每次都完美，先抓最大影響點。"},"6-4":{"why":"外送最容易在很餓時快速下單，因此需要一個在按下訂單前就能完成的快速檢查。","example":"先找主菜蛋白質、蔬菜與主食，再決定飲料與加點，可以降低臨時亂選的機率。","judge":["蛋白質在哪？","蔬菜在哪？","主食與飲料是否符合今天情境？"],"do":["打開外送平台。","先選蛋白質主菜。","加一份蔬菜／纖維。","選主食與飲料。","下單前做一次整餐檢查。"],"cta":"今天在外送平台做一次「下單前整餐檢查」。","tip":"先決定結構，再看口味與加點。"},"6-5":{"why":"聚餐不是課程之外，而是真正需要使用技能的地方。你可以享受社交，同時保留幾個自己的決策點。","example":"先找蛋白質與蔬菜，再選真正想吃的食物，吃到舒服後再決定是否繼續。","judge":["我最重要的選擇是哪個？","哪些食物是我真的想吃？","我能否享受，同時保留下一餐的彈性？"],"do":["預先選一個原則。","到場先找蛋白質與蔬菜。","挑真正想吃的。","吃到舒服再決定是否續盤。","記下最自然的策略。"],"cta":"今天在聚餐只練一個核心原則。","tip":"社交生活本身就是健康決策的練習場。"},"7-1":{"why":"便利商店最需要的是「組合能力」，而不是背品牌。只要知道先找什麼，你就能快速組成一餐。","example":"用蛋白質、蔬菜／纖維、適量碳水與無糖飲組合，就能在很多商品中做判斷。","judge":["蛋白質在哪？","纖維在哪？","主食與飲料如何搭？"],"do":["進店前先決定要買一餐。","先找蛋白質。","再找蔬菜／纖維。","最後選主食與飲料。","記下你的購物順序。"],"cta":"今天完成一份便利商店均衡餐。","tip":"先會組合，再建立自己的常用清單。"},"7-2":{"why":"便利商店的蛋白質選擇很多，學會比較「蛋白質、糖、份量與便利性」，比只記一個商品名稱更有用。","example":"茶葉蛋、無糖豆漿、雞肉、魚、豆腐與原味乳品都可能成為選項。","judge":["它是清楚的蛋白質來源嗎？","糖與份量如何？","哪個最方便、最符合今天情境？"],"do":["找三個蛋白質選項。","看蛋白質與糖資訊。","比較價格與份量。","選一個今天真的會吃的。","存成常用選項。"],"cta":"今天建立你的便利商店蛋白質清單。","tip":"常用選項越清楚，臨時購餐越輕鬆。"},"7-3":{"why":"便利商店餐常缺植物性食物；一份即食蔬菜或高纖選項，就能補上餐盤的重要區塊。","example":"沙拉、毛豆、海帶、蔬菜杯等可依供應與個人喜好選擇。","judge":["這餐有植物性食物嗎？","哪個能直接吃或快速處理？","哪個是我願意重複購買的？"],"do":["找一個蔬菜／高纖選項。","確認能直接搭配。","加入原本餐點。","吃完觀察滿足感。","記下最方便的選項。"],"cta":"今天為便利商店餐補上一個纖維來源。","tip":"方便的纖維來源也算好選擇。"},"7-4":{"why":"飲料很容易在不知不覺中增加糖與碳水，因此是建立低門檻控糖習慣的好入口。","example":"含糖茶飲、汽水、果汁與調味咖啡都可能含糖；水、無糖茶與無糖咖啡可以成為預設。","judge":["有添加糖嗎？","總碳水多少？","哪個無糖版本我願意長期喝？"],"do":["拿兩種常喝飲料。","看標示。","比較糖與總碳水。","選一個無糖版本。","實際喝一次並記下接受度。"],"cta":"今天練習「飲料先看糖」。","tip":"一個容易重複的飲料選擇，可以成為很有價值的習慣。"},"7-5":{"why":"預設餐能在忙碌時降低決策負擔。核心不是固定吃同一套，而是固定結構、食材可以替換。","example":"蛋白質＋蔬菜／纖維＋適量主食＋無糖飲，可以用很多便利商店商品完成。","judge":["缺哪一區？","哪個商品能補位？","下次能否三分鐘內重現？"],"do":["建立一份便利商店組合。","寫兩個蛋白質替換。","寫一個纖維替換。","寫一個主食替換。","存成自己的預設餐。"],"cta":"今天建立第一份便利商店預設餐。","tip":"預設是幫未來的自己省決策力。"},"8-1":{"why":"份量會影響一餐提供的碳水與能量；學份量不是要求你永遠計算，而是建立沒有秤也能判斷的能力。","example":"同一食物，小份與大份對整餐的影響不同。","judge":["主食大約多少？","蛋白質與蔬菜比例如何？","吃完是剛好、仍餓還是過撐？"],"do":["選一餐。","估主食份量。","看蛋白質與蔬菜。","吃到一半停一下。","記下飽足感。"],"cta":"今天觀察一餐份量，不需要秤。","tip":"先學會看，再決定是否需要更精準。"},"8-2":{"why":"手掌法提供一個沒有秤時的視覺估量起點，讓份量判斷可以帶進餐廳、辦公室與旅行。","example":"可用手掌、拳頭等身體尺度估量不同食物，再依個人情況與餐點調整。","judge":["我現在估的是哪一類食物？","哪個身體尺度最容易使用？","放進我的餐具裡好不好判斷？"],"do":["選一餐。","用手掌估蛋白質。","用拳頭或餐盤估其他區塊。","完成一餐。","記下最自然的估量方法。"],"cta":"今天用手掌法估一次份量。","tip":"這是工具，不是毫米級精準的測量。"},"8-3":{"why":"餐盤法看「結構」，份量方法看「大小」；兩者一起使用，比只盯著某一種食物更接近真實生活。","example":"主食很多、蛋白質與蔬菜很少，即使秤得很準，整餐仍可能不完整。","judge":["三個區塊都有嗎？","哪一區明顯過大或過小？","最小改動可以補哪裡？"],"do":["選一餐。","先看三區。","再估主食與蛋白質。","做一個小調整。","記下調整後的感受。"],"cta":"今天把「餐盤＋份量」一起使用。","tip":"先看結構，再看大小。"},"8-4":{"why":"餐廳份量常比家裡大。辨識份量，可以讓你保留喜歡的食物，而不必因為「一定要吃完」而忽略身體訊號。","example":"分享、留下部分、打包或吃到舒服就停，都可以是合理選項。","judge":["這份餐比平常大多少？","我真的需要全部吃完嗎？","哪種處理方式最自然？"],"do":["選一次餐廳餐點。","先觀察份量。","吃到一半停一下。","決定繼續、分享、留下或打包。","記下原因。"],"cta":"今天練習一次「份量由我決定」。","tip":"吃不完不是失敗。"},"8-5":{"why":"飽足感是身體訊號，不是成績分數。它可以幫助你重新判斷「我還需要多少」。","example":"餐前很餓時可能吃得快；中途停一下，可以重新確認是否還需要繼續。","judge":["餐前有多餓？","吃到一半還需要多少？","餐後是剛好、仍餓還是過撐？"],"do":["選一餐。","餐前記 0–10。","吃到一半停 30 秒。","餐後記飽足 0–10。","寫一句造成差異的因素。"],"cta":"今天做一次「中途停一下」。","tip":"身體訊號是資料，不是評分。"},"9-1":{"why":"活動能幫助身體使用能量，也有助於體適能與日常功能；真正重要的是找到可以持續的最低起點。","example":"走路、家務、爬樓梯與短段活動都可以累積，不一定要一次完成完整運動。","judge":["什麼活動最容易增加？","哪個時段最穩定？","我的最低版本是多少？"],"do":["回看今天的活動。","找一段可增加 5–10 分鐘的時間。","安排並完成活動。","記下活動前後感受。","決定是否值得重複。"],"cta":"今天增加一小段你做得到的活動。","tip":"可長期維持，比一次爆量更重要。"},"9-2":{"why":"走路是低門檻活動，可以拆成短段落並綁定既有生活，讓「運動」不再一定需要完整空檔。","example":"午餐後、通勤、晚餐後或工作間隔都可能成為固定走路時段。","judge":["什麼時段最容易？","多久我最願意？","什麼事情可以提醒我？"],"do":["選一個固定時段。","先從 10 分鐘開始。","完成後記實際時間。","觀察是否容易重複。","設定固定觸發。"],"cta":"今天走 10 分鐘，找到一個可重複的時段。","tip":"把走路綁在生活，比靠意志力穩。"},"9-3":{"why":"打斷久坐是一種不需要完整運動時段的日常策略。短暫起身與活動，可以讓一天增加更多動作機會。","example":"起身倒水、走去開會、短伸展，都可以成為工作日的活動節點。","judge":["我最常久坐哪段時間？","什麼提醒最有效？","最小活動可以是什麼？"],"do":["找最長的久坐時段。","設定提醒。","起身走動或伸展 2–5 分鐘。","記下身體感受。","決定明天是否重複。"],"cta":"今天打斷一次長時間久坐。","tip":"沒有完整運動，也可以先動一下。"},"9-4":{"why":"肌力活動有助於維持肌肉與身體功能。初學者重點是控制、規律與安全，不是追求重量或把自己操到極限。","example":"坐站、牆壁伏地挺身等都可以依能力調整；若出現疼痛或不適，應停止並尋求專業建議。","judge":["我能安全控制動作嗎？","需要降低難度嗎？","每週哪一天最適合？"],"do":["選 2–3 個簡單動作。","少量完成並保留餘裕。","注意穩定與呼吸。","不適就停止。","記下最適合你的動作。"],"cta":"今天完成一次短版、能力允許的肌力練習。","tip":"目標是建立能力，不是把自己操爆。"},"9-5":{"why":"最低活動量是「再忙也有機會做到」的版本，讓習慣在壞日子仍有出口。","example":"它可以是每天短走、規律起身或每週固定短肌力，依個人生活與身體狀況設定。","judge":["忙碌日也做得到嗎？","什麼時間觸發？","怎麼知道自己有做到？"],"do":["寫下你的最低活動量。","指定觸發時間。","設定忙碌日版本。","完成一次並記錄。","放進下週行程。"],"cta":"今天正式定義你的最低活動量。","tip":"最低不是偷懶，而是習慣的安全底線。"},"10-1":{"why":"壓力會影響食慾、注意力與選擇。先看見「壓力→進食」的連結，比責怪自己意志力差更有用。","example":"忙碌、疲累或睡眠不足時，有些人會更想吃甜食或方便食物。","judge":["我真的餓嗎？","壓力或疲勞參與多少？","我能先做哪個小動作？"],"do":["記下一次壓力時刻。","記身體餓感。","記情緒與疲勞。","觀察原本想做的選擇。","寫一個下次可用的步驟。"],"cta":"今天辨認一次「壓力→食物選擇」。","tip":"辨認不是責怪，而是增加選擇空間。"},"10-2":{"why":"情緒性飲食是一種可以觀察的行為模式，不是道德問題。觸發可能來自壓力、無聊、孤單、疲累或環境。","example":"下午看到零食就想吃，觸發可能不只是餓，也可能是疲勞或「食物就在眼前」。","judge":["什麼時間發生？","當時身體與情緒狀態如何？","環境中什麼最有影響？"],"do":["選一次想吃零食的時刻。","記時間與情境。","辨認身體、情緒與環境線索。","不批判自己。","找一個可以提前設計的環節。"],"cta":"今天找出一個主要觸發因素。","tip":"知道觸發點，才有機會提前準備。"},"10-3":{"why":"暫停不是禁止自己吃，而是在衝動與行動之間留一點空間。這段空間可以讓你重新辨認真正需求。","example":"先走動、喝水、呼吸或離開食物幾分鐘，再重新判斷是否真的想吃。","judge":["衝動有多強？","我需要食物，還是需要調節情緒？","幾分鐘後我仍然想吃嗎？"],"do":["遇到一次衝動。","停 5–10 分鐘。","做一個非食物活動。","重新判斷。","記下暫停前後的差異。"],"cta":"今天練習一次 10 分鐘暫停。","tip":"目的不是忍耐，而是增加選項。"},"10-4":{"why":"好的因應策略不是「永遠不吃」，而是先辨認需求，再選擇休息、活動、情緒調節或正常進食。","example":"如果是真的餓，就應該正常吃；不要把所有進食都當成情緒性飲食。","judge":["我是餓，還是需要調節情緒？","哪種因應方式符合真正需求？","如果餓，我能否選一份完整餐點？"],"do":["回想一次壓力進食。","判斷當時餓感。","選一個符合需求的因應方式。","如果仍餓就正常吃。","記下哪種方法有效。"],"cta":"今天建立你的「壓力來時，我可以做什麼」清單。","tip":"更多選項，比更多禁令更有用。"},"10-5":{"why":"恢復比失誤本身更重要。一次吃多或沒運動，不需要用極端節食或過度運動補償。","example":"晚餐吃多後，下一餐可以正常回到餐盤、份量與飲料策略，而不是跳餐。","judge":["我是在恢復，還是在補償？","下一個正常選擇是什麼？","這次提供了什麼資訊？"],"do":["記一次偏離。","不做補償。","安排下一個正常餐。","找出可能的觸發因素。","寫一個下次備案。"],"cta":"今天練習「下一餐正常回來」。","tip":"穩定不是從不偏離，而是知道怎麼回來。"},"11-1":{"why":"旅行時保留少數核心原則，比攜帶一整套規則更容易。你需要的是能在陌生環境快速使用的框架。","example":"旅館早餐、機場與便利商店都可以用蛋白質、植物性食物、適量碳水與飲料快速組合。","judge":["今天最重要的原則是哪一個？","哪一餐最不確定？","可以提前準備什麼？"],"do":["看行程。","找最不確定的一餐。","準備一個蛋白質或高纖備案。","先決定飲料。","記下最有用的策略。"],"cta":"今天替下一次旅行準備一個預設餐。","tip":"旅行是練習彈性，不是停止計畫。"},"11-2":{"why":"節日與慶祝是生活的一部分。健康選擇不是拒絕所有喜歡的食物，而是學會選擇、享受與自然恢復。","example":"你可以選真正想吃的甜點，正常享受，再回到下一個平衡餐，而不是進入補償循環。","judge":["我真正想吃什麼？","哪些只是因為眼前有？","吃完能否自然回到下一餐？"],"do":["選一個慶祝情境。","挑真正想吃的食物。","慢慢吃並注意滿足。","不補償。","記下最滿意的選擇。"],"cta":"今天練習一次「有選擇地享受」。","tip":"享受不是失敗。"},"11-3":{"why":"社交壓力可能讓人吃下自己其實不想吃的東西。簡單、自然的界線，可以保留關係也保留自己的選擇。","example":"「我先吃這些就好」「我現在剛好」都可以自然表達界線，不需要長篇解釋。","judge":["我是真的想吃嗎？","怎麼說最自然？","哪一個界線值得練習？"],"do":["想一個社交情境。","寫一句自己的回應。","用自然語氣說出來。","在真實情境使用。","記下自己的感受。"],"cta":"今天練習一句自己的社交界線。","tip":"界線不是拒絕人，而是保留選擇。"},"11-4":{"why":"吃多後最重要的是避免補償循環。極端限制可能讓下一次飢餓與失控更強；真正需要的是回到正常節奏。","example":"下一餐回到蛋白質、蔬菜、適量碳水與正常份量，比跳餐或懲罰性運動更穩定。","judge":["下一餐怎麼回到平常？","我有沒有想補償？","這次可以學到什麼原因？"],"do":["記一次吃多。","辨認當時飢餓、情緒與環境。","不跳餐、不刻意補償。","安排下一個正常餐。","寫一個下次要提前處理的點。"],"cta":"今天練習「吃多後不補償」。","tip":"恢復是技能，不是懲罰。"},"11-5":{"why":"無罪惡感重整，是把觀察、選擇、記錄與恢復串成一個循環。這讓一次偏離不會變成「整天都毀了」。","example":"週末聚餐後，不必等星期一；下一餐就能回到餐盤、份量與飲料策略。","judge":["下一個正常選擇是什麼？","哪個工具真的有用？","需要改的是規則，還是環境？"],"do":["回看一次偏離。","選一個已學工具。","在下一餐使用。","記下結果。","把有效方法加入備案。"],"cta":"今天完成一次「偏離→恢復」。","tip":"真正建立的是恢復能力。"},"12-1":{"why":"最後一週不是再增加規則，而是找出 90 天中真正有效、值得留下的少數工具。","example":"可能是無糖飲、早餐預設、餐盤法、標籤閱讀、走路或壓力策略；重點是你真的使用過。","judge":["哪些方法我真的做過？","哪三個最有幫助？","哪些規則可以刪掉？"],"do":["回看 90 天紀錄。","列出五個有效方法。","挑前三名。","各寫一個使用情境。","決定如何保留。"],"cta":"今天找出你的前三個有效工具。","tip":"長期系統應該越來越簡單。"},"12-2":{"why":"個人飲食規則應該是少數、清楚、可執行的原則，而不是禁止清單。","example":"例如「飲料以無糖為預設」「每餐先找蛋白質」「主食看份量」，都比「永遠不能吃某食物」更容易長期使用。","judge":["這條規則有幫助嗎？","什麼時候使用？","偶爾做不到時，我能自然回來嗎？"],"do":["寫五條目前規則。","刪掉過度嚴格或重複的。","縮成三條。","為每條寫使用情境。","確認自己願意長期使用。"],"cta":"今天完成你的三條個人飲食原則。","tip":"好規則讓生活更容易，不讓你更害怕食物。"},"12-3":{"why":"預設餐能在疲累、忙碌或選擇太多時降低決策負擔。它不是固定菜單，而是可靠模板。","example":"你可以為早餐、外食、便利商店與家庭晚餐各建立一個預設，食材可以自由替換。","judge":["哪一餐最需要預設？","有蛋白質、植物性食物與適量碳水嗎？","時間與成本合理嗎？"],"do":["選三個常需快速決定的餐。","各寫一個預設。","各準備一個替代版本。","寫取得方式。","存成快捷清單。"],"cta":"今天建立三份不用思考也能使用的預設餐。","tip":"預設是幫未來的自己省力。"},"12-4":{"why":"最低活動量是最忙時仍能保留的健康行為。它要小到能長期做，也要有明確觸發。","example":"可以是每日短走、規律起身或每週固定短肌力，依你的生活與身體狀況設定。","judge":["最小版本是什麼？","什麼時候最容易做到？","旅行或忙碌時的替代是什麼？"],"do":["寫最低活動量。","指定觸發時間。","設忙碌日版本。","設旅行／室內備案。","放進行程並實際做一次。"],"cta":"今天把最低活動量正式寫進生活。","tip":"能在壞日子存活的習慣，才有機會累積。"},"12-5":{"why":"長期計畫是一套決策系統：怎麼吃、怎麼動、遇到壓力怎麼辦、偏離後怎麼回來。90 天的目的就是讓你能自己使用這套系統。","example":"你應該能說出自己的飲食原則、預 s="landing-section dark"><p class="eyebrow">學習 → 選擇 → 行動 → 追蹤 → 回顧 → 調整</p><h2>不是追求完美，而是建立你的下一個好選擇。</h2><p>從 GI 與碳水、均衡餐盤、食品標籤，到外食、便利商店、份量、簡單活動與壓力管理，12 週一步一步建立可持續的方法。</p><a class="btn" style="background:#fff;color:var(--g)" href="/dashboard">開始 90 天重整 →</a></section><section class="landing-section"><p class="eyebrow">完整內容</p><h2>一套可以帶進真實生活的 90 天系統。</h2><p>12 週課程、每週回顧、五份加值指南、90 天習慣追蹤器，以及最後的個人健康行動手冊。</p><a class="btn primary" href="/dashboard">立即開始 →</a></section></main><footer class="landing-foot">教育用途，不提供診斷、治療、治癒、預防或個別化醫療建議。</footer></div>`}

function render(){let path=location.pathname.replace(/\/+$/,'')||'/';let h=location.hash.replace(/^#/,'');if(h) path=h;let m=path.match(/^\/(?:week|weeks)\/(\d+)$/);if(m) path='/week/'+m[1];m=path.match(/^\/(?:lesson)\/(\d+)\/(\d+)$/);if(m) path='/lesson/'+m[1]+'/'+m[2];m=path.match(/^\/(?:action)\/(\d+)\/(\d+)$/);if(m) path='/action/'+m[1]+'/'+m[2];m=path.match(/^\/(?:checkin)\/(\d+)$/);if(m) path='/checkin/'+m[1];m=path.match(/^\/(?:challenge)\/(\d+)$/);if(m) path='/challenge/'+m[1];m=path.match(/^\/(?:flex)\/(\d+)$/);if(m) path='/flex/'+m[1];let v;if(path==='/')v=landing();else if(path==='/dashboard')v=dashboard();else if(/^\/week\/\d+$/.test(path))v=week(+path.split('/')[2]);else if(/^\/lesson\/\d+\/\d+$/.test(path)){let q=path.split('/');v=lesson(+q[2],+q[3]);}else if(/^\/action\/\d+\/\d+$/.test(path)){let q=path.split('/');v=action(+q[2],+q[3]);}else if(/^\/checkin\/\d+$/.test(path))v=checkin(+path.split('/')[2]);else if(/^\/challenge\/\d+$/.test(path))v=challenge(+path.split('/')[2]);else if(/^\/flex\/\d+$/.test(path))v=flex(+path.split('/')[2]);else if(path==='/progress')v=progress();else if(path==='/bonus')v=bonus();else if(path==='/completion')v=completion();else v=landing();document.getElementById('view').innerHTML=v;document.getElementById('view').classList.toggle('barriers-week',/^\/(?:week|lesson|action|checkin|challenge|flex)\/7(?:\/|$)/.test(path));document.querySelectorAll('[data-nav]').forEach(a=>{let r=path.split('/')[1]||'dashboard';a.classList.toggle('active',a.dataset.nav===r)});}


const week5Days=[{"focus":"用一餐建立早餐的穩定起點","cta":"今天嘗試一份蛋白質＋纖維早餐。","why":"先實際吃一份搭配完整的早餐，才能知道它是否適合你的時間與食慾。蛋白質與纖維食物可增加搭配的多樣性，但仍需觀察整餐份量，不能只靠名稱判斷。","example":"明早在家用蛋、全穀吐司與水果組合一餐；若外購，先找豆漿或蛋，再選主食與含纖維食物。先從原本早餐加一項或換一項開始。","judge":["早餐在什麼時間、地點吃？","蛋白質與含纖維食物分別是什麼？","份量吃得舒服，也有時間完成嗎？"],"steps":["記下今天早餐時間與地點。","選一項蛋白質：蛋、乳品或豆製品。","加入全穀、蔬菜或完整水果等含纖維食物。","按食慾調整主食份量，實際吃一餐。","記下準備時間、吃後感受與下一次餓的時間。"],"notes":"今天先試一餐，保留真實份量與感受，不把一次飽足感當成血糖結論。","labels":["我的早餐食物與大約份量","蛋白質與纖維來源／準備分鐘數","吃後感受、何時又餓、下次想調整什麼"],"ph":["例如：蛋、全穀吐司、番茄；請填自己實際吃的量。","例如：蛋＋全麥／5 分鐘。","記下口味、方便程度與大約時間即可。"]},{"focus":"只找一個早餐問題，做一次替換","cta":"今天找出平常早餐中的一個陷阱。","why":"同時改太多，容易不知道哪個調整有幫助。先看飲料、主食、蛋白質與纖維，選一個最明顯而且做得到的缺口，能讓採買和點餐更具體。","example":"奶茶配甜麵包時，可先把飲料換成無糖豆漿，其他先維持。若問題是買不到早餐，應優先準備備品，而不是再增加營養規則。","judge":["問題是搭配、份量，還是時間與取得？","這次是否只改一個地方？","替代品價格與口味能接受嗎？"],"steps":["列出平常早餐，包含飲料與抹醬。","圈一個缺口或取得上的困難。","在原店家或超市找到一個替代選項。","今天只替換這一項並記下價格差。","比較方便度與感受，決定是否保留。"],"notes":"今天只改一項，保留喜歡的部分，找出真正做得到的選擇。","labels":["原本早餐與我發現的一個問題","這次替換什麼／價格差","口味、方便度與是否保留"],"ph":["例如：甜飲配麵包，缺少明顯蛋白質來源。","例如：奶茶換無糖豆漿；依現場標價記錄。","不必打健康分數，寫可不可以持續。"]},{"focus":"居家早餐預設：在家做得到的蛋白質＋纖維早餐","cta":"今天完成居家早餐預設。","why":"居家版能先用庫存，減少浪費。把蛋白質與含纖維食物具體寫成食材和大約份量，明天就不必從頭想，也能知道要補買什麼。","example":"原味優格配燕麥與水果，或蛋／豆腐配全穀吐司與番茄。先選一組真的喜歡的版本，買少量試吃，避免一次囤貨。","judge":["家裡已經有哪些可用食材？","這組真的有蛋白質與含纖維食物嗎？","製作、收拾與保存能配合早晨嗎？"],"steps":["盤點冰箱與櫥櫃，查看效期。","選定甜式或鹹式的居家早餐。","只採買缺少食材，記下份數。","做一次居家早餐預設，計時並記下食量。","寫一項可替換食材，存成明天可照做的版本。"],"notes":"今天把居家版做一次；能準備、能吃完，比看起來豐盛更重要。","labels":["居家早餐預設：食材、大約份量與做法","需補買品項／實際準備時間","缺貨替代與保存方式"],"ph":["例如：優格、燕麥、水果；寫實際用量與組合順序。","先寫庫存，再寫只需補買的部分。","依包裝保存，寫下下次可以換哪一項。"]},{"focus":"外購早餐預設：買得到、負擔得起的便利早餐","cta":"今天完成外購早餐預設。","why":"外購版要在真實店家成立。先設定整餐預算，確認蛋白質、纖維食物與主食，再記下等待時間和缺貨替代，才能在上班路上重複使用。","example":"早餐店蛋吐司加蔬菜配無糖飲，或便利商店豆漿搭配地瓜與水果。按食量選擇，不需要把每個例子全部買齊。","judge":["店家在需要的時間有開嗎？","整組花費是否在自己的預算內？","缺貨或排隊時有哪個替代？"],"steps":["選一間常去的店，寫下預算。","找到蛋白質來源，再搭配纖維食物與主食。","比較份量、標示與整組價格。","實際購買外購早餐預設，記下等待時間。","寫下缺貨時可換的品項與理由。"],"notes":"今天確認一組現場買得到的早餐，把店家、價格與替代品留下來。","labels":["外購早餐預設：店家、品項與份量","整組價格／等待時間","缺貨替代與選擇理由"],"ph":["寫完整點餐方式，包含飲料。","依你今天實際支付與等待的數字。","例如：沒有豆漿時換哪項蛋白質來源？"]},{"focus":"忙碌早餐備案：為最忙的早晨準備備案","cta":"今天完成忙碌早餐備案。","why":"備案的功能，是讓你在沒有時間思考時仍有食物可用。挑選保存條件符合環境的品項，寫下補貨方式，才能避免備案只留在筆記裡。","example":"確認可常溫保存的未開封無糖豆漿、全穀麵包與水果，可依需求組合。若備案含需冷藏食物，先確定家中或公司能冷藏並按標示保存。","judge":["最忙時剩幾分鐘、在哪裡吃？","食物能按照標示安全保存嗎？","缺貨、吃完或到期後怎麼補貨？"],"steps":["選定最常發生的趕時間情境。","列出不用現場烹調的忙碌早餐備案。","檢查每項食物的效期與保存條件。","準備一次用量與需要的餐具，放在指定位置。","設定補貨時機，整理三份預設的差異。"],"notes":"今天把備案食物與餐具準備好，確認保存方式，而不只是寫出理想菜單。","labels":["忙碌早餐備案：忙碌情境與食材","備品放哪裡／效期與補貨時機","三份預設的共用食材與替代品"],"ph":["例如：晚起，只剩三分鐘；寫能直接取用的組合。","依產品標示寫保存位置與開封後處理。","讓採買集中在真的會使用的食材。"]},{"focus":"忙碌早晨：實際啟用一份預設","cta":"今天在忙碌情境使用一份早餐預設。","why":"預設需要經過真實情境測試，才知道卡在取餐、準備、攜帶還是用餐。這一天先求真的用一次，遇到缺貨就做同類替換，不用因為偏離原清單就放棄整餐。","example":"今天晚起，改用忙碌早餐備案；若備用水果剛好吃完，就先用手邊可取得的組合，之後正常用餐再增加多樣性，同時記下需要補貨。","judge":["今天適合居家、外購還是備案？","最大阻力是哪一個步驟？","下次只提前準備哪一件事就會更順？"],"steps":["記下今天忙碌的原因與可用分鐘數。","從三份預設選一份最符合現況的。","缺一項時做可取得的替換，按食慾吃。","記下實際耗時、替換與吃後感受。","只修正一個阻力：補貨、提早準備或換店家。"],"notes":"今天的成功是忙碌時真的用一次，再修正一個卡點，不需要補做或懲罰。","labels":["今天情境／使用哪一份預設／實際吃什麼","實際耗時與臨時替換","最大阻力與下次的一個準備"],"ph":["記下與原先預設不同的地方也可以。","例如：用了五分鐘；缺水果改用家中其他選项。","寫可執行動作，例如前晚先放好餐具。"]},{"focus":"用本週資料選出最容易持續的早餐","cta":"今天選出最容易執行的早餐預設，安排下一次採買。","why":"最值得保留的早餐，不一定最精緻，而是兼顧口味、搭配、時間與價格，又能反覆使用的版本。回看實際紀錄可找出共用食材，減少不必要採買與浪費。","example":"居家版吃得舒服但備料太多，外購版方便卻較貴。下週可以選居家版為主要選擇，減少食材種類，並保留外購版給最忙的日子。","judge":["哪份最常完成，並符合食慾與口味？","價格、準備時間與食材浪費哪項最需調整？","下週確定會使用幾次，應買多少才吃得完？"],"steps":["回看三份預設與忙碌日的實際紀錄。","比較時間、花費、口味與用餐後感受。","選一份主用早餐和一份備案。","先查庫存，再寫下一次採買的品項與數量。","完成本週 check-in，寫下下週使用情境與補貨時間。"],"notes":"下週保留一份主用早餐、一份備案與一張買得完的清單就好。","labels":["三份預設的比較／主用與備案","下週採買品項、數量與預計使用次數","下週何時使用／何時補貨／要保留的習慣"],"ph":["用時間、花費、口味和感受比較，不用排名健康分數。","先扣除家中庫存，再寫真的需要買的量。","最後前往本週 check-in，留下回顧。"]}];
const week5Lessons=[{"why":"早餐能成為固定點，是因為你可以先決定食物與取得方式，減少早晨臨時選擇。它不是「吃了就會瘦」的保證，也不代表每個人都必須在同一時間進食。這週練習的是：依起床時間、食慾與下一餐時間，準備一份自己吃得下、取得方便、願意重複的早餐。早餐的好處與迷思補充能量：經過一晚未進食，早餐可以補充白天活動需要的能量與營養；但身體的代謝不會因為沒吃早餐就停止，也不需要靠早餐才「啟動」。穩定食慾：合適的早餐安排可能幫助減少之後過度飢餓的情況；是否需要早餐、吃多少與何時吃，仍要依個人作息與食慾調整。健康早餐的原則增加蛋白質與纖維：選擇雞蛋、牛奶或豆製品，搭配全穀類、蔬菜或水果，有助於增加營養多樣性與飽足感。減少精製澱粉與添加糖：減少含糖飲料、甜麵包與油炸食品的頻率或份量，適時換成全穀主食；不是所有加工麵包都需要排除。","exampleHtml":"<p>真實情境：你早上只有十分鐘，常在出門後才想到還沒安排早餐，於是買一杯甜飲配麵包。</p><p>明天可以先備好<strong>蛋＋全穀吐司＋一份水果</strong>，飲料選水或無糖茶；不吃蛋時，可換成無糖豆漿或豆腐等蛋白質來源。</p><p>先試一餐，記下吃了什麼、多久又餓、是否方便。<strong>一次感受是觀察資料，不是血糖測量結果。</strong></p>","observe":"先找出你早晨真正能吃飯的時間與地點，再決定食物。若早上食慾小，可調整份量或安排稍後吃的版本，不必硬套別人的早餐。","judge":["時間：起床到出門有幾分鐘？能在家吃，還是需要到公司再吃？","搭配：是否看得到蛋白質、含纖維的食物與適合自己的主食份量？水果、豆類、全穀也可能同時提供碳水。","可持續：價格、取得方式、保存條件和口味，能不能支持你再做一次？"],"do":["選定明天早餐的時間與地點。","盤點家中已有的蛋、豆漿、燕麥、吐司或水果。","搭配一項蛋白質與一項含纖維食物，主食按食慾調整。","只買缺少的食材，先準備容器或餐具。","實際吃一次，記下方便程度與下一次餓的時間。"],"cta":"今天先試一份蛋白質＋纖維早餐，留下你的真實感受。","tip":"早餐的價值在於適合你的生活。先建立可重複的安排，不用追求一次吃得完美。","whyHtml":"<p>早餐能成為固定點，是因為你可以先決定食物與取得方式，減少早晨臨時選擇。它不是「吃了就會瘦」的保證，也不代表每個人都必須在同一時間進食。<br><br>這週練習的是：依起床時間、食慾與下一餐時間，準備一份自己吃得下、取得方便、願意重複的早餐。</p><h3>早餐的好處與迷思</h3><ul><li><strong>補充能量</strong>：經過一晚未進食，早餐可以補充白天活動需要的能量與營養；但身體的代謝不會因為沒吃早餐就停止，也不需要靠早餐才「啟動」。</li><li><strong>穩定食慾</strong>：合適的早餐安排可能幫助減少之後過度飢餓的情況；是否需要早餐、吃多少與何時吃，仍要依個人作息與食慾調整。</li></ul><h3>健康早餐的原則</h3><ul><li><strong>增加蛋白質與纖維</strong>：選擇雞蛋、牛奶或豆製品，搭配全穀類、蔬菜或水果，有助於增加營養多樣性與飽足感。</li><li><strong>減少精製澱粉與添加糖</strong>：減少含糖飲料、甜麵包與油炸食品的頻率或份量，適時換成全穀主食；不是所有加工麵包都需要排除。</li></ul>","example":"真實情境：你早上只有十分鐘，常在出門後才想到還沒安排早餐，於是買一杯甜飲配麵包。明天可以先備好蛋＋全穀吐司＋一份水果，飲料選水或無糖茶；不吃蛋時，可換成無糖豆漿或豆腐等蛋白質來源。先試一餐，記下吃了什麼、多久又餓、是否方便。一次感受是觀察資料，不是血糖測量結果。","extra":"<div class=\"lesson-info-grid\"><div><b>採買從家裡開始</b><span>先看庫存與效期，列出缺少的一兩樣，避免因為想吃健康而一次買太多。</span></div><div><b>搭配而非禁食</b><span>保留喜歡的主食，看看蛋白質與纖維能從哪裡補上。</span></div><div><b>觀察而非保證</b><span>飽足感也受份量、睡眠、活動與用餐時間影響，不能單靠一餐判斷效果。</span></div></div><p class=\"week5-sources\">延伸閱讀：<a href=\"https://www.myplate.gov/eathealthy/budget/budget-weekly-meals\" target=\"_blank\" rel=\"noopener\">MyPlate：規劃餐點與採買</a> · <a href=\"https://www.fda.gov/food/nutrition-facts-label/how-understand-and-use-nutrition-facts-label\" target=\"_blank\" rel=\"noopener\">FDA：閱讀營養標示</a></p>"},{"why":"常見需要留意的早餐組合與單品鐵板麵加奶茶：麵條、醬汁與含糖奶茶可能讓整餐碳水、添加糖與鈉偏多。GI 與餐後反應受配方、份量及搭配影響，不能一律稱為「極高 GI」；可調整醬量、搭配蛋與蔬菜，飲料改無糖。培根蛋餅加奶茶：培根等加工肉品常含較多鈉，部分使用亞硝酸鹽類作為保色、防腐用途；飲料則需留意添加糖與飽和脂肪。不能只憑「奶精奶茶」就認定含反式脂肪，應看實際成分與標示。菠蘿麵包加豆漿：菠蘿麵包通常含精製麵粉、糖與油脂。無糖豆漿可補充蛋白質，但不會中和麵包的碳水或熱量；仍要看份量與整餐搭配。玉米脆片加鮮奶：不同脆片的糖與纖維含量差異很大，選購時比較標示。鮮奶含天然乳糖，不等同添加糖；留意脆片實際份量，優先考慮較少添加糖、較高纖的選項。健康替換原則增加蛋白質：選擇雞蛋、無糖豆漿或原味無加糖希臘優格，依實際標示與份量搭配。挑選優質碳水：可把白吐司或精製麵包換成全麥餅皮、全麥吐司或全穀麵包；「雜糧」名稱不保證全穀比例，仍需看成分表。落實三少原則：點餐練習「少醬、少炸、少糖」，從最容易維持的一項開始。","exampleHtml":"<p>真實情境：你平常買奶茶與菠蘿麵包，上午很快又想找點心。</p><p>今天先做<strong>一個替換</strong>：奶茶換無糖豆漿；或保留喜歡的飲料，調整份量並加入蛋白質食物。再觀察整餐，而不是因為換了飲料就把其他食物吃得更多。</p><p>包裝上寫<strong>「全麥」「高蛋白」「無加糖」</strong>，仍要看成分與營養標示。「無加糖」不等於沒有天然糖，也不等於沒有碳水。</p>","observe":"拿你真的會買的早餐做練習：圈出飲料、主食、蛋白質與蔬果／全穀，不用替每一項打分數。","judge":["甜味來源：飲料、抹醬、穀片是否都偏甜？哪一項最容易調整？","整餐缺口：蛋白質或含纖維食物是否缺席？先補最明顯的一項。","比較基準：比較同類包裝食品時，每份量是否相同？價格要換成實際會吃的份數來看。"],"do":["寫下最常買的早餐，包含飲料、抹醬與配料。","找出一個問題：甜飲集中、蛋白質少、纖維少，或根本來不及吃。","只選一項調整，保留其他熟悉的部分。","在同一家店或超市找得到替代品，記下價格差。","吃一次後記下口味、飽足感與是否願意繼續。"],"cta":"今天找出早餐的一個缺口，只做一個可維持的替換。","tip":"不要用「好早餐／壞早餐」評價自己。把問題寫成可調整的搭配、份量或取得方式。","whyHtml":"<h3>常見需要留意的早餐組合與單品</h3><ul><li><strong>鐵板麵加奶茶</strong>：麵條、醬汁與含糖奶茶可能讓整餐碳水、添加糖與鈉偏多。GI 與餐後反應受配方、份量及搭配影響，不能一律稱為「極高 GI」；可調整醬量、搭配蛋與蔬菜，飲料改無糖。</li><li><strong>培根蛋餅加奶茶</strong>：培根等加工肉品常含較多鈉，部分使用亞硝酸鹽類作為保色、防腐用途；飲料則需留意添加糖與飽和脂肪。不能只憑「奶精奶茶」就認定含反式脂肪，應看實際成分與標示。</li><li><strong>菠蘿麵包加豆漿</strong>：菠蘿麵包通常含精製麵粉、糖與油脂。無糖豆漿可補充蛋白質，但不會中和麵包的碳水或熱量；仍要看份量與整餐搭配。</li><li><strong>玉米脆片加鮮奶</strong>：不同脆片的糖與纖維含量差異很大，選購時比較標示。鮮奶含天然乳糖，不等同添加糖；留意脆片實際份量，優先考慮較少添加糖、較高纖的選項。</li></ul><h3>健康替換原則</h3><ul><li><strong>增加蛋白質</strong>：選擇雞蛋、無糖豆漿或原味無加糖希臘優格，依實際標示與份量搭配。</li><li><strong>挑選優質碳水</strong>：可把白吐司或精製麵包換成全麥餅皮、全麥吐司或全穀麵包；「雜糧」名稱不保證全穀比例，仍需看成分表。</li><li><strong>落實三少原則</strong>：點餐練習「少醬、少炸、少糖」，從最容易維持的一項開始。</li></ul>","example":"真實情境：你平常買奶茶與菠蘿麵包，上午很快又想找點心。今天先做一個替換：奶茶換無糖豆漿；或保留喜歡的飲料，調整份量並加入蛋白質食物。再觀察整餐，而不是因為換了飲料就把其他食物吃得更多。包裝上寫「全麥」「高蛋白」「無加糖」，仍要看成分與營養標示。「無加糖」不等於沒有天然糖，也不等於沒有碳水。","extra":"<div class=\"lesson-info-grid\"><div><b>飲料也算整餐</b><span>無糖豆漿可能提供蛋白質；實際含量依產品標示。燕麥飲、杏仁飲等不能一律視為等量蛋白質替代。</span></div><div><b>看懂全穀</b><span>麵包的棕色外觀不是全穀保證，查看成分表是否列出全麥、燕麥等全穀原料。</span></div><div><b>從一個改變開始</b><span>無糖飲或補一顆蛋只是選項，重點是你最常見的缺口與當天需求。</span></div></div><p class=\"week5-sources\">延伸閱讀：<a href=\"https://www.myplate.gov/eathealthy/budget/budget-weekly-meals\" target=\"_blank\" rel=\"noopener\">MyPlate：規劃餐點與採買</a> · <a href=\"https://www.fda.gov/food/nutrition-facts-label/how-understand-and-use-nutrition-facts-label\" target=\"_blank\" rel=\"noopener\">FDA：閱讀營養標示</a></p>"},{"why":"「蛋白質＋纖維」是支持飽足感與均衡飲食的實用搭配，但不是公認「最強」的減脂或控糖組合，也不能保證減重。這是一個簡單的早餐組合概念，再依個人需求加入合適的碳水與飲料。這比背固定菜單更容易長期使用。💡 為什麼要這樣搭？延長飽足感：蛋白質與部分纖維有助於飽足；某些黏性可溶性纖維能減緩消化吸收。效果受纖維種類、份量與整餐影響，不能保證「飽足感加倍」。留意餐後血糖：把碳水與蛋白質、含纖維食物一起搭配，可能改變餐後血糖反應；總碳水份量仍重要。這不等於保證胰島素平穩，也不代表能直接防止脂肪囤積。腸道健康與排便：若增加蛋白質時排擠了蔬果、全穀與豆類，可能導致纖維不足。部分纖維可供腸道菌利用，足夠纖維與水分有助排便；不是所有纖維都是益生質，也不是高蛋白飲食一定造成便秘。","exampleHtml":"<p>真實情境：你想在家用五分鐘準備居家早餐預設。</p><p>可用<strong>原味無加糖優格＋燕麥＋水果</strong>，再依需要加少量無調味堅果。優格的蛋白質含量因產品而異，購買時看標示，不只看「希臘式」等名稱。</p><p>偏好鹹食時，換成<strong>蛋或豆腐＋全穀吐司＋番茄</strong>。不必一次把所有食材都加進去。</p>","observe":"用三個位置組餐：蛋白質主角、含纖維食物、適合自己的主食。食物可以跨位置，不必為了填滿格子而重複加量。","judge":["蛋白質：是蛋、乳品、豆製品還是其他來源？實際份量是否符合這餐？","纖維：有完整水果、蔬菜、全穀或豆類嗎？若平常吃得少，逐步增加並搭配水分。","整餐：加了堅果、水果、燕麥後，份量與花費是否仍合適？"],"do":["選甜式或鹹式的居家早餐預設。","確定蛋白質主角，查看需要購買的份數。","選一項以上含纖維食物，主食依食慾搭配。","實際製作一次，量一下準備時間。","把食材、大約份量與可替換品寫下來。"],"cta":"今天完成居家早餐預設：蛋白質＋纖維，真的做一次。","tip":"堅果可以提供不飽和脂肪與一些纖維，但少量堅果不一定能取代這餐的蛋白質主角。","whyHtml":"<p><strong>「蛋白質＋纖維」是支持飽足感與均衡飲食的實用搭配</strong>，但不是公認「最強」的減脂或控糖組合，也不能保證減重。</p><p>這是一個簡單的早餐組合概念，再依個人需求加入合適的碳水與飲料。這比背固定菜單更容易長期使用。</p><h3>💡 為什麼要這樣搭？</h3><ul><li><strong>延長飽足感</strong>：蛋白質與部分纖維有助於飽足；某些黏性可溶性纖維能減緩消化吸收。效果受纖維種類、份量與整餐影響，不能保證「飽足感加倍」。</li><li><strong>留意餐後血糖</strong>：把碳水與蛋白質、含纖維食物一起搭配，可能改變餐後血糖反應；總碳水份量仍重要。這不等於保證胰島素平穩，也不代表能直接防止脂肪囤積。</li><li><strong>腸道健康與排便</strong>：若增加蛋白質時排擠了蔬果、全穀與豆類，可能導致纖維不足。部分纖維可供腸道菌利用，足夠纖維與水分有助排便；不是所有纖維都是益生質，也不是高蛋白飲食一定造成便秘。</li></ul>","example":"真實情境：你想在家用五分鐘準備居家早餐預設。可用原味無加糖優格＋燕麥＋水果，再依需要加少量無調味堅果。優格的蛋白質含量因產品而異，購買時看標示，不只看「希臘式」等名稱。偏好鹹食時，換成蛋或豆腐＋全穀吐司＋番茄。不必一次把所有食材都加進去。","extra":"<div class=\"lesson-info-grid\"><div><b>乳品替代要看標示</b><span>選擇植物飲時比較蛋白質，並查看是否添加鈣；每種植物飲的營養組成都不同。</span></div><div><b>水果保留完整型態</b><span>以完整水果作為常用選項，方便把纖維一起吃進去；不必把水果打成果汁才算早餐。</span></div><div><b>不用買昂貴超級食物</b><span>燕麥、蛋、豆腐與當季水果都能納入搭配。以能吃完、買得到為先。</span></div></div><p class=\"week5-sources\">延伸閱讀：<a href=\"https://www.myplate.gov/eathealthy/budget/budget-weekly-meals\" target=\"_blank\" rel=\"noopener\">MyPlate：規劃餐點與採買</a> · <a href=\"https://www.fda.gov/food/nutrition-facts-label/how-understand-and-use-nutrition-facts-label\" target=\"_blank\" rel=\"noopener\">FDA：閱讀營養標示</a></p>"},{"why":"忙碌早餐真正需要解決的是「取得容易＋不用想太久」，而不是追求理想食譜。便利商店早餐組合推薦高纖飽足組：蒸地瓜＋茶葉蛋＋無糖拿鐵：分別可提供主食與纖維、蛋白質及乳品中的鈣。依食慾調整份量，無糖拿鐵仍含牛奶的天然乳糖。蛋白質優先組：即食雞胸肉或茶碗蒸＋無糖豆漿：可作蛋白質起點，再視需要加入水果、蔬菜或適量主食。脂肪、鈉與熱量因產品不同，不能一律視為低脂低熱量餐。輕盈纖維組：原味無加糖優格＋少量堅果＋水果：提供不同營養來源，必要時搭配燕麥等主食。注意優格是否加糖與堅果份量，不把這個組合當成穩定血糖的保證。","exampleHtml":"<p>真實情境：公司附近只有便利商店，你今天建立外購早餐預設。</p><p>先找<strong>茶葉蛋或無糖豆漿</strong>，再依食量配地瓜、飯糰或全穀麵包，以及方便取得的水果或蔬菜。飯糰餡料不一定提供足夠的蛋白質，仍要看整份組合。</p><p>早餐店可用<strong>蛋吐司＋蔬菜＋無糖飲料</strong>作起點，抹醬依喜好調整。這些是可選模板，並非每次都要全買。</p>","observe":"今天到真的會去的店走一次，看品項、標價、排隊時間與缺貨可能，建立現場能成立的早餐。","judge":["買得到：上班時間是否有供應？缺貨時能換哪一種同類食物？","買得起：整組加總是否在預算內？促銷多買的份量能否吃完？","吃得方便：有沒有餐具、飲水與需要的冷藏條件？購買後能否按標示保存？"],"do":["選一間常去的店，設定今天可接受的早餐預算。","先找到蛋白質，再搭配含纖維食物與主食。","查看包裝份量、成分與整組價格。","購買一組並實際吃，記下花費與等待時間。","為其中一項食材寫下缺貨替代，存成外購早餐預設。"],"cta":"今天在常去的店完成外購早餐預設，連價格與缺貨替代一起記下來。","tip":"地瓜主要是主食，也提供纖維；無糖飲料不一定含蛋白質。看整組搭配，不只看單一健康字眼。","whyHtml":"<p>忙碌早餐真正需要解決的是<strong>「取得容易＋不用想太久」</strong>，而不是追求理想食譜。</p><h3>便利商店早餐組合推薦</h3><ul><li><strong>高纖飽足組</strong>：<strong>蒸地瓜＋茶葉蛋＋無糖拿鐵</strong>：分別可提供主食與纖維、蛋白質及乳品中的鈣。依食慾調整份量，無糖拿鐵仍含牛奶的天然乳糖。</li><li><strong>蛋白質優先組</strong>：<strong>即食雞胸肉或茶碗蒸＋無糖豆漿</strong>：可作蛋白質起點，再視需要加入水果、蔬菜或適量主食。脂肪、鈉與熱量因產品不同，不能一律視為低脂低熱量餐。</li><li><strong>輕盈纖維組</strong>：<strong>原味無加糖優格＋少量堅果＋水果</strong>：提供不同營養來源，必要時搭配燕麥等主食。注意優格是否加糖與堅果份量，不把這個組合當成穩定血糖的保證。</li></ul>","example":"真實情境：公司附近只有便利商店，你今天建立外購早餐預設。先找茶葉蛋或無糖豆漿，再依食量配地瓜、飯糰或全穀麵包，以及方便取得的水果或蔬菜。飯糰餡料不一定提供足夠的蛋白質，仍要看整份組合。早餐店可用蛋吐司＋蔬菜＋無糖飲料作起點，抹醬依喜好調整。這些是可選模板，並非每次都要全買。","extra":"<div class=\"lesson-info-grid\"><div><b>比較鈉與加工配料</b><span>同類食品可比較鈉，留意火腿、培根與醬料；不必只因標示高蛋白就優先選。</span></div><div><b>保存先看條件</b><span>需冷藏的乳品、豆漿與即食餐點依包裝指示保存，不把它們當成可整天放包包的備品。</span></div><div><b>預算用整組計算</b><span>把飲料、主食和加購配料一起算，避免每樣看似便宜，總價卻超出預算。</span></div></div><p class=\"week5-sources\">延伸閱讀：<a href=\"https://www.myplate.gov/eathealthy/budget/budget-weekly-meals\" target=\"_blank\" rel=\"noopener\">MyPlate：規劃餐點與採買</a> · <a href=\"https://www.fda.gov/food/nutrition-facts-label/how-understand-and-use-nutrition-facts-label\" target=\"_blank\" rel=\"noopener\">FDA：閱讀營養標示</a></p>"},{"why":"早餐公式的目的，是讓食材可以替換、決定不用重來。這週建立三個版本：在家、外購，以及忙碌備案。共同結構是蛋白質、含纖維的食物與合適的主食份量；真正不同的是準備時間、購買地點與保存方式。","exampleHtml":"<p><strong>「蛋白質＋高纖食物＋適量碳水＋無糖飲」是一個結構，不是固定菜單。</strong></p><p><strong>先辨認這個主題在你的餐盤、購物與日常選擇中怎麼出現。</strong></p><h3>挑選原則</h3><ul><li><strong>優先補充蛋白質：選擇雞蛋、鮮乳、無糖豆漿或優格。</strong></li><li><strong>挑選較少加工的主食：例如地瓜；飯糰也是便利選項，但需留意餡料、份量與醬料，少選油炸或多醬料的品項。</strong></li></ul>","observe":"公式是替換工具，不是固定份量處方。若一餐同時有燕麥、麵包與水果，先看合計份量，不為了達成公式而全部加上去。","judge":["三種情境：在家、外購、趕時間，各自都有能成立的版本嗎？","共用食材：同一包燕麥、豆漿或水果能否用在多次早餐，減少浪費？","明天可做：備品放哪裡、誰採買、何時補貨、何時檢查效期，都清楚嗎？"],"do":["回看已完成的居家版 與外購版。","選出你最需要備案的忙碌情境。","用蛋白質、含纖維食物與適量主食寫出忙碌早餐備案。","列出缺少品項、數量、保存方式與替代品。","把三份預設放在同一張紀錄裡，選明天要用的一份。"],"cta":"今天完成忙碌早餐備案，整理三個版本與下一次採買清單。","tip":"備案可以簡單；缺一項時先用手邊可取得的食物，再於下一次正常用餐補足多樣性，不必用挨餓補償。","whyHtml":"早餐公式的目的，是讓食材可以替換、決定不用重來。這週建立三個版本：在家、外購，以及忙碌備案。<br><br>共同結構是蛋白質、含纖維的食物與合適的主食份量；真正不同的是準備時間、購買地點與保存方式。","example":"「蛋白質＋高纖食物＋適量碳水＋無糖飲」是一個結構，不是固定菜單。先辨認這個主題在你的餐盤、購物與日常選擇中怎麼出現。挑選原則優先補充蛋白質：選擇雞蛋、鮮乳、無糖豆漿或優格。挑選較少加工的主食：例如地瓜；飯糰也是便利選項，但需留意餡料、份量與醬料，少選油炸或多醬料的品項。","extra":"<div class=\"lesson-info-grid\"><div><b>居家版</b><span>利用家中冰箱、餐具與可用時間，優先消耗已有食材。</span></div><div><b>外購版</b><span>記住店家與一組實際點餐方式，準備缺貨替代。</span></div><div><b>備案版</b><span>檢查保存條件，設定補貨提醒，避免只有清單卻沒有食物。</span></div></div><p class=\"week5-sources\">延伸閱讀：<a href=\"https://www.myplate.gov/eathealthy/budget/budget-weekly-meals\" target=\"_blank\" rel=\"noopener\">MyPlate：規劃餐點與採買</a> · <a href=\"https://www.fda.gov/food/nutrition-facts-label/how-understand-and-use-nutrition-facts-label\" target=\"_blank\" rel=\"noopener\">FDA：閱讀營養標示</a></p>","observeInExample":true}];
week5Lessons.forEach(item=>{item.extra+="<p class=\"week5-sources\">營養資料：<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/healthy-living-with-diabetes\" target=\"_blank\" rel=\"noopener\">NIDDK：飲食與血糖</a> · <a href=\"https://www.nhs.uk/live-well/eat-well/digestive-health/how-to-get-more-fibre-into-your-diet/\" target=\"_blank\" rel=\"noopener\">NHS：膳食纖維</a> · <a href=\"https://www.fda.gov/food/food-additives-petitions/trans-fat\" target=\"_blank\" rel=\"noopener\">FDA：反式脂肪</a></p>";});
week5Lessons.forEach((item,i)=>{lessonRichOverrides['5-'+(i+1)]=item;});
actionOverrides[5]=week5Days.map(item=>item.steps);
curriculum[4].intro='早餐策略：從真實早餐出發，建立居家、外購與忙碌備案三個可重複的選擇。';
curriculum[4].ability='完成五堂 Learn 與七天練習後，你會留下三份早餐預設、缺貨替代、保存提醒與下一次採買清單。';
curriculum[4].actions.forEach((item,i)=>{item.steps=week5Days[i].steps;});
function week5Record(d,r){const item=week5Days[d-1];return `<div class="micro action-record week5-record"><div class="eyebrow">今日早餐實際記錄</div><h3>${esc(item.cta)}</h3><p>依今天主題留下你的選擇，下次可以直接照做。</p><div class="record-grid">${item.labels.map((label,i)=>`<div class="field record-wide"><label for="${['recordMain','recordKey','recordInsight'][i]}">${esc(label)}</label><textarea id="${['recordMain','recordKey','recordInsight'][i]}" rows="3" placeholder="${esc(item.ph[i])}">${esc(r[['main','key','insight'][i]]||'')}</textarea></div>`).join('')}</div><button class="btn soft" onclick="saveActionRecord(5,${d})">儲存這筆記錄</button></div>`;}
function week5Context(d){const item=week5Days[d-1];return `<section class="depth-card week5-context"><p class="eyebrow">02 · 看見｜今天的真實情境</p><p>${esc(item.example)}</p></section><section class="depth-card week5-context"><p class="eyebrow">03 · 判斷｜依今天主題做選擇</p><ul>${item.judge.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;}


const week6Days=[{"title":"在一餐中使用三步驟餐廳決策框架。","focus":"先找蛋白質，再找蔬菜／纖維，最後調整主食、飲料與份量。把同一套順序用在不同菜單上。","why":"外食選項多，先有一個閱讀菜單的順序，可以減少臨時猜測。蛋、豆腐、魚或肉可作為蛋白質來源；蔬菜、豆類與全穀可增加纖維。主食不必全部去掉，而是按食慾、整餐組合與個人需要決定份量。","example":"真實情境：午餐只有便當店。先選魚、雞肉或豆腐主菜，再看是否有足夠蔬菜；主食依需要留適量，飲料可選水或無糖茶。若主菜已油炸，可以先調整配菜與飲料，不必認為整餐都失敗。","judge":["蛋白質在哪裡？是主要食材，還是只有少量餡料？","蔬菜／纖維有沒有？玉米、馬鈴薯也含較多澱粉，要放回整餐一起看。","主食、醬汁與飲料是否重複加量？依食慾調整，不必清空大份量。"],"steps":["選今天真的會去的餐廳或便當店。","在菜單找一個蛋白質主角。","補一項蔬菜或其他含纖維食物。","決定主食份量、醬汁與飲料。","吃一次，記下三步驟中最有用的一步。"],"notes":"三步驟是點餐工具，不是營養評分表。只調整一個地方也能留下有用的經驗。","cta":"今天用三步驟選一餐。","labels":["餐廳與我點的完整組合","蛋白質、蔬菜／纖維、主食與飲料","最有用的一步與下一次調整"]},{"title":"先做計畫，再完成一次外食。","focus":"先看菜單、安排用餐時間與想享受的食物，讓外食成為有準備、也有彈性的生活選擇。","why":"外食不該造成壓力。事前想好餐廳與點餐方向，搭配蔬菜、蛋白質及適量不飽和脂肪來源，有助於組織一餐；血糖反應仍取決於碳水份量、整體搭配與個人狀況，不能靠多吃油脂來抵銷。計畫是減少臨場壓力的工具；臨時改變不代表失敗。","example":"真實情境：週末和朋友聚餐，餐廳選擇多，也可能有甜點或飲酒邀請。先看菜單、決定一項想享受的食物，再安排其他搭配，現場仍可按食慾調整。","judge":["準備：是否知道用餐時間、菜單與一個備選？出門前是否真的需要點心？","享受：今天最想吃哪一樣？甜點可以分享或依滿足感決定份量嗎？","界線：飲酒、追加菜色或勸食時，自己願意怎麼回應？"],"steps":["選一次即將發生的外食，先看菜單。","寫出主菜、蔬菜、主食與飲料的組合及備選。","依飢餓與等候時間決定是否需要點心。","事先想好甜點分享方式，以及是否飲酒。","用餐後只記一個有幫助的準備和一個下次調整。"],"notes":"外食計畫不是考試。若現場改變，就用可取得的選項調整，不用把責任都歸咎於自己沒有計畫。","cta":"今天先看菜單，再決定點餐與備選。","labels":["用餐時間、餐廳與主選／備選","點心、醬汁、甜點與飲酒的安排","現場有何改變？哪些準備有幫助？"]},{"title":"選一種餐廳，完成適合自己的點餐。","focus":"義式、法式、日式、速食、中式與泰式都可以練習：辨認主食、蛋白質、蔬菜、醬汁與份量，再做一個適合自己的選擇。","why":"餐廳類型不能直接代表健康或不健康。同一道菜也可能因份量、烹調油、醬料及配菜而有很大差異。下面以常見食物為例，整理「尋找」與「避開／調整」的比較，幫你讀菜單；避開指優先減少過量或不合需求的搭配，不是禁止整類食物。","example":"真實情境：朋友在日式定食和泰式合菜之間選擇。日式可以比較烤魚與炸物、飯量與配菜；泰式則看看能否點魚、豆腐或雞肉配蔬菜，把濃醬另外放。兩家都能調整，不需要只憑國別決定。","judge":["食物主軸：這餐以麵飯、肉魚、蔬菜還是濃醬為主？缺少什麼？","可調整處：可以少醬、分食、換配菜或依食慾調整主食嗎？","現場限制：口味、價格、共同用餐者需求及可取得品項，哪個最重要？"],"steps":["從六種餐廳選今天最可能去的一種。","找一項想點的主菜，辨認烹調方式與醬汁。","依圖表補蔬菜並安排合適主食。","寫一句可以向店家提出的具體調整。","記下最後選擇與原因，存成下次可用的點餐範例。"],"notes":"白飯、麵包、麵食或乳酪不必一律排除；重點是份量、頻率與整餐。沙拉、清湯或烤物也不是自動低糖、低鈉。","cta":"今天用餐廳比較圖表做一個具體選擇。","labels":["餐廳類型與原本想點的餐","我尋找／調整的菜色、份量與醬汁","最終組合與下次可用的點餐句子"]},{"title":"用餐廳或外送菜單完成一次下單。","focus":"下單前確認整組內容、份量與總價，把外送優惠換成真正符合需要的一餐。","why":"外送畫面容易讓人只看主菜照片，忽略套餐飲料、加購、醬料與實際份量。先確認吃的人數、需求與家中已有食物，能減少重複購買。到餐後再看實際組合，將缺少的蔬菜或其他食物補上，而不是只相信菜名。","example":"真實情境：晚餐點雞肉便當，套餐預設甜飲與炸配菜。你可以改無糖飲或不加飲料；若家裡已有番茄或燙青菜，就不必為湊免運額外點第二份主餐。","judge":["內容：主食、配菜與飲料是否已包含？醬汁能否另外放？","價格：加上外送費與加購後是否仍在預算？家中庫存可補哪一項？","份量與保存：幾個人吃、是否需要分享？剩食能否妥善冷藏與充分加熱？"],"steps":["先看家裡可搭配的蔬菜、主食與飲料。","選主菜後核對套餐內容與實際份量。","取消不需要的加購，提出少醬或分裝需求。","確認人數、總價與送達後的食用安排再下單。","到餐後記下是否符合預期，留下下次下單備註。"],"notes":"不要只為免運或折扣多買吃不完的食物。實際支付、食用量與剩食都值得一起看。","cta":"今天在下單前確認內容、份量與總價。","labels":["餐點內容、家中可補搭的食物","人數、實際總價、份量與加購調整","到餐是否符合預期？下次如何下單？"]},{"title":"在商務餐或社交聚餐中練習。","focus":"參與聚餐、享受喜歡的食物，同時保留份量、飲料與點餐上的選擇。","why":"商務餐與聚餐常有共享菜色、固定套餐及勸食，並非所有細節都由自己決定。把注意力放在能控制的一兩件事，例如先看菜色、按食慾取餐與選擇飲料，比要求自己整場完全照計畫更務實。聚餐前不必刻意挨餓，下一餐也不需要補償。","example":"真實情境：同事點了炸物、肉類、青菜與炒飯。你先看看所有菜色，按食慾取一份青菜、蛋白質及主食；喜歡的炸物可以享用，再決定是否還需要。有人勸酒時，可說「我今天喝茶，謝謝」。","judge":["參與：最想享受哪一道菜或哪個交流時刻？","自主：飲料、取餐份量或加一道蔬菜，哪項可以自己決定？","回復：吃得比預期多時，下一餐能否照常吃，不用挨餓或懲罰？"],"steps":["先確認聚餐形式、時間與共同用餐者需求。","挑一樣真正想享受的食物。","搭配蔬菜、蛋白質與適合的主食份量。","練一句禮貌拒絕勸食或勸酒的話。","聚餐後記下成功的一件事，下一餐正常安排。"],"notes":"禮貌不等於一定要吃完別人夾的每一口。你可以感謝對方，再依自己的需要決定。","cta":"今天享受聚餐，也保留一個自己的選擇。","labels":["聚餐形式與我想享受的食物","我能控制的選擇與禮貌回應","成功的一件事與下一餐正常安排"]},{"title":"彈性日：在臨時外食中做一個可行調整。","focus":"用手邊選项完成一餐，練習替代而不是放棄。","why":"臨時加班或店家缺貨時，完整計畫可能無法照做。保留一個有用原則，例如先找蛋白質、補蔬菜或改飲料，就能把方法帶進真實生活。","example":"原本想吃魚，店家只剩雞肉便當。可以用雞肉替代，保留青菜，飯量依需要；不必另花時間找完全相同的菜單。","judge":["現在有哪些真的買得到的食物？","哪一個缺口最容易補上？","這個調整符合時間與預算嗎？"],"steps":["記下臨時改變的原因與可用時間。","列出兩個現場能取得的選項。","只選一個可行調整：蛋白質、蔬菜、份量或飲料。","實際吃一次，按食慾決定是否還需要。","記下可用替代，下次遇到同樣情況直接使用。"],"notes":"今天保留一個有用選擇就好，不為缺少理想選項責備自己。","cta":"今天在臨時外食中只改善一個地方。","labels":["臨時情境與現場可用選項","實際選擇、替代與花費","下次能直接使用的備案"]},{"title":"每週回顧：留下最有用的外食策略。","focus":"把一週外食經驗整理成常用店家、點餐句與備案。","why":"回顧不是計算哪幾餐完美，而是找出哪些方法真的能持續。把實際吃過、價格合適的組合留下來，也能讓下週採買與外食互相配合。","example":"你發現「先看菜單」最有幫助，而外送最常缺蔬菜。下週可保留兩家常用店，採買少量方便處理的蔬菜，避免每次多點一套。","judge":["哪個決策步驟最常幫到我？","最常見的阻力是價格、時間、搭配還是社交？","下週可以提前準備的一件事是什麼？"],"steps":["回看本週實際外食與紀錄。","挑兩組願意再吃的點餐方式。","整理一個缺貨或臨時加班備案。","盤點家中庫存，列出能補外食缺口的採買品項與數量。","完成本週 check-in，留下下週要重複的一步。"],"notes":"留下兩個常用組合和一個備案，讓下一次外食少想一點。","cta":"今天整理自己的外食小抄與下週採買清單。","labels":["常用店家與兩組實際點餐方式","最有用的步驟、阻力與備案","下週要重複的行動與採買品項／數量"]}];
const week6LessonMeta=[{"title":"餐廳決策框架","concept":"先找蛋白質，再找蔬菜／纖維，最後調整主食、飲料與份量。把同一套順序用在不同菜單上。","hook":"餐廳決策框架","example":"真實情境：午餐只有便當店。先選魚、雞肉或豆腐主菜，再看是否有足夠蔬菜；主食依需要留適量，飲料可選水或無糖茶。若主菜已油炸，可以先調整配菜與飲料，不必認為整餐都失敗。","apply":"選今天真的會去的餐廳或便當店。"},{"title":"計畫與外食","concept":"先看菜單、安排用餐時間與想享受的食物，讓外食成為有準備、也有彈性的生活選擇。","hook":"計畫與外食","example":"真實情境：週末和朋友聚餐，餐廳選擇多，也可能有甜點或飲酒邀請。先看菜單、決定一項想享受的食物，再安排其他搭配，現場仍可按食慾調整。","apply":"選一次即將發生的外食，先看菜單。"},{"title":"各種餐廳的選擇","concept":"義式、法式、日式、速食、中式與泰式都可以練習：辨認主食、蛋白質、蔬菜、醬汁與份量，再做一個適合自己的選擇。","hook":"各種餐廳的選擇","example":"真實情境：朋友在日式定食和泰式合菜之間選擇。日式可以比較烤魚與炸物、飯量與配菜；泰式則看看能否點魚、豆腐或雞肉配蔬菜，把濃醬另外放。兩家都能調整，不需要只憑國別決定。","apply":"從六種餐廳選今天最可能去的一種。"},{"title":"餐廳與外送","concept":"下單前確認整組內容、份量與總價，把外送優惠換成真正符合需要的一餐。","hook":"餐廳與外送","example":"真實情境：晚餐點雞肉便當，套餐預設甜飲與炸配菜。你可以改無糖飲或不加飲料；若家裡已有番茄或燙青菜，就不必為湊免運額外點第二份主餐。","apply":"先看家裡可搭配的蔬菜、主食與飲料。"},{"title":"商務餐與社交聚餐","concept":"參與聚餐、享受喜歡的食物，同時保留份量、飲料與點餐上的選擇。","hook":"商務餐與社交聚餐","example":"真實情境：同事點了炸物、肉類、青菜與炒飯。你先看看所有菜色，按食慾取一份青菜、蛋白質及主食；喜歡的炸物可以享用，再決定是否還需要。有人勸酒時，可說「我今天喝茶，謝謝」。","apply":"先確認聚餐形式、時間與共同用餐者需求。"}];
const week6Rich=[{"why":"外食選項多，先有一個閱讀菜單的順序，可以減少臨時猜測。蛋、豆腐、魚或肉可作為蛋白質來源；蔬菜、豆類與全穀可增加纖維。主食不必全部去掉，而是按食慾、整餐組合與個人需要決定份量。","whyHtml":"<p>外食選項多，先有一個閱讀菜單的順序，可以減少臨時猜測。蛋、豆腐、魚或肉可作為蛋白質來源；蔬菜、豆類與全穀可增加纖維。主食不必全部去掉，而是按食慾、整餐組合與個人需要決定份量。</p>","example":"真實情境：午餐只有便當店。先選魚、雞肉或豆腐主菜，再看是否有足夠蔬菜；主食依需要留適量，飲料可選水或無糖茶。若主菜已油炸，可以先調整配菜與飲料，不必認為整餐都失敗。","exampleHtml":"<p>真實情境：午餐只有便當店。先選魚、雞肉或豆腐主菜，再看是否有足夠蔬菜；主食依需要留適量，飲料可選水或無糖茶。若主菜已油炸，可以先調整配菜與飲料，不必認為整餐都失敗。</p>","observe":"把今天的重點放回你真正會去的店、實際預算與食慾，選一件能做的事。","judge":["蛋白質在哪裡？是主要食材，還是只有少量餡料？","蔬菜／纖維有沒有？玉米、馬鈴薯也含較多澱粉，要放回整餐一起看。","主食、醬汁與飲料是否重複加量？依食慾調整，不必清空大份量。"],"do":["選今天真的會去的餐廳或便當店。","在菜單找一個蛋白質主角。","補一項蔬菜或其他含纖維食物。","決定主食份量、醬汁與飲料。","吃一次，記下三步驟中最有用的一步。"],"cta":"今天用三步驟選一餐。","tip":"三步驟是點餐工具，不是營養評分表。只調整一個地方也能留下有用的經驗。","extra":"<div class=\"lesson-info-grid\"><div><b>看烹調方式</b><span>蒸、烤、煮可作比較起點，但仍要留意油、糖、鈉與份量。</span></div><div><b>加點先補缺口</b><span>套餐少蔬菜時，可加一份青菜；不必因優惠再加一份主食。</span></div><div><b>整餐價格一起算</b><span>把飲料、配菜與服務費算進預算，選能重複負擔的組合。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.heart.org/en/healthy-living/healthy-eating/eat-smart/nutrition-basics/dining-out-doesnt-mean-ditch-your-diet\" target=\"_blank\" rel=\"noopener\">美國心臟協會：外食選擇</a> · <a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/healthy-living-with-diabetes\" target=\"_blank\" rel=\"noopener\">NIDDK：飲食、飲酒與血糖</a></p>"},{"why":"外食不該造成壓力。事前想好餐廳與點餐方向，搭配蔬菜、蛋白質及適量不飽和脂肪來源，有助於組織一餐；血糖反應仍取決於碳水份量、整體搭配與個人狀況，不能靠多吃油脂來抵銷。計畫是減少臨場壓力的工具；臨時改變不代表失敗。","whyHtml":"<p>外食不該造成壓力。事前想好餐廳與點餐方向，搭配蔬菜、蛋白質及適量不飽和脂肪來源，有助於組織一餐；血糖反應仍取決於碳水份量、整體搭配與個人狀況，不能靠多吃油脂來抵銷。計畫是減少臨場壓力的工具；臨時改變不代表失敗。</p>","example":"真實情境：週末和朋友聚餐，餐廳選擇多，也可能有甜點或飲酒邀請。先看菜單、決定一項想享受的食物，再安排其他搭配，現場仍可按食慾調整。","exampleHtml":"<p>真實情境：週末和朋友聚餐，餐廳選擇多，也可能有甜點或飲酒邀請。先看菜單、決定一項想享受的食物，再安排其他搭配，現場仍可按食慾調整。</p><ul><li><strong>先看菜單：</strong>出門前查看餐廳菜單與可取得的營養資訊，先選主菜與備選，避免因飢餓或促銷不斷加點。</li><li><strong>需要時先吃點心：</strong>若已餓且離用餐還很久，可先吃適量杏仁、蔬菜搭配蛋白質食物，或查看標示後選蛋白質飲品。點心不是必須，也不是額外越多越好；生菜單吃未必足夠。</li><li><strong>水與醬汁先安排：</strong>依口渴喝水，沙拉醬可另外放，自己決定用量。不需為了壓抑食慾大量灌水。</li><li><strong>甜點慢慢享受：</strong>可選小份、分享，或先嘗三口再感受是否滿足。「三口」是可選的品嚐提示，不是硬性營養規則；享用後不必有罪惡感或補償。</li><li><strong>飲酒先做決定：</strong>不喝酒也是完整的聚餐選擇。若決定飲酒，不要空腹，也要事先決定自己的界線；吃過飯不保證喝得少或消除酒精風險。使用胰島素或某些降血糖藥時，酒精可能引起低血糖，應依醫療團隊建議安排。</li></ul>","observe":"把今天的重點放回你真正會去的店、實際預算與食慾，選一件能做的事。","judge":["準備：是否知道用餐時間、菜單與一個備選？出門前是否真的需要點心？","享受：今天最想吃哪一樣？甜點可以分享或依滿足感決定份量嗎？","界線：飲酒、追加菜色或勸食時，自己願意怎麼回應？"],"do":["選一次即將發生的外食，先看菜單。","寫出主菜、蔬菜、主食與飲料的組合及備選。","依飢餓與等候時間決定是否需要點心。","事先想好甜點分享方式，以及是否飲酒。","用餐後只記一個有幫助的準備和一個下次調整。"],"cta":"今天先看菜單，再決定點餐與備選。","tip":"外食計畫不是考試。若現場改變，就用可取得的選項調整，不用把責任都歸咎於自己沒有計畫。","extra":"<p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.heart.org/en/healthy-living/healthy-eating/eat-smart/nutrition-basics/dining-out-doesnt-mean-ditch-your-diet\" target=\"_blank\" rel=\"noopener\">美國心臟協會：外食選擇</a> · <a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/healthy-living-with-diabetes\" target=\"_blank\" rel=\"noopener\">NIDDK：飲食、飲酒與血糖</a></p>"},{"why":"餐廳類型不能直接代表健康或不健康。同一道菜也可能因份量、烹調油、醬料及配菜而有很大差異。下面以常見食物為例，整理「尋找」與「避開／調整」的比較，幫你讀菜單；避開指優先減少過量或不合需求的搭配，不是禁止整類食物。","whyHtml":"<p>餐廳類型不能直接代表健康或不健康。同一道菜也可能因份量、烹調油、醬料及配菜而有很大差異。下面以常見食物為例，整理「尋找」與「避開／調整」的比較，幫你讀菜單；避開指優先減少過量或不合需求的搭配，不是禁止整類食物。</p><div class=\"restaurant-guide\"><article class=\"restaurant-card\"><h3>義式餐廳</h3><p><strong>食物主軸：</strong>常見主軸是麵食、披薩、蔬菜、魚肉與各式醬汁。</p><dl><div><dt>尋找</dt><dd>番茄蔬菜醬、魚或豆類配蔬菜；麵量依需要，全穀選項有供應時可比較。</dd></div><div><dt>避開／調整</dt><dd>濃奶油醬、額外大量乳酪，以及麵包＋大份麵食＋甜飲的疊加。</dd></div></dl><p><strong>點餐例子：</strong>例：番茄海鮮麵配沙拉，醬另外放；按食慾決定麵量。</p></article><article class=\"restaurant-card\"><h3>法式餐廳</h3><p><strong>食物主軸：</strong>常見魚肉主菜、蔬菜、麵包，以及奶油、乳酪與醬汁。</p><dl><div><dt>尋找</dt><dd>烤或煮的魚禽主菜與蔬菜，醬汁可分開；麵包按需要取用。</dd></div><div><dt>避開／調整</dt><dd>大量奶油濃醬、多道酥皮與甜點一起加量；清湯也需留意鈉。</dd></div></dl><p><strong>點餐例子：</strong>例：烤魚配蔬菜與適量主食，先嘗再加醬。</p></article><article class=\"restaurant-card\"><h3>日式餐廳</h3><p><strong>食物主軸：</strong>米飯、麵、魚、豆製品與醃漬配菜常同餐出現。</p><dl><div><dt>尋找</dt><dd>烤魚、豆腐、毛豆與蔬菜；定食的飯量依食慾調整。</dd></div><div><dt>避開／調整</dt><dd>炸天婦羅、甜照燒醬或美乃滋大量使用，以及麵飯雙主食；湯與醬油不必喝光。</dd></div></dl><p><strong>點餐例子：</strong>例：烤魚定食加蔬菜，醬油少量使用，飯量自己決定。</p></article><article class=\"restaurant-card\"><h3>速食餐廳</h3><p><strong>食物主軸：</strong>常見漢堡或三明治、炸物、配餐與含糖飲料。</p><dl><div><dt>尋找</dt><dd>單點或合適份量的主餐、水或無糖飲；有蔬菜配餐時可替換。</dd></div><div><dt>避開／調整</dt><dd>自動升級大份薯條與甜飲、疊加炸物和醬料。</dd></div></dl><p><strong>點餐例子：</strong>例：單份漢堡配無糖茶，按需求搭配沙拉；不一定要去掉麵包。</p></article><article class=\"restaurant-card\"><h3>中式餐廳</h3><p><strong>食物主軸：</strong>飯麵、共享肉魚豆製品、蔬菜與各種湯醬。</p><dl><div><dt>尋找</dt><dd>清蒸魚、豆腐與蔬菜，主食按需要；合菜可先看整桌再分配。</dd></div><div><dt>避開／調整</dt><dd>糖醋濃醬、裹粉油炸、重勾芡與大份炒飯炒麵重複加點。</dd></div></dl><p><strong>點餐例子：</strong>例：清蒸魚、青菜、豆腐配適量飯，少用盤底醬汁。</p></article><article class=\"restaurant-card\"><h3>泰式餐廳</h3><p><strong>食物主軸：</strong>米飯或米線，配酸辣香草、魚露、糖與椰奶等調味。</p><dl><div><dt>尋找</dt><dd>蒸魚、雞肉或豆腐搭蔬菜；詢問醬汁能否少糖或另放。</dd></div><div><dt>避開／調整</dt><dd>濃椰奶咖哩、油炸配菜與甜飲一起大量攝取；酸辣不等於低糖低鈉。</dd></div></dl><p><strong>點餐例子：</strong>例：魚或豆腐配蔬菜與適量飯；咖哩可分享，按需要取醬。</p></article></div>","example":"真實情境：朋友在日式定食和泰式合菜之間選擇。日式可以比較烤魚與炸物、飯量與配菜；泰式則看看能否點魚、豆腐或雞肉配蔬菜，把濃醬另外放。兩家都能調整，不需要只憑國別決定。","exampleHtml":"<p>真實情境：朋友在日式定食和泰式合菜之間選擇。日式可以比較烤魚與炸物、飯量與配菜；泰式則看看能否點魚、豆腐或雞肉配蔬菜，把濃醬另外放。兩家都能調整，不需要只憑國別決定。</p>","observe":"把今天的重點放回你真正會去的店、實際預算與食慾，選一件能做的事。","judge":["食物主軸：這餐以麵飯、肉魚、蔬菜還是濃醬為主？缺少什麼？","可調整處：可以少醬、分食、換配菜或依食慾調整主食嗎？","現場限制：口味、價格、共同用餐者需求及可取得品項，哪個最重要？"],"do":["從六種餐廳選今天最可能去的一種。","找一項想點的主菜，辨認烹調方式與醬汁。","依圖表補蔬菜並安排合適主食。","寫一句可以向店家提出的具體調整。","記下最後選擇與原因，存成下次可用的點餐範例。"],"cta":"今天用餐廳比較圖表做一個具體選擇。","tip":"白飯、麵包、麵食或乳酪不必一律排除；重點是份量、頻率與整餐。沙拉、清湯或烤物也不是自動低糖、低鈉。","extra":"<p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.heart.org/en/healthy-living/healthy-eating/eat-smart/nutrition-basics/dining-out-doesnt-mean-ditch-your-diet\" target=\"_blank\" rel=\"noopener\">美國心臟協會：外食選擇</a> · <a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/healthy-living-with-diabetes\" target=\"_blank\" rel=\"noopener\">NIDDK：飲食、飲酒與血糖</a></p>"},{"why":"外送畫面容易讓人只看主菜照片，忽略套餐飲料、加購、醬料與實際份量。先確認吃的人數、需求與家中已有食物，能減少重複購買。到餐後再看實際組合，將缺少的蔬菜或其他食物補上，而不是只相信菜名。","whyHtml":"<p>外送畫面容易讓人只看主菜照片，忽略套餐飲料、加購、醬料與實際份量。先確認吃的人數、需求與家中已有食物，能減少重複購買。到餐後再看實際組合，將缺少的蔬菜或其他食物補上，而不是只相信菜名。</p>","example":"真實情境：晚餐點雞肉便當，套餐預設甜飲與炸配菜。你可以改無糖飲或不加飲料；若家裡已有番茄或燙青菜，就不必為湊免運額外點第二份主餐。","exampleHtml":"<p>真實情境：晚餐點雞肉便當，套餐預設甜飲與炸配菜。你可以改無糖飲或不加飲料；若家裡已有番茄或燙青菜，就不必為湊免運額外點第二份主餐。</p>","observe":"把今天的重點放回你真正會去的店、實際預算與食慾，選一件能做的事。","judge":["內容：主食、配菜與飲料是否已包含？醬汁能否另外放？","價格：加上外送費與加購後是否仍在預算？家中庫存可補哪一項？","份量與保存：幾個人吃、是否需要分享？剩食能否妥善冷藏與充分加熱？"],"do":["先看家裡可搭配的蔬菜、主食與飲料。","選主菜後核對套餐內容與實際份量。","取消不需要的加購，提出少醬或分裝需求。","確認人數、總價與送達後的食用安排再下單。","到餐後記下是否符合預期，留下下次下單備註。"],"cta":"今天在下單前確認內容、份量與總價。","tip":"不要只為免運或折扣多買吃不完的食物。實際支付、食用量與剩食都值得一起看。","extra":"<div class=\"lesson-info-grid\"><div><b>看照片也看文字</b><span>查看份量、配菜與過敏原資訊；不清楚時詢問店家。</span></div><div><b>採買可補一個缺口</b><span>家中常備方便處理的蔬菜，能搭配外送主餐，減少每次重買整套。</span></div><div><b>剩食及時處理</b><span>需冷藏的熟食別長時間留在室溫；依食安指引及時冷藏，食用前充分加熱。</span></div></div><p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.heart.org/en/healthy-living/healthy-eating/eat-smart/nutrition-basics/dining-out-doesnt-mean-ditch-your-diet\" target=\"_blank\" rel=\"noopener\">美國心臟協會：外食選擇</a> · <a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/healthy-living-with-diabetes\" target=\"_blank\" rel=\"noopener\">NIDDK：飲食、飲酒與血糖</a></p>"},{"why":"商務餐與聚餐常有共享菜色、固定套餐及勸食，並非所有細節都由自己決定。把注意力放在能控制的一兩件事，例如先看菜色、按食慾取餐與選擇飲料，比要求自己整場完全照計畫更務實。聚餐前不必刻意挨餓，下一餐也不需要補償。","whyHtml":"<p>商務餐與聚餐常有共享菜色、固定套餐及勸食，並非所有細節都由自己決定。把注意力放在能控制的一兩件事，例如先看菜色、按食慾取餐與選擇飲料，比要求自己整場完全照計畫更務實。聚餐前不必刻意挨餓，下一餐也不需要補償。</p>","example":"真實情境：同事點了炸物、肉類、青菜與炒飯。你先看看所有菜色，按食慾取一份青菜、蛋白質及主食；喜歡的炸物可以享用，再決定是否還需要。有人勸酒時，可說「我今天喝茶，謝謝」。","exampleHtml":"<p>真實情境：同事點了炸物、肉類、青菜與炒飯。你先看看所有菜色，按食慾取一份青菜、蛋白質及主食；喜歡的炸物可以享用，再決定是否還需要。有人勸酒時，可說「我今天喝茶，謝謝」。</p>","observe":"把今天的重點放回你真正會去的店、實際預算與食慾，選一件能做的事。","judge":["參與：最想享受哪一道菜或哪個交流時刻？","自主：飲料、取餐份量或加一道蔬菜，哪項可以自己決定？","回復：吃得比預期多時，下一餐能否照常吃，不用挨餓或懲罰？"],"do":["先確認聚餐形式、時間與共同用餐者需求。","挑一樣真正想享受的食物。","搭配蔬菜、蛋白質與適合的主食份量。","練一句禮貌拒絕勸食或勸酒的話。","聚餐後記下成功的一件事，下一餐正常安排。"],"cta":"今天享受聚餐，也保留一個自己的選擇。","tip":"禮貌不等於一定要吃完別人夾的每一口。你可以感謝對方，再依自己的需要決定。","extra":"<p class=\"week6-sources\">延伸閱讀：<a href=\"https://www.heart.org/en/healthy-living/healthy-eating/eat-smart/nutrition-basics/dining-out-doesnt-mean-ditch-your-diet\" target=\"_blank\" rel=\"noopener\">美國心臟協會：外食選擇</a> · <a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/healthy-living-with-diabetes\" target=\"_blank\" rel=\"noopener\">NIDDK：飲食、飲酒與血糖</a></p>"}];
weeks[5].lessons=week6LessonMeta.map(l=>l.title);
weeks[5].daily_actions=week6Days.map(d=>d.title);
curriculum[5].intro='外食策略：先做計畫，再用餐廳框架、各類菜單比較與社交應對，建立自己的常用選擇。';
curriculum[5].ability='學會提前看菜單、比較六類餐廳、安排外送與聚餐，留下常用點餐方式與採買備案。';
curriculum[5].lessons=week6LessonMeta;
curriculum[5].actions=week6Days.map(d=>({title:d.title,steps:d.steps}));
curriculum[5].flex=['臨時外食','餐廳缺貨','社交聚餐'];
week6Rich.forEach((item,i)=>lessonRichOverrides['6-'+(i+1)]=item);
actionOverrides[6]=week6Days.map(d=>d.steps);
function week6Record(d,r){const item=week6Days[d-1];return `<div class="micro action-record"><div class="eyebrow">今日外食實際記錄</div><h3>${esc(item.cta)}</h3><p>依今天主題留下你的點餐與準備，下次可以直接使用。</p><div class="record-grid">${item.labels.map((label,i)=>`<div class="field record-wide"><label for="${['recordMain','recordKey','recordInsight'][i]}">${esc(label)}</label><textarea id="${['recordMain','recordKey','recordInsight'][i]}" rows="3" placeholder="${esc(label)}；依今天實際情況填寫。">${esc(r[['main','key','insight'][i]]||'')}</textarea></div>`).join('')}</div><button class="btn soft" onclick="saveActionRecord(6,${d})">儲存這筆記錄</button></div>`;}
function week6Context(d){const item=week6Days[d-1];return `<section class="depth-card week6-context"><p class="eyebrow">02 · 看見｜今天的真實情境</p><p>${esc(item.example)}</p></section><section class="depth-card week6-context"><p class="eyebrow">03 · 判斷｜依今天主題做選擇</p><ul>${item.judge.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;}


const week7Days=[{"title":"辨認一次飲食觸發與自己的需要。","focus":"先看見自己的飲食模式與觸發因子；同一個人可能在不同時刻出現不同模式，不需要替自己貼標籤。","why":"了解自己的飲食習慣相當重要，才能發掘讓自己在不知不覺中多吃、或做出不符合當下需要之選擇的觸發因子。先觀察情境，再談改變，比只責怪意志力更有方向。","example":"真實情境 1：今天工作不順，被上司責備。回家坐在沙發上，一邊看電視，一邊打開洋芋片，一片接著一片。也許你需要晚餐，也許需要安慰，也可能兩者都有。","judge":["身體：上一餐是否吃得足夠？現在有空腹、疲倦或其他飢餓訊號嗎？","情境：我正在看螢幕、工作、社交，還是在安靜吃飯？","需要：我需要食物、休息、安慰、陪伴，或同時需要幾項？"],"steps":["選今天一次進食或想進食的時刻，不刻意挑最好的一餐。","寫下時間、地點與剛發生的事情。","記下身體訊號與情緒；不確定也可以。","選一個貼近當下的飲食模式描述，允許多種並存。","寫一句不責備的發現：我注意到＿＿時，容易＿＿。"],"notes":"模式是可以改變的觀察，不是你的性格或價值。沒有哪一種食物能單獨證明你做得好或不好。","cta":"辨認一次飲食觸發與自己的需要。","labels":["時間／場景／剛發生的事情","身體訊號、情緒與可能模式","我的需要與一句中立觀察"]},{"title":"為一次強烈渴望建立支持方案。","focus":"堅強不只在於撐住，也在於遇到挫折後願意重新照顧自己，並在需要時尋求支持。","why":"本課沿用「食物成癮和飲食強迫症」的主題名稱，探討強烈渴望、反覆失控進食與情緒依賴；這些日常用語不能直接等同暴食症、強迫症或其他臨床診斷。喜歡某種食物，也不表示成癮。","example":"真實情境：剛吃過飯，仍很想買鹹酥雞或珍奶。先看這是享受味道、餐點不足、壓力後想放鬆，還是常常出現「想停卻停不下來」的感受。","judge":["頻率與影響：這是偶爾想吃，還是反覆失控並影響生活或心情？","限制循環：我是否因為前一次吃多，就跳餐、嚴格禁食，之後又更餓？","支持：現在需要正常餐點、情緒陪伴，還是安排專業諮詢？"],"steps":["回想一次強烈想吃的情境，記下當時身體與情緒。","辨認自己是想吃特定味道，還是覺得無法控制；不作診斷。","若餓或餐點不足，安排足夠的餐點或點心。","另選一種支持方式，如和信任的人說話、休息或寫下感受。","寫下需要協助時可聯絡的人或專業資源。"],"notes":"不要靠跳餐、催吐、過度運動或嚴格戒食補償。若失控進食持續造成困擾，尋求專業支持就是有價值的行動。","cta":"為一次強烈渴望建立支持方案。","labels":["強烈想吃時發生了什麼？","飢餓、限制或失控的線索","我嘗試的支持與可求助對象"]},{"title":"把一個障礙改成可執行的小行動。","focus":"把「我做不到」拆成具體阻力，再為它設計一個今天能完成的小步驟。","why":"改變需要行動，也需要合理的目標、可用資源與善待自己。羅馬不是一天造成的，沒有神奇捷徑；能在忙碌日重複的小行動，比一次全改更實際。","example":"「太麻煩、沒時間」：把備餐縮小成前晚準備一項可取得的食物，而不是每天煮三餐。","judge":["阻力是否具體：卡在時間、價格、環境、身體狀況還是社交？","行動是否夠小：今天能完成嗎？忙碌時還有更簡單版本嗎？","是否可驗證：我要在什麼時候、哪裡做什麼，而不是只說更努力？"],"steps":["寫下最常出現的一個障礙，用事實描述。","找出可改變的一小部分，以及需要的支持。","寫一句「當＿＿，我就＿＿」的行動。","今天試一次，忙碌時使用最低版本。","記下有效與卡住之處，只修正一項。"],"notes":"環境設計不是把喜歡的食物全部清空。讓正常餐點更容易取得，也為想享受的食物保留彈性。","cta":"把一個障礙改成可執行的小行動。","labels":["一個真實障礙與可改部分","當＿＿我就＿＿／最低版本","實際結果與下次一個調整"]},{"title":"完成一筆食物與感受日誌。","focus":"日誌不只寫食物，也寫身體訊號、當下感受與需要，幫助自己做出有意識的決定。","why":"生活裡有很多美食，也有許多讓人分心的時刻。記錄能讓原本模糊的循環變得可見：情境 → 身體與情緒 → 選擇 → 結果。重點是找規律，不是精算每一口或追求漂亮答案。","example":"日誌例子：下午四點、加班；午餐較早且份量少，肚子空、肩膀緊，情緒焦躁。","judge":["記錄是否完整：有時間、食物與身體／情緒，而不只寫吃了什麼？","解讀是否中立：是在看線索，還是把數字變成准不准吃的門檻？","下一步是否照顧需要：需要吃、休息、陪伴，還是請人協助？"],"steps":["挑一次進食或想進食的時刻，記下時間與場景。","用四個覺察問題描述身體、渴望與上一餐，不急著分類。","記下食物、感受與需要；不確定就寫不確定。","選擇照顧需要的行動，吃與不吃都不是成績。","稍後補一句結果與下次可以調整的地方。"],"notes":"不要以喝水或等待來驗證自己有沒有資格吃。若明顯飢餓就照顧它；疑似低血糖時依醫療團隊的處置計畫處理。","cta":"完成一筆食物與感受日誌。","labels":["時間、上一餐與想吃的食物","身體訊號、情緒與當下需要","我吃了什麼／做了什麼與之後感受"]},{"title":"設定一個行為目標與支持自己的獎勵。","focus":"獎勵願意練習與重新開始的自己，讓行動有期待，而不是只獎勵體重或完美表現。","why":"不要讓一次挫折阻止下一步。把卡住的地方當成下次設計的資料，你可以逐漸培養耐心、決心與面對困難的勇氣。重新開始也是進步。","example":"真實情境：你原本計畫記錄三次，最後完成兩次，另一次忘了。兩次觀察仍值得肯定，可以依原先訂好的階段條件給自己獎勵，再把下次提醒放得更清楚。","judge":["目標是否可控制：衡量的是一次練習，還是難以控制的體重結果？","獎勵是否支持生活：喜歡、負擔得起，也不剝奪基本需要嗎？","遇到挫折怎麼回來：有沒有階段肯定與更小的下一步？"],"steps":["選一個具體行為目標與合理期限。","寫下可觀察的完成條件，允許小步累積。","選一個喜歡且負擔得起的獎勵。","完成今天的一小步並記錄，不用等待完美。","依條件慶祝；若卡住，寫下一次開始時間與最低版本。"],"notes":"休息、吃飯與求助不是要靠達標換來的。獎勵可以增加期待，但不能成為新的壓力來源。","cta":"設定一個行為目標與支持自己的獎勵。","labels":["行為目標、期限與完成條件","我選的獎勵與今天的一小步","慶祝方式或下一次重新開始"]},{"title":"彈性日：遇到挫折，練習重新開始。","focus":"用最低版本照顧需要，保留已完成的努力。","why":"忘記記錄或吃得和計畫不同，不代表整天失敗。重新辨認需要、恢復正常用餐、向人求助，都是可以做的下一步。","example":"原本想晚餐後寫日誌，但臨時加班。今天只寫「我很累，需要休息」，明天再留一個提醒；不因沒完成就跳過下一餐。","judge":["現在最需要照顧什麼？","最低版本是否足夠簡單？","我需要誰一起支持？"],"steps":["用一句話描述發生的變化。","確認身體與情緒需要，不補償。","選記一句話、正常吃飯或求助等一個最低版本。","實際做一次，記下結果。","安排下一次開始時機並肯定今天的小步。"],"notes":"回到下一個照顧自己的選擇，不用重算成零，也不需要懲罰。","cta":"今天只做一個能重新開始的小步。","labels":["意外情境與當下需要","使用的最低版本或支持","結果與對自己的一句話"]},{"title":"每週回顧：留下你的障礙應對與獎勵計畫。","focus":"從本週經驗選一個有效支持，而不是再加十條規則。","why":"回顧讓你看見哪些情境反覆出現，哪些支持真的有幫助。把有效行動留下，調整不合生活的目標，為下週準備一個可持續的開始。","example":"你發現加班時同時餓又煩，備一份點心和找人聊聊比硬忍有效。下週保留這個支持，不要求每次情緒都消失。","judge":["反覆出現的需要是什麼？","哪個支持能再使用？","下週目標是否小而可控制？"],"steps":["回看本週至少一筆觀察或日誌。","找一個常見模式與一個有效支持。","肯定已做的行動，安排合適的慶祝。","寫下下週小目標、最低版本與支持對象。","完成本週回顧，留下開始時間。"],"notes":"改變不是再也沒有困難，而是更知道如何照顧自己與尋求協助。","cta":"今天整理一份下週能用的支持計畫。","labels":["本週出現的模式與有效策略","值得肯定的行動與獎勵","下週一個目標、支持與開始時間"]}];
const week7LessonData=[{"title":"你的飲食屬於哪種類型","concept":"先看見自己的飲食模式與觸發因子；同一個人可能在不同時刻出現不同模式，不需要替自己貼標籤。","why":["了解自己的飲食習慣相當重要，才能發掘讓自己在不知不覺中多吃、或做出不符合當下需要之選擇的觸發因子。<strong>先觀察情境，再談改變</strong>，比只責怪意志力更有方向。","均衡、多樣、足夠且有彈性的飲食，可以作為參考方向，不是用來打分數的完美標準。睡眠、用餐間隔、取得食物的條件、壓力與情緒都值得一起看。"],"example":["<strong>真實情境 1：</strong>今天工作不順，被上司責備。回家坐在沙發上，一邊看電視，一邊打開洋芋片，一片接著一片。也許你需要晚餐，也許需要安慰，也可能兩者都有。","<strong>真實情境 2：</strong>已吃完飯，沒有事情做，無聊之下打開冰箱，手邊多了一盒冰淇淋。除了飢餓，無聊、傷心、焦慮、壓力與熟悉的環境，也可能促使人進食。","這些情境可能包含<strong>情緒飲食或分心進食</strong>。先問「剛剛發生什麼、我需要什麼」，而不是立刻禁止自己吃。享受食物本身也是生活的一部分。"],"judge":["身體：上一餐是否吃得足夠？現在有空腹、疲倦或其他飢餓訊號嗎？","情境：我正在看螢幕、工作、社交，還是在安靜吃飯？","需要：我需要食物、休息、安慰、陪伴，或同時需要幾項？"],"steps":["選今天一次進食或想進食的時刻，不刻意挑最好的一餐。","寫下時間、地點與剛發生的事情。","記下身體訊號與情緒；不確定也可以。","選一個貼近當下的飲食模式描述，允許多種並存。","寫一句不責備的發現：我注意到＿＿時，容易＿＿。"],"tip":"模式是可以改變的觀察，不是你的性格或價值。沒有哪一種食物能單獨證明你做得好或不好。","self":[["我能描述一次情境","說出發生了什麼，不只說自己沒自制力。"],["我有看身體與情緒","知道飢餓與情緒可能同時出現。"],["我找到下一個觀察點","選定一次值得再留意的時刻。"]]},{"title":"食物成癮和飲食強迫症","concept":"堅強克服的意義不在於您能做什麼事，而是失敗後能重啟的決心。","why":["<p>反覆失控進食會影響許多人的身心健康，也可能與肥胖及代謝健康問題並存；心血管疾病與代謝症候群仍涉及多種因素，不能只憑飲食行為判定。</p><p>除了生理上的飢餓，<strong>情緒飢餓</strong>也可能參與其中。<strong>自我覺察是第一步</strong>：嘗試用其他方式照顧情緒，或藉由專家的協助，逐步減少只依賴食物調節情緒的情況。</p>"],"example":["<p>經常想吃某些特定食物，即使吃過飯沒多久或者很飽，還是會去買來吃，例如<strong>鹹酥雞、珍奶</strong>。</p><p>又或者常常吃到過飽，吃完有罪惡感，之後仍反覆出現相同情境。先記下當時發生的事與感受，找出需要的支持，不急著責備自己或作診斷。</p>"],"judge":["頻率與影響：這是偶爾想吃，還是反覆失控並影響生活或心情？","限制循環：我是否因為前一次吃多，就跳餐、嚴格禁食，之後又更餓？","支持：現在需要正常餐點、情緒陪伴，還是安排專業諮詢？"],"steps":["回想一次強烈想吃的情境，記下當時身體與情緒。","辨認自己是想吃特定味道，還是覺得無法控制；不作診斷。","若餓或餐點不足，安排足夠的餐點或點心。","另選一種支持方式，如和信任的人說話、休息或寫下感受。","寫下需要協助時可聯絡的人或專業資源。"],"tip":"不要靠跳餐、催吐、過度運動或嚴格戒食補償。若失控進食持續造成困擾，尋求專業支持就是有價值的行動。","self":[["我不把渴望當診斷","知道喜歡食物與反覆失控是不同情況。"],["我知道先照顧需要","不以限制下一餐來補償。"],["我知道何時求助","能說出一個可聯絡的支持對象。"]]},{"title":"將障礙轉為成功的助力","concept":"把「我做不到」拆成具體阻力，再為它設計一個今天能完成的小步驟。","why":["<p><strong>當您減少容易引發自動進食的高糖、高熱量或高脂食品，並安排足夠、規律的餐點時，對部分食物的渴望可能漸漸減少。</strong>每個人反應不同，不需要一律排除所有加工食品。</p><p>改變需要行動，全心投入、訂下目標，這些都是達成重大理想的要素，管理健康和善待自己當然也是。<strong>羅馬不是一天造成的，不要輕易相信任何神奇的捷徑。</strong></p><p>「沒時間」「常在外跑」「朋友都這樣吃」可能是真實限制。把它們轉成可設計的問題：需要備餐、備案、陪伴，還是更小的起點？</p>"],"example":["<strong>「太麻煩、沒時間」：</strong>把備餐縮小成前晚準備一項可取得的食物，而不是每天煮三餐。","<strong>「工作到處跑、朋友都這樣吃」：</strong>預先選一個買得到的用餐備案，或練習說「我先按自己的食量拿」。","<strong>「我明天就開始、不想流汗」：</strong>今天先完成一個不需運動或額外設備的小動作，例如記下一次觸發，或安排午餐時間。別把所有健康行動綁在同一個門檻上。"],"judge":["阻力是否具體：卡在時間、價格、環境、身體狀況還是社交？","行動是否夠小：今天能完成嗎？忙碌時還有更簡單版本嗎？","是否可驗證：我要在什麼時候、哪裡做什麼，而不是只說更努力？"],"steps":["寫下最常出現的一個障礙，用事實描述。","找出可改變的一小部分，以及需要的支持。","寫一句「當＿＿，我就＿＿」的行動。","今天試一次，忙碌時使用最低版本。","記下有效與卡住之處，只修正一項。"],"tip":"環境設計不是把喜歡的食物全部清空。讓正常餐點更容易取得，也為想享受的食物保留彈性。","self":[["我說得出真正阻力","描述一個具體條件，不用罵自己懶。"],["我有一個小行動","有明確觸發時機與最低版本。"],["我願意調整方法","沒成功時修改設計，而不是否定自己。"]]},{"title":"有效執行觀察並紀錄","concept":"日誌不只寫食物，也寫身體訊號、當下感受與需要，幫助自己做出有意識的決定。","why":["<p>生活裡有很多美食，也有許多讓人分心的時刻。記錄能讓原本模糊的循環變得可見：<strong>情境 → 身體與情緒 → 選擇 → 結果</strong>。重點是找規律，不是精算每一口或追求漂亮答案。</p><p>「需要」與「想要」可能同時存在；想享受某個味道也不需要羞愧。飢餓訊號有時不清楚，時間、活動與身體狀況也會影響它。下面四個問題是<strong>覺察提示，不是真假飢餓的診斷測驗</strong>。</p><p>一天只記錄一次即可。若記錄讓你更焦慮、開始反覆計算或限制進食，可以縮短或暫停。</p>"],"example":["<strong>日誌例子：</strong>下午四點、加班；午餐較早且份量少，肚子空、肩膀緊，情緒焦躁。","<strong>我的選擇：</strong>先吃合適點心，接著找同事聊兩句。之後身體舒服一些，工作壓力仍在。","<strong>我的發現：</strong>這次同時有飢餓與壓力。下次安排點心與短暫休息，不要求自己只選一種原因。"],"judge":["記錄是否完整：有時間、食物與身體／情緒，而不只寫吃了什麼？","解讀是否中立：是在看線索，還是把數字變成准不准吃的門檻？","下一步是否照顧需要：需要吃、休息、陪伴，還是請人協助？"],"steps":["挑一次進食或想進食的時刻，記下時間與場景。","用四個覺察問題描述身體、渴望與上一餐，不急著分類。","記下食物、感受與需要；不確定就寫不確定。","選擇照顧需要的行動，吃與不吃都不是成績。","稍後補一句結果與下次可以調整的地方。"],"tip":"不要以喝水或等待來驗證自己有沒有資格吃。若明顯飢餓就照顧它；疑似低血糖時依醫療團隊的處置計畫處理。","self":[["我能記食物也記感受","把身體、情緒與場景一起留下。"],["我不用分數限制進食","知道覺察問題不是診斷或通行證。"],["我能從一筆資料找線索","只選一個下次可調整的地方。"]]},{"title":"達成目標的獎勵","concept":"獎勵願意練習與重新開始的自己，讓行動有期待，而不是只獎勵體重或完美表現。","why":["不要讓一次挫折阻止下一步。把卡住的地方當成下次設計的資料，你可以逐漸培養耐心、決心與面對困難的勇氣。<strong>重新開始也是進步。</strong>","先設定可控制的行為目標，例如本週完成兩次簡短觀察，再搭配喜歡、負擔得起的獎勵：聽一段音樂、安排休閒時間、和朋友走走或做喜歡的活動。","獎勵不是食物交換券，也不用先達標才准吃飯、休息或照顧自己。可以慶祝努力，但不以體重、挨餓或消耗熱量作為兌換條件。"],"example":["<strong>真實情境：</strong>你原本計畫記錄三次，最後完成兩次，另一次忘了。兩次觀察仍值得肯定，可以依原先訂好的階段條件給自己獎勵，再把下次提醒放得更清楚。","<strong>小目標：</strong>這週在兩個晚間時刻寫一句感受。<strong>獎勵：</strong>安排一段喜歡的休閒時間。若未完成，保留已做的部分，縮小下一步，不設懲罰。"],"judge":["目標是否可控制：衡量的是一次練習，還是難以控制的體重結果？","獎勵是否支持生活：喜歡、負擔得起，也不剝奪基本需要嗎？","遇到挫折怎麼回來：有沒有階段肯定與更小的下一步？"],"steps":["選一個具體行為目標與合理期限。","寫下可觀察的完成條件，允許小步累積。","選一個喜歡且負擔得起的獎勵。","完成今天的一小步並記錄，不用等待完美。","依條件慶祝；若卡住，寫下一次開始時間與最低版本。"],"tip":"休息、吃飯與求助不是要靠達標換來的。獎勵可以增加期待，但不能成為新的壓力來源。","self":[["我有行為目標","衡量一次可做到的練習。"],["我選了支持自己的獎勵","不把食物、休息或體重當交換條件。"],["我有重新開始的方式","知道下一個小步與時間。"]]}];
const week7Meta=[{"title":"你的飲食屬於哪種類型","concept":"先看見自己的飲食模式與觸發因子；同一個人可能在不同時刻出現不同模式，不需要替自己貼標籤。","hook":"你的飲食屬於哪種類型","example":"真實情境 1：今天工作不順，被上司責備。回家坐在沙發上，一邊看電視，一邊打開洋芋片，一片接著一片。也許你需要晚餐，也許需要安慰，也可能兩者都有。 真實情境 2：已吃完飯，沒有事情做，無聊之下打開冰箱，手邊多了一盒冰淇淋。除了飢餓，無聊、傷心、焦慮、壓力與熟悉的環境，也可能促使人進食。 這些情境可能包含情緒飲食或分心進食。先問「剛剛發生什麼、我需要什麼」，而不是立刻禁止自己吃。享受食物本身也是生活的一部分。","apply":"選今天一次進食或想進食的時刻，不刻意挑最好的一餐。"},{"title":"食物成癮和飲食強迫症","concept":"堅強克服的意義不在於您能做什麼事，而是失敗後能重啟的決心。","hook":"食物成癮和飲食強迫症","example":"真實情境：剛吃過飯，仍很想買鹹酥雞或珍奶。先看這是享受味道、餐點不足、壓力後想放鬆，還是常常出現「想停卻停不下來」的感受。 若反覆吃到過飽、非常痛苦或害怕別人知道，值得被認真照顧。不需要用「找藉口」或「不夠堅強」形容自己。一次渴望不能用來自我診斷。","apply":"回想一次強烈想吃的情境，記下當時身體與情緒。"},{"title":"將障礙轉為成功的助力","concept":"把「我做不到」拆成具體阻力，再為它設計一個今天能完成的小步驟。","hook":"將障礙轉為成功的助力","example":"「太麻煩、沒時間」：把備餐縮小成前晚準備一項可取得的食物，而不是每天煮三餐。 「工作到處跑、朋友都這樣吃」：預先選一個買得到的用餐備案，或練習說「我先按自己的食量拿」。 「我明天就開始、不想流汗」：今天先完成一個不需運動或額外設備的小動作，例如記下一次觸發，或安排午餐時間。別把所有健康行動綁在同一個門檻上。","apply":"寫下最常出現的一個障礙，用事實描述。"},{"title":"有效執行觀察並紀錄","concept":"日誌不只寫食物，也寫身體訊號、當下感受與需要，幫助自己做出有意識的決定。","hook":"有效執行觀察並紀錄","example":"日誌例子：下午四點、加班；午餐較早且份量少，肚子空、肩膀緊，情緒焦躁。 我的選擇：先吃合適點心，接著找同事聊兩句。之後身體舒服一些，工作壓力仍在。 我的發現：這次同時有飢餓與壓力。下次安排點心與短暫休息，不要求自己只選一種原因。","apply":"挑一次進食或想進食的時刻，記下時間與場景。"},{"title":"達成目標的獎勵","concept":"獎勵願意練習與重新開始的自己，讓行動有期待，而不是只獎勵體重或完美表現。","hook":"達成目標的獎勵","example":"真實情境：你原本計畫記錄三次，最後完成兩次，另一次忘了。兩次觀察仍值得肯定，可以依原先訂好的階段條件給自己獎勵，再把下次提醒放得更清楚。 小目標：這週在兩個晚間時刻寫一句感受。獎勵：安排一段喜歡的休閒時間。若未完成，保留已做的部分，縮小下一步，不設懲罰。","apply":"選一個具體行為目標與合理期限。"}];
const week7Rich=[{"why":"了解自己的飲食習慣相當重要，才能發掘讓自己在不知不覺中多吃、或做出不符合當下需要之選擇的觸發因子。先觀察情境，再談改變，比只責怪意志力更有方向。 均衡、多樣、足夠且有彈性的飲食，可以作為參考方向，不是用來打分數的完美標準。睡眠、用餐間隔、取得食物的條件、壓力與情緒都值得一起看。","whyHtml":"<p>了解自己的飲食習慣相當重要，才能發掘讓自己在不知不覺中多吃、或做出不符合當下需要之選擇的觸發因子。<strong>先觀察情境，再談改變</strong>，比只責怪意志力更有方向。</p><p>均衡、多樣、足夠且有彈性的飲食，可以作為參考方向，不是用來打分數的完美標準。睡眠、用餐間隔、取得食物的條件、壓力與情緒都值得一起看。</p>","example":"真實情境 1：今天工作不順，被上司責備。回家坐在沙發上，一邊看電視，一邊打開洋芋片，一片接著一片。也許你需要晚餐，也許需要安慰，也可能兩者都有。 真實情境 2：已吃完飯，沒有事情做，無聊之下打開冰箱，手邊多了一盒冰淇淋。除了飢餓，無聊、傷心、焦慮、壓力與熟悉的環境，也可能促使人進食。 這些情境可能包含情緒飲食或分心進食。先問「剛剛發生什麼、我需要什麼」，而不是立刻禁止自己吃。享受食物本身也是生活的一部分。","exampleHtml":"<p><strong>真實情境 1：</strong>今天工作不順，被上司責備。回家坐在沙發上，一邊看電視，一邊打開洋芋片，一片接著一片。也許你需要晚餐，也許需要安慰，也可能兩者都有。</p><p><strong>真實情境 2：</strong>已吃完飯，沒有事情做，無聊之下打開冰箱，手邊多了一盒冰淇淋。除了飢餓，無聊、傷心、焦慮、壓力與熟悉的環境，也可能促使人進食。</p><p>這些情境可能包含<strong>情緒飲食或分心進食</strong>。先問「剛剛發生什麼、我需要什麼」，而不是立刻禁止自己吃。享受食物本身也是生活的一部分。</p>","observe":"今天只選一個真實時刻，看看身體、情緒和環境如何一起影響選擇。","judge":["身體：上一餐是否吃得足夠？現在有空腹、疲倦或其他飢餓訊號嗎？","情境：我正在看螢幕、工作、社交，還是在安靜吃飯？","需要：我需要食物、休息、安慰、陪伴，或同時需要幾項？"],"do":["選今天一次進食或想進食的時刻，不刻意挑最好的一餐。","寫下時間、地點與剛發生的事情。","記下身體訊號與情緒；不確定也可以。","選一個貼近當下的飲食模式描述，允許多種並存。","寫一句不責備的發現：我注意到＿＿時，容易＿＿。"],"cta":"辨認一次飲食觸發與自己的需要。","tip":"模式是可以改變的觀察，不是你的性格或價值。沒有哪一種食物能單獨證明你做得好或不好。","extra":"<p class=\"barriers-sources\">資料參考：<a href=\"https://www.cuh.nhs.uk/patient-information/a-brief-guide-to-tackling-emotional-eating/\" target=\"_blank\" rel=\"noopener\">情緒與飲食</a> · <a href=\"https://www.niddk.nih.gov/health-information/weight-management/binge-eating-disorder/symptoms-causes\" target=\"_blank\" rel=\"noopener\">失控進食與支持</a> · <a href=\"https://www.nhs.uk/mental-health/conditions/binge-eating/treatment/\" target=\"_blank\" rel=\"noopener\">治療與規律進食</a> · <a href=\"https://www.niddk.nih.gov/health-information/diet-nutrition/changing-habits-better-health\" target=\"_blank\" rel=\"noopener\">習慣、障礙與獎勵</a></p>"},{"why":"反覆失控進食會影響許多人的身心健康，也可能與肥胖及代謝健康問題並存；心血管疾病與代謝症候群仍涉及多種因素，不能只憑飲食行為判定。除了生理上的飢餓，情緒飢餓也可能參與其中。自我覺察是第一步：嘗試用其他方式照顧情緒，或藉由專家的協助，逐步減少只依賴食物調節情緒的情況。","whyHtml":"<p>反覆失控進食會影響許多人的身心健康，也可能與肥胖及代謝健康問題並存；心血管疾病與代謝症候群仍涉及多種因素，不能只憑飲食行為判定。</p><p>除了生理上的飢餓，<strong>情緒飢餓</strong>也可能參與其中。<strong>自我覺察是第一步</strong>：嘗試用其他方式照顧情緒，或藉由專家的協助，逐步減少只依賴食物調節情緒的情況。</p>","example":"經常想吃某些特定食物，即使吃過飯沒多久或者很飽，還是會去買來吃，例如鹹酥雞、珍奶。又或者常常吃到過飽，吃完有罪惡感，之後仍反覆出現相同情境。先記下當時發生的事與感受，找出需要的支持，不急著責備自己或作診斷。","exampleHtml":"<p>經常想吃某些特定食物，即使吃過飯沒多久或者很飽，還是會去買來吃，例如<strong>鹹酥雞、珍奶</strong>。</p><p>又或者常常吃到過飽，吃完有罪惡感，之後仍反覆出現相同情境。先記下當時發生的事與感受，找出需要的支持，不急著責備自己或作診斷。</p>","observe":"今天只選一個真實時刻，看看身體、情緒和環境如何一起影響選擇。","judge":["頻率與影響：這是偶爾想吃，還是反覆失控並影響生活或心情？","限制循環：我是否因為前一次吃多，就跳餐、嚴格禁食，之後又更餓？","支持：現在需要正常餐點、情緒陪伴，還是安排專業諮詢？"],"do":["回想一次強烈想吃的情境，記下當時身體與情緒。","辨認自己是想吃特定味道，還是覺得無法控制；不作診斷。","若餓或餐點不足，安排足夠的餐點或點心。","另選一種支持方式，如和信任的人說話、休息或寫下感受。","寫下需要協助時可聯絡的人或專業資源。"],"cta":"為一次強烈渴望建立支持方案。","tip":"不要靠跳餐、催吐、過度運動或嚴格戒食補償。若失控進食持續造成困擾，尋求專業支持就是有價值的行動。","extra":"<section class=\"depth-card mode-chart\"><h2>主要的飲食模式</h2><table class=\"reference-table modes-table\"><thead><tr><th>飲食類型</th><th>描述</th><th>飲食類型</th><th>描述</th></tr></thead><tbody><tr><th scope=\"row\">壓力型</th><td>壓力升高時，常用吃東西舒緩壓力。<p><strong>可以試試：</strong>先看看不吃是否也餓；若有飢餓感，可以吃適合的餐點或點心，同時安排一個減壓支持，不必勉強忍餓。</p></td><th scope=\"row\">節儉型（怕浪費而吃完）</th><td>不想要浪費任何食物，往往強迫自己過量飲食。<p><strong>可以試試：</strong>每次嘗試買適合的份量；或善用保鮮盒，把可隔餐吃的食物妥善保存。</p></td></tr><tr><th scope=\"row\">情緒型</th><td>每當情緒強烈波動，如憂鬱、哀傷、憤怒或挫折時，就會進食。<p><strong>可以試試：</strong>用一個詞寫出情緒，選食物之外的另一種照顧方式。</p></td><th scope=\"row\">隱藏進食型</th><td>擔心被批評，所以不想讓別人看見自己吃。<p><strong>可以試試：</strong>保護隱私不等於做錯；若羞恥或失控使你痛苦，找可信任的支持。</p></td></tr><tr><th scope=\"row\">放牧型（零散進食）</th><td>整天都在吃小點心，每一份都少少的，因此很容易低估吃進去的總熱量。<p><strong>可以試試：</strong><strong>把零散吃改成一次有意識的點心時間。</strong>想吃時先把食物放進碗盤，坐下來吃，避免反覆從大包裝順手拿取；也留意正餐是否吃得足夠，吃完再感受是否仍需要。</p></td><th scope=\"row\">彈性覺察型</th><td>兼顧身體需要、享受、規律與生活條件。<p><strong>可以試試：</strong>留意身體的提示，同時照顧情緒需要；保持食物選擇的彈性，吃多樣的食物。</p></td></tr><tr><th scope=\"row\">無意識型（分心進食）</th><td>看電視、滑手機或工作時邊吃邊做事，可能不知不覺吃得超過需要。<p><strong>可以試試：</strong><strong>今天選一次進食，先放下手機、暫停電視與工作。</strong>把注意力放回食物的味道與身體感受，吃到一半留意是否舒服、是否還想吃，再決定下一步。</p></td><th scope=\"row\">大吃大喝型</th><td>白天節食忍耐不吃，但在晚上吃進眼前的食物。<p><strong>可以試試：</strong>規律與足量進食，或安排需要的點心；反覆失控或痛苦時尋求支持。</p></td></tr></tbody></table></section><p class=\"barriers-sources\">資料參考：<a href=\"https://www.cuh.nhs.uk/patient-information/a-brief-guide-to-tackling-emotional-eating/\" target=\"_blank\" rel=\"noopener\">情緒與飲食</a> · <a href=\"https://www.niddk.nih.gov/health-information/weight-management/binge-eating-disorder/symptoms-causes\" target=\"_blank\" rel=\"noopener\">失控進食與支持</a> · <a href=\"https://www.nhs.uk/mental-health/conditions/binge-eating/treatment/\" target=\"_blank\" rel=\"noopener\">治療與規律進食</a> · <a href=\"https://www.niddk.nih.gov/health-information/diet-nutrition/changing-habits-better-health\" target=\"_blank\" rel=\"noopener\">習慣、障礙與獎勵</a></p>"},{"why":"當您減少容易引發自動進食的高糖、高熱量或高脂食品，並安排足夠、規律的餐點時，對部分食物的渴望可能漸漸減少。每個人反應不同，不需要一律排除所有加工食品。改變需要行動，全心投入、訂下目標，這些都是達成重大理想的要素，管理健康和善待自己當然也是。羅馬不是一天造成的，不要輕易相信任何神奇的捷徑。「沒時間」「常在外跑」「朋友都這樣吃」可能是真實限制。把它們轉成可設計的問題：需要備餐、備案、陪伴，還是更小的起點？","whyHtml":"<p><strong>當您減少容易引發自動進食的高糖、高熱量或高脂食品，並安排足夠、規律的餐點時，對部分食物的渴望可能漸漸減少。</strong>每個人反應不同，不需要一律排除所有加工食品。</p><p>改變需要行動，全心投入、訂下目標，這些都是達成重大理想的要素，管理健康和善待自己當然也是。<strong>羅馬不是一天造成的，不要輕易相信任何神奇的捷徑。</strong></p><p>「沒時間」「常在外跑」「朋友都這樣吃」可能是真實限制。把它們轉成可設計的問題：需要備餐、備案、陪伴，還是更小的起點？</p>","example":"「太麻煩、沒時間」：把備餐縮小成前晚準備一項可取得的食物，而不是每天煮三餐。 「工作到處跑、朋友都這樣吃」：預先選一個買得到的用餐備案，或練習說「我先按自己的食量拿」。 「我明天就開始、不想流汗」：今天先完成一個不需運動或額外設備的小動作，例如記下一次觸發，或安排午餐時間。別把所有健康行動綁在同一個門檻上。","exampleHtml":"<p><strong>「太麻煩、沒時間」：</strong>把備餐縮小成前晚準備一項可取得的食物，而不是每天煮三餐。</p><p><strong>「工作到處跑、朋友都這樣吃」：</strong>預先選一個買得到的用餐備案，或練習說「我先按自己的食量拿」。</p><p><strong>「我明天就開始、不想流汗」：</strong>今天先完成一個不需運動或額外設備的小動作，例如記下一次觸發，或安排午餐時間。別把所有健康行動綁在同一個門檻上。</p>","observe":"今天只選一個真實時刻，看看身體、情緒和環境如何一起影響選擇。","judge":["阻力是否具體：卡在時間、價格、環境、身體狀況還是社交？","行動是否夠小：今天能完成嗎？忙碌時還有更簡單版本嗎？","是否可驗證：我要在什麼時候、哪裡做什麼，而不是只說更努力？"],"do":["寫下最常出現的一個障礙，用事實描述。","找出可改變的一小部分，以及需要的支持。","寫一句「當＿＿，我就＿＿」的行動。","今天試一次，忙碌時使用最低版本。","記下有效與卡住之處，只修正一項。"],"cta":"把一個障礙改成可執行的小行動。","tip":"環境設計不是把喜歡的食物全部清空。讓正常餐點更容易取得，也為想享受的食物保留彈性。","extra":"<p class=\"barriers-sources\">資料參考：<a href=\"https://www.cuh.nhs.uk/patient-information/a-brief-guide-to-tackling-emotional-eating/\" target=\"_blank\" rel=\"noopener\">情緒與飲食</a> · <a href=\"https://www.niddk.nih.gov/health-information/weight-management/binge-eating-disorder/symptoms-causes\" target=\"_blank\" rel=\"noopener\">失控進食與支持</a> · <a href=\"https://www.nhs.uk/mental-health/conditions/binge-eating/treatment/\" target=\"_blank\" rel=\"noopener\">治療與規律進食</a> · <a href=\"https://www.niddk.nih.gov/health-information/diet-nutrition/changing-habits-better-health\" target=\"_blank\" rel=\"noopener\">習慣、障礙與獎勵</a></p>"},{"why":"生活裡有很多美食，也有許多讓人分心的時刻。記錄能讓原本模糊的循環變得可見：情境 → 身體與情緒 → 選擇 → 結果。重點是找規律，不是精算每一口或追求漂亮答案。「需要」與「想要」可能同時存在；想享受某個味道也不需要羞愧。飢餓訊號有時不清楚，時間、活動與身體狀況也會影響它。下面四個問題是覺察提示，不是真假飢餓的診斷測驗。一天只記錄一次即可。若記錄讓你更焦慮、開始反覆計算或限制進食，可以縮短或暫停。","whyHtml":"<p>生活裡有很多美食，也有許多讓人分心的時刻。記錄能讓原本模糊的循環變得可見：<strong>情境 → 身體與情緒 → 選擇 → 結果</strong>。重點是找規律，不是精算每一口或追求漂亮答案。</p><p>「需要」與「想要」可能同時存在；想享受某個味道也不需要羞愧。飢餓訊號有時不清楚，時間、活動與身體狀況也會影響它。下面四個問題是<strong>覺察提示，不是真假飢餓的診斷測驗</strong>。</p><p>一天只記錄一次即可。若記錄讓你更焦慮、開始反覆計算或限制進食，可以縮短或暫停。</p>","example":"日誌例子：下午四點、加班；午餐較早且份量少，肚子空、肩膀緊，情緒焦躁。 我的選擇：先吃合適點心，接著找同事聊兩句。之後身體舒服一些，工作壓力仍在。 我的發現：這次同時有飢餓與壓力。下次安排點心與短暫休息，不要求自己只選一種原因。","exampleHtml":"<p><strong>日誌例子：</strong>下午四點、加班；午餐較早且份量少，肚子空、肩膀緊，情緒焦躁。</p><p><strong>我的選擇：</strong>先吃合適點心，接著找同事聊兩句。之後身體舒服一些，工作壓力仍在。</p><p><strong>我的發現：</strong>這次同時有飢餓與壓力。下次安排點心與短暫休息，不要求自己只選一種原因。</p>","observe":"今天只選一個真實時刻，看看身體、情緒和環境如何一起影響選擇。","judge":["記錄是否完整：有時間、食物與身體／情緒，而不只寫吃了什麼？","解讀是否中立：是在看線索，還是把數字變成准不准吃的門檻？","下一步是否照顧需要：需要吃、休息、陪伴，還是請人協助？"],"do":["挑一次進食或想進食的時刻，記下時間與場景。","用四個覺察問題描述身體、渴望與上一餐，不急著分類。","記下食物、感受與需要；不確定就寫不確定。","選擇照顧需要的行動，吃與不吃都不是成績。","稍後補一句結果與下次可以調整的地方。"],"cta":"完成一筆食物與感受日誌。","tip":"不要以喝水或等待來驗證自己有沒有資格吃。若明顯飢餓就照顧它；疑似低血糖時依醫療團隊的處置計畫處理。","extra":"<section class=\"depth-card hunger-chart\"><h2>飢餓與渴望：四個覺察問題</h2><table class=\"reference-table hunger-table\"><thead><tr><th>覺察問題</th><th>說明</th></tr></thead><tbody><tr><th scope=\"row\">您是否渴望某樣特定的食物？</th><td>飢餓時可能有多種食物讓您滿意，渴望則可能集中在某種味道；兩者也可能同時出現，不能只靠這一點判斷。</td></tr><tr><th scope=\"row\">渴望的感覺是否過去了？</th><td>渴望有時會變化，也可能持續。可以留意變化，但不必先喝水、等十五分鐘來證明飢餓；口渴時喝水，餓時照顧進食需要。</td></tr><tr><th scope=\"row\">您真正有多餓？</th><td>留意當下的身體訊號，可自願以 1 到 10 描述餓感（1 是很少餓感，10 是非常餓），也可以用文字。分數不是能否吃東西的門檻；用餐安排依個人需要。</td></tr><tr><th scope=\"row\">您上次進食是什麼時候？</th><td>隔了幾個小時可能是飢餓線索，也要看上一餐吃了多少、活動與個人狀況。剛吃完仍想吃，不一定只因情緒。</td></tr></tbody></table></section><p class=\"barriers-sources\">資料參考：<a href=\"https://www.cuh.nhs.uk/patient-information/a-brief-guide-to-tackling-emotional-eating/\" target=\"_blank\" rel=\"noopener\">情緒與飲食</a> · <a href=\"https://www.niddk.nih.gov/health-information/weight-management/binge-eating-disorder/symptoms-causes\" target=\"_blank\" rel=\"noopener\">失控進食與支持</a> · <a href=\"https://www.nhs.uk/mental-health/conditions/binge-eating/treatment/\" target=\"_blank\" rel=\"noopener\">治療與規律進食</a> · <a href=\"https://www.niddk.nih.gov/health-information/diet-nutrition/changing-habits-better-health\" target=\"_blank\" rel=\"noopener\">習慣、障礙與獎勵</a></p>"},{"why":"不要讓一次挫折阻止下一步。把卡住的地方當成下次設計的資料，你可以逐漸培養耐心、決心與面對困難的勇氣。重新開始也是進步。 先設定可控制的行為目標，例如本週完成兩次簡短觀察，再搭配喜歡、負擔得起的獎勵：聽一段音樂、安排休閒時間、和朋友走走或做喜歡的活動。 獎勵不是食物交換券，也不用先達標才准吃飯、休息或照顧自己。可以慶祝努力，但不以體重、挨餓或消耗熱量作為兌換條件。","whyHtml":"<p>不要讓一次挫折阻止下一步。把卡住的地方當成下次設計的資料，你可以逐漸培養耐心、決心與面對困難的勇氣。<strong>重新開始也是進步。</strong></p><p>先設定可控制的行為目標，例如本週完成兩次簡短觀察，再搭配喜歡、負擔得起的獎勵：聽一段音樂、安排休閒時間、和朋友走走或做喜歡的活動。</p><p>獎勵不是食物交換券，也不用先達標才准吃飯、休息或照顧自己。可以慶祝努力，但不以體重、挨餓或消耗熱量作為兌換條件。</p>","example":"真實情境：你原本計畫記錄三次，最後完成兩次，另一次忘了。兩次觀察仍值得肯定，可以依原先訂好的階段條件給自己獎勵，再把下次提醒放得更清楚。 小目標：這週在兩個晚間時刻寫一句感受。獎勵：安排一段喜歡的休閒時間。若未完成，保留已做的部分，縮小下一步，不設懲罰。","exampleHtml":"<p><strong>真實情境：</strong>你原本計畫記錄三次，最後完成兩次，另一次忘了。兩次觀察仍值得肯定，可以依原先訂好的階段條件給自己獎勵，再把下次提醒放得更清楚。</p><p><strong>小目標：</strong>這週在兩個晚間時刻寫一句感受。<strong>獎勵：</strong>安排一段喜歡的休閒時間。若未完成，保留已做的部分，縮小下一步，不設懲罰。</p>","observe":"今天只選一個真實時刻，看看身體、情緒和環境如何一起影響選擇。","judge":["目標是否可控制：衡量的是一次練習，還是難以控制的體重結果？","獎勵是否支持生活：喜歡、負擔得起，也不剝奪基本需要嗎？","遇到挫折怎麼回來：有沒有階段肯定與更小的下一步？"],"do":["選一個具體行為目標與合理期限。","寫下可觀察的完成條件，允許小步累積。","選一個喜歡且負擔得起的獎勵。","完成今天的一小步並記錄，不用等待完美。","依條件慶祝；若卡住，寫下一次開始時間與最低版本。"],"cta":"設定一個行為目標與支持自己的獎勵。","tip":"休息、吃飯與求助不是要靠達標換來的。獎勵可以增加期待，但不能成為新的壓力來源。","extra":"<p class=\"barriers-sources\">資料參考：<a href=\"https://www.cuh.nhs.uk/patient-information/a-brief-guide-to-tackling-emotional-eating/\" target=\"_blank\" rel=\"noopener\">情緒與飲食</a> · <a href=\"https://www.niddk.nih.gov/health-information/weight-management/binge-eating-disorder/symptoms-causes\" target=\"_blank\" rel=\"noopener\">失控進食與支持</a> · <a href=\"https://www.nhs.uk/mental-health/conditions/binge-eating/treatment/\" target=\"_blank\" rel=\"noopener\">治療與規律進食</a> · <a href=\"https://www.niddk.nih.gov/health-information/diet-nutrition/changing-habits-better-health\" target=\"_blank\" rel=\"noopener\">習慣、障礙與獎勵</a></p>"}];
weeks[6].title='健康重整的障礙';
weeks[6].outcome='探索常見的健康管理障礙，辨認自己的飲食模式，建立照顧需要與克服障礙的策略。';
weeks[6].lessons=week7Meta.map(l=>l.title);weeks[6].daily_actions=week7Days.map(d=>d.title);
weeks[6].review_prompts=['我發現哪些觸發與需要？','哪個支持最有幫助？','下週如何肯定努力並重新開始？'];

curriculum[6].intro='我們來探索一些常見的健康管理障礙，找出自己在哪些情境出現哪些飲食習慣，並提供克服障礙的策略。從辨認觸發、尋求支持，到設計小步、記錄感受與獎勵努力。';

curriculum[6].challenge={title:'真實挑戰：看見觸發，回應需要',prompt:'遇到一次熟悉的觸發，辨認身體與情緒，選一個照顧自己的回應並記下結果。',success:'不是忍住不吃，而是看見一次需要並給予回應。'};
